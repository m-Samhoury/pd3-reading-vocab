            onclick: () => { laerSit = s.id; route(); } }, LANG === "en" ? s.label.en : s.label.da,
            el("span", { class: "n" }, `${n}/${ids.length}`));
        }))),
      el("section", { class: "sec" }, el("div", { class: "tgrid" }, topicsOf(laerSit).map(key => {
        const st = tStatus(key), fam = famOf(key), topic = D.topics[key], ten = topic.situations_en || {};
        const sits = [topic.situations.A, topic.situations.B].filter(Boolean).join(" · ");
        const sitsEn = [ten.A, ten.B].filter(Boolean).join(" · ");
        const n = topicIds(key).filter(id => qStatus(id) === "sure").length;
        return el("a", { class: "sheet tcard", href: `#q/${key}-1A` },
          el("span", { class: "letter" }, key.split("-")[1]),
          el("h3", { lang: "da" }, topic.title, enLine(topic.title_en)),
          fam ? el("p", { class: "st" }, el("span", { class: "dot " + st }), LANG === "en" ? fam[1] : fam[0]) : null,
          sits ? el("p", { class: "sits" }, el("span", { lang: "da" }, sits), enLine(sitsEn)) : null,
          el("p", { class: "st" }, el("span", { class: "dot " + st }), t("or.tcount", n)));
      }))),
      el("div", { class: "tgrid", style: "margin-top:24px" }, el("a", { class: "btn solid", href: "#test" }, t("or.tab.test"))));
  }

  // ── topic view (Lær) ─────────────────────────────────────────────────────────────
  function viewTopic(id) {
    const key = keyOf(id), q0 = qById[id];
    if (!q0 || !D.topics[key]) return viewLaer();
    laerSit = sitOf(key);
    const qs = topicIds(key).map(x => qById[x]).filter(Boolean);
    app.replaceChildren(
      el("p", { class: "crumbs" }, el("a", { href: "#laer" }, t("or.back"))),
      el("section", { class: "view" },
        topicHead(key),
        picture(key),
        el("p", { class: "hint" }, el("a", { href: `#test`, onclick: () => startSingle(key) }, t("or.topictest"))),
        ...qs.map(q => questionCard(q, q.id === id))));
  }

  // ── Test ─────────────────────────────────────────────────────────────────────────
  let testCfg = { sit: "2024s", unsure: false }, S = null, timer = null;
  function startSession(keys) { return { queue: keys, ti: 0, phase: "topic", slot1: "1A", results: {}, draft: "", last: null, t0: 0 }; }
  function startSingle(key) { S = startSession([key]); }
  function testSetup() {
    const pool = testCfg.sit === "random" ? topicKeys : topicKeys.filter(k => sitOf(k) === testCfg.sit);
    const keysNow = testCfg.unsure ? pool.filter(k => tStatus(k) !== "sure") : pool;
    const chips = [...D.sittings.map(s => ({ id: s.id, label: LANG === "en" ? s.label.en : s.label.da })),
      { id: "random", label: t("or.test.rand") }];
    app.replaceChildren(
      el("section", { class: "top" }, el("h1", null, el("span", { class: "light" }, t("or.h1a")), el("span", null, t("or.test.h")))),
      el("p", { class: "lead" }, both("or.test.p")),
      el("section", { class: "sec" }, el("h2", null, t("or.test.sit")),
        el("div", { class: "chips", role: "group" }, chips.map(c => el("button", { type: "button", class: "chipbtn",
          "aria-pressed": testCfg.sit === c.id ? "true" : "false", onclick: () => { testCfg.sit = c.id; route(); } }, c.label))),
        el("label", { class: "check" }, el("input", { type: "checkbox", checked: testCfg.unsure ? "" : null,
          onchange: e => { testCfg.unsure = e.target.checked; route(); } }), t("or.test.unsure")),
        keysNow.length
          ? el("button", { class: "btn solid", type: "button", onclick: () => {
              let keys = keysNow;
              if (testCfg.sit === "random") keys = shuffle(keys.slice()).slice(0, 3);
              S = startSession(keys); route(); } }, t("or.test.start"))
          : el("p", { class: "hint" }, t("or.test.none"))));
  }
  function testProgressBar() {
    const total = S.queue.length;
    return el("div", { class: "testbar" }, el("span", null, t("or.test.topic", S.ti + 1, total)),
      el("span", null, bi(sitLabel(sitOf(S.queue[S.ti])).da, sitLabel(sitOf(S.queue[S.ti])).en)));
  }
  function startTimer() {
    clearInterval(timer);
    const tick = () => { const e = $("#tm"); if (e) e.textContent = t("or.test.time", mmss(Date.now() - S.t0)); };
    timer = setInterval(tick, 1000); tick();
  }
  function ratingBlock(id, phase) {
    const res = S.results[id];
    const btns = [["k", "or.rate.k"], ["d", "or.rate.d"], ["i", "or.rate.i"]].map(([r, k]) => el("button", {
      type: "button", class: "btn", "aria-pressed": res && res.r === r ? "true" : "false",
      onclick: () => { S.results[id] = { ...(S.results[id] || {}), r }; rate(id, r); route(); } }, t(k)));
    const next = phase === "fb1" ? { label: t("or.next"), go: () => { S.phase = "q2"; S.draft = ""; S.t0 = Date.now(); route(); } }
      : { label: t("or.seetopic"), go: () => { S.phase = "sum"; route(); } };
    return el("div", { class: "rate" }, el("p", { class: "sub-h" }, t("or.rate.h")), el("div", { class: "ratebtns" }, btns),
      res && res.r ? el("button", { class: "btn solid", type: "button", onclick: next.go }, next.label) : null);
  }
  function feedbackView(q, phase) {
    const last = S.last, fb = last.fb, text = last.text;
    const spell = fb.spell.length
      ? el("div", { class: "box" }, el("p", { class: "lbl" }, t("or.fb.spell.h")), el("p", { class: "hint", style: "margin:0" }, both("or.fb.spell.note")),
          el("ul", { class: "wlist" }, fb.spell.map(s => el("li", null, el("span", { class: "sp-old" }, s.w), el("span", null, " → "), el("b", { class: "sp-new", lang: "da" }, s.fix)))))
      : el("div", { class: "box" }, el("p", { class: "lbl" }, t("or.fb.spell.h")), el("p", { class: "ok-mark" }, t("or.fb.none")));
    const wo = fb.wo.length
      ? el("div", { class: "box warn" }, el("p", { class: "lbl" }, el("span", { class: "dotbad" }), t("or.fb.wo.h")), el("p", { class: "hint", style: "margin:0" }, both("or.fb.wo.note")),
          el("ul", { class: "wlist" }, fb.wo.map(w => el("li", null, el("span", { class: "wo", lang: "da" }, w.snip), el("span", null, " → "), el("b", { lang: "da" }, w.fix),
            el("span", { class: "why", lang: "da" }, w.why.da), el("span", { class: "why en" }, w.why.en)))))
      : el("div", { class: "box" }, el("p", { class: "lbl" }, t("or.fb.wo.h")), el("p", { class: "ok-mark" }, t("or.fb.wo.none")));
    const n = fb.steps.filter(s => s.ok).length, m = fb.steps.length, k = fb.kw.filter(x => x.used).length;
    const struct = !q.answer ? null : el("div", { class: "box" }, el("p", { class: "lbl" }, t("or.fb.struct.h"), " · ", t("frame." + q.answer.frame)),
      el("p", { class: "hint", style: "margin:0" }, t("or.fb.struct.n", n, m)),
      el("ol", { class: "fsteps" }, fb.steps.map(s => el("li", { class: s.ok ? "" : "no" }, el("span", { class: s.ok ? "ok-mark" : "no-mark" }, s.ok ? "✅" : "❌"), t("part." + s.part)))));
    const kws = fb.kw.length
      ? el("div", { class: "box" }, el("p", { class: "lbl" }, t("or.fb.kw.h")), el("p", { class: "hint", style: "margin:0" }, t("or.fb.kw.n", k, fb.kw.length)),
          el("ul", { class: "fkw" }, fb.kw.map(x => el("li", { class: x.used ? "" : "no" }, el("span", { class: x.used ? "ok-mark" : "no-mark" }, x.used ? "✅" : "❌"), el("span", { lang: "da" }, x.da))))) : null;
    const cmp = el("div", { class: "cmp" },
      el("div", { class: "col" }, el("p", { class: "sub-h" }, t("or.fb.yours")), el("p", { class: "yours", lang: "da" }, annotate(text, fb))),
      el("div", { class: "col" }, el("p", { class: "sub-h" }, t("or.fb.model")), segmentsOnly(q)));
    return el("div", { class: "fb" }, el("div", { class: "testbar" }, el("span", { class: "lbl", style: "margin:0" }, t("or.fb.h")), el("span", { class: "tm", id: "tm" }, "")),
      spell, wo, struct, kws, cmp, ratingBlock(q.id, phase));
  }
  function viewTest() {
    if (!S) return testSetup();
    if (S.phase === "done") return testDone();
    const key = S.queue[S.ti];
    const wrap = children => app.replaceChildren(el("section", { class: "view" }, testProgressBar(), ...children));
    if (S.phase === "topic") {
      wrap([topicHead(key), picture(key, "test"),
        el("button", { class: "btn solid", type: "button", onclick: () => {
          S.slot1 = Math.random() < 0.5 ? "1A" : "1B"; S.phase = "q1"; S.draft = ""; S.t0 = Date.now(); route(); } }, t("or.test.startq"))]);
      return;
    }
    if (S.phase === "q1" || S.phase === "q2") {
      const id = S.phase === "q1" ? `${key}-${S.slot1}` : `${key}-2`, q = qById[id];
      const ta = el("textarea", { class: "ans", id: "ta", lang: "da", rows: "7", spellcheck: "false", placeholder: t("or.test.ta"), "aria-label": t("or.test.ta") });
      ta.value = S.draft || "";
      ta.addEventListener("input", () => { S.draft = ta.value; });
      const sl = sourceLabel(q);
      const card = el("article", { class: "qcard sheet" }, el("p", { class: "src" }, el("span", { lang: "da" }, sl.da), el("span", { class: "en" }, sl.en)),
        el("p", { class: "lbl", style: "margin:0" }, t("or.test.step", S.phase === "q1" ? 1 : 2)),
        qtext(q));
      wrap([picture(key, "test"), card, ta,
        el("div", { class: "testbar" }, el("span", { id: "tm", class: "tm" }, ""),
          el("button", { class: "btn solid", type: "button", onclick: () => {
            const text = ta.value; S.draft = text;
            S.last = { id, text, fb: analyse(text, q) }; S.phase = S.phase === "q1" ? "fb1" : "fb2"; route(); } }, t("or.test.check")))]);
      startTimer();
      return;
    }
    if (S.phase === "fb1" || S.phase === "fb2") {
      const q = qById[S.last.id];
      clearInterval(timer);
      wrap([feedbackView(q, S.phase)]);
      const e = $("#tm"); if (e) e.textContent = t("or.test.time", mmss(Date.now() - S.t0));
      return;
    }
    if (S.phase === "sum") {
      const rows = topicIds(key).filter(id => id === `${key}-2` || id === `${key}-${S.slot1}`).map(id => {
        const r = S.results[id]; const q = qById[id];
        const steps = r && r.fb ? r.fb.steps.filter(x => x.ok).length : 0, m = r && r.fb ? r.fb.steps.length : 0;
        const kws = r && r.fb ? r.fb.kw.filter(x => x.used).length : 0, mk = r && r.fb ? r.fb.kw.length : 0;
        const rl = r && r.r ? t({ k: "or.rate.k", d: "or.rate.d", i: "or.rate.i" }[r.r]) : "–";
        return el("div", { class: "sumrow" }, el("b", null, id.split("-").slice(2).join("-")), el("span", { class: "meta2" }, rl),
          el("span", { class: "meta2" }, t("or.sum.struct", steps, m) + " · " + t("or.sum.kw", kws, mk)));
      });
      const last = S.ti + 1 >= S.queue.length;
      wrap([el("h2", null, t("or.sum.h")), el("div", { class: "framecards" }, rows),
        el("div", { class: "ratebtns" },
          el("button", { class: "btn solid", type: "button", onclick: () => {
            if (last) { S.phase = "done"; } else { S.ti++; S.phase = "topic"; S.draft = ""; }
            route(); } }, last ? t("or.seeall") : t("or.nexttopic")),
          el("button", { class: "btn", type: "button", onclick: () => {
            topicIds(key).forEach(id => delete S.results[id]); S.phase = "topic"; S.draft = ""; route(); } }, t("or.again")))]);
    }
  }
  function testDone() {
    const rows = S.queue.map(key => el("section", { class: "sec" }, el("h2", null, bi(sitLabel(sitOf(key)).da, sitLabel(sitOf(key)).en)),
      el("p", { class: "lead", lang: "da" }, D.topics[key].title, enLine(D.topics[key].title_en))));
    app.replaceChildren(el("section", { class: "view" }, el("h2", null, t("or.sum.all")), ...rows,
      el("button", { class: "btn solid", type: "button", onclick: () => { S = null; route(); } }, t("or.newtest"))));
  }

  // ── English switch: hides and shows the English lines in place (no re-render, nothing is lost) ──
  const enBtn = $("#enToggle");
  const enOn = () => { try { return localStorage.getItem(EN_KEY) !== "0"; } catch (e) { return true; } };
  function setEnLabel() {
    const on = !app.classList.contains("hide-en");
    enBtn.textContent = I18N[on ? "or.en.hide" : "or.en.show"][LANG === "en" ? 1 : 0];
    enBtn.setAttribute("aria-pressed", on ? "true" : "false");
  }
  function setEn(on) {
    app.classList.toggle("hide-en", !on);
    try { localStorage.setItem(EN_KEY, on ? "1" : "0"); } catch (e) { /* ignore */ }
    setEnLabel();
  }
  enBtn.addEventListener("click", () => setEn(app.classList.contains("hide-en")));

  // ── router ─────────────────────────────────────────────────────────────────────────
  function route() {
    clearInterval(timer);
    const h = location.hash.slice(1);
    const tab = h.startsWith("test") ? "test" : "laer";
    document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.go === "#" + tab ? "true" : "false"));
    if (h.startsWith("q/")) viewTopic(h.slice(2));
    else if (tab === "test") viewTest();
    else viewLaer();
    setEnLabel();
  }
  document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => { location.hash = b.dataset.go; if (location.hash === b.dataset.go) route(); }));
  addEventListener("hashchange", route);
  // the Dansk/English button re-renders the page so that the dynamic text follows the language
  const lb = document.querySelector(".langbtn");
  if (lb) lb.addEventListener("click", () => setTimeout(route, 0));
  setEn(enOn());
  if (!location.hash) location.hash = "#laer";
  route();
  applyTexts(document);
})();
</script>
