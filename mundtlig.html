<style>
/* Mundtlig v3 · Trin for trin (PLAN-v3). Tokens come from common.css; shared pieces first, then the page layout. */
/* Shared pieces for the Mundtlig redesign prototypes. Uses only the site tokens from common.css. */
:root { --ok-ink: var(--ok); }
::selection { background: var(--accent-soft); color: var(--accent-text); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
body { background: var(--paper); }

/* Danish first, English small under it. The switch hides every English line. */
.bi { display: inline; }
.bi > .da { display: block; }
.en { display: block; margin-top: 2px; color: var(--soft); font-size: .84em; font-weight: 450; line-height: 1.4; }
.hide-en .en { display: none !important; }
.lab { margin: 0; font: 700 .95rem/1.3 var(--head); color: var(--ink); letter-spacing: 0; }
.lab .en { font-family: var(--body); font-weight: 500; font-size: .8rem; }

.ic { width: 1.1em; height: 1.1em; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.18em; }

/* English switch */
.enbtn { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; padding: 6px 14px 6px 10px; border-radius: 999px; border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink); font: 600 .88rem var(--body); cursor: pointer; }
.enbtn .sw { width: 30px; height: 18px; border-radius: 99px; background: var(--rule-strong); position: relative; transition: background .2s; }
.enbtn .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--sheet); transition: transform .2s cubic-bezier(.2,.8,.2,1); }
.enbtn[aria-pressed="true"] .sw { background: var(--accent); }
.enbtn[aria-pressed="true"] .sw::after { transform: translateX(12px); }

/* structure parts: one colour per part, the same everywhere */
.p-intro { --c: var(--faint); }
.p-aarsag, .p-aarsag2, .p-side1 { --c: var(--accent); }
.p-fordi, .p-side2, .p-konsekvens { --c: var(--blue); }
.p-eksempel { --c: var(--violet); }
.p-stilling { --c: var(--ok); }
.p-konklusion { --c: var(--warn); }

.segs { display: grid; gap: 8px; }
.seg { margin: 0; padding: 10px 14px 11px; border-radius: 14px; background: color-mix(in srgb, var(--c) 13%, var(--sheet)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); font-size: 1.04rem; line-height: 1.5; transition: opacity .2s, box-shadow .2s; }
.seg .seglbl { display: block; font: 700 .78rem/1.2 var(--body); color: color-mix(in srgb, var(--c) 80%, var(--ink)); margin-bottom: 3px; }
.seg .en { font-size: .86rem; }
.segs.focus .seg:not(.hi) { opacity: .38; }
.seg.hi { box-shadow: inset 0 0 0 2px var(--c); }

ol.smap, ol.order { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
ol.smap button, ol.order li { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 5px 12px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 14%, var(--sheet)); color: var(--ink); font: 600 .88rem/1.2 var(--body); text-align: left; }
ol.smap button { cursor: pointer; }
ol.smap button .en, ol.order li .en { font-size: .72rem; margin-top: 0; }
ol.smap button.on { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 45%, transparent); }
ol.smap li.off button { opacity: .45; border-style: dashed; }
ol.smap .n { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--c); color: var(--sheet); font: 800 .75rem var(--body); }

.kws { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.kw { display: grid; gap: 1px; padding: 9px 12px; border-radius: 12px; background: var(--paper); border: 1px solid var(--rule); }
.kw b { font-size: 1.02rem; color: var(--ink); }
.kw .use { color: var(--soft); font-size: .9rem; }
.kw .en { font-size: .82rem; }
.tips { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.tips li::marker { color: var(--accent); }
.tips .en { font-size: .82rem; }
.fu { display: grid; gap: 8px; }
.fu p { margin: 0; }
.fu .fuq { font-weight: 700; }
.fu .fua { padding: 10px 14px; border-radius: 14px; background: var(--paper); border: 1px solid var(--rule); }
.notes { display: grid; gap: 6px; padding: 12px 14px; border-radius: 14px; background: var(--hl); color: var(--hl-ink); }
.notes p { margin: 0; white-space: pre-line; }
.notes .en { color: color-mix(in srgb, var(--hl-ink) 75%, transparent); white-space: pre-line; }
.notes summary { cursor: pointer; min-height: 36px; display: inline-flex; align-items: center; font-size: .88rem; font-weight: 600; }
.notes .raw { font-size: .9rem; opacity: .85; }

figure.pic { margin: 0; display: grid; gap: 6px; }
figure.pic .picbtn { position: relative; display: block; padding: 0; border: 1px solid var(--rule); border-radius: 16px; overflow: hidden; background: #fff; cursor: zoom-in; width: 100%; }
figure.pic img { display: block; width: 100%; height: auto; }
figure.pic .zoom { position: absolute; right: 8px; bottom: 8px; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--sheet); color: var(--ink); box-shadow: var(--shadow-lg); }
figure.pic figcaption { font-size: .82rem; color: var(--soft); }
figure.pic.big { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--paper) 94%, transparent); padding: 16px; place-items: center; overflow: auto; }
figure.pic.big .picbtn { max-width: min(900px, 100%); cursor: zoom-out; }
/* the sticky .side (>= 960 px) is its own stacking context and comes before .main in the DOM, so the
   fixed .big overlay inside it is drawn under the steps and the action bar unless the whole .side is raised */
.flow .side.zoomed { z-index: 60; }

.src { margin: 0; font-size: .88rem; font-weight: 600; color: var(--soft); }
.src .en { font-size: .78rem; font-weight: 500; color: var(--faint); }
.qtext { margin: 0; font: 700 1.28rem/1.4 var(--body); letter-spacing: -.01em; color: var(--ink); text-wrap: pretty; }
.qtext .intro { display: block; font-weight: 500; color: var(--soft); font-size: 1rem; }
.qtext .en { font-size: .9rem; }

/* status dots */
.sdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 2px var(--rule-strong); flex: 0 0 auto; }
.sdot.s-practice { background: var(--warn); box-shadow: none; }
.sdot.s-sure { background: var(--ok); box-shadow: none; }

/* feedback pieces */
.yours { margin: 0; font-size: 1.04rem; line-height: 1.7; }
.yours .sp { text-decoration: underline; text-decoration-color: var(--warn); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.yours .wo { text-decoration: underline wavy var(--bad); text-underline-offset: 5px; text-decoration-thickness: 1.5px; }
.yours .empty { color: var(--soft); font-style: italic; }
.fixes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.fix { display: grid; gap: 4px; padding: 10px 14px; border-radius: 14px; background: var(--sheet); border: 1px solid var(--rule); }
.fix p { margin: 0; }
.fix .pair { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 1.02rem; }
.fix .old { color: var(--bad); text-decoration-thickness: 1.5px; }
.fix .new { color: var(--ok); }
.fix .pair .ic { color: var(--faint); }
.fix .why { font-size: .92rem; color: var(--ink); }
.fix .why .en { font-size: .82rem; }
.st-fix .pair b { color: color-mix(in srgb, var(--c) 75%, var(--ink)); }
ol.fsteps, ul.fkw { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
ol.fsteps li { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 4px 12px 4px 9px; border-radius: 12px; font-size: .88rem; font-weight: 600; background: color-mix(in srgb, var(--c) 14%, var(--sheet)); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
ol.fsteps li .en { font-size: .72rem; margin: 0; }
ol.fsteps li.ok .ic { color: var(--ok); }
ol.fsteps li.no { background: var(--sheet); border-style: dashed; color: var(--soft); }
ol.fsteps li.no .ic { color: var(--bad); }
ul.fkw { display: grid; gap: 6px; }
ul.fkw li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border-radius: 12px; background: var(--sheet); border: 1px solid var(--rule); }
ul.fkw li .ic { margin-top: 3px; }
ul.fkw li.ok .ic { color: var(--ok); }
ul.fkw li.no .ic { color: var(--bad); }
ul.fkw li > span { display: grid; }
ul.fkw .use { font-size: .86rem; color: var(--soft); }
ul.fkw .en { font-size: .8rem; }

/* self-rating */
.rating { display: grid; gap: 8px; }
.ratebtns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ratebtn { display: grid; gap: 2px; justify-items: start; text-align: left; min-height: 56px; padding: 8px 12px; border-radius: 16px; border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--ink); font: 700 1rem var(--body); cursor: pointer; }
.ratebtn .en { font-size: .74rem; margin: 0; }
.ratebtn .hint { font-size: .74rem; font-weight: 500; color: var(--soft); }
.ratebtn:hover { border-color: var(--ink); }
.ratebtn.r-k[aria-pressed="true"] { background: var(--ok-bg); border-color: var(--ok); }
.ratebtn.r-d[aria-pressed="true"] { background: var(--warn-bg); border-color: var(--warn); }
.ratebtn.r-i[aria-pressed="true"] { background: var(--bad-bg); border-color: var(--bad); }
.ratemsg { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; color: var(--ok); min-height: 1.2em; }
.ratemsg .bi .da { color: var(--ink); }
@media (max-width: 420px) { .ratebtn .hint { display: none; } }

textarea.ans { width: 100%; min-height: 140px; padding: 12px 14px; border-radius: 16px; border: 1.5px solid var(--rule-strong); background: var(--sheet); color: var(--ink); font: 1.04rem/1.55 var(--body); resize: vertical; caret-color: var(--accent); }
textarea.ans:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.foot { padding-top: 40px; padding-bottom: 48px; color: var(--faint); font-size: .82rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* Option 1 · Trin for trin: one question at a time, in four steps. */
.head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 24px; }
.head .pick button { min-width: 76px; }
.view { padding-top: 22px; }

/* start */
.hello h1 { font-size: clamp(1.8rem, 5vw, 2.4rem); letter-spacing: -.025em; }
.hello h1 .en { font: 500 .95rem var(--body); letter-spacing: 0; margin-top: 4px; }
.hello { display: grid; gap: 4px; margin-bottom: 18px; }
.next { display: grid; gap: 0; overflow: hidden; border-radius: 28px; background: var(--sheet); border: 1px solid var(--rule); box-shadow: var(--shadow-lg); }
@media (min-width: 760px) { .next { grid-template-columns: 300px 1fr; } }
.next .thumb { background: #fff; border-bottom: 1px solid var(--rule); display: grid; place-items: center; max-height: 220px; overflow: hidden; }
@media (min-width: 760px) { .next .thumb { max-height: none; border-bottom: 0; border-right: 1px solid var(--rule); } }
.next .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.next .body { display: grid; gap: 14px; padding: 20px; align-content: center; }
@media (min-width: 760px) { .next .body { padding: 28px 32px; } }
.next .lab { color: var(--accent-text); }
.next .topic { margin: 0; font: 800 1.5rem/1.2 var(--head); }
.next .topic .en { font: 500 .9rem var(--body); }
.next .qtext { font-size: 1.12rem; }
.go { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 999px; border: 0; background: var(--accent); color: var(--accent-ink); font: 700 1.05rem var(--body); cursor: pointer; text-decoration: none; justify-self: start; }
.go:hover { background: color-mix(in srgb, var(--accent) 88%, black); }
.go.ghost { background: var(--sheet); color: var(--ink); border: 1px solid var(--rule-strong); }
.prog { display: grid; gap: 8px; margin-top: 18px; padding: 0 4px; }
.prog .line { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.prog .line b { font-size: 1rem; }
.prog .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .84rem; color: var(--soft); margin: 0; }
.prog .legend span { display: inline-flex; align-items: center; gap: 6px; }
.pbar { display: flex; height: 10px; border-radius: 99px; background: var(--rule); overflow: hidden; }
.pbar .s { background: var(--ok); } .pbar .p { background: var(--warn); }
.choose { margin-top: 40px; display: grid; gap: 14px; }
.choose h2 { font-size: 1.3rem; }
.choose h2 .en { font: 500 .85rem var(--body); }
.years { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
.years .chipbtn { flex: 0 0 auto; }
.topics { display: grid; gap: 10px; }
.trow { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 20px; background: var(--sheet); border: 1px solid var(--rule); text-decoration: none; color: inherit; }
.trow:hover { border-color: var(--rule-strong); box-shadow: var(--shadow-lg); }
.trow .L { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-text); font: 800 1.3rem var(--head); }
.trow h3 { font-size: 1.08rem; }
.trow h3 .en { font: 500 .82rem var(--body); }
.trow .sits { margin: 2px 0 0; font-size: .86rem; color: var(--soft); }
.trow .dots { display: flex; gap: 5px; align-items: center; }
.trow .ic.chev { color: var(--faint); }

/* one question, four steps */
.flow { display: grid; gap: 22px; }
@media (min-width: 960px) { .flow { grid-template-columns: minmax(0, 1fr) 380px; align-items: start; } .flow .side { position: sticky; top: 16px; order: 2; } }
.qhead { display: grid; gap: 10px; }
.crumb { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; color: var(--soft); text-decoration: none; font-weight: 600; font-size: .92rem; }
.crumb:hover { color: var(--ink); }
.qnav { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.qnav .topic { margin: 0; font: 800 1.35rem/1.2 var(--head); }
.qnav .topic .en { font: 500 .85rem var(--body); }
.qpills { display: flex; gap: 6px; margin-left: auto; }
.qpills a { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rule-strong); text-decoration: none; color: var(--soft); font: 700 .85rem var(--body); background: var(--sheet); }
.qpills a[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: s; }
.step { position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 0 14px; padding-bottom: 26px; }
.step::before { counter-increment: s; content: counter(s); grid-row: 1; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--sheet); border: 2px solid var(--rule-strong); color: var(--soft); font: 800 1rem var(--head); z-index: 1; }
.step:not(:last-child)::after { content: ""; position: absolute; left: 19px; top: 40px; bottom: 0; width: 2px; background: var(--rule); }
.step.done::before { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step.now::before { border-color: var(--accent); color: var(--accent-text); background: var(--accent-soft); }
.step.later { opacity: .55; }
.step .sh { grid-column: 2; min-height: 40px; display: flex; align-items: center; }
.step .sh h3 { font-size: 1.12rem; }
.step .sh h3 .en { font: 500 .8rem var(--body); }
.step .sb { grid-column: 2; display: grid; gap: 14px; margin-top: 10px; }
.step.later .sb { display: none; }
.card { padding: 18px; border-radius: 22px; background: var(--sheet); border: 1px solid var(--rule); display: grid; gap: 12px; align-content: start; }
.typecard { display: grid; gap: 10px; padding: 14px 16px; border-radius: 18px; background: var(--paper); border: 1px solid var(--rule); }
.typecard .t { margin: 0; font-weight: 700; }
.typecard .t .en { font-weight: 500; }
.say { display: flex; gap: 10px; align-items: flex-start; margin: 0; color: var(--ink); }
.say .ic { color: var(--accent); margin-top: 3px; }
.more { display: grid; gap: 14px; }
@media (min-width: 720px) { .more { grid-template-columns: 1fr 1fr; } .more .wide { grid-column: 1 / -1; } }
.more .card h4 { margin: 0; font: 700 1rem var(--head); }
.more .card h4 .en { font: 500 .78rem var(--body); }
.side .pic figcaption { padding: 0 2px; }
@media (max-width: 959px) { .side figure.pic:not(.big) .picbtn { max-height: 240px; } .side figure.pic:not(.big) img { object-fit: cover; object-position: top; max-height: 240px; } }
.actionbar { position: sticky; bottom: 0; z-index: 20; margin-top: 8px; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--paper) 70%, transparent); display: flex; gap: 10px; justify-content: flex-end; }
.actionbar .go { justify-self: auto; }

/* test */
.tsetup { display: grid; gap: 16px; max-width: 720px; }
.tsetup h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); }
.tsetup h1 .en { font: 500 .9rem var(--body); }
.tsetup p { margin: 0; }
.tbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: .9rem; color: var(--soft); }
.tbar .count { font-weight: 700; color: var(--ink); }
.tbar .dash { display: flex; gap: 4px; flex: 1 1 160px; }
.tbar .dash i { flex: 1; height: 6px; border-radius: 99px; background: var(--rule); }
.tbar .dash i.done { background: var(--accent); } .tbar .dash i.now { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.timer { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; font-weight: 600; }
.verdict { display: grid; gap: 10px; padding: 18px 20px; border-radius: 22px; background: var(--sheet); border: 1px solid var(--rule); }
.verdict h2 { font-size: 1.35rem; }
.verdict h2 .en { font: 500 .85rem var(--body); }
.verdict ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.verdict li { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--rule); font-size: .88rem; font-weight: 600; }
.verdict li.bad { background: var(--bad-bg); border-color: transparent; color: var(--md-sys-color-on-error-container); }
.verdict li.good { background: var(--ok-bg); border-color: transparent; color: var(--ok); }
.verdict li .nb { font-weight: 500; opacity: .8; }
.cmp { display: grid; gap: 16px; }
@media (min-width: 820px) { .cmp { grid-template-columns: 1fr 1fr; } }
.cmp h4 { margin: 0 0 8px; font: 700 1rem var(--head); }
.cmp h4 .en { font: 500 .78rem var(--body); }
.cmp .yours { padding: 14px 16px; border-radius: 16px; background: var(--sheet); border: 1px solid var(--rule); }
/* ── v3 additions to the option 1 prototype CSS (PLAN-v3) ── */
.lead { margin: 6px 0 0; max-width: 62ch; color: var(--ink); }
.hint { margin: 0; font-size: .9rem; color: var(--soft); }
.soon { margin: 0; color: var(--soft); font-style: italic; }
.view h1, .view h2, .view h3, .view h4 { margin: 0; }

/* start */
.next .body > .nl { display: grid; gap: 2px; }
.prog .legend { list-style: none; padding: 0; }
.prog .legend li { display: inline-flex; align-items: flex-start; gap: 6px; }
.prog .legend .sdot { margin-top: 5px; }
.prog .legend .bi { display: grid; gap: 0; }   /* option 1's ".legend span" rule would put the English beside the Danish */
.choose > .ch { display: grid; gap: 4px; }
.years .chipbtn { text-align: left; }
.years .chipbtn .bi .en { font-size: .72rem; margin: 0; font-weight: 500; }
@media (min-width: 720px) { .years { flex-wrap: wrap; overflow: visible; } }
/* topic rows: the 3 dots stay on one line, top right next to the title (the prototype wrapped them under the text on a phone) */
.trow .dots { flex-wrap: nowrap; white-space: nowrap; }
@media (max-width: 560px) {
  .trow { grid-template-columns: 36px minmax(0, 1fr) auto; align-items: start; gap: 12px; padding: 12px 14px; }
  .trow .L { width: 36px; height: 36px; font-size: 1.1rem; border-radius: 12px; }
  .trow .dots { padding-top: 4px; }
}

/* question */
.step { scroll-margin-top: 12px; }
.qpills a { white-space: nowrap; }

                  "Source: Prøve i Dansk 3, oral part 2, May 2018 – May 2024 (SIRI), and your own notes. May 2022 is not included (no speaking booklet). Model answers were written for this tool. Progress is stored only in this browser."],
    "frame.aarsag": ["Hvorfor? · årsag", "Why? · reason"], "frame.fordele_ulemper": ["Fordele og ulemper", "Advantages and disadvantages"],
    "frame.konsekvens": ["Konsekvens", "Consequence"], "frame.holdning": ["Din holdning", "Your view"],
    "part.intro": ["Indledning", "Intro"], "part.aarsag": ["Årsag", "Reason"], "part.aarsag2": ["Anden årsag", "Second reason"],
    "part.fordi": ["Fordi", "Because"], "part.eksempel": ["Eksempel", "Example"], "part.konklusion": ["Konklusion", "Conclusion"],

    "or.seetopic": ["Se emnet", "See topic"],
  });

  // ── data helpers ───────────────────────────────────────────────────────────
  const qById = Object.fromEntries(D.questions.map(q => [q.id, q]));
  const topicKeys = Object.keys(D.topics);
  const topicIds = k => [k + "-1A", k + "-1B", k + "-2"];
  const keyOf = id => id.split("-").slice(0, 2).join("-");
  const sitOf = key => key.split("-")[0];
  const sitLabel = s => (D.sittings.find(x => x.id === s) || { label: { da: s, en: s } }).label;
  const FAM = { arbejde: ["Arbejde", "Work"], uddannelse: ["Uddannelse", "Education"], klima: ["Klima", "Climate"],
    sundhed: ["Sundhed", "Health"], unge_born: ["Unge og børn", "Young people and children"], medier: ["Medier", "Media"], samfund: ["Samfund", "Society"] };
  const famOf = key => { const f = D.topics[key].family; return FAM[f] || null; };
  const today = () => new Date().toLocaleDateString("sv-SE");
  const mmss = ms => { const s = Math.floor(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const fill = (s, ...a) => a.reduce((x, v, i) => x.split(`{${i}}`).join(String(v)), s);
  const slotText = slot => slot === "2" ? ["2. obligatorisk spørgsmål", "2nd compulsory question"]
    : [`1. obligatorisk spørgsmål, situation ${slot === "1A" ? "A" : "B"}`, `1st compulsory question, situation ${slot === "1A" ? "A" : "B"}`];
  function sourceLabel(q) {
    const sl = sitLabel(q.sitting), topic = D.topics[`${q.sitting}-${q.letter}`];
    const [da, en] = slotText(q.slot);

  }

  const FR = f => (D.frames && D.frames[f]) || {};

  const frameDa = f => I18N["frame." + f][0], frameEn = f => I18N["frame." + f][1];

  // ── progress (localStorage) ────────────────────────────────────────────────
  const loadProg = () => store.get(KEY, {});
  function rate(id, r) {
    const all = loadProg(), e = all[id] || { ratings: [] };
    e.ratings = [...e.ratings, { d: today(), r }].slice(-30); all[id] = e; store.set(KEY, all);
  }
  function qStatus(id) {
    const rs = (loadProg()[id] || {}).ratings || [];
    if (!rs.length) return "new";
    const days = new Set(rs.filter(x => x.r === "k").map(x => x.d));
    return days.size >= 2 ? "sure" : "practice";
  }
  function tStatus(key) {
    const s = topicIds(key).map(qStatus);
    if (s.every(x => x === "sure")) return "sure";
    return s.some(x => x !== "new") ? "practice" : "new";
  }
  const sureCount = () => D.questions.filter(q => qStatus(q.id) === "sure").length;

  // ── offline checks: spelling, word order, structure, keywords ──────────────────────────
  const SUBJ = new Set(["jeg", "du", "han", "hun", "vi", "de", "det", "den", "man"]);
  const FIN = new Set(["er", "var", "har", "havde", "kan", "kunne", "skal", "skulle", "vil", "ville", "må", "bør", "bliver", "blev",
    "får", "fik", "gør", "gjorde", "kommer", "går", "betyder", "giver", "tror", "mener", "synes", "ved", "siger", "findes", "bruger", "kender", "ser"]);
  const TRIG = new Set(["synes", "tror", "mener", "syntes", "ved", "siger"]);
  const CONJ = new Set(["at", "fordi", "selvom", "hvis", "når"]);
  const MODAL = new Set(["kan", "skal", "må", "bør"]);
  const ADV1 = new Set(["derfor", "måske", "desuden", "tit", "ofte", "heldigvis", "desværre"]);
  const MARK = {
    aarsag: /\ben (første |anden |tredje )?(årsag|grund)\b|\bdet skyldes\b|\bskyldes\b/,
    aarsag2: /\ben (anden|tredje|yderligere) (årsag|grund)\b|\ben anden (årsag|grund)\b/,
    fordi: /\bfordi\b|\bnemlig\b|\bpå grund af\b|\bdet skyldes\b/,
    eksempel: /\bfx\b|\bf\.eks\b|\bfor eksempel\b|\beksempelvis\b|\bkender jeg\b/,
    konklusion: /\bderfor\b|\balt i alt\b|\bsamlet set\b|\bkonklusion\b|\bså (jeg|vi|man) (tror|mener|synes)\b/,
    side1: /\bpå den ene side\b/,
    side2: /\bpå den anden side\b/,
    stilling: /\bjeg (mener|synes|tror)\b|\befter min mening\b|\bhvis jeg skal tage stilling\b|\bmin holdning\b/,
    konsekvens: /\bdet betyder\b|\bkonsekvens\b|\bfører til\b|\bmedfører\b|\bdet får\b/,
  };

    trig: { da: "Efter synes, tror, mener (+ komma og at) kommer en ledsætning: subjekt før verbum.",
            en: "After synes/tror/mener (+ comma and 'at') comes a subordinate clause: subject before verb." },
    neg: { da: "I en ledsætning (at, fordi, hvis, når) står ikke før verbet: subjekt + ikke + verbum.",
           en: "In a subordinate clause 'ikke' comes before the verb: subject + ikke + verb." },
    modal: { da: "Efter kan, skal, må og bør kommer infinitiv uden at.", en: "After kan, skal, må and bør the infinitive has no 'at'." },
    inv: { da: "Når ordet før subjektet er fx Derfor, skal verbum stå på plads 2: Derfor + verbum + subjekt.",
           en: "When a word such as Derfor starts the sentence, the verb comes second: Derfor + verb + subject." },
  };
  function dl(a, b) {  // optimal string alignment distance (a transposition counts as one)
    const n = a.length, m = b.length; if (!n) return m; if (!m) return n;
    const d = Array.from({ length: n + 1 }, (_, i) => [i]);
    for (let j = 0; j <= m; j++) d[0][j] = j;
    for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
      const c = a[i - 1] === b[j - 1] ? 0 : 1;
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
      if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
    }
    return d[n][m];
  }
  const CANDS = Object.keys(LEXW).filter(w => LEXW[w] >= 3);
  const fixCache = new Map();
  function spellFix(lo) {  // the closest common known word, or null
    if (fixCache.has(lo)) return fixCache.get(lo);
    const maxd = lo.length <= 5 ? 1 : 2;
    let best = null, bd = 99, bc = 0;
    for (const c of CANDS) {
      if (Math.abs(c.length - lo.length) > maxd) continue;
      if (c.includes(lo) || lo.includes(c)) continue;   // compounds and inflections are not typos
      const d = dl(lo, c);
      if (d > maxd) continue;
      if (d < bd || (d === bd && LEXW[c] > bc)) { best = c; bd = d; bc = LEXW[c]; }
    }
    fixCache.set(lo, best); return best;

  const cap = (orig, w) => orig[0] === orig[0].toUpperCase() && orig[0] !== orig[0].toLowerCase() ? w[0].toUpperCase() + w.slice(1) : w;
  function analyse(text, q) {
    const toks = [...text.matchAll(/[a-zæøåA-ZÆØÅ]+|[.,!?;:]/g)].map(m => ({ w: m[0], lo: m[0].toLowerCase(), s: m.index, e: m.index + m[0].length }));
    const isWord = t => /[a-zæøå]/i.test(t.w);
    // spelling: an unknown word with a close, common word; names (capitalised mid-sentence) are skipped
    const spell = [];
    toks.forEach((t, i) => {
      if (!isWord(t) || t.lo.length < 3 || LEXW[t.lo]) return;
      const prev = toks[i - 1];
      const sentStart = !prev || prev.w === "." || prev.w === "!" || prev.w === "?";
      if (!sentStart && t.w[0] !== t.w[0].toLowerCase()) return;
      const fix = spellFix(t.lo);
      if (fix) spell.push({ s: t.s, e: t.e, w: t.w, fix: cap(t.w, fix) });
    });
    // word order: only the clear, common mistakes
    const wo = [], snip = (a, b) => text.slice(a, b);
    toks.forEach((t, i) => {
      const nx = toks[i + 1], n2 = toks[i + 2], n3 = toks[i + 3];
      if (TRIG.has(t.lo)) {
        let j = i + 1; if (toks[j]?.w === ",") j++;
        if (toks[j]?.lo === "at") j++;
        if (toks[j] && FIN.has(toks[j].lo) && toks[j + 1] && SUBJ.has(toks[j + 1].lo)) {
          wo.push({ s: t.s, e: toks[j + 1].e, snip: snip(t.s, toks[j + 1].e), fix: `${t.w}, at ${toks[j + 1].w} ${toks[j].w}`, why: WHY.trig });
        }
      }
      if (CONJ.has(t.lo) && nx && SUBJ.has(nx.lo) && n2 && FIN.has(n2.lo) && n3 && n3.lo === "ikke") {
        wo.push({ s: t.s, e: n3.e, snip: snip(t.s, n3.e), fix: `${t.w} ${nx.w} ikke ${n2.w}`, why: WHY.neg });
      }
      if (MODAL.has(t.lo) && nx && nx.lo === "at" && n2 && /[a-zæøå]/.test(n2.lo)) {
        wo.push({ s: t.s, e: nx.e, snip: snip(t.s, nx.e), fix: `${t.w} ${n2.w}`, why: WHY.modal });
      }
      const starts = i === 0 || ["." , "!", "?"].includes(toks[i - 1].w);
      if (starts) {
        if (ADV1.has(t.lo) && nx && SUBJ.has(nx.lo)) {
          wo.push({ s: t.s, e: nx.e, snip: snip(t.s, nx.e), fix: `${t.w} [verbum] ${nx.w}`, why: WHY.inv });
        }
        if (t.lo === "i" && nx && (nx.lo === "dag" || nx.lo === "går") && n2 && SUBJ.has(n2.lo)) {
          wo.push({ s: t.s, e: n2.e, snip: snip(t.s, n2.e), fix: `${t.w} ${nx.w} [verbum] ${n2.w}`, why: WHY.inv });
        }
      }
    });
    wo.sort((a, b) => a.s - b.s);
    // structure: one ✅/❌ per step of the question's frame
    const low = text.toLowerCase();
    const steps = (D.frameSteps[q.answer ? q.answer.frame : "aarsag"] || []).map(p => ({
      part: p, ok: p === "intro" ? text.trim().length > 0 : !!(MARK[p] && MARK[p].test(low)) }));
    // keywords: each content word of the keyword (4+ letters) must appear in the answer (by its first five letters)
    const stems = new Set(toks.filter(isWord).map(t => t.lo.slice(0, 5)));
    const kw = ((q.answer && q.answer.keywords) || []).map(k => {
      let words = k.da.toLowerCase().split(/\s+/).filter(w => w.length >= 4);
      if (!words.length) words = k.da.toLowerCase().split(/\s+/);
      return { da: k.da, use: k.use, en: k.en, used: words.every(w => stems.has(w.slice(0, 5))) };
    });
    return { spell, wo, steps, kw };

          srcLabel(nq), qText(nq, "p"),
          el("a", { class: "go", href: `#q/${nq.id}` }, t("o3.start"), icon("right")))),
      el("div", { class: "prog" },
        el("div", { class: "line" }, tb("o3.prog.sure", [c.sure, total], [c.sure, total], "b"), tb("o3.prog.rest", [c.practice, c.new], [c.practice, c.new], "span", "hint")),
        el("div", { class: "pbar", role: "img", "aria-label": t("o3.prog.sure", c.sure, total) },
          el("span", { class: "s", style: `width:${pct(c.sure)}` }), el("span", { class: "p", style: `width:${pct(c.practice)}` })),
        el("ul", { class: "legend" }, ["sure", "practice", "new"].map(s => el("li", null, statusDot(s), tb("o3.leg." + s))))),
      el("section", { class: "choose" },
        el("div", { class: "ch" }, tb("o3.choose", [], [], "h2"), tb("o3.choose.p", [], [], "p", "hint")),
        el("div", { class: "years", role: "group", "aria-label": t("or.sittings") }, [...D.sittings].reverse().map(s => {
          const n = ["A", "B", "C"].flatMap(L => topicIds(`${s.id}-${L}`)).filter(id => qStatus(id) === "sure").length;
          return el("button", { type: "button", class: "chipbtn", "data-sit": s.id, "aria-pressed": String(s.id === year), onclick: () => { year = s.id; viewStart(); } },
            bi(s.label.da, s.label.en), el("span", { class: "n" }, t("o3.yearn", n)));
        })),
        el("div", { class: "topics" }, ["A", "B", "C"].map(L => `${year}-${L}`).filter(k => D.topics[k]).map(k => {
          const tp = D.topics[k], ten = tp.situations_en || {}, ids = topicIds(k);
          const nSure = ids.filter(id => qStatus(id) === "sure").length;
          return el("a", { class: "trow", href: `#q/${k}-1A`, "data-key": k },
            el("span", { class: "L", "aria-hidden": "true" }, k.split("-")[1]),
            el("div", null, el("h3", null, el("span", { class: "da", lang: "da" }, tp.title), en(tp.title_en)),
              el("p", { class: "sits" }, el("span", { class: "da", lang: "da" }, [tp.situations.A, tp.situations.B].filter(Boolean).join(" · ")),
                en([ten.A, ten.B].filter(Boolean).join(" · ")))),
            el("span", { class: "dots", title: t("o3.dots", nSure), "aria-label": t("o3.dots", nSure) }, ids.map(id => statusDot(qStatus(id))), icon("right", "chev")));
        }))));
  }

  // ── one question in four steps ──
  function viewQuestion(id, stage, scroll) {
    const q = qById[id]; if (!q) { location.replace("#laer"); return; }
    const key = keyOf(id), topic = D.topics[key], ids = topicIds(key), idx = ids.indexOf(id);
    const list = ORDER(), nextKey = list[list.indexOf(key) + 1] || null;
    const a = q.answer;
    const cls = n => n < stage ? "step done" : n === stage ? "step now" : "step later";
    const go = n => { location.hash = `#q/${id}/${n}`; };
    const segs = a ? segments(q) : null;
    const soon = () => tb("or.soon", [], [], "p", "soon");
    const step = (n, k, ...body) => el("li", { class: cls(n), id: "s" + n, "aria-current": n === stage ? "step" : null },
      el("div", { class: "sh" }, tb(k, [], [], "h3")), el("div", { class: "sb" }, ...body));
    const card = (k, body) => el("div", { class: "card" }, tb(k, [], [], "h4"), body);
    let primary;
    if (stage === 1) primary = [t("o3.b.show"), () => go(2)];
    else if (stage === 2) primary = [t("o3.b.words"), () => go(3)];
    else if (stage === 3) primary = [t("o3.s4"), () => go(4)];
    else if (ids[idx + 1]) primary = [t("or.next"), () => { location.hash = `#q/${ids[idx + 1]}`; }];
    else if (nextKey) primary = [t("or.nexttopic"), () => { location.hash = `#q/${nextKey}-1A`; }];
    else primary = [t("o3.crumb"), () => { location.hash = "#laer"; }];
    const fr = a ? FR(a.frame) : {};
    app.replaceChildren(el("div", { class: "flow" },
      el("aside", { class: "side" }, picture(key)),
      el("div", { class: "main" },
        el("div", { class: "qhead" },
          el("a", { class: "crumb", href: "#laer" }, icon("left"), t("o3.crumb")),
          el("div", { class: "qnav" },
            tb("o3.topic", [q.letter, topic.title], [q.letter, topic.title_en || topic.title], "h1", "topic"),
            el("nav", { class: "qpills", "aria-label": t("o3.qpills") }, ids.map((x, i) =>
              el("a", { href: `#q/${x}`, "aria-current": String(x === id) }, statusDot(qStatus(x)), t("o3.qpill", i + 1))))),
          srcLabel(q)),
        el("ol", { class: "steps" },
          step(1, "o3.s1", el("div", { class: "card" }, qText(q),
            a ? el("div", { class: "typecard" },
              tb("o3.qtype", [fr.title || frameDa(a.frame)], [fr.title_en || frameEn(a.frame)], "p", "t"),
              tb("o3.order", [], [], "p"), order(a.frame)) : null,
            el("p", { class: "say" }, icon("mic"), tb("o3.say")))),
          step(2, "o3.s2", a ? el("div", { class: "card" }, tb("o3.tap", [], [], "p", "hint"), smap(q, segs), segs) : soon()),
          step(3, "o3.s3", a ? el("div", { class: "more" },
            card("o3.kw.h", keywords(q)), card("or.tips", qTips(q)),
            a.followup ? card("o3.fu.h", followup(q)) : null,
            a.notes || a.notes_raw ? card("or.notes", notes(q)) : null) : soon()),
          step(4, "o3.s4", rating(id))),
        el("div", { class: "actionbar" }, el("button", { type: "button", class: "go", onclick: primary[1] }, primary[0], icon("right"))))));
    if (scroll && stage > 1) requestAnimationFrame(() => { const s = document.getElementById("s" + stage); if (s) s.scrollIntoView({ block: "start", behavior: smooth() }); });
  }

  // ── Test ──
  function viewTestSetup() {
    const chip = (id, label) => el("button", { type: "button", class: "chipbtn", "data-sit": id, "aria-pressed": String(tChoice === id),
      onclick: () => { tChoice = id; viewTestSetup(); } }, label);
    app.replaceChildren(el("div", { class: "tsetup" },
      tb("o3.t.h1", [], [], "h1"), tb("o3.t.p", [], [], "p"),
      tb("o3.t.choose", [], [], "h2"),
      el("div", { class: "years", role: "group", "aria-label": t("o3.t.choose") },
        chip("random", t("or.test.rand")), [...D.sittings].reverse().map(s => chip(s.id, bi(s.label.da, s.label.en)))),
      el("button", { type: "button", class: "go", id: "tstart", onclick: () => { TEST.start(tChoice); location.hash = "#test/q"; } }, t("o3.t.start"), icon("right"))));
  }
  function tbar(s) {
    return el("div", { class: "tbar" }, tb("o3.t.count", [s.i + 1, s.ids.length], [s.i + 1, s.ids.length], "span", "count"),
      el("span", { class: "dash", "aria-hidden": "true" }, s.ids.map((_, i) => el("i", { class: i < s.i ? "done" : i === s.i ? "now" : "" }))));
  }
  function viewTestQ() {
    const s = TEST.get(); if (!s || !s.ids.length) { location.replace("#test"); return; }
    const q = qById[s.ids[s.i]], key = keyOf(q.id), t0 = Date.now();
    const tt = el("span", { class: "tt" }, t("o3.t.time", "0:00"));
    const ta = el("textarea", { class: "ans", id: "ta", rows: "7", spellcheck: "false", placeholder: t("o3.t.ta"), "aria-label": t("o3.t.ta") });
    ta.value = s.answers[q.id] || "";
    ta.addEventListener("input", () => { s.answers[q.id] = ta.value; TEST.save(s); });
    app.replaceChildren(el("div", { class: "flow" }, el("aside", { class: "side" }, picture(key)),
      el("div", { class: "main" }, el("div", { class: "qhead" }, tbar(s), srcLabel(q)),
        el("div", { class: "card tq" }, qText(q), tb("o3.t.say", [], [], "p", "hint"), ta, el("div", { class: "tbar" }, el("span", { class: "timer" }, icon("clock"), tt))),
        el("div", { class: "actionbar" }, el("button", { type: "button", class: "go", onclick: () => {
          s.answers[q.id] = ta.value; TEST.save(s); location.hash = "#test/fb"; } }, t("o3.t.check"), icon("right"))))));
    timer = setInterval(() => { tt.textContent = t("o3.t.time", mmss(Date.now() - t0)); }, 1000);
  }
  function viewFeedback() {
    const s = TEST.get(); if (!s || !s.ids.length) { location.replace("#test"); return; }
    const q = qById[s.ids[s.i]];
    if (!(q.id in s.answers)) { location.replace("#test/q"); return; }
    const key = keyOf(q.id), text = s.answers[q.id] || "", F = feedback(q, text), last = s.i === s.ids.length - 1;
    s.results[q.id] = { ...(s.results[q.id] || {}), nWo: F.nWo, nOk: F.nOk, nSteps: F.nSteps, nKwOk: F.nKwOk, nKw: F.nKw, nSp: F.nSp };
    TEST.save(s);
    const sec = (code, head, ...body) => el("li", { class: "step done", "data-sec": code }, el("div", { class: "sh" }, head), el("div", { class: "sb" }, ...body));
    const chip = (ok, label) => el("li", { class: ok === null ? "" : ok ? "good" : "bad" }, ok === null ? null : icon(ok ? "check" : "x"), label);
    const todo = F.nWo + F.missing.length + F.kwMiss.length;
    app.replaceChildren(el("div", { class: "flow" }, el("aside", { class: "side" }, picture(key)),
      el("div", { class: "main" }, el("div", { class: "qhead" }, tbar(s), srcLabel(q), qText(q, "p")),
        el("section", { class: "verdict" },
          todo ? tb("o3.f.todo", [todo], [todo], "h2") : tb("o3.f.clean", [], [], "h2"),
          el("ul", null,
            chip(!F.nWo, F.nWo ? tb("o3.f.wo.n", [F.nWo]) : tb("o3.f.wo.ok")),
            chip(!F.missing.length, tb("o3.f.st", [F.nOk, F.nSteps])),
            chip(F.nKwOk >= Math.ceil(F.nKw / 2), tb("o3.f.kw", [F.nKwOk, F.nKw])),
            chip(null, tb("o3.f.sp", [F.nSp])))),
        el("ol", { class: "steps fbsteps" },
          sec("wo", tb("or.fb.wo.h", [], [], "h3"),
            F.woList ? tb("or.fb.wo.note", [], [], "p", "hint") : null, F.woList || tb("o3.f.wo.none", [], [], "p")),
          sec("st", tb("o3.f.st.h", [F.nOk, F.nSteps], [F.nOk, F.nSteps], "h3"), tb("o3.f.st.p", [], [], "p", "hint"), F.steps, F.stepFix),
          sec("kw", tb("o3.f.kw.h", [F.nKwOk, F.nKw], [F.nKwOk, F.nKw], "h3"), F.kwMiss.length ? tb("o3.f.kw.p", [], [], "p", "hint") : null, F.kws),
          sec("sp", tb("o3.f.sp.h", [], [], "h3"), F.spList || tb("o3.f.sp.none", [], [], "p")),
          sec("cmp", tb("o3.f.cmp", [], [], "h3"), el("div", { class: "cmp" }, tb("o3.f.cmp.p", [], [], "p", "hint"),
            el("div", null, tb("or.fb.yours", [], [], "h4"), F.yours),
            el("div", null, tb("or.fb.model", [], [], "h4"), F.model))),
          sec("rate", tb("o3.s4", [], [], "h3"), rating(q.id, r => { s.results[q.id].r = r; TEST.save(s); }))),
        el("div", { class: "actionbar" }, el("button", { type: "button", class: "go", onclick: () => {
          if (last) { location.hash = "#test/done"; return; }
          s.i++; TEST.save(s); location.hash = "#test/q"; } }, last ? t("o3.b.result") : t("or.next"), icon("right"))))));
  }
  function viewTestDone() {
    const s = TEST.get(); if (!s || !s.ids.length) { location.replace("#test"); return; }
    const RL = { k: "or.rate.k", d: "or.rate.d", i: "or.rate.i" };
    app.replaceChildren(el("div", { class: "tsetup tend" },
      tb("o3.end.h", [], [], "h1"), tb("o3.end.p", [s.ids.length], [s.ids.length], "p"),
      el("ol", { class: "endlist" }, s.ids.map(id => {
        const q = qById[id], r = s.results[id] || {}, nums = [r.nWo, r.nOk, r.nSteps, r.nKwOk, r.nKw];
        return el("li", { class: "endrow" }, el("a", { href: `#q/${id}` }, srcLabel(q), qText(q, "p"),
          r.nSteps != null ? tb("o3.end.row", nums, nums, "p", "hint") : tb("o3.end.skip", [], [], "p", "hint"),
          el("span", { class: "rl" }, statusDot(qStatus(id)), r.r ? tb(RL[r.r]) : tb("o3.end.none"))));
      })),
      el("div", { class: "row" },
        el("button", { type: "button", class: "go", onclick: () => { TEST.clear(); location.hash = "#test"; } }, t("or.newtest"), icon("right")),
        el("a", { class: "go ghost", href: "#laer" }, t("o3.b.laer")))));
  }

  // ── English switch: hides and shows the English lines in place, remembered in pd3.oral.en ──
  const enBtn = $("#enToggle");
  const enOn = () => { try { return localStorage.getItem(EN_KEY) !== "0"; } catch (e) { return true; } };
  function paintEn() {
    const on = !document.body.classList.contains("hide-en");
    enBtn.setAttribute("aria-pressed", String(on));
    enBtn.replaceChildren(el("span", { class: "sw", "aria-hidden": "true" }), t(on ? "or.en.hide" : "or.en.show"));
  }
  function setEn(on) {
    document.body.classList.toggle("hide-en", !on);
    try { localStorage.setItem(EN_KEY, on ? "1" : "0"); } catch (e) { /* ignore */ }
    paintEn();
  }
  enBtn.addEventListener("click", () => setEn(document.body.classList.contains("hide-en")));
  document.body.classList.toggle("hide-en", !enOn());
  paintEn();

  // ── router. The Dansk/English button is NOT hooked: flipLang swaps texts in place, nothing re-renders. ──
  function route() {
    clearInterval(timer);
    const h = location.hash.slice(1);
    const tab = h.startsWith("test") ? "test" : "laer";
    document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.go === "#" + tab)));
    let toStep = false;
    if (h.startsWith("q/")) {
      const [, id, st] = h.split("/"), stage = Math.min(4, Math.max(1, +st || 1));
      viewQuestion(id, stage, true); toStep = stage > 1;
    }
    else if (h === "test/q") viewTestQ();
    else if (h === "test/fb") viewFeedback();
    else if (h === "test/done") viewTestDone();
    else if (tab === "test") viewTestSetup();
    else viewStart();
    if (!toStep) scrollTo(0, 0);
  }
  document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => { if (location.hash === b.dataset.go) route(); else location.hash = b.dataset.go; }));
  addEventListener("hashchange", route);
  if (!location.hash) history.replaceState(null, "", "#laer");
  route();
  applyTexts(document);
})();
</script>
</body>
</html>
