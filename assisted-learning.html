traktioner i Odense der uden tvivl er et besøg værd?", "src": "2021v L1", "m": [16, 24]}, {"s": "De fleste kender den friskhed, man føler efter at have brugt sin krop.", "src": "2018v L2", "m": [41, 49]}, {"s": "efter at have brugt sin krop.", "src": "2018v L2", "m": [0, 8]}, {"s": "Men efter at have researchet lidt på det fik også han øje på det potentiale, som Sørens idé gemte på.", "src": "2017v L2", "m": [4, 12]}, {"s": "“Helt fra starten har de lokale kolleger været meget ivrige efter at involvere os i arbejdet.", "src": "2016s L1", "m": [60, 68]}, {"s": "Ofte er tavle og kridt de eneste materialer i klasseværelset, men du vil blive varmt modtaget af eleverne, der er ivrige efter at suge ny viden til sig!", "src": "2016s L1", "m": [121, 129]}, {"s": "Efter at have trænet et stykke tid tilmeldte han sig sit livs første maratonløb1.", "src": "2015v L2", "m": [0, 8]}, {"s": "Næste dag skrev jeg til en lægebrevkasse og fik nogle dage efter at vide, at der ikke er nogen forskning, der viser, at det skulle være farligt med korte fasteperioder.", "src": "2014v L2", "m": [59, 67]}], "efterhånden_som": [{"s": "Trine Sundsvald tog blot sine projekter med sig, og efterhånden som de bliver løst, overtager hun nye.", "src": "2020v L2", "m": [52, 67]}], "siden": [{"s": "Siden disse omkostninger varierer utroligt meget, er det svært at give et gennemsnit herpå.", "src": "2016s L1", "m": [0, 5], "sense": "cause"}, {"s": "Peter er siden rykket til Sønderborg Kommune, hvor han nu fungerer som økonomikonsulent.", "src": "2023s L1", "m": [9, 14], "sense": "then"}, {"s": "Nordisk Films tidlige succes viste sig at være langtidsholdbar, og selskabet har siden haft en central placering i den danske filmbranche.", "src": "2019v L1", "m": [81, 86], "sense": "then"}, {"s": "Siden er der kommet mange nye børnehaver, skoler, gymnasier og andre uddannelsessteder, som beskæftiger beboerne.", "src": "2021v L1", "m": [0, 5], "sense": "then"}, {"s": "Siden fagforeningernes opkomst i slutningen af det 19. århundrede har man diskuteret lønmodtagernes arbejdstid.", "src": "2024s L2", "m": [0, 5], "sense": "prep"}, {"s": "Hærvejen er Danmarks ældste landevej, som siden oldtiden har fragtet soldater og folk fra Dannevirke i syd til Viborg i nord og den modsatte vej.", "src": "2023s L1", "m": [42, 47], "sense": "prep"}, {"s": "For fire år siden besluttede Marianne og hendes mand, Torben Bruun, at lægge deres livsstil helt om.", "src": "2021s L2", "m": [12, 17], "sense": "ago"}, {"s": "For to år siden flyttede den nu 22-årige Anne Puggaard til Odense fra København for at læse matematik på Syddansk Universitet.", "src": "2019s L2", "m": [10, 15], "sense": "ago"}], "derefter": [{"s": "Så kl. 20 fik jeg fri, og derefter kunne jeg bare gå to etager ned i bygningen og lære at spille guitar.", "src": "2020v L1", "m": [26, 34]}, {"s": "Det er vigtigt, at du, allerede når du tilmelder dig eller hurtigst muligt derefter, gør opmærksom på, at du eventuelt vil få behov for SPS for at kunne gennemføre uddannelsen.", "src": "2016v L1", "m": [75, 83]}, {"s": "Eleverne kan for eksempel bruge en tablet til en skattejagt eller til at tage billeder af dyr og planter, som de ser i naturen, og derefter søge informationer om dem.", "src": "2016v L2", "m": [131, 139]}, {"s": "andre veje Langt de fleste vælger at starte på grundforløbet og derefter indgå en uddannelsesaftale.", "src": "2015v L1", "m": [64, 72]}, {"s": "Uddannelsen starter med et praktikophold (ca. 6 måneder) og derefter et skoleophold på 11 uger.", "src": "2015v L1", "m": [60, 68]}, {"s": "Tilmed begyndte han at få ondt i det ene knæ, da der manglede ca. 50 km, så da han derefter skulle gennemføre konkurrencens sidste del, maratonløbet, var der ikke mange kræfter tilbage.", "src": "2015v L2", "m": [83, 91]}, {"s": "Det er længe siden, at arbejdet som bibliotekar var et spørgsmål om at finde den rigtige bog til et menneske, der derefter kunne låne bogen med sig hjem.", "src": "2014s L2", "m": [114, 122]}, {"s": "en god start Du begynder med et introduktionsforløb, og derefter tilrettelægger du dit grundforløb sammen med din kontaktlærer.", "src": "2013s L1", "m": [56, 64]}], "herefter": [{"s": "Herefter blev der indført entré, det medførte et fald i antallet af publikummer.", "src": "2020s L1", "m": [0, 8]}, {"s": "Herefter følger en personlig samtale, hvor vi vil lære hinanden lidt bedre at kende, og hvor vi vil høre lidt mere om, hvorfor du gerne vil arbejde i Legoland.", "src": "2018s L1", "m": [0, 8]}, {"s": "Herefter flyttede jeg hjem og startede på VUF.", "src": "2016v L1", "m": [0, 8]}, {"s": "Hvis dine forældre ikke er enige i UU´s vurdering (ikke-uddannelsesparat), sendes din ansøgning til den uddannelsesinstitution, du har søgt, som herefter vurderer, om du er uddannelsesparat.", "src": "2015v L1", "m": [145, 153]}, {"s": "Herefter er det UU-centret eller din efterskole mv., som sender ansøgningen videre til uddannelsesstedet.", "src": "2015v L1", "m": [0, 8]}, {"s": "Herefter skal fangstredskaber og kutter rengøres, efterses og gøres klar til næste tur på havet.", "src": "2015v L1", "m": [0, 8]}, {"s": "Vurderes du herefter uddannelsesparat, rettes din uddannelsesplan, og den sendes til det ansøgte uddannelsessted.", "src": "2015s L1", "m": [12, 20]}, {"s": "To eksempler på eGU Herefter kan du se to konkrete eksempler på EGU.", "src": "2013s L1", "m": [20, 28]}], "til_sidst": [{"s": "Det hele har ikke meget med vikinger at gøre, men historien om familien, der til sidst igen finder sammen, er god familieunderholdning.", "src": "2022v L1", "m": [77, 86]}, {"s": "Derfor valgte han til sidst at starte sit eget snedkerværksted. ”I modsætning til de fleste andre værksteder, satser jeg ikke på nye møbler.", "src": "2022v L2", "m": [18, 27]}, {"s": "Jeg tog blandt andet kurser i at skrive ansøgninger – og jeg blev til sidst rigtig god til at beskrive alt det, jeg kan,” siger han med et smil.", "src": "2022s L2", "m": [66, 75]}], "endelig": [{"s": "Nylars Rundkirke er den bedst bevarede af de bornholmske rundkirker, og endelig kan man opleve Nyker Rundkirke, der er den mindste og sandsynligvis også den yngste af Bornholms rundkirker.", "src": "2023v L1", "m": [72, 79]}, {"s": "Endelig er det også vigtigt altid at holde sine enheder opdaterede, gerne automatisk.", "src": "2023v L2", "m": [0, 7]}, {"s": "Og halvdelen mente, at deres handicap ville få stor betydning for, hvordan de ville klare deres job, hvis de endelig fik et.", "src": "2023s L2", "m": [109, 116]}, {"s": "Endelig viste undersøgelsen også, at mange mennesker med et handicap ikke kender særlig meget til de mange forskellige støttemuligheder, der er på arbejdsmarkedet.", "src": "2023s L2", "m": [0, 7]}, {"s": "Endelig kan nyuddannede med et handicap også få løntilskud i deres første job.", "src": "2023s L2", "m": [0, 7]}, {"s": "Endelig får man mulighed for at beskæftige sig med lige præcis det, man har lyst til.", "src": "2022v L2", "m": [0, 7]}, {"s": "Hun er blot glad for, at det via aktivt brug af sit netværk på de sociale medier endelig lykkedes hende at få et job.", "src": "2022s L2", "m": [81, 88]}, {"s": "Endelig forventer mange unge meget af sig selv, og de sammenligner sig meget med hinanden, både på de sociale medier og i klassen.", "src": "2021v L2", "m": [0, 7]}], "alt_i_alt": [{"s": "Selvom det alt i alt har været meget dyrt for Eva og Per at tage på studieophold i Storbritannien, synes de, det har været det hele værd.", "src": "2020s L2", "m": [11, 20]}, {"s": "Alt i alt var mit ophold i Nepal berigende socialt, kulturelt og fagligt, og det var været en af de absolut bedste oplevelser i mit liv at rejse dertil som frivillig.", "src": "2016s L1", "m": [0, 9]}, {"s": "Uddannelsestiden varierer fra eux-forløb til eux-forløb, men alt i alt vil uddannelsestiden være længere end den “normale” længde for den pågældende erhvervsuddannelse.", "src": "2015v L1", "m": [61, 70]}, {"s": "Uddannelsestiden varierer fra eux-forløb til eux-forløb, men alt i alt vil uddannelsestiden være væsentlig længere end den \"normale\" længde for den pågældende erhvervsuddannelse.", "src": "2013s L1", "m": [61, 70]}], "samlet_set": [{"s": "Samlet set giver det en årsmiddeltemperatur, som ligger tæt på landsgennemsnittet.", "src": "2023v L1", "m": [0, 10]}, {"s": "Samlet set går mange tusind mennesker til undervisning på AOF’s aftenskoler hver uge, hvor de bliver klogere på alt fra madlavning, Mellemøsten og motion til sprog og syning.", "src": "2020v L1", "m": [0, 10]}, {"s": "Det betyder samlet set, at vi bliver udsat for mindre stråling, men meget oftere end før.", "src": "2020s L2", "m": [12, 22]}, {"s": "Samlet set var 98 % af drikkevarerne (inkl. øl og spiritus) økologiske.", "src": "2019s L1", "m": [0, 10]}, {"s": "Men samlet set er der flere kvinder, der donerer penge end mænd.", "src": "2019s L2", "m": [4, 14]}, {"s": "Behandling i hjemmet er altså samlet set både nemmere for borgerne og billigere for samfundet.", "src": "2016s L2", "m": [30, 40]}], "kort_sagt": [{"s": "Kort sagt er det altså intet problem at få en hel dag til at gå her.", "src": "2021v L1", "m": [0, 9]}, {"s": "Kort sagt, vil du aldrig være isoleret i dit destinationsland.", "src": "2016s L1", "m": [0, 9]}, {"s": "Vores kendetegn er et stærkt fagligt miljø, et godt kammeratskab og godt sammenhold - her er kort sagt rart at være.", "src": "2015v L1", "m": [93, 102]}, {"s": "Kort sagt, dit arbejde handler om at være med til at forbedre patientens tilværelse og velvære.", "src": "2013s L1", "m": [0, 9]}], "at_bekræfte": [{"s": "Det kan både Mette Dalgaard og Henriette Friis bekræfte.", "src": "2023v L2", "m": [47, 55]}], "at_fortryde": [{"s": "Grundforløbet og det første halve år af studieretningen på pre-IB skal være tilrettelagt, så du har mulighed for at skifte fra pre-IB klassen til en stx-studie retning, hvis du fortryder dit valg.", "src": "2015s L1", "m": [177, 186]}], "at_beklage": [{"s": "Vi beklager meget det besvær, det må give for vores gæster og kan oplyse, at museets ledelse løbende er i dialog med Aarhus Kommune om forbedring af forholdene.", "src": "2017s L1", "m": [3, 11]}], "at_opleve": [{"s": "Her kan man tage tilbage i tiden og opleve kunsten samt spændende skiftende særudstillinger.", "src": "2024s L1", "m": [36, 42]}, {"s": "I Mønsted Kalkgruber kan man opleve en labyrint af minegange, spændende historie og smuk natur.", "src": "2024s L1", "m": [29, 35]}, {"s": "På turen kan man opleve den særlige natur i området og se den flotte udsigt til søen i bunden af kalkbruddet.", "src": "2024s L1", "m": [17, 23]}, {"s": "Øens lange kystlinje kan også opleves fra fx havkajak, og fra kysten eller fra båd kan man teste fiskelykken på Østersøens mange havørreder.", "src": "2023v L1", "m": [30, 37]}, {"s": "Og det er ikke så underligt, for her kan man virkelig få gang i fantasien og opleve den bornholmske historie.", "src": "2023v L1", "m": [77, 83]}, {"s": "Det nye Hammershus Besøgscenter giver en helt ny måde at opleve Hammershus på.", "src": "2023v L1", "m": [57, 63]}, {"s": "Nylars Rundkirke er den bedst bevarede af de bornholmske rundkirker, og endelig kan man opleve Nyker Rundkirke, der er den mindste og sandsynligvis også den yngste af Bornholms rundkirker.", "src": "2023v L1", "m": [88, 94]}, {"s": "Bornholm er en attraktiv ø at opleve fra en cykel.", "src": "2023v L1", "m": [30, 36]}], "at_reducere": [{"s": "De ser på forskellige uddannelsesmuligheder i stedet for at fokusere på enkelte prestigeuddannelser, og det er med til at reducere presset.", "src": "2021v L2", "m": [122, 130]}, {"s": "I nogle storbyer i verden har man forsøgt at reducere trafikproblemerne ved at opkræve en afgift for at køre ind i byen.", "src": "2015s L2", "m": [45, 53]}, {"s": "Antallet af biblioteker er reduceret kraftigt.", "src": "2014s L2", "m": [27, 36]}], "at_muliggøre": [{"s": "Samtidig muliggør elevforeningens hjemmeside kontakten til ens gamle højskolevenner.", "src": "2018v L1", "m": [9, 17]}], "at_udvide": [{"s": "Gosch oprettede en afdeling med blyanter kaldet VIKING, en afdeling, som i dag er udvidet med oliekridt, farvekridt m.m.", "src": "2022v L1", "m": [82, 89]}, {"s": "Man byggede masser af boliger til arbejderne, og byen blev udvidet med for eksempel Kongensgade, Albani-kvarteret og Vesterbro-området.", "src": "2021v L1", "m": [59, 66]}, {"s": "FOF arbejder for at udvide den enkeltes indsigt.", "src": "2020v L1", "m": [20, 26]}, {"s": "FOF tilbyder undervisning og samvær, der tilstræber at udvide den enkeltes horisont både kulturelt, socialt og fagligt.", "src": "2020v L1", "m": [55, 61]}, {"s": "COWI satser på at udvide sine internationale aktiviteter i de kommende år.", "src": "2019v L2", "m": [18, 24]}, {"s": "Så tænkte jeg, at vi må kunne udvide de netværk og gøre betalingen automatisk,” siger Søren.", "src": "2017v L2", "m": [30, 36]}, {"s": "Vinterferien i Den Gamle By er i år udvidet med en uge, så vi både i uge 7 og 8 har masser af aktiviteter for hele familien.", "src": "2017s L1", "m": [36, 43]}, {"s": "På den måde kan man både få et godt måltid mad og udvide sin vennekreds, og det vil måske få endnu flere til at deltage i madklubber i fremtiden.", "src": "2016v L2", "m": [50, 56]}], "at_forlænge": [{"s": "Man kan imidlertid søge om at få tilladelsen forlænget, dog højst til 18 måneder.", "src": "2018v L1", "m": [45, 54]}, {"s": "Rekruttering og Integration inddrage eller nægte at forlænge ens opholdstilladelse.", "src": "2018v L1", "m": [52, 60]}], "at_investere_i": [{"s": "Det har øget interessen blandt private firmaer for at investere i store vindmølleprojekter.", "src": "2023s L2", "m": [54, 65]}, {"s": "Derfor bliver der investeret meget i vores medarbejdere, hvilket blandt andet gøres via uddannelse inden ansættelse i Universe.", "src": "2018s L1", "m": [18, 28]}, {"s": "Respekt for vores frivillige Vi anerkender, at vores frivillige investerer tid, energi og penge i at yde en indsats for lokalsamfund i udviklingslande.", "src": "2016s L1", "m": [64, 74]}], "en_mulighed": [{"s": "Man har også mulighed for at stille sulten og slukke tørsten i den hyggelige Café Kridthuset.", "src": "2024s L1", "m": [13, 21]}, {"s": "Ved tilmelding har man mulighed for at bestille og købe en række tilvalg i forhold til indkvartering og forplejning.", "src": "2024s L1", "m": [23, 31]}, {"s": "Der er mange muligheder for god forplejning under marchen.", "src": "2024s L1", "m": [13, 23]}, {"s": "I det område, hvor alle ruter starter og slutter, er der derudover hele weekenden masser af muligheder for at købe mad og drikke for dem, der ikke har forudbestilt mad hjemmefra.", "src": "2024s L1", "m": [92, 102]}, {"s": "Hvis de for eksempel ikke har mulighed for at have så mange varer på lager i butikken, kan de tilbyde at fremskaffe dem inden for 24 timer og levere dem til døren.", "src": "2024s L2", "m": [30, 38]}, {"s": "Den storslåede og varierende natur giver gode muligheder for friluftsliv.", "src": "2023v L1", "m": [46, 56]}, {"s": "Besøgscentret byder også på en fascinerende udstilling, hvor der er mulighed for at læse om borgruinens utrolige historie.", "src": "2023v L1", "m": [68, 76]}, {"s": "Og ved at give borgerne mulighed for at møde beslutningstagerne ansigt til ansigt.", "src": "2023v L1", "m": [24, 32]}], "en_udfordring": [{"s": "Da Mimi fik job og flyttede til Tønder med sin mand, Jon, var udfordringen i begyndelsen, at de især var bekymrede for, om livskvaliteten i Sønderjylland kunne leve op til deres forventninger.", "src": "2023s L1", "m": [62, 74]}, {"s": "Så det var disse udfordringer, man fra øernes side ville arbejde for at løse.", "src": "2022s L1", "m": [17, 29]}, {"s": "At lære det danske sprog Vores søn Michel havde udfordringer i børnehaven i Maribo, da han havde svært ved dansk, og han nærmede sig skolealderen.", "src": "2022s L1", "m": [48, 60]}, {"s": "Udfordringer ved flytningen Ikke alt var dog lige let ved at flytte.", "src": "2022s L1", "m": [0, 12]}, {"s": "Udfordringer for den etiske forbruger, side 84.", "src": "2021s L2", "m": [0, 12]}, {"s": "Udfordringer for den etiske forbruger, side 86.", "src": "2021s L2", "m": [0, 12]}, {"s": "Men sproget har ikke overraskende for ham vist sig at være en stor udfordring, som han må bruge meget tid på.", "src": "2019v L2", "m": [67, 77]}, {"s": "Udfordringer for arbejdspladserne Også for arbejdspladserne kan der være en række udfordringer forbundet med at flytte.", "src": "2018v L2", "m": [0, 12]}], "et_ansvar": [{"s": "jeg et job som konsulent med ansvar for udvikling af en helt ny hjemmeside i et ministerium, og det har jeg ikke fortrudt.", "src": "2024s L2", "m": [29, 35]}, {"s": "De trives begge med at have indflydelse og ansvar for medarbejdere – også selvom det ikke altid er lige let.", "src": "2023v L2", "m": [43, 49]}, {"s": "Men hvem har egentlig det primære ansvar for at opretholde en høj datasikkerhed?", "src": "2023v L2", "m": [34, 40]}, {"s": "Uklarheden om ansvaret betyder imidlertid ikke, at udbyderne kan fralægge sig ethvert ansvar.", "src": "2023v L2", "m": [14, 22]}, {"s": "De har sammen ansvaret for en stor afdeling i virksomheden, men får også tid til at tale om ledelse generelt, og hvad de hver især gør for at blive bedre ledere.", "src": "2023s L2", "m": [14, 22]}, {"s": "At spise østers indsamlet i Vadehavet foregår på eget ansvar, uanset om man er på tur med en naturvejleder eller er ude på egen hånd.", "src": "2022s L1", "m": [54, 60]}, {"s": "Det er det ikke alle, der har, selvom arbejdsgiverne har ansvar for at sikre et godt fysisk arbejdsmiljø derhjemme.", "src": "2022s L2", "m": [57, 63]}, {"s": "Delprøve 2A – Hvem har ansvaret for klimaet?", "src": "2021s L2", "m": [23, 31]}], "et_behov": [{"s": "Forskellige aktører på nettet har forskellige behov.", "src": "2023v L2", "m": [46, 51]}, {"s": "Store multinationale virksomheder har nogle helt andre behov for beskyttelse end den almindelige borger.", "src": "2023v L2", "m": [55, 60]}, {"s": "Det er ikke alle, der er enige i, at man skal prøve at tilpasse udvalget af uddannelser efter det behov, der er i øjeblikket.", "src": "2023v L2", "m": [98, 103]}, {"s": "Vi kan derfor ikke vurdere, hvilke behov der kommer til at opstå.", "src": "2023v L2", "m": [35, 40]}, {"s": "Den bliver klippet efter behov i sommerhalvåret, men nogle steder kan der i perioder forekomme høj bevoksning.", "src": "2023s L1", "m": [25, 30]}, {"s": "Projektet viste bl.a. et behov for flere lejeboliger, som kan være attraktive for potentielle tilflyttere, der ikke er parate til at købe en bolig.", "src": "2022s L1", "m": [25, 30]}, {"s": "Derfor kan de lettere balancere mellem kravene om præstation og behovet for hvile.", "src": "2021v L2", "m": [64, 71]}, {"s": "Særlige behov Nedenfor finder du information om adgangsforhold og handicapfaciliteter på Det Kongelige Teaters scener.", "src": "2021s L1", "m": [8, 13]}], "en_modstand": [{"s": "Der er dog stadig en vis modstand blandt visse arbejdsgivere mod en fire-dages arbejdsuge.", "src": "2024s L2", "m": [25, 33]}, {"s": "Men flere steder møder projekterne modstand fra lokale borgere.", "src": "2023s L2", "m": [35, 43]}, {"s": "Men planerne blev opgivet blandt andet på grund af folkelig modstand.", "src": "2015s L2", "m": [60, 68]}], "en_opbakning": [{"s": "Jeg er imponeret over den opbakning vores sportsfolk får.", "src": "2024s L1", "m": [26, 35]}, {"s": "Opsætningen af vindmøller har generelt både politisk og folkelig opbakning i Danmark.", "src": "2023s L2", "m": [65, 74]}, {"s": "OFF er en publikumsfest med massiv opbakning i lokalmiljøet.", "src": "2021v L1", "m": [35, 44]}, {"s": "Det er Torben enig i: ”Uden opbakning går det selvfølgelig ikke.", "src": "2021s L2", "m": [28, 37]}, {"s": "Fælles for alle tiltag er dog, at der skal være en politisk opbakning bag.", "src": "2019v L2", "m": [60, 69]}, {"s": "Hvis man derimod deles mere lige i familien, viser man, at der er opbakning hjemmefra, og det påvirker de positive forventninger til kvinden.", "src": "2018s L2", "m": [66, 75]}, {"s": "Politikerne vil også være helt sikre på, at der er folkelig opbakning, inden man eventuelt indfører roadpricing.", "src": "2015s L2", "m": [60, 69]}, {"s": "Politikerne vil også være helt sikre på, at der er folkelig opbakning, inden m~m eventuelt indfører roadpricing.", "src": "2015s L2", "m": [60, 69]}], "en_forudsætning": [{"s": "Folkeoplysning bliver i Danmark anset for at være en vigtig forudsætning for folkestyret.", "src": "2020v L1", "m": [60, 72]}, {"s": "Formidlingen adskiller sig ved, at indholdet ikke kræver, at modtagerne har særlige forudsætninger eller evner ud over det at være nysgerrige og interesserede mennesker.", "src": "2020v L1", "m": [84, 98]}, {"s": "Der kræves ingen forudsætninger for at deltage på kurset, men vi forventer, at du møder stabilt og er interesseret i og motiveret for at arbejde med skriftligt dansk og lave ansøgninger.", "src": "2020v L1", "m": [17, 31]}, {"s": "Vi hørte om forudsætninger for det demokrati, vi har i dag, og så en masse spændende dele af udstillingerne.", "src": "2020s L1", "m": [12, 26]}, {"s": "Det er en forudsætning for opholdstilladelsen, at man er studieaktiv.", "src": "2018v L1", "m": [10, 22]}, {"s": "Derimod tilbyder man på kampagnens hjemmeside blandt andet en test, hvor folk kan finde ud af, om de har forudsætninger for at købe hund.", "src": "2017s L2", "m": [105, 119]}, {"s": "Det er et tilbud til dig, der har faglige og personlige forudsætninger for at tage en studentereksamen på 2 år, og som er villig til at bruge den fornødne energi og tid.", "src": "2016v L1", "m": [56, 70]}, {"s": "Det er også muligt at tage enkeltfag på VUFs studenterkursus; enkeltfagskursister optages dog under forudsætning af ledige pladser.", "src": "2016v L1", "m": [100, 112]}], "en_påstand": [{"s": "Det er jo en påstand, der kræver, at man skærer en hæl og klipper en tå.", "src": "2023v L1", "m": [13, 20]}], "en_tendens": [{"s": "Her er der i forvejen en tendens til, at folk har en mere usund livsstil med alkohol og rygning, hvilket forøg 2", "m": [35, 45]}], "en_målsætning": [{"s": "Det kan synes lidt langt væk fra højskolernes oprindelige målsætninger om almen dannelse og styrkelse af danskheden, men som alt andet i livet har højskolerne også måttet følge med tiden.", "src": "2018v L1", "m": [58, 70]}], "en_forklaring": [{"s": "Det er måske en af forklaringerne på, at mange topledere dyrker meget sport i deres fritid.", "src": "2023s L2", "m": [19, 33]}, {"s": "og dårlig trivsel end pigerne, kan der være flere forklaringer på.", "src": "2021v L2", "m": [50, 62]}, {"s": "Flere undersøgelser giver den forklaring, at kvinder ikke er så motiverede for at få en toppost som mænd.", "src": "2018s L2", "m": [30, 40]}], "typisk": [{"s": "Pia Lehmanns historie er typisk, siger Ask Nielsen.", "src": "2024s L2", "m": [25, 31]}, {"s": "Og man har også typisk mere overskud til at arbejde koncentreret, når man er på arbejde.", "src": "2024s L2", "m": [16, 22]}, {"s": "Hos kommunerne kan du typisk hente hjælp til alt fra karriere- og jobmuligheder, jobsøgningskurser, mentorprogrammer og sociale netværk i området.", "src": "2023s L1", "m": [22, 28]}, {"s": "Som topleder har man typisk en travl og krævende arbejdsdag, hvor det er vigtigt at være mentalt og fysisk på toppen hele tiden.", "src": "2023s L2", "m": [21, 27]}, {"s": "Den erhvervsaktive øbo arbejder typisk med egen virksomhed eller i offentlige jobs som ansat på færgen, skolen, i kirken eller hjemmeplejen.", "src": "2022s L1", "m": [32, 38]}, {"s": "Som nyuddannet har man typisk ikke erfaring med sit fag endnu.", "src": "2022s L2", "m": [23, 29]}, {"s": "Typisk lærer man ikke noget om at søge job, når man går på en uddannelse.", "src": "2022s L2", "m": [0, 6]}, {"s": "Men det var de økonomisk dårligst stillede, der valgte at blive væk i den tid, der fulgte – typisk pensionister og enlige forsørgere.", "src": "2020v L1", "m": [92, 98]}], "karakteristisk": [{"s": "Det er karakteristisk for romanen, at dens mange fortællinger godt kunne være virkelige eller tage udgangspunkt i rigtige begivenheder.", "src": "2023v L1", "m": [7, 21]}], "sjældent": [{"s": "Derfor er det også forholdsvist sjældent, man ser journalister skifte til et helt andet arbejdsområde.", "src": "2024s L2", "m": [32, 40]}, {"s": "Jeg har sjældent tid til at få dyrket motion, og hverdagen er indimellem lidt stressende.", "src": "2020v L1", "m": [8, 16]}, {"s": "Der er sjældent et lærerværelse, hvor man kan få en sludder – eller finde materiale om faget.", "src": "2020v L1", "m": [7, 15]}, {"s": "Ikke det mest sexede i verden Den gode idé kommer sjældent ud af ingenting.", "src": "2017v L2", "m": [50, 58]}, {"s": "”Sjældent har jeg mødt så søde, sjove og fantastisk dejlige mennesker som de ansatte på Taricaya Rescue Center.", "src": "2016s L1", "m": [1, 9]}, {"s": "Lærerne straffer derfor sjældent eleverne, hvis de laver for meget larm og forstyrrer undervisning en.", "src": "2016s L2", "m": [24, 32]}, {"s": "For eksempel bliver eleverne sjældent sendt uden for døren.", "src": "2016s L2", "m": [29, 37]}, {"s": "hvert fald sjældent om husarbejdet, og jeg kan fak tisk godt lide at vaske tøj.", "src": "2015s L2", "m": [11, 19]}]}, "built": "2026-10-28"};</script>

// ---------- switching language in place ----------
// The language button swaps every interface text on screen instead of reloading, so a session, a flashcard,
// a search or an open dialog stays exactly where it is. Texts are found by their wording in the other language;
// Danish or English content (lang="da" / lang="en", the words and sentences) is left alone.
function langPairs() {
  const pairs = Object.values(I18N).map(v => [v[0], v[1]]);           // [da, en]
  for (const [en, da] of Object.values(GROUPS)) pairs.push([da, en], [`${da} · ${en}`, `${en} · ${da}`]);
  for (const r of Object.values(RULES)) pairs.push([r[2], r[1]]);
  for (const p of CONFUSABLES) pairs.push([p[3], p[2]]);
  return pairs;
}
function flipLang() {
  const to = LANG === "en" ? "da" : "en", [fi, ti] = to === "en" ? [0, 1] : [1, 0];
  const exact = new Map(), pats = [];
  for (const p of langPairs()) {
    const a = p[fi], b = p[ti];
    if (!a || !b || a === b || /<[a-z]/i.test(a)) continue;
    if (/\{\d\}/.test(a)) {
      const idx = [], re = a.replace(/[.*+?^$()|[\]\\]/g, "\\$&").replace(/\{(\d)\}/g, (_, i) => { idx.push(i); return "(.+?)"; });
      pats.push([new RegExp("^" + re + "$"), b, idx]);
    } else {
      exact.set(a.trim(), b.trim());
      exact.set(a.trim().replace(/:$/, ""), b.trim().replace(/:$/, ""));   // labels used without their colon
    }
  }
  const one = k => {
    if (exact.has(k)) return exact.get(k);
    for (const [re, b, idx] of pats) {
      const m = re.exec(k), v = {};
      if (m) { idx.forEach((i, j) => { v[i] = m[j + 1]; }); return b.replace(/\{(\d)\}/g, (_, i) => v[i] ?? ""); }
    }
    return null;
  };
  // whole text first; then without a leading symbol or trailing arrow/colon ("✕ Afslut", "Ordstilling:");
  // then compounds part by part ("Start session · Årsag", "Forveksl ikke: a / b — begge = …")
  const bare = k => {
    const r = one(k);
    if (r != null) return r;
    const m = /^([^\p{L}\p{N}“"(]*)(.*?)([\s:→←›…]*)$/u.exec(k);
    if (m && (m[1] || m[3]) && m[2]) { const x = one(m[2]); if (x != null) return m[1] + x + m[3]; }
    return null;
  };
  const tr = s => {
    const k = s.trim();
    if (!k) return null;
    let out = bare(k);
    for (const sep of [" · ", " — "]) {
      if (out != null || !k.includes(sep)) continue;
      const parts = k.split(sep), got = parts.map(x => bare(x.trim()) ?? x);
      if (got.some((x, i) => x !== parts[i])) out = got.join(sep);
    }
    return out == null ? null : s.replace(k, out);
  };
  const content = n => { const l = n.closest && n.closest("[lang]"); return l && l !== document.documentElement; };
  const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for (let n; (n = walk.nextNode());) {
    const el = n.parentElement;
    if (!el || el.closest("script, style") || content(el)) continue;
    const r = tr(n.nodeValue); if (r != null) n.nodeValue = r;
  }
  document.body.querySelectorAll("[title], [aria-label], [placeholder]").forEach(el => {
    if (content(el)) return;
    for (const a of ["title", "aria-label", "placeholder"]) { const v = el.getAttribute(a); const r = v && tr(v); if (r != null) el.setAttribute(a, r); }
  });
  LANG = to;
  try { localStorage.setItem("pd3.lang", to); } catch (e) { /* ignore */ }
  document.documentElement.lang = to;
  document.title = `${t("nav.assisted")} · ${t("brand")}`;
  const lb = $(".langbtn"); lb.lang = to === "en" ? "da" : "en"; lb.textContent = t("lang.button"); lb.title = t("lang.title");
  // screens that redraw without losing anything are drawn again, so nothing is left in the old language
  if ($("#go")) { const y = window.scrollY; home(); window.scrollTo(0, y); }
  else if (FC && $("#fcard")) flashCard();
  if ($("#findbar").classList.contains("open")) findDraw();
}

function load() {

  const deck = window.PD3_DECK;

    $("#app").innerHTML = `<div class="err" style="margin-top:32px">${t("nodeck")}<br><br><code>python3 -I .claude/skills/pd3-coach/scripts/pd3.py page</code></div>`;
    return;
  }
  DB = { today: iso(new Date()), profile: deck.profile || {}, sentences: deck.sentences || {}, senses: deck.senses || {}, tips: deck.tips || {}, cards: {} };
  const saved = readProgress();
  for (const [id, c] of Object.entries(deck.cards)) DB.cards[id] = { id, ...c, history: c.history || [], ...(saved[id] || {}) };
  // ask the browser not to clear this page's storage when space runs low (Chrome/Firefox; Safari decides itself)
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  finder();
  home(); route();
  window.addEventListener("hashchange", route);
}
// the site's other pages link to "#find" (or "#find=ord"): open the find bar over the home screen
function route() {
  if (!location.hash.startsWith("#find")) return;
  const q = decodeURIComponent(location.hash.slice(6));
  history.replaceState(null, "", location.pathname + location.search);

}

// SM-2, same maths as sm2() in pd3.py
function grade(id, q) {
  const c = DB.cards[id];
  c.introduced = c.introduced || DB.today;
  if (q >= 3) {
    c.interval = c.reps === 0 ? 1 : c.reps === 1 ? 6 : Math.round(c.interval * c.ef);
    c.reps += 1;
  } else {
    c.interval = 1; c.reps = 0; c.lapses += 1;
  }
  c.ef = Math.max(1.3, Math.round((c.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02))) * 100) / 100);
  const d = new Date(DB.today + "T12:00"); d.setDate(d.getDate() + c.interval);
  c.due = iso(d);
  c.history = [...c.history, [DB.today, q]].slice(-10);
  writeProgress(id);
  return c;
}

// ---------- card helpers ----------
function wtype(c) {
  const m = /^(SUB\/PRÆP|SUB\/ADV|SUB|ADV|KOO|PRÆP)\b/.exec(c.note || "");
  return m ? m[1] : null;
}
function stateOf(c) {
  if (!c.history || !c.history.length) return "new";
  return c.interval >= 21 ? "master" : c.interval >= 6 ? "known" : "learn";
}
function variants(word) {
  const base = norm(word.replace(/\(.*?\)/g, ""));
  const out = [norm(word), base, ...[...word.matchAll(/\((.*?)\)/g)].map(m => norm(m[1]))];
  base.split(/\s*\/\s*/).forEach(p => out.push(p.trim()));
  out.slice().forEach(v => { for (const a of ["at ", "en ", "et "]) if (v.startsWith(a)) out.push(v.slice(a.length)); });
  return [...new Set(out.filter(Boolean))];
}
function isAnswer(c, input) {
  const a = norm(input), set = variants(c.word);
  return set.includes(a) || set.includes(a.replace(/^(at|en|et) /, ""));
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function nearMiss(c, input) {
  const a = norm(input).replace(/^(at|en|et) /, "");
  return a.length > 2 && variants(c.word).some(v => lev(a, v) <= (v.length > 8 ? 2 : 1));
}
// Where the card word sits in a sentence (for highlighting and cloze gaps)
function findSpan(c, s) {
  const w = norm(c.word);
  const kind = w.startsWith("at ") ? "verb" : /^(en|et) /.test(w) ? "noun" : c.group === "adjektiv" ? "adj" : "fixed";
  const vs = variants(c.word).filter(v => !/^(at|en|et) /.test(v) && v.length > 1).sort((a, b) => b.length - a.length);
  for (const v of vs) {
    const toks = v.split(" ").map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    if (kind === "verb") toks[0] = toks[0].replace(/e$/, "") + "\\p{L}{0,4}";
    else if (kind !== "fixed") toks[0] += "\\p{L}{0,4}";
    const m = new RegExp("(?<![\\p{L}])" + toks.join("\\s+") + "(?![\\p{L}])", "iu").exec(s);
    if (m) return [m.index, m.index + m[0].length];
  }
  return null;
}
function hlSentence(c, s, span) {
  span = span || findSpan(c, s);
  if (!span) return esc(s);
  return esc(s.slice(0, span[0])) + `<mark class="hl">${esc(s.slice(span[0], span[1]))}</mark>` + esc(s.slice(span[1]));
}
function examSentences(c) { return DB.sentences[c.id] || []; }
function partnerPairs(id) { return CONFUSABLES.filter(p => (p[0] === id || p[1] === id) && DB.cards[p[0]] && DB.cards[p[1]]); }
function gname(g) { return GROUPS[g] ? GROUPS[g][LANG === "en" ? 0 : 1] : g; }
// both languages, the page language first (as the other pages name their groups)
function glabel(g) { return GROUPS[g] ? (LANG === "en" ? `${GROUPS[g][0]} · ${GROUPS[g][1]}` : `${GROUPS[g][1]} · ${GROUPS[g][0]}`) : g; }
const prio = g => (GROUPS[g] || [])[2] || 3;

// ---------- home ----------
function daysTo(d) { return d ? Math.round((new Date(d) - new Date(DB.today)) / 864e5) : null; }
function counts() {
  const all = cards();
  const introducedToday = all.filter(c => c.introduced === DB.today).length;
  return {
    due: all.filter(c => c.history && c.history.length && c.due <= DB.today).length,
    newLeft: Math.max(0, NEW_PER_DAY - introducedToday),
    fresh: all.filter(c => stateOf(c) === "new").length,
    learning: all.filter(c => ["learn", "known"].includes(stateOf(c))).length,
    mastered: all.filter(c => stateOf(c) === "master").length,
    total: all.length,
  };
}

function home() {
  S = null; FC = null;
  const k = counts(), p = DB.profile || {};
  const dW = daysTo(p.exam_date);
  const groupsBy = {};
  cards().forEach(c => (groupsBy[c.group] = groupsBy[c.group] || []).push(c));
  const tiles = pr => GROUP_ORDER.filter(g => prio(g) === pr && groupsBy[g]).map(g => groupTile(g, groupsBy[g])).join("");
  const metric = (l, n, s, pct) => `<div class="m"><div class="lbl">${l}</div><b>${n}</b><span class="s">${s}</span>${pct != null ? `<div class="bar"><span style="width:${pct.toFixed(1)}%"></span></div>` : ""}</div>`;
  const newLeft = Math.min(k.newLeft, k.fresh);

  const pool = sel ? sel.flatMap(g => groupsBy[g]) : cards();

  const canDue = dueIn(pool);
  const chips = pr => GROUP_ORDER.filter(g => prio(g) === pr && groupsBy[g]).map(g => {

  }).join("");
  $("#app").innerHTML = `
    <div class="top">

      <h1><span class="light">${t("h.h1a")}</span>${t("h.h1b")}</h1>
      <p>${t("h.intro", k.total)}</p>
      <div class="sheet picker" role="group" aria-labelledby="pkTitle">
        <div class="ph"><b id="pkTitle">${t("pk.title")}</b>
          <span class="soft small">${sel ? t("pk.some", sel.length, pool.length) : t("pk.all")}</span>
          ${sel ? `<button type="button" class="linkbtn small" id="allg">${t("pk.clear")}</button>` : ""}</div>
        ${[1, 2, 3].map(pr => `<div class="tier"><span class="badge t${pr}">${t("p." + pr)}</span>${chips(pr)}</div>`).join("")}
      </div>
      <div class="hero-cta">
        <button class="btn solid" id="go">${t("h.go")}${sel ? ` · ${sel.length === 1 ? esc(gname(sel[0])) : t("s.groups", sel.length)}` : ""}</button>
        <button class="btn" id="learn" ${canNew ? "" : "disabled"}>${t("h.learn", BATCH)}</button>
        <button class="btn" id="review" ${canDue ? "" : "disabled"} title="${esc(canDue ? t("h.review.t") : t("h.review.off"))}">${t("h.review")}</button>
        <button class="btn" id="conf" ${confusablePairs(sel).length ? "" : `disabled title="${esc(t("h.conf.none"))}"`}>${t("h.conf")}${sel ? ` · ${confusablePairs(sel).length}` : ""}</button>
        <button class="btn" id="exer" ${learnedIn(sel).length ? `title="${esc(t("h.ex.t"))}"` : `disabled title="${esc(t("h.ex.none"))}"`}>${t("h.ex")} · ${learnedIn(sel).length}</button>
        <button class="btn" id="flash" title="${esc(t("h.fc.t"))}">${t("h.fc")} · ${pool.length}</button>
      </div>
      <p class="soft small" style="margin-top:12px">${sessionBlurb(k, canDue, canNew)}</p>
      ${storageOK ? "" : `<div class="err small">${t("h.storage")}</div>`}
    </div>
    <div class="section"><h2>${t("h.progress")}</h2><div class="band"><div class="prog">
      ${metric(t("m.due"), k.due, t("m.due.s"))}
      ${metric(t("m.new"), newLeft, t("m.new.s"), 100 * newLeft / NEW_PER_DAY)}
      ${metric(t("m.learn"), k.learning, t("m.learn.s"))}
      ${metric(t("m.master"), `${k.mastered} / ${k.total}`, t("m.master.s"), 100 * k.mastered / k.total)}
    </div></div></div>
    <div class="section"><h2>${t("h.groups")}</h2><p class="soft small" style="margin:-4px 0 10px">${t("h.map.s")}</p>
      <div class="legend">${["new", "learn", "known", "master"].map(s => `<span><i style="background:var(--s-${s})"></i>${t("st." + s)}</span>`).join("")}</div>

function sessionBlurb(k, due, fresh) {
  const r = Math.min(due, REVIEW_LIMIT), n = Math.min(BATCH, fresh);
  if (!r && !n) return t("h.nothing");
  const parts = [r ? (r === 1 ? t("h.blurb.r1") : t("h.blurb.r", r)) : null, n ? t("h.blurb.n", n) : null].filter(Boolean);
  return t("h.blurb", parts.join(" + "));
}
function groupTile(g, cs) {
  const n = { new: 0, learn: 0, known: 0, master: 0 };
  cs.forEach(c => n[stateOf(c)]++);
  const due = cs.filter(c => c.history.length && c.due <= DB.today).length;
  const seg = s => n[s] ? `<span style="width:${100 * n[s] / cs.length}%;background:var(--s-${s})"></span>` : "";
  const other = GROUPS[g] ? GROUPS[g][LANG === "en" ? 1 : 0] : "";
  return `<button class="sheet group${openGroup === g ? " open" : ""}" data-g="${esc(g)}">
    <div class="row"><span class="gn">${esc(gname(g))}</span><span class="spacer"></span>${due ? `<span class="due">${t("g.due", due)}</span>` : ""}</div>
    <div class="ge">${esc(other)} · ${t("g.words", cs.length)}</div>
    <div class="bar">${seg("master")}${seg("known")}${seg("learn")}</div></button>`;
}
function showGroupDetail(g, cs) {
  const grid = $(`.groups[data-pr="${prio(g)}"]`);
  const tiles = [...grid.children], idx = tiles.findIndex(x => x.dataset.g === g);
  // place the panel after the last tile in the clicked tile's row
  const top = tiles[idx].offsetTop;
  let last = idx; while (tiles[last + 1] && tiles[last + 1].offsetTop === top) last++;
  const d = document.createElement("div");
  d.className = "sheet detail";
  const order = { new: 3, learn: 0, known: 1, master: 2 };
  d.innerHTML = `<b>${esc(glabel(g))}</b>
    <div class="words">${cs.slice().sort((a, b) => order[stateOf(a)] - order[stateOf(b)]).map(c =>
      `<button type="button" class="word" data-id="${esc(c.id)}" lang="da" title="${esc(c.meaning)}${c.history.length ? " · " + t("g.next", c.due) : ""}"><i style="background:var(--s-${stateOf(c)})"></i>${esc(c.word)}</button>`).join("")}</div>
    <div class="row"><button class="btn solid" id="gstudy">${t("g.study")}</button><span class="soft small">${t("g.study.s", BATCH)}</span></div>`;
  tiles[last].after(d);
  $("#gstudy").onclick = () => startSession({ groups: [g] });
  d.querySelectorAll("button.word").forEach(b => { b.onclick = () => explain(DB.cards[b.dataset.id]); });
}

// ---------- session building ----------
function startSession({ groups = null, reviews = REVIEW_LIMIT, fresh = BATCH }) {
  const k = counts();
  const inGroup = c => !groups || groups.includes(c.group);
  const rank = c => [c.priority || 3, -(c.lapses || 0), c.reps || 0];
  const cmp = (a, b) => { const x = rank(a), y = rank(b); return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]; };
  const due = cards().filter(c => inGroup(c) && c.history.length && c.due <= DB.today).sort(cmp).slice(0, reviews);
  const n = Math.min(fresh, k.newLeft);
  let batch = [];
  if (n > 0) {
    // taught group by group: fill the batch from the first (selected) group that still has new words, then the next
    for (const g of GROUP_ORDER.filter(g => !groups || groups.includes(g))) {
      if (batch.length >= n) break;
      batch.push(...cards().filter(c => c.group === g && stateOf(c) === "new").slice(0, n - batch.length));
    }
  }
  let practice = [];
  if (groups && !due.length && !batch.length) // nothing to grade: practise the groups' learnt words without touching the schedule
    practice = shuffle(cards().filter(c => inGroup(c) && c.history.length)).slice(0, 8);
  const q = [];
  due.forEach(c => q.push({ kind: "ex", id: c.id }));
  if (batch.length) {
    q.push({ kind: "intro", ids: batch.map(c => c.id) });
    batch.forEach(c => q.push({ kind: "teach", id: c.id }));
    shuffle(batch).forEach(c => q.push({ kind: "ex", id: c.id, first: true }));
  }
  practice.forEach(c => q.push({ kind: "ex", id: c.id, practice: true }));
  if (!q.length) { alert(groups ? t("g.empty") : t("h.empty")); return; }
  const title = !groups ? t("s.session") : groups.length === 1 ? glabel(groups[0]) : groups.length <= 3 ? groups.map(gname).join(" · ") : t("s.groups", groups.length);
  S = { queue: q, i: 0, results: [], lastType: null, graded: new Set(), title };
  step();
}
// ---------- Øvelse: extra B2 practice on words already learnt ----------
// words reviewed at least once, in the selected groups (all when none are selected)
function learnedIn(groups) { return cards().filter(c => c.history.length && (!groups || groups.includes(c.group))); }
function startExercise(groups) {
  const pool = learnedIn(groups);
  if (!pool.length) { alert(t("h.ex.none")); return; }
  // weakest first (lapses, then ease), so the practice goes where it is needed; then mixed
  const pickd = pool.slice().sort((a, b) => (b.lapses || 0) - (a.lapses || 0) || (a.ef || 2.5) - (b.ef || 2.5) || Math.random() - .5).slice(0, 15);
  S = { queue: shuffle(pickd).map(c => ({ kind: "ex", id: c.id, practice: true })), exercise: true, practiceResults: [], i: 0, results: [], lastType: null, graded: new Set(),
        title: t("h.ex") + (groups ? ` · ${groups.length === 1 ? gname(groups[0]) : t("s.groups", groups.length)}` : "") };
  step();
}
// pairs with at least one word in the selected groups (all pairs when none are selected)
function confusablePairs(groups) {
  return CONFUSABLES.filter(p => DB.cards[p[0]] && DB.cards[p[1]] && (!groups || [p[0], p[1]].some(id => groups.includes(DB.cards[id].group))));
}
function startConfusables(groups) {
  const pairs = shuffle(confusablePairs(groups)).slice(0, 4);
  if (!pairs.length) { alert(t("h.conf.none")); return; }
  S = { queue: pairs.flatMap(p => pairItems(p, 3)), drill: true, i: 0, results: [], lastType: null, graded: new Set(), title: t("s.conf") };
  step();
}

// ---------- step rendering ----------
function frame(kindLabel, inner) {
  const done = S.i - (S.back || 0), total = S.queue.length;
  $("#app").innerHTML = `<div class="narrow">
    <div class="counter"><span>${esc(S.title)} · ${t("s.count", done + 1, total)}</span>
      <span class="row" style="gap:4px">${prevIndex() >= 0 ? `<button class="btn quiet" id="prev" title="${esc(t("b.prev.t"))}">← ${t("b.prev")}</button>` : ""}<button class="btn quiet" id="quit">✕ ${t("s.end")}</button></span></div>
    <div class="bar sessionbar" aria-hidden="true"><span style="width:${100 * done / total}%"></span></div>
    <div class="sheet q"><div class="kind">${esc(kindLabel)}</div>${inner}</div></div>`;
  $("#quit").onclick = () => S.results.length ? summary() : home();
  if ($("#prev")) $("#prev").onclick = goBack;
  window.scrollTo(0, 0);
}
// ---------- going back ----------
// Earlier steps are shown again as their word's lesson card (read-only): answers already given keep their grade.
// S.back counts how many steps behind the current one (S.i) the screen is.
const reviewable = it => it && (it.kind === "intro" || it.kind === "teach" || it.kind === "ex");
function prevIndex() {
  for (let j = S.i - (S.back || 0) - 1; j >= 0; j--) if (reviewable(S.queue[j])) return j;
  return -1;
}
function goBack() {
  if (S.pending && !S.back) { flushPending(); S.i++; }  // an answer on screen counts before leaving it
  const j = prevIndex();
  if (j < 0) return;
  S.back = S.i - j;
  step();
}
function goForward() {
  do S.back--; while (S.back > 0 && !reviewable(S.queue[S.i - S.back]));
  step();
}
function step() {
  if (S.back > 0) {
    const it = S.queue[S.i - S.back];
    return it.kind === "intro" ? renderIntro(it, true) : renderTeach(DB.cards[it.id], true);
  }
  if (S.i >= S.queue.length) return summary();
  const it = S.queue[S.i];
  if (it.kind === "intro") return renderIntro(it);
  if (it.kind === "teach") return renderTeach(DB.cards[it.id]);
  if (it.kind === "pair") { S.queue.splice(S.i, 1, ...pairItems(it.pair, 1)); return step(); }
  if (it.kind === "pairq") return renderPairQ(it);
  if (it.kind === "pairsame") return renderPairSame(it);
  return renderExercise(it);
}
function advance() { S.i++; step(); }

function renderIntro(it, review) {
  const cs = it.ids.map(id => DB.cards[id]);
  frame(review ? t("k.back") : t("k.new"), `
    <h2 style="font-size:1.6rem;margin-top:6px">${[...new Set(cs.map(c => c.group))].map(g => esc(glabel(g))).join("<br>")}</h2>
    <p class="prompt">${t("intro.p", cs.length)}</p>
    <div class="words" lang="da">${cs.map(c => `<span class="word">${esc(c.word)}</span>`).join("")}</div>
    <button class="btn solid next" id="nx">${review ? t("b.next") + " →" : t("b.start")}</button>`);
  bindNext(review ? goForward : advance);
}

// DDO definitions with the English translation in small print under each
// which DDO headword the definition comes from, when it isn't the card's own word (blandt andet → blandt)
function ddoHead(c, d) {
  const own = !d.head || norm(d.head) === norm(c.word.replace(/^(at|en|et) /, ""));
  return `${own ? "" : `${t("t.under")} <b lang="da">${esc(d.head)}</b> · `}${esc(d.pos)}`;
}
function ddoSenses(d, n) {
  return d.senses.slice(0, n).map((s, i) => `<div lang="da" style="margin-top:4px">${d.senses.length > 1 ? `<b>${i + 1}.</b> ` : ""}${esc(s)}</div>${
    d.senses_en && d.senses_en[i] ? `<div class="en-def" lang="en">${esc(d.senses_en[i])}</div>` : ""}`).join("");
}
// words with more than one meaning (senses.json): one block per meaning with its own example and exam sentences
function senseBlocks(c, perSense, withTr) {
  const info = DB.senses[c.id];
  const ex = examSentences(c);
  const exLine = e => `<div class="ex" lang="da"><span class="tag">${esc(e.src)}</span><span>${hlSentence(c, e.s, e.m)}</span>${withTr ? trLink(e.s) : ""}</div>`;
  return info.senses.map((sn, i) => {
    const mine = ex.filter(e => e.sense === sn.id).slice(0, perSense);
    return `<div class="sense"><div class="sh">${info.senses.length > 1 ? `<span class="num">${i + 1}</span>` : ""}<b lang="en">${esc(sn.en)}</b><span class="soft" lang="da">${esc(sn.da)}</span></div>
      <div class="eg"><div class="ex" lang="da"><span class="sentence">${hlSentence(c, sn.example)}</span>${withTr ? trLink(sn.example) : ""}</div></div>
      ${mine.length ? mine.map(exLine).join("") : `<div class="none">${t("s.noexam")}</div>`}</div>`;
  }).join("") + (info.note ? `<div class="sensenote" lang="da">${esc(info.note)}</div>` : "");
}
// ---------- "Hvorfor?": why the right answer is right, shown after a wrong answer ----------
const GEX = {
  "årsag": ["giver grunden – svar på ”hvorfor?”", "gives the reason (answers ”why?”)", "fordi, da, eftersom"],
  "konsekvens": ["giver følgen – svar på ”hvad skete der så?”", "gives the result (answers ”so what happened?”)", "derfor, så, dermed"],
  "kontrast": ["sætter to ting op mod hinanden", "sets two things against each other", "men, derimod, hvorimod"],
  "indrømmelse": ["indrømmer noget, men konklusionen holder alligevel", "admits something, but the conclusion still holds", "selvom, alligevel, ganske vist"],
  "tilføjelse": ["lægger noget mere til", "adds something more", "desuden, endvidere, blandt andet"],
  "betingelse": ["noget gælder kun på en betingelse", "something holds only on a condition", "hvis, medmindre, forudsat at"],
  "formål": ["fortæller hensigten – hvad noget skal føre til", "gives the purpose: what something is meant to achieve", "for at, så (at), med henblik på"],
  "tid": ["fortæller hvornår eller i hvilken rækkefølge", "says when, or in what order", "når, inden, derefter"],
  "sammenligning": ["sammenligner to ting", "compares two things", "ligesom, i forhold til, tilsvarende"],
  "præcisering": ["giver et eksempel eller uddyber", "gives an example or explains further", "fx, især, dvs."],
  "udelukkelse": ["undtager eller fravælger noget", "leaves something out", "undtagen, bortset fra, frem for"],
  "konklusion": ["opsummerer", "sums up", "alt i alt, kort sagt"],
  "holdning": ["viser skribentens holdning", "shows the writer's attitude", "heldigvis, desværre, faktisk"],
};
function whyBox(html) { return `<div class="whybox"><b>${t("why.title")}</b> ${html}</div>`; }
function relWhy(g) {
  const x = GEX[g];

// ---------- exercises ----------
// word-order tiles: the connector's clause from a real exam sentence (PD3 length), else the card's example
function clauseTokens(s) {
  if (/[…:;()”"–]|\.\s|\?\s/.test(s.slice(0, -1))) return null;
  const toks = s.replace(/[.!?]$/, "").split(/\s+/).map(x => x.replace(/,$/, "")).filter(Boolean);
  return toks.length >= 4 && toks.length <= 14 ? toks : null;
}
function orderSource(c) {
  if (!wtype(c)) return null;
  const cands = [];
  for (const e of examSentences(c)) {
    const [a] = e.m;
    let part = null;
    if (a === 0) part = e.s;                                   // "Derfor er det …" / "Da jeg var barn, …"
    else if (/,\s$/.test(e.s.slice(0, a))) part = e.s.slice(a).split(/,\s/)[0];   // "…, da de følger de … ruter"
    const toks = part && clauseTokens(part);
    if (toks && toks.length >= 6) cands.push({ toks, s: part.replace(/[,.]$/, "") + (/[.!?]$/.test(part) ? "" : "."), src: e.src });
  }
  if (cands.length) return pickEasy(cands);
  const toks = c.example && clauseTokens(c.example);
  return toks ? { toks, s: c.example, src: null } : null;
}
function orderTokens(c) { return orderSource(c)?.toks || null; }
const defOf = x => x.dict && x.dict.senses && x.dict.senses[0];
// writing clue: the first two DDO meanings, since an exam sentence may use the second one (begrænset af = bounded by)
const defClue = c => { const ss = c.dict.senses.slice(0, 2); return ss.length > 1 ? ss.map((d, i) => `<div><b>${i + 1}.</b> ${esc(d)}</div>`).join("") : esc(ss[0]); };
const posKey = x => ((x.dict && x.dict.pos) || "").split(/[ ,]/)[0];
// PD3 level with readable context: prefer a word's shortest exam sentences (≤ 110 characters when there is one)
function pickEasy(list) {
  if (!list.length) return null;
  const byLen = list.slice().sort((a, b) => a.s.length - b.s.length);
  const short = byLen.filter(x => x.s.length <= 110);
  return pick((short.length ? short : byLen).slice(0, 3));
}
const ctxSentence = c => pickEasy(examSentences(c).filter(e => !e.sense || !DB.senses[c.id]));
function clozeSource(c) {
  if (c.word.includes("…")) return null;
  const sp = c.example && findSpan(c, c.example);
  // a lone exam sentence lacks the context that decides between connectors (derfor vs ligeledes both fit
  // "… findes ___ også …"), so connectors use their example, written with that context; content words use the exam
  if (c.priority === 1 && sp) return { s: c.example, span: sp, src: "example" };
  const srcs = examSentences(c).map(e => ({ s: e.s, span: e.m, src: e.src }));
  if (sp) srcs.push({ s: c.example, span: sp, src: "example" });
  return pickEasy(srcs);
}
function eligibleTypes(c, first) {
  // B2: once a word has been met, production (writing, word order, meaning in context) dominates
  const ts = [["meaning", 2], ["produce", 2]];
  if (clozeSource(c)) ts.push(["cloze", 2]);
  // multi-meaning words (da, mens, så, siden): read the meaning off a real exam sentence
  if (DB.senses[c.id] && DB.senses[c.id].senses.length > 1 && examSentences(c).some(e => e.sense)) ts.push(["sense", 3]);
  if (c.priority === 1) {
    ts.push(["relation", 1]);
    if (cards().filter(x => x.group === c.group).length > 1) ts.push(["odd", 1]);
    if (wtype(c) && orderTokens(c)) ts.push(["order", 3]);
  }
  // a brand-new word is tested with recognition first
  return first ? ts.filter(([k]) => ["meaning", "cloze", "relation", "sense"].includes(k)) : ts;
}
function chooseType(c, first) {
  let ts = eligibleTypes(c, first).filter(([k]) => k !== S.lastType);
  if (!ts.length) ts = eligibleTypes(c, first);
  let r = Math.random() * ts.reduce((a, [, w]) => a + w, 0);
  for (const [k, w] of ts) if ((r -= w) < 0) return k;
  return ts[0][0];
}
function distractors(c, n, filter) {
  const pool = shuffle(cards().filter(x => x.id !== c.id && x.group !== c.group && filter(x)));
  const out = [], seen = new Set([norm(c.meaning), norm(c.word)]);
  for (const x of pool) {
    if (seen.has(norm(x.meaning)) || seen.has(norm(x.word))) continue;
    seen.add(norm(x.meaning)); seen.add(norm(x.word)); out.push(x);

const sameKind = c => { const w = norm(c.word); return w.startsWith("at ") ? x => norm(x.word).startsWith("at ") : /^(en|et) /.test(w) ? x => /^(en|et) /.test(norm(x.word)) : x => (x.priority || 3) === (c.priority || 3) && !/^(at|en|et) /.test(norm(x.word)); };

function renderExercise(it) {
  const c = DB.cards[it.id];
  const type = it.type || chooseType(c, it.first);
  it.type = type;
  S.lastType = type;
  S.t0 = performance.now();
  const label = t(it.practice ? "k.practice" : it.first ? "k.first" : "k.review") + " · " + t("x." + type);
  S.sent = null;
  ({ meaning: exMeaning, produce: exProduce, cloze: exCloze, relation: exRelation, order: exOrder, odd: exOdd, sense: exSense })[type](c, label, it);

function mc(label, head, options, correctIdx, onDone) {
  frame(label, `${head}<div class="opts">${options.map((o, i) => `<button class="btn opt" data-i="${i}"><span class="k">${i + 1}</span><span>${o}</span></button>`).join("")}</div><div id="fb"></div>`);
  const btns = [...document.querySelectorAll(".opt")];
  const choose = i => {
    if (btns[0].disabled) return;
    btns.forEach(b => b.disabled = true);
    btns[correctIdx].classList.add("right");
    if (i !== correctIdx) btns[i].classList.add("wrong");
    onDone(i === correctIdx, i);
  };
  btns.forEach(b => b.onclick = () => choose(+b.dataset.i));
  S.keys = e => { const n = +e.key; if (n >= 1 && n <= options.length) choose(n - 1); };
}
// real exam sentences take longer to read than a single word
const quick = (ms = 6000) => performance.now() - S.t0 < ms;

function exMeaning(c, label, it) {
  // PD3 level: pick the Danish dictionary definition, with the word met in a real exam sentence
  if (defOf(c)) {
    const fits = x => defOf(x) && norm(defOf(x)) !== norm(defOf(c)) && (posKey(c) ? posKey(x) === posKey(c) : sameKind(c)(x));
    // B2: one wrong option comes from the word's own group (medføre vs forårsage), as long as its meaning
    // and definition really differ; the rest from other groups
    const words = x => new Set(norm(defOf(x)).split(" ").filter(w => w.length > 3));
    const overlap = x => { const a = words(c), b = words(x); return [...b].filter(w => a.has(w)).length / Math.max(1, Math.min(a.size, b.size)); };
    const glossSet = x => new Set(x.meaning.toLowerCase().split(/[,/;()]+/).map(g => g.trim()).filter(Boolean));
    const near = shuffle(cards().filter(x => x.id !== c.id && x.group === c.group && fits(x) && overlap(x) < 0.5 && ![...glossSet(x)].some(g => glossSet(c).has(g))))[0];
    const others = distractors(c, 3, fits);
    if (others.length === 3) {
      const opts = shuffle([c, ...others]), ctx = ctxSentence(c);
      S.sent = ctx && ctx.s;
      const clip = x => { const d = defOf(x); return d.length > 150 ? d.slice(0, 147) + "…" : d; };
      return mc(label.replace(t("x.meaning"), t("x.def")), `<p class="prompt">${t("q.def")}</p><div class="big" lang="da">${esc(c.word)}</div>
        ${ctx ? `<div class="ex" lang="da" style="margin-top:8px"><span class="tag">${esc(ctx.src)}</span>${hlSentence(c, ctx.s, ctx.m)}</div>` : ""}`,
        opts.map(o => `<span lang="da">${esc(clip(o))}</span>`), opts.indexOf(c),
        (ok, i) => feedback(c, it, ok ? (quick(12000) ? 5 : 4) : 2, ok,
          `<b lang="da">${esc(c.word)}</b> = ${esc(c.meaning)}<div class="small" lang="da">${esc(defOf(c))}</div>${c.dict.senses_en?.[0] ? `<div class="en-def">${esc(c.dict.senses_en[0])}</div>` : ""}` +
          (ok ? "" : whyBox(`${t("why.def", wordLine(opts[i]))}${opts[i].dict.senses_en?.[0] ? `<div class="en-def">${esc(opts[i].dict.senses_en[0])}</div>` : ""}`)), ok ? null : "moderate"));
    }
  }
  const opts = shuffle([c, ...distractors(c, 3, x => (x.priority || 3) === (c.priority || 3))]);
  mc(label, `<p class="prompt">${t("q.meaning")}</p><div class="big" lang="da">${esc(c.word)}</div>`,
    opts.map(o => esc(o.meaning)), opts.indexOf(c),
    (ok, i) => feedback(c, it, ok ? (quick() ? 5 : 4) : 2, ok, ok ? "" : wordLine(c) + whyBox(t("why.chose", `“${esc(opts[i].meaning)}”`) + " = " + wordLine(opts[i])), ok ? null : "moderate"));
}

function exRelation(c, label, it) {
  const groups = shuffle([c.group, ...shuffle(GROUP_ORDER.filter(g => prio(g) === 1 && g !== c.group && !(ALSO[c.id] || []).includes(g))).slice(0, 3)]);
  const ctx = ctxSentence(c);
  S.sent = ctx && ctx.s;
  mc(label, ctx ? `<p class="prompt">${t("q.relctx", `<b lang="da">${esc(c.word)}</b>`)}</p><div class="sentence" lang="da">${hlSentence(c, ctx.s, ctx.m)}</div><div style="margin-top:6px"><span class="tag">${esc(ctx.src)}</span></div>`
    : `<p class="prompt">${t("q.relation")}</p><div class="big" lang="da">${esc(c.word)}</div>`,
    groups.map(g => esc(glabel(g))), groups.indexOf(c.group),
    (ok, i) => feedback(c, it, ok ? 4 : 2, ok, `<b lang="da">${esc(c.word)}</b> (${esc(c.meaning)}) → ${esc(glabel(c.group))}` +
      (ok ? "" : whyBox(`<div><span lang="da">${esc(c.word)}</span>: ${relWhy(c.group)}</div><div class="test">${t("why.chose2")} ${relWhy(groups[i])}</div>`)), ok ? null : "moderate"));

function exSense(c, label, it) {
  const info = DB.senses[c.id];
  const e = pickEasy(examSentences(c).filter(x => x.sense));
  S.sent = e.s;
  const opts = info.senses;
  mc(label, `<p class="prompt">${t("q.sense", `<b lang="da">${esc(c.word)}</b>`)}</p><div class="sentence" lang="da">${hlSentence(c, e.s, e.m)}</div><div style="margin-top:6px"><span class="tag">${esc(e.src)}</span></div>`,
    opts.map(sn => `<span lang="da">${esc(sn.da)}</span> <span class="soft">· ${esc(sn.en)}</span>`), opts.findIndex(sn => sn.id === e.sense),
    (ok, i) => {
      const right = info.senses.find(sn => sn.id === e.sense), chose = opts[i];
      const line = (sn, mark) => `<div class="test">${mark} <b lang="da">${esc(sn.da)}</b>: <span lang="da">${esc(sn.cue)}</span>${sn.test ? `<div class="sentence small" lang="da">${swapIn(e.s, e.m, sn.test)}</div>` : ""}<div class="en-def">${esc(sn.cue_en)}</div></div>`;
      feedback(c, it, ok ? (quick(12000) ? 5 : 4) : 2, ok, `<b lang="da">${esc(right.da)}</b> · ${esc(right.en)}` +
        (ok ? (info.note ? `<div class="small" lang="da">${esc(info.note)}</div>` : "") : whyBox(t("why.sub") + line(right, "✅") + line(chose, "❌"))), ok ? null : "critical");

function exCloze(c, label, it) {
  const src = clozeSource(c);
  S.sent = src && src.s;
  // same word class (and same word-order type for connectors), so the choice is about meaning, not grammar
  // a confusable partner (da/når, for/fordi) is the hardest distractor, so it goes in first when it fits the gap
  const partner = partnerPairs(c.id).map(p => DB.cards[p[0] === c.id ? p[1] : p[0]]).find(x => sameKind(c)(x) && (!wtype(c) || wtype(x) === wtype(c)));
  const rest = distractors(c, partner ? 2 : 3, x => x !== partner && sameKind(c)(x) && !x.word.includes("…") && (!wtype(c) || wtype(x) === wtype(c)));
  const opts = shuffle([c, ...(partner ? [partner] : []), ...rest]);
  if (opts.length < 3) { it.type = "meaning"; return exMeaning(c, label, it); }
  const [a, b] = src.span;
  const gapped = `${esc(src.s.slice(0, a))}<span class="gap">&nbsp;</span>${esc(src.s.slice(b))}`;
  const inflected = norm(src.s.slice(a, b)) !== norm(c.word.replace(/^(at|en|et) /, ""));
  mc(label, `<p class="prompt">${t("q.cloze")}${inflected ? t("q.base") : ""} ${src.src !== "example" ? `<span class="tag">${esc(src.src)}</span>` : ""}</p><div class="sentence" lang="da">${gapped}</div>`,
    opts.map(o => `<span lang="da">${esc(o.word)}</span>`), opts.indexOf(c),
    (ok, i) => {
      const x = opts[i], pr = !ok && partnerPairs(c.id).find(p => p.includes(x.id));
      const why = ok ? "" : whyBox(
        `<div>${t("why.chose", wordLine(x))}</div>` +
        (pr ? `<div class="test"><b>${t("f.rule")}</b> <span lang="da">${esc(tip(pr))}</span></div>` :
          wtype(c) && x.group !== c.group ? `<div class="test">${t("why.needs2")} ${relWhy(c.group)}</div><div class="test">${esc(x.word)}: ${relWhy(x.group)}</div>` :
          defOf(c) ? `<div class="test">${t("why.clue", `<b lang="da">${esc(c.word)}</b>`)} <span lang="da">${esc(defOf(c))}</span></div>` : "") +
        (inflected || /^(at|en|et) /.test(c.word) ? "" : `<div class="test sentence small" lang="da">${swapIn(src.s, src.span, x.word.replace(/^(at|en|et) /, ""))} ❌</div>`));
      feedback(c, it, ok ? (quick(src.src === "example" ? 6000 : 10000) ? 5 : 4) : 2, ok,
        `<div class="sentence" lang="da">${hlSentence(c, src.s, src.span)}</div><div class="small"><span lang="da">${esc(c.word)}</span> = ${esc(c.meaning)}</div>` + why, ok ? null : "moderate");
    });
}

function exOdd(c, label, it) {
  const mate = pick(cards().filter(x => x.group === c.group && x.id !== c.id));
  const others = [];
  shuffle(cards().filter(x => x.priority === 1 && x.group !== c.group)).forEach(x => { if (others.length < 2 && !others.some(o => o.group === x.group)) others.push(x); });
  const opts = shuffle([c, mate, ...others]);
  frame(label, `<p class="prompt">${t("q.odd")}</p>
    <div class="opts">${opts.map((o, i) => `<button class="btn opt" data-i="${i}"><span class="k">${i + 1}</span><span lang="da">${esc(o.word)}</span></button>`).join("")}</div><div id="fb"></div>`);
  const btns = [...document.querySelectorAll(".opt")], sel = new Set();
  const toggle = i => {
    if (btns[0].disabled) return;
    sel.has(i) ? sel.delete(i) : sel.add(i);
    btns[i].classList.toggle("sel");
    if (sel.size < 2) return;
    btns.forEach(b => b.disabled = true);
    const ok = [...sel].every(j => opts[j].group === c.group);
    opts.forEach((o, j) => { btns[j].classList.remove("sel"); if (o.group === c.group) btns[j].classList.add("right"); else if (sel.has(j)) btns[j].classList.add("wrong"); });
    feedback(c, it, ok ? 4 : 2, ok, t("f.both", `<b lang="da">${esc(c.word)}</b>`, `<b lang="da">${esc(mate.word)}</b>`, esc(glabel(c.group))) + " " +
      opts.filter(o => o.group !== c.group).map(o => `<span lang="da">${esc(o.word)}</span> = ${esc(gname(o.group))}`).join(" · ") +
      (ok ? "" : whyBox(opts.map(o => `<div class="test"><span lang="da">${esc(o.word)}</span>: ${relWhy(o.group)}</div>`).join(""))), ok ? null : "moderate");
  };
  btns.forEach(b => b.onclick = () => toggle(+b.dataset.i));
  S.keys = e => { const n = +e.key; if (n >= 1 && n <= 4) toggle(n - 1); };
}

function letters() { return `<div class="letters">${["æ", "ø", "å"].map(l => `<button type="button" data-l="${l}">${l}</button>`).join("")}</div>`; }

    input.focus(); input.setSelectionRange(p + 1, p + 1);

  S.sent = ctx ? ctx.s : c.example;
  let hinted = false;
  frame(label, (ctx ? `<p class="prompt">${t("q.gap")}</p>
    <div class="sentence" lang="da">${esc(ctx.s.slice(0, ctx.m[0]))}<span class="gap">&nbsp;</span>${esc(ctx.s.slice(ctx.m[1]))}</div>
    <div style="margin-top:6px"><span class="tag">${esc(ctx.src)}</span></div>
    <div class="ddo" style="margin-top:12px" lang="da">${defClue(c)}</div>
    <div class="row" style="margin-top:8px"><button class="btn quiet" id="hint">${t("b.hint")}</button><span id="hinttxt" class="soft"></span></div>` : defOf(c) ? `<p class="prompt">${t("q.def2")}</p>
    <div class="ddo" lang="da">${defClue(c)}</div>
    <div class="soft small" style="margin-top:6px" lang="da">${esc(GROUPS[c.group] ? GROUPS[c.group][1] : c.group)}${wtype(c) ? " · " + esc(wtype(c)) : ""}${c.dict.pos ? " · " + esc(c.dict.pos) : ""}</div>
    <div class="row" style="margin-top:8px"><button class="btn quiet" id="hint">${t("b.hint")}</button><span id="hinttxt" class="soft"></span></div>` : `<p class="prompt">${t("q.produce")}</p>
    <div class="meaning" style="font-size:1.5rem">${esc(c.meaning)}</div>
    <div class="soft small">${esc(glabel(c.group))}${wtype(c) ? " · " + esc(wtype(c)) : ""}</div>`) + `
    <input class="answer" id="ans" lang="da" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${t("q.ph")}">${letters()}
    <div class="row next"><button class="btn solid" id="chk">${t("b.check")}</button><button class="btn quiet" id="idk">${t("b.idk")}</button></div><div id="fb"></div>`);
  const input = $("#ans");
  input.focus(); bindLetters(input);
  if ($("#hint")) $("#hint").onclick = () => { hinted = true; $("#hinttxt").textContent = c.meaning; $("#hint").remove(); input.focus(); };
  const isRight = v => isAnswer(c, v) || (gapForm && norm(v) === norm(gapForm));
  const check = give => {
    if (input.disabled) return;
    const v = input.value.trim();
    if (!v && !give) return;
    // another deck word with an overlapping meaning (however → dog / imidlertid): not wrong, ask for the other one
    const gloss = s => new Set(s.toLowerCase().split(/[,/;()]+/).map(x => x.trim()).filter(Boolean));
    const twin = !give && !isRight(v) && cards().find(x => x.id !== c.id && isAnswer(x, v) && [...gloss(x.meaning)].some(g => gloss(c.meaning).has(g)));

    // B2: the gap needs the form the sentence asks for (skyldtes, not skyldes); the base form is the right word, wrong form

    if (!give && isRight(v) && !exact) return feedback(c, it, hinted ? 3 : 4, true, t("f.formok", `<b lang="da">${esc(gapForm)}</b>`) + `<div style="margin-top:6px">${answer}</div>`);
    if (!give && isRight(v)) return feedback(c, it, hinted ? 3 : quick(ctx ? 15000 : 9000) ? 5 : 4, true, answer + (hinted ? `<div class="soft small">${t("f.hinted")}</div>` : ""));
    if (!give && nearMiss(c, v)) return feedback(c, it, 3, true, t("f.spelling", `<b lang="da">${esc(c.word)}</b>`, esc(v)), "minor", t("f.almost"));
    const other = v && cards().find(x => x.id !== c.id && isAnswer(x, v));
    const why = give ? "" : whyBox((other ? `<div>${t("why.typed", `<b lang="da">${esc(v)}</b>`, esc(other.meaning))}</div>` : "") +
      (defOf(c) ? `<div class="test">${t("why.clue", `<b lang="da">${esc(c.word)}</b>`)} <span lang="da">${esc(defOf(c))}</span></div>` : `<div class="test">${wordLine(c)}</div>`) +
      (other && wtype(other) && wtype(c) && other.group !== c.group ? `<div class="test">${relWhy(c.group)}</div>` : ""));
    feedback(c, it, give ? 0 : 1, false, (v ? t("f.wrote", esc(v)) : "") + answer + why, give ? null : "moderate", null, !give);
  };
  $("#chk").onclick = () => check(false);
  $("#idk").onclick = () => check(true);
  S.keys = e => { if (e.key === "Enter" && document.activeElement === input) { e.preventDefault(); check(false); } };
}

function exOrder(c, label, it) {
  const os = it.os || (it.os = orderSource(c));
  if (!os) { it.type = "cloze"; return clozeSource(c) ? exCloze(c, label, it) : exMeaning(c, label, it); }
  const toks = os.toks;
  S.sent = os.s;
  const rest = toks.slice(1);
  let tiles = shuffle(rest.map((x, i) => ({ t: x, i })));
  for (let n = 0; n < 5 && tiles.map(x => x.t).join(" ") === rest.join(" "); n++) tiles = shuffle(tiles);
  const placed = [];
  let tries = 0;
  frame(label, `<p class="prompt">${t("q.order", `<b lang="da">${esc(c.word)}</b> <span class="tag">${esc(wtype(c))}</span>`)}</p>
    <div class="built" id="built" lang="da"></div><div class="tiles" id="tiles" lang="da"></div>
    <div class="row next"><button class="btn solid" id="chk" disabled>${t("b.check")}</button><button class="btn quiet" id="clr">${t("b.clear")}</button><button class="btn quiet" id="idk">${t("b.show")}</button></div><div id="fb"></div>`);
  const draw = () => {
    $("#built").innerHTML = `<span class="tile fixed">${esc(toks[0])}</span>` + placed.map((x, k) => `<button class="tile" data-k="${k}">${esc(x.t)}</button>`).join("");
    $("#tiles").innerHTML = tiles.map((x, k) => `<button class="tile${placed.includes(x) ? " used" : ""}" data-t="${k}">${esc(x.t)}</button>`).join("");
    document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { if (!placed.includes(tiles[+b.dataset.t])) { placed.push(tiles[+b.dataset.t]); draw(); } });
    document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { placed.splice(+b.dataset.k, 1); draw(); });
    $("#chk").disabled = placed.length !== rest.length;
  };
  draw();
  const right = `<div class="sentence" lang="da">${hlSentence(c, os.s)}</div>${os.src ? `<span class="tag">${esc(os.src)}</span>` : ""}`;
  const finish = (q, ok, sev) => {
    ["#chk", "#clr", "#idk"].forEach(s => $(s)?.remove());
    document.querySelectorAll(".tile").forEach(b => b.disabled = true);
    const built = [toks[0], ...placed.map(x => x.t)].join(" ");
    feedback(c, it, q, ok, right + (ok ? `<div class="why">${rule(wtype(c).split("/")[0]) || ""}</div>` :
      whyBox(`${placed.length ? `<div>${t("why.built")} <span lang="da" style="text-decoration:line-through">${esc(built)}</span></div>` : ""}<div class="test">${rule(wtype(c).split("/")[0]) || ""}</div>`)), sev, null, false, ok ? null : os.s);
  };
  $("#chk").onclick = () => {
    const ok = placed.map(x => x.t.toLowerCase()).join(" ") === rest.join(" ").toLowerCase();
    tries++;
    if (ok) return finish(tries === 1 ? 5 : 3, true);
    if (tries === 1) {
      $("#built").classList.remove("shake"); void $("#built").offsetWidth; $("#built").classList.add("shake");
      $("#fb").innerHTML = `<div class="feedback bad"><h3>${t("f.retry")}</h3><div class="why">${t("f.retry.p", `<b lang="da">${esc(c.word)}</b>`)}</div></div>`;
      return;
    }
    finish(1, false, "critical");
  };
  $("#clr").onclick = () => { placed.length = 0; draw(); };
  $("#idk").onclick = () => finish(1, false, "critical");
  S.keys = e => { if (e.key === "Enter" && !$("#chk")?.disabled) $("#chk")?.click(); };
}

// ---------- feedback + grading ----------

function feedback(c, it, q, ok, body, severity, headText, canOverride, retype) {

function commit() {

}
function flushPending() {
  const p = S.pending;

      if (pr && !S.queue.some(x => x.kind === "pair" && x.pair === pr)) S.queue.splice(Math.min(S.i + 2, S.queue.length), 0, { kind: "pair", pair: pr });

// ---------- confusables drill ----------
// pairs that mean the same thing can't be tested with a gap (either word fits): they get an L3-style check instead
const SAME_MEANING = new Set(["derfor|således", "næppe|næsten_ikke", "imidlertid|dog", "at_medføre|at_forårsage", "at_forhindre|at_forebygge", "at_begrænse|at_reducere", "undtagen|bortset_fra", "hvis|såfremt", "skønt|selvom", "ikke_desto_mindre|alligevel", "desuden|derudover", "endvidere|ydermere", "især|navnlig", "for_eksempel_fx|eksempelvis", "i_stedet_for|frem_for", "derefter|herefter", "alt_i_alt|samlet_set", "dermed|derved", "følgelig|derfor", "at_sikre|at_garantere"]);
// per pair: which of a word's labelled senses to use, and senses where the partner also fits (counted right, with a note)
const PAIR_SENSES = { "mens|hvorimod": { mens: { both: ["contrast"] }, hvorimod: { skip: true } } };
const RELATED = { "konsekvens": ["årsag", "formål", "konklusion"], "årsag": ["konsekvens", "formål"], "kontrast": ["indrømmelse"], "indrømmelse": ["kontrast"] };
const pairKey = p => `${p[0]}|${p[1]}`;
function pairItems(pair, perWord) {
  if (SAME_MEANING.has(pairKey(pair))) return [{ kind: "pairsame", pair }];
  const rule = PAIR_SENSES[pairKey(pair)] || {};
  const sides = [];
  for (const id of [pair[0], pair[1]]) {
    const c = DB.cards[id], r = rule[id] || {}, other = id === pair[0] ? pair[1] : pair[0];
    if (r.skip) continue;
    let srcs = examSentences(c).filter(e => e.s.length < 230).map(e => ({ s: e.s, span: e.m, src: e.src, sense: e.sense }));
    if (!srcs.length && c.example && findSpan(c, c.example)) srcs = [{ s: c.example, span: findSpan(c, c.example), src: null }];
    if (srcs.length) sides.push({ id, other, r, srcs: srcs.sort((a, b) => a.s.length - b.s.length) });
  }
  // each word is the answer equally often (a word with one sentence used to leave its partner the answer 3 times in 4),
  // and the two words are listed in random order, so the answer can't be guessed from its place in "Skriv A eller B"
  const n = Math.min(perWord, ...sides.map(x => x.srcs.length));
  const out = sides.flatMap(({ id, other, r, srcs }) => shuffle(srcs.slice(0, Math.max(n, 4))).slice(0, n)
    .map(x => ({ kind: "pairq", pair, id, other, ...x, both: (r.both || []).includes(x.sense), flip: Math.random() < .5 })));
  return shuffle(out);
}
function renderPairQ(it) {
  const c = DB.cards[it.id], o = DB.cards[it.other], [A, B] = (it.flip ? [it.pair[1], it.pair[0]] : it.pair).map(id => DB.cards[id]);
  const gapForm = it.s.slice(it.span[0], it.span[1]);
  S.sent = it.s;
  frame(`${t("s.conf")} · ${A.word} / ${B.word}`, `<p class="prompt">${t("q.pair2", `<b lang="da">${esc(A.word)}</b>`, `<b lang="da">${esc(B.word)}</b>`)}</p>
    <div class="sentence" lang="da">${esc(it.s.slice(0, it.span[0]))}<span class="gap">&nbsp;</span>${esc(it.s.slice(it.span[1]))}</div>
    ${it.src ? `<div style="margin-top:6px"><span class="tag">${esc(it.src)}</span></div>` : ""}
    <input class="answer" id="ans" lang="da" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${t("q.ph")}">${letters()}
    <div class="row next"><button class="btn solid" id="chk">${t("b.check")}</button><button class="btn quiet" id="idk">${t("b.idk")}</button></div><div id="fb"></div>`);
  const input = $("#ans");
  input.focus(); bindLetters(input);
  const check = give => {
    if (input.disabled) return;
    const v = input.value.trim();
    if (!v && !give) return;
    input.disabled = true; $("#chk").remove(); $("#idk").remove();
    const body = `<div class="sentence" lang="da">${hlSentence(c, it.s, it.span)}</div>
      <div class="why"><b>${t("f.rule")}</b> ${esc(tip(it.pair))}</div>
      <div class="pair"><div><b lang="da">${esc(A.word)}</b><br>${esc(A.meaning)}</div><div><b lang="da">${esc(B.word)}</b><br>${esc(B.meaning)}</div></div>`;
    const exact = norm(v) === norm(gapForm);
    if (!give && exact) return feedback(c, it, quick(10000) ? 5 : 4, true, body);
    if (!give && it.both && isAnswer(o, v)) return feedback(c, it, 4, true, `<div class="why">${t("f.bothfit", `<b lang="da">${esc(o.word)}</b>`)}</div>` + body);
    if (!give && isAnswer(c, v)) return feedback(c, it, 4, true, t("f.formok", `<b lang="da">${esc(gapForm)}</b>`) + body);
    if (!give && isAnswer(o, v)) return feedback(c, it, 1, false, whyBox(`${t("why.chose", wordLine(o))}<div class="test sentence small" lang="da">${swapIn(it.s, it.span, v)} ❌</div><div class="test"><b>${t("f.rule")}</b> <span lang="da">${esc(tip(it.pair))}</span></div>`) + body, "critical", t("f.its", esc(gapForm)));
    if (!give && nearMiss(c, v)) return feedback(c, it, 3, true, t("f.spelling", `<b lang="da">${esc(gapForm)}</b>`, esc(v)) + body, "minor", t("f.almost"));
    feedback(c, it, give ? 0 : 1, false, (v ? t("f.wrote", esc(v)) : "") + body, give ? null : "moderate", t("f.its", esc(gapForm)));
  };
  $("#chk").onclick = () => check(false);
  $("#idk").onclick = () => check(true);
  S.keys = e => { if (e.key === "Enter" && document.activeElement === input) { e.preventDefault(); check(false); } };
}
// same-meaning pair: pick the two words that say the same thing (they cancel each other out in an L3 grid)
function renderPairSame(it) {
  S.sent = null;
  const [A, B] = [DB.cards[it.pair[0]], DB.cards[it.pair[1]]];
  const others = [];
  // wrong options come from clearly different relations (not cause/result/purpose next to derfor)
  const near = new Set([A.group, B.group, ...(ALSO[A.id] || []), ...(ALSO[B.id] || []), ...(RELATED[A.group] || [])]);
  shuffle(cards().filter(x => !near.has(x.group) && (x.priority || 3) === (A.priority || 3) && !x.word.includes("…") && norm(x.meaning) !== norm(A.meaning)))
    .forEach(x => { if (others.length < 2 && !others.some(y => y.group === x.group)) others.push(x); });
  const opts = shuffle([A, B, ...others]);
  frame(`${t("s.conf")} · ${t("x.same")}`, `<p class="prompt">${t("q.same")}</p>
    <div class="opts">${opts.map((x, i) => `<button class="btn opt" data-i="${i}"><span class="k">${i + 1}</span><span lang="da">${esc(x.word)}</span></button>`).join("")}</div><div id="fb"></div>`);
  const btns = [...document.querySelectorAll(".opt")], sel = new Set();
  const toggle = i => {
    if (btns[0].disabled) return;
    sel.has(i) ? sel.delete(i) : sel.add(i);
    btns[i].classList.toggle("sel");
    if (sel.size < 2) return;
    btns.forEach(b => b.disabled = true);
    const ok = [...sel].every(j => opts[j] === A || opts[j] === B);
    opts.forEach((x, j) => { btns[j].classList.remove("sel"); if (x === A || x === B) btns[j].classList.add("right"); else if (sel.has(j)) btns[j].classList.add("wrong"); });
    feedback(A, it, ok ? 4 : 2, ok, `<div class="why"><b>${t("f.rule")}</b> ${esc(tip(it.pair))}</div>
      <div class="small">${opts.map(x => `<span lang="da">${esc(x.word)}</span> = ${esc(x.meaning)}`).join(" · ")}</div>`, ok ? null : "moderate");
  };
  btns.forEach(b => b.onclick = () => toggle(+b.dataset.i));
  S.keys = e => { const n = +e.key; if (n >= 1 && n <= 4) toggle(n - 1); };
}

}
function flashButtons() {

function flashFlip() {

function flashAnswer(knew) {

  else { FC.again.add(id); FC.pile.splice(Math.min(3, FC.pile.length), 0, id); }

}
function flashDone() {
  const hard = [...FC.again].map(id => DB.cards[id]), groups = FC.groups;

    ${hard.length ? `<div class="block"><span class="lbl">${t("fc.hard")}</span><ul class="list">${hard.map(c => `<li><b lang="da">${esc(c.word)}</b><span class="soft">${esc(c.meaning)}</span></li>`).join("")}</ul></div>` : ""}
    <div class="row next">${hard.length ? `<button class="btn solid" id="fcHard">${t("fc.again", hard.length)}</button>` : ""}
      <button class="btn${hard.length ? "" : " solid"}" id="fcNew">${t("fc.new")}</button><button class="btn quiet" id="home">${t("r.home")}</button></div></div></div>`;

document.addEventListener("keydown", e => {
  if (!FC || !$("#fcard") || document.querySelector("dialog[open]") || e.target.closest?.("#findbar")) return;
  const onBtn = e.target.closest?.("button, a") && e.target.id !== "fcard";
