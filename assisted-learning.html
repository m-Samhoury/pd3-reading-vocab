ighederne, men også fordi nyuddannede med en teknisk uddannelse ofte får en højere løn end nyuddannede med en humanistisk uddannelse.", "src": "2023v L2", "m": [48, 53]}, {"s": "For mange iværksættere er det svært at skelne mellem arbejde og fritid, fordi de arbejder med netop det, de interesserer sig for.", "src": "2022v L2", "m": [72, 77]}, {"s": "Vi ville flytte til København, fordi min mand fik arbejde der, men vi kunne ikke finde en bolig.", "src": "2022s L1", "m": [31, 36]}, {"s": "Nogle gange er det, fordi der ganske enkelt ikke er så mange jobs i netop deres branche.", "src": "2022s L2", "m": [20, 25]}], "nemlig": [{"s": "Det er der nemlig også flere og flere, der ønsker.", "src": "2024s L2", "m": [11, 17]}, {"s": "Historisk har det nemlig været attraktivt at have en butik i centrum.", "src": "2024s L2", "m": [18, 24]}, {"s": "Butikkerne har nemlig især i de mindre byer, hvor der heller ikke er storcentre, en vigtig rolle for folks psykiske og fysiske velvære.", "src": "2024s L2", "m": [15, 21]}, {"s": "Hun er nemlig forelsket i studiekammeraten Albert, som har vist hende, at livet kan være andet og mere end det, hun kender til.", "src": "2023v L1", "m": [7, 13]}, {"s": "Hun er nemlig udvalgt til at spille en særlig rolle i den verden, som følger efter undergangen.", "src": "2023v L1", "m": [7, 13]}, {"s": "Burgundias hovedperson er nemlig Østersø-øen selv, dens granit og sandsten, kirker, slægter, vand, land og byer.", "src": "2023v L1", "m": [26, 32]}, {"s": "Den stilistik, som romanen forsøger at efterligne, er nemlig den, der hersker i den mundtlige fortælling, i anekdoten eller skrønen.", "src": "2023v L1", "m": [54, 60]}, {"s": "Der er nemlig mange useriøse leverandører af antivirusprogrammer på markedet, som er mere optaget af profit end af datasikkerhed.", "src": "2023v L2", "m": [7, 13]}], "alligevel": [{"s": "Måske er det ikke så overraskende, men det var alligevel interessant nok til, at VIA University College satte sig for at undersøge det nærmere.", "src": "2023s L2", "m": [47, 56]}, {"s": "Der er ingen tvivl om, at kvinder ikke havde så meget politisk magt dengang, men der er alligevel meget, der tyder på, at kvinder både var selvstændige og havde rettigheder.", "src": "2022v L1", "m": [88, 97]}, {"s": "Tilbage til Omø Måske lå det alligevel i kortene, at Omø skulle blive mit hjem som voksen.", "src": "2022s L1", "m": [29, 38]}, {"s": "Hun mener nemlig, at man spilder mange ressourcer på at ansætte en medarbejder, der alligevel ikke passer til jobbet.", "src": "2022s L2", "m": [84, 93]}, {"s": "Alligevel mener Martin Holm ikke, at personlighedstesten er særlig brugbar: ”Vi mennesker forandrer os alt efter den sammenhæng, vi indgår i og også fra dag til dag.", "src": "2022s L2", "m": [0, 9]}, {"s": "Alligevel finder man det hele i det lille barndomshjem.", "src": "2021v L1", "m": [0, 9]}, {"s": "Men det bedste var alligevel, at vi lærte at tilberede et festmåltid, som jeg faktisk vil kunne lave derhjemme også.", "src": "2020v L1", "m": [19, 28]}, {"s": "Alligevel repræsenterer skiftet et væsentligt vendepunkt i hendes karriere, fordi det har ført hende ind på et spor, som hun målrettet er gået efter.", "src": "2020v L2", "m": [0, 9]}], "imidlertid": [{"s": "Uklarheden om ansvaret betyder imidlertid ikke, at udbyderne kan fralægge sig ethvert ansvar.", "src": "2023v L2", "m": [31, 41]}, {"s": "Vikingen i de to logoer adskiller sig imidlertid markant.", "src": "2022v L1", "m": [38, 48]}, {"s": "I flere kommuner ønsker man imidlertid at kunne tilbyde de ansatte større indflydelse på deres arbejdsliv.", "src": "2021v L2", "m": [28, 38]}, {"s": "Kritikerne mente imidlertid, at oplysningsforbundene på den måde ikke levede op til de værdier, som de havde stået for i så mange år.", "src": "2020v L1", "m": [17, 27]}, {"s": "De mange master er imidlertid også årsag til bekymring.", "src": "2020s L2", "m": [19, 29]}, {"s": "Det er imidlertid et problem for de danske virksomheder, at mange internationale talenter ikke ved ret meget om Danmark.", "src": "2019v L2", "m": [7, 17]}, {"s": "Man kan imidlertid søge om at få tilladelsen forlænget, dog højst til 18 måneder.", "src": "2018v L1", "m": [8, 18]}, {"s": "Imidlertid har det senere vist sig, at flytningerne i stedet kommer til at koste knap en milliard kr. i alt, altså mere end dobbelt så meget som først beregnet.", "src": "2018v L2", "m": [0, 10]}], "derimod": [{"s": "Om foråret og i den tidlige sommer er Østersøen derimod kold og nedbørsmængderne tilsvarende små.", "src": "2023v L1", "m": [48, 55]}, {"s": "Men der er ikke tale om rejsebeskrivelse af hverken øen, himlen eller havet omkring Bornholm, men derimod om en fantasifuld fortælling fortalt af en til tider ret vidtløftig fortællerstemme.", "src": "2023v L1", "m": [98, 105]}, {"s": "Det gør resten af verden derimod, men Burgundia er, blandt mange, mange ting, en lang argumentation for, at Bornholm er verdens selvfølgelige centrum.", "src": "2023v L1", "m": [25, 32]}, {"s": "Derimod har jeg stadig svært ved, at vi må begrænse, hvilke lande vi holder ferie i.", "src": "2021s L2", "m": [0, 7]}, {"s": "På uddannelser, hvor de studerende hurtigt rejser hjem igen, skal antallet af pladser derimod ikke være for højt.", "src": "2020s L2", "m": [86, 93]}, {"s": "Flytter arbejdspladsen derimod til en anden landsdel, så vælger mange ikke at flytte med.", "src": "2018v L2", "m": [23, 30]}, {"s": "Hvis man derimod deles mere lige i familien, viser man, at der er opbakning hjemmefra, og det påvirker de positive forventninger til kvinden.", "src": "2018s L2", "m": [9, 16]}, {"s": "Derimod tilbyder man på kampagnens hjemmeside blandt andet en test, hvor folk kan finde ud af, om de har forudsætninger for at købe hund.", "src": "2017s L2", "m": [0, 7]}], "selvom": [{"s": "Selvom der især spilles rytmisk musik, har vi også en gang imellem klassiske koncerter.", "src": "2024s L1", "m": [0, 6]}, {"s": "Der kan være mange grunde til, at man vælger at skifte branche, selvom man er midt i livet, fortæller Ask Nielsen, der har været karriererådgiver igennem 15 år.", "src": "2024s L2", "m": [64, 70]}, {"s": "De trives begge med at have indflydelse og ansvar for medarbejdere – også selvom det ikke altid er lige let.", "src": "2023v L2", "m": [74, 80]}, {"s": "En uddannelse som filosofi udbydes fx fem steder i landet, selvom der er høj ledighed blandt nyuddannede.", "src": "2023v L2", "m": [59, 65]}, {"s": "Men det var faktisk ikke så svært for Peter at finde job og gøre karriere, for selvom der er færre stillinger, så er der også færre ansøgere.", "src": "2023s L1", "m": [79, 85]}, {"s": "Heller ikke selvom de både har en god uddannelse og har lyst til at gå i gang med en karriere.", "src": "2023s L2", "m": [12, 18]}, {"s": "Selvom elementer fra vikingetiden bliver vist med en relativ historisk præcision, er der dog tale om en fri tilgang til den originale historie, og serien tager sig en del kunstneriske friheder.", "src": "2022v L1", "m": [0, 6]}, {"s": "Fx tales der engelsk, selvom historien foregår i Skandinavien, men skuespillerne forsøger at tale med nordisk accent for at få serien til at virke mere autentisk.", "src": "2022v L1", "m": [22, 28]}], "omvendt": [{"s": "Her var resultatet lige omvendt, idet 80 procent stemte for at forblive tysk.", "src": "2023s L1", "m": [24, 31]}], "til_gengæld": [{"s": "Til gengæld holder havet længe på sommervarmen, og fra august til december ligger Bornholm oppe blandt landets ti varmeste kommuner.", "src": "2023v L1", "m": [0, 11]}, {"s": "Til gengæld savnede jeg nogle kolleger, jeg kunne sparre med om min nye rolle.", "src": "2023v L2", "m": [0, 11]}, {"s": "Til gengæld lægger de unge også mere pres på sig selv for at præstere hver eneste dag i skolen, så de kan holde mulighederne åbne.", "src": "2021v L2", "m": [0, 11]}, {"s": "Til gengæld er det måske ikke så vigtigt, om sommerferien går til Berlin eller Bangkok.", "src": "2021s L2", "m": [0, 11]}, {"s": "Med den store indvandring af lavtuddannet arbejdskraft har dette til gengæld været et problem for de lavtuddannede danskere.", "src": "2019v L2", "m": [65, 76]}, {"s": "Til gengæld vækker det jubel hos borgmestrene i de kommuner, der skal modtage de nye arbejdspladser.", "src": "2018v L2", "m": [0, 11]}, {"s": "Hos lemurerne er der til gengæld fuld fart på - det er umuligt ikke at blive i godt humør her!", "src": "2017v L1", "m": [21, 32]}, {"s": "NGO’er Alle vores projekter indenfor Jura og Menneskerettigheder byder på hårdt arbejde, der til gengæld belønnes rigeligt i helt enestående erfaringer, indsigt og oplevelser!", "src": "2016s L1", "m": [93, 104]}], "overraskende": [{"s": "Hvert år ser vi nye og overraskende konstellationer.", "src": "2023v L1", "m": [23, 35]}, {"s": "Måske er det ikke så overraskende, men det var alligevel interessant nok til, at VIA University College satte sig for at undersøge det nærmere.", "src": "2023s L2", "m": [21, 33]}, {"s": "Overraskende nok kunne 15 ud af 18 fortælle, at deres handicap enten har lille eller slet ingen betydning for deres arbejdsliv.", "src": "2023s L2", "m": [0, 12]}, {"s": "Måske ikke overraskende, da det jo for denne aldersgruppe gælder om at uddanne sig og opleve verden.", "src": "2022s L1", "m": [11, 23]}, {"s": "Olsen-banden-filmene fik også en lidt overraskende succes i Østtyskland og store dele af det kommunistiske Østeuropa under den kolde krig.", "src": "2019v L1", "m": [38, 50]}, {"s": "Men sproget har ikke overraskende for ham vist sig at være en stor udfordring, som han må bruge meget tid på.", "src": "2019v L2", "m": [21, 33]}, {"s": "Og man kan være sikker på, at man hvert år får hørt noget nyt og ofte overraskende musik.", "src": "2019s L1", "m": [70, 82]}, {"s": "Det er overraskende, at det går så dårligt med ligestillingen i toppen af dansk erhvervsliv.", "src": "2018s L2", "m": [7, 19]}], "nødvendigt": [{"s": "For at lykkes med omstillingen er det nødvendigt at øge produktionen af grøn energi markant.", "src": "2023s L2", "m": [38, 48]}, {"s": "Her er det nødvendigt, at medarbejderne er fysisk til stede på arbejdspladsen på bestemte tidspunkter.", "src": "2021v L2", "m": [11, 21]}, {"s": "Og når det er nødvendigt, så hjælper personalet altid til – jeg føler mig slet ikke til besvær.", "src": "2019v L1", "m": [14, 24]}, {"s": "Det kan dog vise sig at være nødvendigt, hvis COWI og andre danske firmaer skal kunne klare sig i den internationale konkurrence i fremtiden.", "src": "2019v L2", "m": [29, 39]}, {"s": "For at blive frivillig gennem Projects Abroad er det nødvendigt, at du er fyldt 16 år på din afrejsedato, men vi har ingen øvre aldersgrænse.", "src": "2016s L1", "m": [53, 63]}, {"s": "Det er derfor nødvendigt, at lærere har autoritet til at skabe ro i klassen.", "src": "2016s L2", "m": [14, 24]}, {"s": "Uddannelse er i dag mere nødvendigt end nogensinde før for at få fodfæste på et arbejdsmarked, der hele tiden er under forandring.", "src": "2015s L1", "m": [25, 35]}], "hensigtsmæssig": [{"s": "Det er ikke hensigtsmæssigt i en tid, hvor viden og information står højt på dagsordenen,” siger han.", "src": "2014s L2", "m": [12, 27]}], "at_forhindre": [{"s": "Der er således professionelle udviklere, der hele tiden arbejder på at forhindre uønsket adgang til brugernes enheder.", "src": "2023v L2", "m": [71, 80]}, {"s": "Der blev ikke givet spiritusbevilling til forsamlingshuse, for på den måde forsøgte de tyske myndigheder at forhindre disse møder.", "src": "2023s L1", "m": [108, 117]}, {"s": "Det krævede ingen spiritusbevilling, og tyskerne kunne ikke forhindre dansksindede taler og sange hen over det veldækkede kagebord.", "src": "2023s L1", "m": [60, 69]}], "at_begrænse": [{"s": "De frygtede, at de ikke ville have mulighed for at etablere en social omgangskreds, samt at der ville være et begrænset antal aktiviteter.", "src": "2023s L1", "m": [110, 119]}, {"s": "Mandø er omgivet af store vader og højsander, der er begrænset af Knudedyb mod nord og Juvre Dyb mod syd.", "src": "2022s L1", "m": [53, 62]}, {"s": "Disse rundvisninger er kortere end gruppe - rundvisningerne og kan være begrænset af andre aktiviteter i teatret som fx prøver på scenen.", "src": "2021s L1", "m": [72, 81]}, {"s": "Derimod har jeg stadig svært ved, at vi må begrænse, hvilke lande vi holder ferie i.", "src": "2021s L2", "m": [43, 51]}, {"s": "Der findes masser af gratis CO2-beregnere på nettet, som kan hjælpe en til at finde ud af, hvor man får mest ud af at begrænse sin CO2-udledning.", "src": "2021s L2", "m": [118, 126]}, {"s": "Det vil altså give god mening at begrænse folks forbrug af kød.", "src": "2021s L2", "m": [33, 41]}, {"s": "1 I gamle dage folk, som havde begrænsede økonomiske forhold, især på landet.", "src": "2020v L1", "m": [31, 41]}, {"s": "Sundhedsstyrelsen har lavet nogle enkle råd, som borgerne kan følge for at begrænse den stråling, de bliver udsat for.", "src": "2020s L2", "m": [75, 83]}], "at_undgå": [{"s": "Meningen er, at man skal lade sig rive med af historien, af dens egen logik, og det kan man nærmest ikke undgå, når man læser Burgundia.", "src": "2023v L1", "m": [105, 110]}, {"s": "Som almindelig internetbruger er der altså meget, man selv kan gøre for at undgå at blive offer for it-kriminalitet.", "src": "2023v L2", "m": [75, 80]}, {"s": "Lejren blev bygget for at undgå deportationer af danskere til koncentrationslejre i Tyskland.", "src": "2023s L1", "m": [26, 31]}, {"s": "De valgte dog Hjørring for at undgå at skulle bruge tid på at pendle frem og tilbage mellem job og hjem hver dag.", "src": "2018v L2", "m": [30, 35]}, {"s": "Når man faster, vil kroppen forsøge at undgå vægttab.", "src": "2014v L2", "m": [39, 44]}], "at_medføre": [{"s": "Om vinteren kan kold luft fra øst danne snebyger over den relativt lune Østersø, hvilket visse år medfører et kraftigt snefald på øen.", "src": "2023v L1", "m": [98, 106]}, {"s": "Der kan være prøver på scener, der medfører, at vi ikke kan garantere, at turen går forbi alle scener.", "src": "2021s L1", "m": [35, 43]}, {"s": "Herefter blev der indført entré, det medførte et fald i antallet af publikummer.", "src": "2020s L1", "m": [37, 45]}, {"s": "Dette gælder f.eks. for en ansøger, der har lovligt ophold i Danmark på grundlag af en opholdstilladelse, et visum eller i medfør af EU-regler.", "src": "2018v L1", "m": [123, 129]}, {"s": "Det kan medføre, at børnene for eksempel bliver i dårligt humør, og så skal der et nyt spil til for at få niveauet op og dermed gøre dem glade igen.", "src": "2016v L2", "m": [8, 15]}, {"s": "Det medfører, at madlavning ændrer status fra almindeligt husmorarbejde til hobby og fritidsinteresse . ..", "src": "2015s L2", "m": [4, 12]}], "at_føre_til": [{"s": "Kunsthåndværk Traditionen for kunsthåndværk fører langt tilbage på Bornholm.", "src": "2023v L1", "m": [44, 49]}, {"s": "Den rige tradition, oprindeligt baseret på produktion af glas og keramik, har ført til en bred, rig og solid symbiose af værksteder, museer, biennaler og uddannelsesfaciliteter på øen.", "src": "2023v L1", "m": [78, 86]}, {"s": "kan dette også føre til, at planer om at sætte vindmøller op opgives.", "src": "2023s L2", "m": [15, 23]}, {"s": "På dette kursus kan kursusdeltagerne øge deres muligheder for at komme til netop de jobsamtaler, der kan føre til deres drømmejob.", "src": "2020v L1", "m": [105, 113]}, {"s": "Men det fører også til et stigende stressniveau.", "src": "2017s L2", "m": [8, 13]}, {"s": "En stigende interesse for frivilligt arbejde i udviklingslande har ført til, at Projects Abroad i dag er vokset til at være en organisation som arbejder i hele verden.", "src": "2016s L1", "m": [67, 75]}, {"s": "Du lærer forskellige fisketeknikker, om fiskeriregulering og fiskeredskaber, motorer og sikkerhed, og du kan få rettigheder til at føre visse fiskefartøjer.", "src": "2015v L1", "m": [131, 135]}, {"s": "du får brug for, hvis du senere vil have ret til at føre dit eget skib eller uddanne dig til fiskeskipper.", "src": "2015v L1", "m": [52, 56]}], "at_resultere_i": [{"s": "Roadpricing behøver ikke resultere i endnu en afgift.", "src": "2015s L2", "m": [25, 36]}], "at_betinge": [{"s": "Deltagelse i rekrutteringsworkshoppen er derfor betinget af, at du kan deltage i U1- og U2-forløbet.", "src": "2018s L1", "m": [48, 56]}, {"s": "Støtten er betinget af, at reglerne om studieaktivitet over holdes.", "src": "2016v L1", "m": [11, 19]}], "at_sikre": [{"s": "Den fælles ambition er at sikre unges repræsentation og styrke unges stemme på Folkemødet.", "src": "2023v L1", "m": [26, 31]}, {"s": "De bør være med til at sikre, at borgerne kender til risikoen ved at færdes på nettet og bliver bedre til at beskytte sig mod it-kriminalitet.", "src": "2023v L2", "m": [23, 28]}, {"s": "Store dele af Danmarks natur er nemlig sikret med Naturbeskyttelsesloven.", "src": "2023s L2", "m": [39, 45]}, {"s": "Det nye museum skal sikre de fem Skuldelev- skibe mod klimaforandringer, og samtidig skal museets udstillinger og faciliteter bringes op til nutidige standarder.", "src": "2022v L1", "m": [20, 25]}, {"s": "Det er det ikke alle, der har, selvom arbejdsgiverne har ansvar for at sikre et godt fysisk arbejdsmiljø derhjemme.", "src": "2022s L2", "m": [71, 76]}, {"s": "”Før man gør noget som helst andet, bør man sikre sig, at familien bakker op om projektet og har mod på at udfordre de gamle vaner.", "src": "2021s L2", "m": [44, 49]}, {"s": "Som følge af denne krise, var oplysningsforbundene i midten af 00’erne nødt til at tænke nyt for at sikre, at økonomien hang sammen.", "src": "2020v L1", "m": [100, 105]}, {"s": "Men på dette kursus var underviseren meget kompetent, og hun sikrede, at vi alle lærte stegeteknikkerne.", "src": "2020v L1", "m": [61, 68]}], "at_garantere": [{"s": "Der kan være prøver på scener, der medfører, at vi ikke kan garantere, at turen går forbi alle scener.", "src": "2021s L1", "m": [60, 69]}, {"s": "Som sæsonansat i Universe bliver du ikke garanteret et fast timeantal.", "src": "2018s L1", "m": [41, 51]}, {"s": "Du har i de to østeuropæiske destinationer mulighed for at arbejde frivilligt på vidt forskellige projekter, der alle garanterer store oplevelser og muligheden for virkelig at gøre en forskel.", "src": "2016s L1", "m": [118, 128]}, {"s": "Uanset dit valg, vil arbejdet som frivillig inden for Arkæologi garantere dig en oplevelse udover det sædvanlige!", "src": "2016s L1", "m": [64, 73]}, {"s": "Praktikplads Danmarks Fiskeriforening garanterer, at der er en praktikplads til dig, hvis det er muligt, og hvis skolen finder dig egnet.", "src": "2015v L1", "m": [38, 48]}, {"s": "Praktikpladsgaranti Danmarks Fiskeriforening garanterer, at der er en praktikplads til dig, hvis det er muligt, og hvis skolen finder dig egnet.", "src": "2013s L1", "m": [45, 55]}], "at_understrege": [{"s": "Kamilla har ikke fortrudt sit valg, men hun understreger, at det faktisk var svært at finde et job.", "src": "2022s L2", "m": [44, 56]}, {"s": "Dialog frem for sanktioner Problemerne i folkeskolen understreges også af en undersøgelse lavet af Dansk Center for Undervisningsmiljø.", "src": "2016s L2", "m": [53, 65]}, {"s": "Mai Heide Ottosen fra SFI understreger, at det liv, der kendetegner de 19-årige udeboende, måske skal ses som en midlertidig periode af deres liv.", "src": "2013s L2", "m": [26, 38]}], "at_kræve": [{"s": "Det er jo en påstand, der kræver, at man skærer en hæl og klipper en tå.", "src": "2023v L1", "m": [26, 32]}, {"s": "indstilling var, at 'den der gør sin pligt, kan også kræve sin ret'.", "src": "2023s L1", "m": [53, 58]}, {"s": "Det krævede ingen spiritusbevilling, og tyskerne kunne ikke forhindre dansksindede taler og sange hen over det veldækkede kagebord.", "src": "2023s L1", "m": [4, 11]}, {"s": "Uanset hvad man gør som nyuddannet jobsøgende, så er Kamilla og René enige om, at det for mange kræver hårdt arbejde at få sit første job.", "src": "2022s L2", "m": [96, 102]}, {"s": "Udskifter man ofte kontoret med en hjemmearbejdsplads, skal man dog være opmærksom på, at det kræver det rigtige udstyr i hjemmet.", "src": "2022s L2", "m": [94, 100]}, {"s": "Han mener derfor, at hjemmearbejde kræver en ledelse, der er ekstra opmærksom.", "src": "2022s L2", "m": [35, 41]}, {"s": "Prøver, der trækker ud, eller sceneteknik, der kræver akut justering, kan bevirke, at vi ikke kan gå den vante rute.", "src": "2021s L1", "m": [47, 53]}, {"s": "Formidlingen adskiller sig ved, at indholdet ikke kræver, at modtagerne har særlige forudsætninger eller evner ud over det at være nysgerrige og interesserede mennesker.", "src": "2020v L1", "m": [50, 56]}], "at_fremkalde": [{"s": "Det kan nemlig fremkalde mekanismer, der ligner dem, man ser hos folk, der er afhængige af spil.", "src": "2016v L2", "m": [15, 24]}], "at_skyldes": [{"s": "Forskere mener, at det blandt andet skyldes egne og andres forventninger til dem.", "src": "2021v L2", "m": [36, 43]}, {"s": "Måden at deltage i fællesskaber på er anderledes, hvilket ikke mindst skyldes den teknologiske udvikling, så folk nu bruger meget tid på nettet, især de sociale medier.", "src": "2020v L1", "m": [70, 77]}, {"s": "Usikkerhed i ansættelsen Når ansatte i korte midlertidige ansættelser generelt foretrækker en længerevarende fastansættelse, skyldes det ønsket om mere tryghed i deres arbejdsliv.", "src": "2020v L2", "m": [125, 132]}, {"s": "Det skyldes, at virksomhederne i fremtiden må rekruttere flere især højt specialiserede medarbejdere fra udlandet.", "src": "2020s L2", "m": [4, 11]}, {"s": "Det positive bidrag skyldes, at højtuddannede indvandrere typisk får en høj løn.", "src": "2019v L2", "m": [20, 27]}, {"s": "Kvindernes engagement skyldes ikke mindst, at organisationerne bag de seneste indsamlinger har haft fokus på områder som moderskab og børn.", "src": "2019s L2", "m": [22, 29]}, {"s": "Han mener, at det stigende stressniveau blandt andet skyldes, at mange virksomheder ikke er dygtige nok til at praktisere selvledelse.", "src": "2017s L2", "m": [53, 60]}, {"s": "Denne sundhedsmæssige effekt opnår Michael Mosley uden at være på en traditionel slankekur, og han mener, det skyldes, at kroppen får tid til at reparere sine celler.", "src": "2014v L2", "m": [110, 117]}], "at_afvise": [{"s": "Det vil jeg slet ikke afvise.", "src": "2023s L2", "m": [22, 28]}], "et_formål_med": [{"s": "Formålet med bymidterne skal altså tænkes bredere end i den klassiske handelsby, hvor det primært var handlen, der fik folk ind til centrum.", "src": "2024s L2", "m": [0, 12]}, {"s": "Det primære formål med Folkemødet er at styrke det danske demokrati ved at mindske afstanden og øge tilliden mellem borgere og beslutningstagere.", "src": "2023v L1", "m": [12, 22]}, {"s": "Formålet med undersøgelsen var at finde ud af, hvor mange nyuddannede med et handicap, der er tilknyttet arbejdsmarkedet, og på hvilken måde de er det.", "src": "2023s L2", "m": [0, 12]}, {"s": "Formålet med lejren var at være et forum for politiske drøftelser og et frirum for alle kvinder.", "src": "2022s L1", "m": [0, 12]}, {"s": "Produkterne er i vid udstrækning produceret og forædlet på øerne med det formål at skabe lokal identitet og jobmuligheder på øerne.", "src": "2022s L1", "m": [73, 79]}, {"s": "Endelig adskiller folkeoplysende aktiviteter sig ved, at det egentlige formål er, at alle involverede skal blive klogere på at leve deres liv engageret i forhold til medmennesket og samfundet.", "src": "2020v L1", "m": [71, 77]}, {"s": "Formålet med deltagelsen i et folkeoplysende kursus er, at det skal give mulighed for at udvikle en lang række forskellige kompetencer, der ikke nødvendigvis hænger sammen med selve faget.", "src": "2020v L1", "m": [0, 12]}, {"s": "Formålet med undervisningen er at sprede viden om og forståelse for det danske samfund og den danske kultur og gøre danskerne til aktive medborgere.", "src": "2020v L1", "m": [0, 12]}], "problemer_med": [{"s": "Ifølge fagforeningen HK kan netop en fire-dages arbejdsuge være et godt værktøj til at løse nogle af disse problemer.", "src": "2024s L2", "m": [107, 116]}, {"s": "Men ofte viser det sig, at frygten er ubegrundet. ”Det voldte faktisk ikke de store problemer, da det kom til stykket.", "src": "2023v L2", "m": [84, 93]}, {"s": "De svarede på vores spørgsmål, og det var også dem, der bakkede os op, da vi fik problemer med at optage boliglån.", "src": "2022s L1", "m": [81, 94]}, {"s": "Han mener, at man bør se mere på de problemer, de unge har, i stedet for at skyde skylden på de sociale medier som årsag til problemerne.", "src": "2021v L2", "m": [36, 45]}, {"s": "Når de kommer hjem, kan de nemlig risikere at få problemer med at få merit for deres fag.", "src": "2020s L2", "m": [49, 62]}, {"s": "Der er aldrig problemer med at komme ind eller ud med en kørestol.", "src": "2019v L1", "m": [14, 27]}, {"s": "Det gik dog ikke helt, som hun havde forventet på studiet, for hun fik problemer med at følge med.", "src": "2019s L2", "m": [71, 84]}, {"s": "Ved at tilbyde vejledning kan de hjælpe de studerende med deres problemer, før de bliver for store.", "src": "2019s L2", "m": [64, 73]}], "effekten_af": [{"s": "Effekten af den gratis adgang var en betydelig stigning i antallet af gæster.", "src": "2020s L1", "m": [0, 11]}], "indflydelse_på": [{"s": "De trives begge med at have indflydelse og ansvar for medarbejdere – også selvom det ikke altid er lige let.", "src": "2023v L2", "m": [28, 39]}, {"s": "Det indebærer stor frihed og meget indflydelse, men det indebærer også ofte en vis usikkerhed og lange arbejdsdage.", "src": "2022v L2", "m": [35, 46]}, {"s": "Frem for at arbejde 37 timer om ugen for en arbejdsgiver et sted, hvor man måske ikke har særlig meget indflydelse eller selvbestemmelse, vil de gerne være iværksættere.", "src": "2022v L2", "m": [103, 114]}, {"s": "I flere kommuner ønsker man imidlertid at kunne tilbyde de ansatte større indflydelse på deres arbejdsliv.", "src": "2021v L2", "m": [74, 88]}, {"s": "Altså har den danske model indflydelse på jobomsætningen.", "src": "2020v L2", "m": [27, 41]}, {"s": "Modellen har dog også indflydelse på, hvordan det generelt opfattes at blive fyret.", "src": "2020v L2", "m": [22, 36]}, {"s": "Men hun er ikke nervøs for, at det vil få en ødelæggende indflydelse.", "src": "2016v L2", "m": [57, 68]}, {"s": "På studieretningsforløbet har du med dit valg af studieret ningsfag og valgfag en vis indflydelse på, hvordan din ud dannelse bliver.", "src": "2015s L1", "m": [86, 100]}], "da": [{"s": "Hun er begyndt at løbe, da det giver hende energi.", "src": "2019s L2", "m": [24, 26], "sense": "because"}, {"s": "De anbefalede tures numre er ikke skiltet i naturen, da de følger de nationale og regionale ruter.", "src": "2023v L1", "m": [53, 55], "sense": "because"}, {"s": "Ingen ved ganske vist, hvordan vikingernes mad smagte, da der ikke er bevaret opskrifter fra den tid.", "src": "2022v L1", "m": [55, 57], "sense": "because"}, {"s": "Da det er uddannede tjenere, der serverer, kan man som gæst være sikker på en professionel håndtering af mad, vin og gæster.", "src": "2021v L1", "m": [0, 2], "sense": "because"}, {"s": "Da jeg var barn, gik jeg tit tur sammen med min bedstefar, der gik ved hjælp af sin elskede stok.", "src": "2024s L1", "m": [0, 2], "sense": "when"}, {"s": "Men vi blev positivt overraskede, da vi besøgte Fejø.", "src": "2022s L1", "m": [34, 36], "sense": "when"}, {"s": "Han slog sig ikke alvorligt, da han faldt, men han satte sig lettere chokeret på en stol.", "src": "2017s L2", "m": [29, 31], "sense": "when"}, {"s": "Da Andrei Vasilescu boede i Rumænien, arbejdede han med drift og udvikling af it-systemer.", "src": "2019v L2", "m": [0, 2], "sense": "when"}], "idet": [{"s": "Her var resultatet lige omvendt, idet 80 procent stemte for at forblive tysk.", "src": "2023s L1", "m": [33, 37]}, {"s": "Der er altid prøve i Almen Studieforberedelse og Studieretningsprojektet, mens de øvrige eksaminer i fagene vælges ved lodtrækning, idet såvel mundtlige som eventuelle skriftlige prøver indgår i lodtrækningen.", "src": "2016v L1", "m": [132, 136]}, {"s": "Bemærk venligst, at der tages forbehold for ændringer, idet vore projekter løbende udvikles og idet priserne på vore projekter er genstand for vedvarende ændringer.", "src": "2016s L1", "m": [55, 59]}], "for": [{"s": "Den forholdsvis lave søgning til de tekniske bacheloruddannelser er et problem, for der er faktisk mangel på unge med den type uddannelse.", "src": "2023v L2", "m": [80, 83], "sense": "because"}, {"s": "At kalde det et ’kaffebord’ er måske lidt misvisende, for det er i langt højere grad kagerne end kaffen, der stjæler billedet.", "src": "2023s L1", "m": [54, 57], "sense": "because"}, {"s": "Og så går jeg også til dans på øen, for man lærer bedst et nyt sprog ved at komme ud blandt lokale.", "src": "2022s L1", "m": [36, 39], "sense": "because"}, {"s": "Det gik dog ikke helt, som hun havde forventet på studiet, for hun fik problemer med at følge med.", "src": "2019s L2", "m": [59, 62], "sense": "because"}, {"s": "Hans forældre mente imidlertid, at det ville være bedst for ham at flytte, for de var ikke tilfredse med undervisningen.", "src": "2016s L2", "m": [75, 78], "sense": "because"}, {"s": "Jeg har ikke evig dårlig samvittighed, når jeg spiser noget forbudt, for jeg må jo spise helt normalt på fem af ugens syv dage.", "src": "2014v L2", "m": [69, 72], "sense": "because"}], "på_grund_af": [{"s": "I gamle dage valfartede folk til området på grund af Helligdomskilden, som blev tillagt en helbredende kraft.", "src": "2023v L1", "m": [41, 52]}, {"s": "Ikke blot på grund af jobmulighederne, men også fordi nyuddannede med en teknisk uddannelse ofte får en højere løn end nyuddannede med en humanistisk uddannelse.", "src": "2023v L2", "m": [10, 21]}, {"s": "De flyttede til Tønder for at spare tid på transport og på grund af de lavere boligpriser.", "src": "2023s L1", "m": [56, 67]}, {"s": "Det er ubetinget et sted, der er værd at besøge på grund af atmosfæren og muligheden for at møde folk, der er interesserede i film.", "src": "2021v L1", "m": [48, 59]}, {"s": "unik – det kan handle om den enkelte genstands særlige historie, eller det kan være på grund af dens videnskabelige betydning.", "src": "2020s L1", "m": [84, 95]}, {"s": "Dreyer, som siden er blevet kendt som en af Danmarks allerstørste instruktører på grund af sin særlige kunstneriske stil.", "src": "2019v L1", "m": [79, 90]}, {"s": "de studerende springer fra deres studier er, at de har svært ved at følge med på grund af niveauet og derfor ikke føler sig dygtige nok.", "src": "2019s L2", "m": [78, 89]}, {"s": "Det er et argument, der i høj grad støttes af kvinder, som ikke vil vælges til et job på grund af deres køn.", "src": "2018s L2", "m": [86, 97]}], "som_følge_af": [{"s": "I et stort studie fra to amerikanske byer (Portland og Houston) tilkendegav folk, at de ikke havde ændret adfærd som følge af klimaproblemerne.", "src": "2021s L2", "m": [113, 125]}, {"s": "Som følge af denne krise, var oplysningsforbundene i midten af 00’erne nødt til at tænke nyt for at sikre, at økonomien hang sammen.", "src": "2020v L1", "m": [0, 12]}, {"s": "Som følge heraf er virksomhedens mål at sikre og opdatere de højeste og mest praktiske standarder for sundhed og sikkerhed i alle virksomhedens aktiviteter.", "src": "2018s L1", "m": [0, 9]}], "derved": [{"s": "Den ønsker derved at tiltrække nye typer af festivaldeltagere.", "src": "2019s L1", "m": [11, 17]}, {"s": "Din temaleder eller en af dine vejledere vil fungere som tutor og derved følge og rådgive dig gennem dit uddannelsesforløb.", "src": "2015s L1", "m": [66, 72]}], "af_den_grund": [{"s": "Af den grund har landsdelen på flere områder en historie, som afviger fra resten af Danmarks.", "src": "2023s L1", "m": [0, 12]}], "så": [{"s": "Året rundt er der kun otte grader i kalkgruberne, så det anbefales, at man har varmt tøj på.", "src": "2024s L1", "m": [50, 52], "sense": "result"}, {"s": "Men forsamlingshusene fik ikke alkoholbevilling, så der kom kaffe på bordet.", "src": "2023s L1", "m": [49, 51], "sense": "result"}, {"s": "Restauranten er velbesøgt, så det er en god ide at reservere bord.", "src": "2019v L1", "m": [27, 29], "sense": "result"}, {"s": "Der er ingen bilparkering i forbindelse med NorthSide, så man må gå, cykle eller tage offentlig transport, hvis man vil til festival.", "src": "2019s L1", "m": [55, 57], "sense": "result"}, {"s": "Kom i god tid, så du kan nyde vores smukke bygning indefra en halv time før forestillingens start.", "src": "2021s L1", "m": [15, 17], "sense": "purpose"}, {"s": "Der skal laves regnskab, så man har helt styr på indtægter og udgifter.", "src": "2022v L2", "m": [25, 27], "sense": "purpose"}, {"s": "Samtidig modtager mange voksne, både danskere og flygtninge/indvandrere, undervisning hos AOF, så de kan lære at læse det, som de har brug for i deres hverdag.", "src": "2020v L1", "m": [95, 97], "sense": "purpose"}, {"s": "Vi vil sammen arbejde med mønstre og tilrette dem, så de passer godt til dig.", "src": "2020v L1", "m": [51, 53], "sense": "purpose"}], "hvilket_betyder_at": [{"s": "Blandt andet kører man på mange dele af ruten på det nedlagte jernbanespor midt i landskabet, langt væk fra den øvrige trafik, hvilket betyder, at børneruten her er meget trafiksikker.", "src": "2023v L1", "m": [127, 146]}], "endvidere": [{"s": "Brosten i plænen omkring kirken markerer endvidere, hvor den gamle kirkes tilbygninger lå.", "src": "2024s L1", "m": [41, 50]}, {"s": "For disse scener gælder det endvidere, at dørene ind til selve teatersalen først åbner 10 minutter inden forestillingen starter.", "src": "2021s L1", "m": [28, 37]}, {"s": "Timeantallet vil endvidere variere afhængigt af travlhed og Universes åbningstider.", "src": "2018s L1", "m": [17, 26]}, {"s": "Endvidere skal du selv dække udgifterne til eventuelle studierejser m.m.", "src": "2015v L1", "m": [0, 9]}, {"s": "Her kan du endvidere tilmelde dig et skoleforløb via vores online tilmeldingsformular.", "src": "2015v L1", "m": [11, 20]}, {"s": "Endvidere er forarbejdning, præsentation og tilberedning af specialiteter en væsentlig del af en fiskehandlers arbejde.", "src": "2015v L1", "m": [0, 9]}, {"s": "Skolen har endvidere en Flex-afdeling, der er et undervisningstilbud med individuelt sammensatte undervisningsforløb og lektiehjælp.", "src": "2013s L1", "m": [11, 20]}], "ydermere": [{"s": "Man kan ydermere regne med den sidegevinst, at de i deres nye land er med til at sprede budskabet om, at Danmark er et godt land at arbejde i.", "src": "2019v L2", "m": [8, 16]}], "tilmed": [{"s": "Tilmed begyndte han at få ondt i det ene knæ, da der manglede ca. 50 km, så da han derefter skulle gennemføre konkurrencens sidste del, maratonløbet, var der ikke mange kræfter tilbage.", "src": "2015v L2", "m": [0, 6]}], "samt": [{"s": "Her kan man tage tilbage i tiden og opleve kunsten samt spændende skiftende særudstillinger.", "src": "2024s L1", "m": [51, 55]}, {"s": "Museets udstillinger findes i syv forskellige bygninger samt i parken og skoven, der forbinder dem.", "src": "2024s L1", "m": [56, 60]}, {"s": "Det samme gælder det mere end 1,4 milliard år gamle grundfjeld, der er synligt på store dele af øen samt på øgruppen Ertholmene nordøst for Bornholm.", "src": "2023v L1", "m": [100, 104]}, {"s": "Derudover er øen karakteriseret ved en stor mangfoldighed af flagermus samt et fravær af de fleste danske rovdyr.", "src": "2023v L1", "m": [71, 75]}, {"s": "Nedbøren påvirkes af havet samt det kuperede terræn, der bidrager til bygedannelsen.", "src": "2023v L1", "m": [27, 31]}, {"s": "Alle lovlige danske organisationer, foreninger, virksomheder m.fl. samt private, der lever op til Folkemødets principper for events, har mulighed for at blive optaget i Folkemødets program.", "src": "2023v L1", "m": [67, 71]}, {"s": "Vi har samlet 8 anbefalede ture samt 1 for børn og 2 for mountainbikere.", "src": "2023v L1", "m": [32, 36]}, {"s": "En måned senere var der afstemning i den sydlige zone, der blandt andet omfattede Flensborg samt øerne Sylt og Föhr.", "src": "2023s L1", "m": [92, 96]}], "ikke_kun_men_også": [{"s": "Men det er ikke kun i fodbold, Viborg klarer sig rigtigt godt som sportsby.", "src": "2024s L1", "m": [11, 19]}, {"s": "Jeg ser nogle gange deres kampe, dog kun på tv, så det er ikke kun fodbold, jeg følger.", "src": "2024s L1", "m": [58, 66]}, {"s": "Så det er ikke kun mig, der er vild med Borgvold, det er børnene også.", "src": "2024s L1", "m": [10, 18]}, {"s": "Men det er måske ikke kun virksomhedernes organisering af arbejdsugen, der kommer til at forandre sig.", "src": "2024s L2", "m": [17, 25]}, {"s": "Det er dog ikke kun politisk, der kan gøres en indsats.", "src": "2024s L2", "m": [11, 19]}, {"s": "Klassisk musik Koncerter bliver afholdt flere forskellige steder – i nogle af vore smukke kirker, men også på andre mere usædvanlige spillesteder.", "src": "2023v L1", "m": [98, 106]}, {"s": "Men også i dette kulturspor kan lokale kunstnere fint gøre sig gældende med koncerter rundt omkring på øen, hvor de viser kvaliteten af det bornholmske musikliv.", "src": "2023v L1", "m": [0, 8]}, {"s": "Ikke blot på grund af jobmulighederne, men også fordi nyuddannede med en teknisk uddannelse ofte får en højere løn end nyuddannede med en humanistisk uddannelse.", "src": "2023v L2", "m": [39, 47]}], "både_og": [{"s": "Kongehyldningsmonumentet af bronze og granit forestiller Dronning Margrethe I og Erik af Pommern.", "src": "2024s L1", "m": [35, 37]}, {"s": "Det var en slags domstol, der traf afgørelser om krig og fred, og som kunne idømme folk straffe.", "src": "2024s L1", "m": [54, 56]}, {"s": "En række statslige institutioner kom til byen, blandt andet en garnison og et sindssygehospital.", "src": "2024s L1", "m": [72, 74]}, {"s": "I dag er industriens største branche jern- og metalindustrien, men servicesektoren er blevet endnu vigtigere.", "src": "2024s L1", "m": [43, 45]}, {"s": "Viborg Domkirke står både stærkt i bybilledet og i Viborg bys lange historie.", "src": "2024s L1", "m": [21, 48]}, {"s": "I vådt puds tryllede de med deres kalkfarver, og freskerne taler et sprog, som alle kan forstå.", "src": "2024s L1", "m": [46, 48]}, {"s": "Her kan man tage tilbage i tiden og opleve kunsten samt spændende skiftende særudstillinger.", "src": "2024s L1", "m": [33, 35]}, {"s": "Kunstneren Joakim Skovgaard har udsmykket Viborg Domkirke, og museet er oprettet for at hædre ham og hans familie, hvoraf mange var kunstnere.", "src": "2024s L1", "m": [59, 61]}], "tilsvarende": [{"s": "Om foråret og i den tidlige sommer er Østersøen derimod kold og nedbørsmængderne tilsvarende små.", "src": "2023v L1", "m": [81, 92]}, {"s": "Indehavere af et officielt ledsagerkort, udstedt af Danske Handicaporganisationer, Dansk Blindesamfund eller tilsvarende organisation fra et EU land, tilbydes en gratis (+ serviceomkostninger) ledsagerbillet til Det Kongelige Teaters egne forestillinger.", "src": "2021s L1", "m": [109, 120]}, {"s": "Specialpædagogisk støtte (SPS) Har du en funktionsnedsættelse eller tilsvarende svære vanskeligheder (ordblind, blind, svagtsynet, døv, hørehæmmet, bevægelseshæmmet eller psykiske vanskeligheder), kan du få rådgivning, vejledning og hjælp via SPS.", "src": "2016v L1", "m": [68, 79]}, {"s": "Han mener, at det er vigtigt, at børn også i børnehaven arbejder med tablets og tilsvarende teknologi.", "src": "2016v L2", "m": [80, 91]}, {"s": "Ved enkeltfagsundervisningen gælder, at du tidligst kan blive optaget et år efter, at du har afsluttet folkeskolens 9. eller 10. klasse eller modtaget tilsvarende undervisning.", "src": "2015s L1", "m": [151, 162]}], "ligesom": [{"s": "Derfor arbejder Sammenslutningen af Danske Småøer for, at de små ø-skoler bevares, ligesom der arbejdes for at få etableret passende lægedækning, så utryghed ikke tvinger folk til at flytte fra øerne.", "src": "2022s L1", "m": [83, 90]}, {"s": "Traditionelle erhverv som landbrug, håndværk, handel og fiskeri spiller stadig en vis rolle på de små øer, ligesom der er jobs inden for turismeerhvervet.", "src": "2022s L1", "m": [107, 114]}, {"s": "Inden Kamilla fik jobbet, havde hun ligesom de fleste andre nyuddannede brugt meget tid på at lære at skrive ansøgninger og CV og syntes også selv, hendes ansøgninger var gode.", "src": "2022s L2", "m": [36, 43]}, {"s": "De følger derfor årstidernes gang ligesom landbruget.", "src": "2021v L1", "m": [34, 41]}, {"s": "Det er tydeligt, at skuespillerne ikke altid kan spille ligesom personerne fra filmen, men når det er en musical, så synes jeg, at det vigtigste er, hvordan skuespillerne synger.", "src": "2021s L1", "m": [56, 63]}, {"s": "Selvom flere unge ser korte midlertidige ansættelser som led i deres karriere, ønsker de fleste unge dog en længerevarende fastansættelse ligesom deres ældre kolleger.", "src": "2020v L2", "m": [138, 145]}, {"s": "Per, der læser til lærer på Københavns Professionshøjskole, valgte ligesom Eva at studere et halvt år i Cardiff, dog ikke på samme universitet.", "src": "2020s L2", "m": [67, 74]}, {"s": "På højskolen mødte jeg fagligt dygtige lærere og et dejligt inkluderende miljø, men det, jeg var mest glad for, var faktisk, at de andre højskoleelever elskede at diskutere ligesom jeg selv.", "src": "2018v L1", "m": [173, 180]}], "sammenlignet_med": [{"s": "Danmark er sammenlignet med mange andre lande et trygt og velfungerende velfærdssamfund.", "src": "2019v L2", "m": [11, 27]}], "heller_ikke": [{"s": "Butikkerne har nemlig især i de mindre byer, hvor der heller ikke er storcentre, en vigtig rolle for folks psykiske og fysiske velvære.", "src": "2024s L2", "m": [54, 65]}, {"s": "Men det er heller ikke meningen.", "src": "2023v L1", "m": [11, 22]}, {"s": "Heller ikke selvom de både har en god uddannelse og har lyst til at gå i gang med en karriere.", "src": "2023s L2", "m": [0, 11]}, {"s": "Odense Havn var heller ikke så vigtig mere.", "src": "2021v L1", "m": [16, 27]}, {"s": "Er der en løsning, der ikke involverer, at staten skal regulere, hvad vi spiser, og som heller ikke lægger hele ansvaret over på forbrugeren?", "src": "2021s L2", "m": [88, 99]}, {"s": "Selve undervisningen blev jeg bestemt heller ikke skuffet over, for underviseren er meget dygtig.", "src": "2020v L1", "m": [38, 49]}, {"s": "Det er heller ikke alle aftenskoler, der holder lærermøder – for det kan blandt andet være svært at finde et tidspunkt, hvor alle skolens undervisere kan mødes.", "src": "2020v L1", "m": [7, 18]}, {"s": "Man har måske heller ikke styr på den elektroniske udvikling og hvilke værktøjer, der måske kan gøre ens undervisning endnu bedre.", "src": "2020v L1", "m": [14, 25]}], "hverken_eller": [{"s": "Her findes også bænke og borde, hvor man kan nyde sin medbragte mad, mens man lytter til fuglene eller den brusende Gudenå.", "src": "2024s L1", "m": [97, 102]}, {"s": "Det er en kulisse for shoppingoplevelser, som hverken nettet eller et moderne shoppingcenter kan konkurrere med.", "src": "2024s L2", "m": [46, 66]}, {"s": "Øens lange kystlinje kan også opleves fra fx havkajak, og fra kysten eller fra båd kan man teste fiskelykken på Østersøens mange havørreder.", "src": "2023v L1", "m": [69, 74]}, {"s": "I stedet for et sideskib har rundkirken en central kerne, der enten er rund eller ottekantet.", "src": "2023v L1", "m": [76, 81]}, {"s": "Men der er ikke tale om rejsebeskrivelse af hverken øen, himlen eller havet omkring Bornholm, men derimod om en fantasifuld fortælling fortalt af en til tider ret vidtløftig fortællerstemme.", "src": "2023v L1", "m": [44, 69]}, {"s": "Eller at man har en ubændig trang til at binde andre en røverhistorie på ærmet.", "src": "2023v L1", "m": [0, 5]}, {"s": "Det er karakteristisk for romanen, at dens mange fortællinger godt kunne være virkelige eller tage udgangspunkt i rigtige begivenheder.", "src": "2023v L1", "m": [88, 93]}, {"s": "Den stilistik, som romanen forsøger at efterligne, er nemlig den, der hersker i den mundtlige fortælling, i anekdoten eller skrønen.", "src": "2023v L1", "m": [118, 123]}], "men": [{"s": "Byen hed ikke oprindeligt Viborg men Vibjerg, der betyder ’det hellige sted på bakken’.", "src": "2024s L1", "m": [33, 36]}, {"s": "Viborg blev i middelalderen domkirkeby, men var allerede tilbage i vikingetiden et religiøst mødested for hele Jylland.", "src": "2024s L1", "m": [40, 43]}, {"s": "Desuden havde byen god indtjening på studeeksport, men byens placering inde i landet var et permanent problem.", "src": "2024s L1", "m": [51, 54]}, {"s": "I dag er industriens største branche jern- og metalindustrien, men servicesektoren er blevet endnu vigtigere.", "src": "2024s L1", "m": [63, 66]}, {"s": "Men det er også den eneste gang, Sven ikke har været med, og vi regner med at være med i mange år endnu.", "src": "2024s L1", "m": [0, 3]}, {"s": "Men så blev jeg tømrer, og da jeg fik mit eget firma, stoppede jeg.", "src": "2024s L1", "m": [0, 3]}, {"s": "Nu er jeg pensionist og arbejder ikke længere, men interessen for fodbold har jeg stadig.", "src": "2024s L1", "m": [47, 50]}, {"s": "Men det er ikke kun i fodbold, Viborg klarer sig rigtigt godt som sportsby.", "src": "2024s L1", "m": [0, 3]}], "dog": [{"s": "Jeg ser nogle gange deres kampe, dog kun på tv, så det er ikke kun fodbold, jeg følger.", "src": "2024s L1", "m": [33, 36]}, {"s": "Det kan selvfølgelig virke lidt afskrækkende.” Der er dog oftest noget andet på spil, der vejer tungere.", "src": "2024s L2", "m": [54, 57]}, {"s": "Der er dog stadig en vis modstand blandt visse arbejdsgivere mod en fire-dages arbejdsuge.", "src": "2024s L2", "m": [7, 10]}, {"s": "Det er dog ikke kun politisk, der kan gøres en indsats.", "src": "2024s L2", "m": [7, 10]}, {"s": "En stor del af området er dog fredet og bør derfor ikke benyttes til klatring.", "src": "2023v L1", "m": [26, 29]}, {"s": "Det er dog lettere sagt end gjort.", "src": "2023v L2", "m": [7, 10]}, {"s": "Man kan dog tjekke kvaliteten hos uafhængige testvirksomheder, hvor man kan læse gratis analyser og anmeldelser af blandt andet de antivirusprogrammer, man kan finde på nettet.", "src": "2023v L2", "m": [8, 11]}, {"s": "Det var dog ikke det smarteste træk.", "src": "2023s L1", "m": [8, 11]}], "mens": [{"s": "Her findes også bænke og borde, hvor man kan nyde sin medbragte mad, mens man lytter til fuglene eller den brusende Gudenå.", "src": "2024s L1", "m": [69, 73], "sense": "time"}, {"s": "Midt i det hele står den 25-årige Nancy, som arbejder på et bosted for udsatte, mens hun går på HF.", "src": "2023v L1", "m": [80, 84], "sense": "time"}, {"s": "Forældrene kan ikke opdrage deres børn, mens børnene er i skole.", "src": "2016s L2", "m": [40, 44], "sense": "time"}, {"s": "Mens du er på skolen, kan du vælge at bo på skolehjemmet.", "src": "2013s L1", "m": [0, 4], "sense": "time"}, {"s": "I zone 1 var der tydeligt dansk flertal, mens der i zone 2 var tysk flertal.", "src": "2023s L1", "m": [41, 45], "sense": "contrast"}, {"s": "Nogle træffer små beslutninger, mens andre lægger hele deres livsstil om.", "src": "2021s L2", "m": [32, 36], "sense": "contrast"}, {"s": "En undersøgelse kan pege på, at mobiltelefoner ikke er skadelige for helbredet, mens en anden kan vise det modsatte.", "src": "2020s L2", "m": [80, 84], "sense": "contrast"}, {"s": "Nogle lande har ladet sig påvirke af den vestlige verden, mens andre lande har en stærk østlig identitet.", "src": "2016s L1", "m": [58, 62], "sense": "contrast"}], "tværtimod": [{"s": "Han føler tværtimod, at han er skabt til noget stort.", "src": "2023v L1", "m": [10, 19]}, {"s": "Det betyder dog ikke, at hun har fortrudt et øjeblik – tværtimod: Det var det helt rigtige.", "src": "2020v L2", "m": [55, 64]}, {"s": "Formanden for Bibliotekarforbundet, Pernille Drost, peger tværtimod på, at der er tale om en afvikling.", "src": "2014s L2", "m": [58, 67]}], "i_modsætning_til": [{"s": "I modsætning til nettet og storcentrene rummer mange byer gamle, smukke huse og en historie, der går langt tilbage i tiden.", "src": "2024s L2", "m": [0, 16]}, {"s": "Derfor forekom sult og sygdom stort set ikke i Frøslevlejren – i modsætning til i andre tyske lejre.", "src": "2023s L1", "m": [63, 79]}, {"s": "Derfor valgte han til sidst at starte sit eget snedkerværksted. ”I modsætning til de fleste andre værksteder, satser jeg ikke på nye møbler.", "src": "2022v L2", "m": [65, 81]}, {"s": "Kurserne afsluttes i modsætning til i det formelle uddannelsessystem ikke med en eksamen efter endt kursus.", "src": "2020v L1", "m": [19, 35]}, {"s": "De kan blandt andet relativt nemt ansætte og fyre medarbejdere i modsætning til i mange andre lande, hvor der er strengere regler.", "src": "2020v L2", "m": [63, 79]}, {"s": "I modsætning til de kortere løb er mændene klart mere aktive end kvinderne i de længere løb og til ironman.", "src": "2015v L2", "m": [0, 16]}], "i_stedet_for": [{"s": "I stedet for et sideskib har rundkirken en central kerne, der enten er rund eller ottekantet.", "src": "2023v L1", "m": [0, 12]}, {"s": "Og afdelingen gik jo ikke i stå, fordi jeg trak mig lidt og i stedet bad medarbejderne klare flere opgaver selv.", "src": "2023v L2", "m": [60, 68]}, {"s": "Det var således ikke tilladt at nyde alkohol, fx den traditionelle kaffepunch, så danskerne begyndte i stedet at mødes til kaffe- og kagebord.", "src": "2023s L1", "m": [101, 109]}, {"s": "Da intet forsamlingshus havde kapacitet til at lave kager til så mange mennesker, medbragte deltagerne i stedet for selv kager til et fælles kaffebord.", "src": "2023s L1", "m": [103, 115]}, {"s": "Hun fik i stedet et job som SoMe-redaktør på et stort forlag i København.", "src": "2022s L2", "m": [8, 16]}, {"s": "Anne Lund medgiver, at selve ordet ’personlighedstest’ er uheldigt. ”Man burde kalde det en personlighedsprofil i stedet.", "src": "2022s L2", "m": [112, 120]}, {"s": "I stedet for at få karakterer har eleverne fået en feedback fra læreren med fokus på, hvor eleverne har udviklet sig i de forskellige fag.", "src": "2021v L2", "m": [0, 12]}, {"s": "Han mener, at man bør se mere på de problemer, de unge har, i stedet for at skyde skylden på de sociale medier som årsag til problemerne.", "src": "2021v L2", "m": [60, 72]}], "på_den_ene_side_på_den_anden_side": [{"s": "De daglige ture med Kvik i skoven på den anden side af vejen er næsten det hele værd,” siger Lars og fortsætter: ”Vi har også mødt mange nye mennesker.", "src": "2018v L2", "m": [34, 51]}, {"s": "På den anden side kan der også være en karrieremæssig fordel ved at flytte med.", "src": "2018v L2", "m": [0, 17]}, {"s": "Men på den anden side havde vi et godt fællesskab i min gamle klasse.", "src": "2016s L2", "m": [4, 21]}], "skønt": [{"s": "Det er skønt, når man bor i lejlighed, at der er større udearealer, hvor børnene kan brænde noget energi af.", "src": "2024s L1", "m": [7, 12]}, {"s": "Det var en super god oplevelse, for der er skønt og hyggeligt i bøgeskoven i Skanderborg.", "src": "2019s L1", "m": [43, 48]}], "ikke_desto_mindre": [{"s": "Ikke desto mindre er en offensiv markedsføring stadig en del af forbundenes virkelighed i dag, bl.a. på sociale medier.", "src": "2020v L1", "m": [0, 17]}], "ganske_vist": [{"s": "Ingen ved ganske vist, hvordan vikingernes mad smagte, da der ikke er bevaret opskrifter fra den tid.", "src": "2022v L1", "m": [10, 21]}], "trods_på_trods_af": [{"s": "På trods af et større budget og stjerneskuespillere fra Hollywood, så formåede filmen ikke at begejstre publikum og anmeldere på samme måde, som det danske forlæg havde gjort det.", "src": "2019v L1", "m": [0, 11]}, {"s": "Der er en lang række højskoler, som på trods af navnet ikke er folkehøjskoler.", "src": "2018v L1", "m": [36, 47]}, {"s": "Trods de mange nye tilbud falder udlånet på bibliotekerne overalt i Danmark – også i Århus.", "src": "2014s L2", "m": [0, 5]}], "hvis": [{"s": "Det anbefales, at man bruger en lommelygte, hvis man vil gå på opdagelse i de mørke minegange.", "src": "2024s L1", "m": [44, 48]}, {"s": "Der er konkurrence om de kvalificerede medarbejdere, og undersøgelser viser, at medarbejderne bliver mere loyale over for virksomheden, hvis de ikke skal arbejde så mange timer.", "src": "2024s L2", "m": [136, 140]}, {"s": "Hvis de for eksempel ikke har mulighed for at have så mange varer på lager i butikken, kan de tilbyde at fremskaffe dem inden for 24 timer og levere dem til døren.", "src": "2024s L2", "m": [0, 4]}, {"s": "De kan også tilbyde samme pris som en netbutik, hvis den fysiske butik ikke umiddelbart matcher den pris man kan få online.", "src": "2024s L2", "m": [48, 52]}, {"s": "Nancy er noget så eksotisk som en dansk roman om undergang, hvis handling udspiller sig på Bornholm og kombinerer mytologi og hverdagsrealisme: En mystisk tåge lægger sig pludselig om Bornholm.", "src": "2023v L1", "m": [60, 64]}, {"s": "Det er blevet sagt, at man som ny leder hurtigt må lære at svømme, hvis man ikke vil synke til bunds.", "src": "2023v L2", "m": [67, 71]}, {"s": "På nettet er der hackere fra hele verden, der er parate til at misbruge alle tænkelige slags oplysninger, hvis de kan: cpr-numre, MitID, oplysninger om konti og betalingskort, firmahemmeligheder m.m.", "src": "2023v L2", "m": [106, 110]}, {"s": "Det kan alt sammen være svært at overskue, hvis man ikke er særlig it-interesseret.", "src": "2023v L2", "m": [43, 47]}], "såfremt": [{"s": "Såfremt der er ledige pladser, optager vi også kursister i august inden studiestart.", "src": "2016v L1", "m": [0, 7]}, {"s": "Mentor Såfremt UU vurderer, at du har behov for støtte for at starte og gennemføre en ungdomsuddannelse eller 10. klasse,, kan du få hjælp af en mentor.", "src": "2015s L1", "m": [7, 14]}], "medmindre": [{"s": "Tagbokse af hård plast er som udgangspunkt velkomne, medmindre personalet på dagen vurderer det anderledes.", "src": "2017v L1", "m": [53, 62]}], "for_at": [{"s": "Kunstneren Joakim Skovgaard har udsmykket Viborg Domkirke, og museet er oprettet for at hædre ham og hans familie, hvoraf mange var kunstnere.", "src": "2024s L1", "m": [81, 87]}, {"s": "Man har også mulighed for at stille sulten og slukke tørsten i den hyggelige Café Kridthuset.", "src": "2024s L1", "m": [22, 28]}, {"s": "Her mødes tusinder af mennesker som i gamle dage, hvor man kom fra hele Jylland for at handle og feste og for måske at få afgjort nogle uenigheder på Tinge.", "src": "2024s L1", "m": [80, 86]}, {"s": "Ved tilmelding har man mulighed for at bestille og købe en række tilvalg i forhold til indkvartering og forplejning.", "src": "2024s L1", "m": [32, 38]}, {"s": "I det område, hvor alle ruter starter og slutter, er der derudover hele weekenden masser af muligheder for at købe mad og drikke for dem, der ikke har forudbestilt mad hjemmefra.", "src": "2024s L1", "m": [103, 109]}, {"s": "Når Viborg spiller på hjemmebane, så er jeg altid på stadion for at støtte dem.", "src": "2024s L1", "m": [61, 67]}, {"s": "Og de er næsten lige så glade for at lege på legepladsen og skøjte på skøjtebanen, som anlægges midt i parken om vinteren.", "src": "2024s L1", "m": [30, 36]}, {"s": "Bymidterne har historisk været et sted, hvor folk mødtes på torve og markeder for at handle og blive underholdt.", "src": "2024s L2", "m": [78, 84]}], "så_at": [{"s": "Kunstneren Joakim Skovgaard har udsmykket Viborg Domkirke, og museet er oprettet for at hædre ham og hans familie, hvoraf mange var kunstnere.", "src": "2024s L1", "m": [85, 87]}, {"s": "Det anbefales, at man bruger en lommelygte, hvis man vil gå på opdagelse i de mørke minegange.", "src": "2024s L1", "m": [15, 17]}, {"s": "Året rundt er der kun otte grader i kalkgruberne, så det anbefales, at man har varmt tøj på.", "src": "2024s L1", "m": [50, 52]}, {"s": "Man har også mulighed for at stille sulten og slukke tørsten i den hyggelige Café Kridthuset.", "src": "2024s L1", "m": [26, 28]}, {"s": "En mangeårig tradition er, at der i Viborg i hærvejsugen op til og under marchen arrangeres en stor byfest på pladser og torve i den gamle, historiske by.", "src": "2024s L1", "m": [27, 29]}, {"s": "Her mødes tusinder af mennesker som i gamle dage, hvor man kom fra hele Jylland for at handle og feste og for måske at få afgjort nogle uenigheder på Tinge.", "src": "2024s L1", "m": [84, 86]}, {"s": "Ved tilmelding har man mulighed for at bestille og købe en række tilvalg i forhold til indkvartering og forplejning.", "src": "2024s L1", "m": [36, 38]}, {"s": "I det område, hvor alle ruter starter og slutter, er der derudover hele weekenden masser af muligheder for at købe mad og drikke for dem, der ikke har forudbestilt mad hjemmefra.", "src": "2024s L1", "m": [107, 109]}], "med_henblik_på": [{"s": "Den Gamle By ansætter derfor typisk ekstra timelønnet assistance i publikumsafdelingerne og på restaurationsområdet i oktober med henblik på julen.", "src": "2017s L1", "m": [126, 140]}, {"s": "Hvis vi mod forventning ikke kan efterkomme dit ønske, kontakter vi dig med alternative forslag, eller med henblik på at refundere dit depositum.", "src": "2016s L1", "m": [103, 117]}, {"s": "Diagrammet nedenfor viser dine valg- muligheder med henblik på valg af ungdomsuddannelse.", "src": "2015v L1", "m": [48, 62]}, {"s": "Derudover er der fokus på udvalgte elementer fx vejledning og afklaring om uddannelsesvalg, ekstra træning eller højere niveauer i grundfag med henblik på mulighed for videreuddannelse.", "src": "2013s L1", "m": [140, 154]}], "undtagen": [{"s": "Butikken har åbent alle dage undtagen mandag: på hverdage 9:00-22:00, lørdag 10:45-22:00 og søndag 10:45-19:30.", "src": "2019v L1", "m": [29, 37]}, {"s": "Dyrene var en fantastisk oplevelse – undtagen isbjørnen, som gemte sig.", "src": "2017v L1", "m": [37, 45]}], "frem_for": [{"s": "Pia Lehman er glad for, at hun tog springet ud i noget nyt, og at hun fandt frem til noget, hun hellere ville.", "src": "2024s L2", "m": [76, 80]}, {"s": "Vikingeskibsmuseet vil holde åbent, helt frem til det nye museum står klar.", "src": "2022v L1", "m": [41, 45]}, {"s": "Jeg rejser rundt til vikingemarkeder og vikingefestivaler, hvor jeg viser mine varer frem og fortæller om baggrunden for og produktionen af dem – og så sælger jeg dem selvfølgelig.", "src": "2022v L1", "m": [85, 89]}, {"s": "Frem for at arbejde 37 timer om ugen for en arbejdsgiver et sted, hvor man måske ikke har særlig meget indflydelse eller selvbestemmelse, vil de gerne være iværksættere.", "src": "2022v L2", "m": [0, 8]}, {"s": "Og kom helt tæt på Odense og Fyn – lige fra Oldtiden og frem til i dag – i museets udstillinger og børnemuseet Histotoriet, hvor alt må røres og prøves.", "src": "2021v L1", "m": [56, 60]}, {"s": "Det betød, at skibstransport mistede betydning, og landtransport vandt frem.", "src": "2021v L1", "m": [71, 75]}, {"s": "Dresscode Du behøver ikke finde de lange silkehandsker og butterflyen frem for at komme ind på Store Scene.", "src": "2021s L1", "m": [70, 78]}, {"s": "Samlingen omfatter musikinstrumenter fra Europa, Asien og Afrika fra bronzealderen og frem til vor tid.", "src": "2020s L1", "m": [86, 90]}], "for_eksempel_fx": [{"s": "De ti udvalgte byer har for eksempel tænkt velfærdsfunktioner som biblioteker og borgerservice ind i deres planer for nyt liv i bymidterne.", "src": "2024s L2", "m": [24, 36]}, {"s": "Hvis de for eksempel ikke har mulighed for at have så mange varer på lager i butikken, kan de tilbyde at fremskaffe dem inden for 24 timer og levere dem til døren.", "src": "2024s L2", "m": [8, 20]}, {"s": "I dag er det meste af Højlyngen forsvundet, men i fx Rutsker Højlyng kan man stadig finde små rester af det gamle bornholmske hedelandskab.", "src": "2023v L1", "m": [50, 52]}, {"s": "Øens lange kystlinje kan også opleves fra fx havkajak, og fra kysten eller fra båd kan man teste fiskelykken på Østersøens mange havørreder.", "src": "2023v L1", "m": [42, 44]}, {"s": "Det skal fx også indeholde et spamfilter, der kan sortere uønskede mails fra.", "src": "2023v L2", "m": [9, 11]}, {"s": "For eksempel er uddannelse gratis, og studerende kan få SU, og efter endt uddannelse kan man som nyuddannet også modtage dagpenge.", "src": "2023v L2", "m": [0, 12]}, {"s": "En uddannelse som filosofi udbydes fx fem steder i landet, selvom der er høj ledighed blandt nyuddannede.", "src": "2023v L2", "m": [35, 37]}, {"s": "Det gælder fx David Budtz Pedersen, professor ved Institut for Kommunikation og Psykologi på Aalborg Universitet.", "src": "2023v L2", "m": [11, 13]}], "eksempelvis": [{"s": "Arbejdsdagen kan eksempelvis blive mere fokuseret og effektiv.", "src": "2022s L2", "m": [17, 28]}, {"s": "I kan også se flere forskellige udstilling er, eksempelvis Fyn – midt i verden, Byens liv og Børnenes baggård.", "src": "2021v L1", "m": [47, 58]}, {"s": "I løbet af året afholdes der forskellige arrangementer, eksempelvis Ulddag, Morgenvækning af dyrene og Håndværkerdag.", "src": "2021v L1", "m": [56, 67]}, {"s": "Eksempelvis præsenterer Biffen Nordkraft hvert år en eller to udvalgte film gratis for foreningen.", "src": "2019v L1", "m": [0, 11]}, {"s": "Gangstierne i de anlæg, som er beregnet for gående trafik, eksempelvis ved anlæg hos lemurer og kænguruer, er grusbelagte og kan benyttes af kørestolsbrugere.", "src": "2017v L1", "m": [59, 70]}, {"s": "Der er desuden rig mulighed for at kombinere arrangementet med eksempelvis en rundvisning, ølsmagning i det historiske bryggeri, musik under middagen, skattejagter og meget mere.", "src": "2017s L1", "m": [63, 74]}, {"s": "Eksempelvis er det en god idé på forhånd at aftale, hvilken mad der skal serveres, og hvor mange retter der skal på bordet.", "src": "2016v L2", "m": [0, 11]}, {"s": "Mulighederne er mange; du kan eksempelvis arbejde på et hospital i Mexico, på et abe-rehabiliteringscenter i Argentina, eller på et center for handicappede børn i Bolivia, og meget mere.", "src": "2016s L1", "m": [30, 41]}], "især": [{"s": "I landsbyen kan man følge jernalderfolkets daglige gøremål, hvor især madlavningen tager tid.", "src": "2024s L1", "m": [65, 69]}, {"s": "Det gør byen i høj grad også i håndbold, især kvinderne har succes.", "src": "2024s L1", "m": [41, 45]}, {"s": "Jeg er især vild med Borgvold.", "src": "2024s L1", "m": [7, 11]}, {"s": "Der kommer især kunstnere inden for rytmisk musik.", "src": "2024s L1", "m": [11, 15]}, {"s": "Selvom der især spilles rytmisk musik, har vi også en gang imellem klassiske koncerter.", "src": "2024s L1", "m": [11, 15]}, {"s": "Butikkerne har nemlig især i de mindre byer, hvor der heller ikke er storcentre, en vigtig rolle for folks psykiske og fysiske velvære.", "src": "2024s L2", "m": [22, 26]}, {"s": "Da Mimi fik job og flyttede til Tønder med sin mand, Jon, var udfordringen i begyndelsen, at de især var bekymrede for, om livskvaliteten i Sønderjylland kunne leve op til deres forventninger.", "src": "2023s L1", "m": [96, 100]}, {"s": "De har sammen ansvaret for en stor afdeling i virksomheden, men får også tid til at tale om ledelse generelt, og hvad de hver især gør for at blive bedre ledere.", "src": "2023s L2", "m": [126, 130]}], "det_vil_sige_dvs": [{"s": "Det tyske mindretal opfatter sig selv som tyske nordslesvigere, det vil sige som danske statsborgere med tysk identitet og stærk forankring i den sønderjyske region.", "src": "2023s L1", "m": [64, 76]}, {"s": "Det vil sige, at man byggede fabrikker, som kunne støbe jern, og fabrikker som brugte dampmaskiner som energi til for eksempel vævemaskiner.", "src": "2021v L1", "m": [0, 12]}, {"s": "Det vil sige, at vi fordyber os i kortere tid ad gangen, i skiftende aktiviteter og i midlertidige fællesskaber, der passer ind i vores liv nu og her.", "src": "2020v L1", "m": [0, 12]}, {"s": "Det vil sige, at man fx normalt er sikret overenskomstbestemte løn- og arbejdsvilkår, hvis man er ansat i en fast stilling.", "src": "2020v L2", "m": [0, 12]}, {"s": "Det vil sige, at de udenlandske studerende set i det lange perspektiv bidrager økonomisk til det danske samfund.", "src": "2020s L2", "m": [0, 12]}, {"s": "En ansøgning om opholdstilladelse indgives i ansøgerens hjemland, normalt ved en dansk repræsentation, dvs. en ambassade eller et generalkonsulat.", "src": "2018v L1", "m": [103, 107]}, {"s": "Kursusforløbet retter sig primært mod AMUmålgruppen – dvs. personer med en uddannelsesbaggrund til og med erhvervsuddannelsesniveauet og nogen erfaring med administrative opgaver.", "src": "2018s L1", "m": [54, 58]}, {"s": "Der er brug for mere klarhed omkring, hvad det vil sige at være en dygtig topleder, og hvordan arbejdslivet kan indrettes.", "src": "2018s L2", "m": [43, 55]}], "med_andre_ord": [{"s": "De ser med andre ord ingen problemer, de ikke kan løse i fællesskab, hverken på kort eller langt sigt.", "src": "2018s L2", "m": [7, 20]}, {"s": "Med andre ord kan du ”hoppe af og på” vores projekter når det bedst passer dig.", "src": "2016s L1", "m": [0, 13]}, {"s": "Med andre ord, du kan prøve din teori af i praksis samtidig med at du oplever forholdene i et udviklingsland.", "src": "2016s L1", "m": [0, 13]}, {"s": "Mulighederne er med andre ord uendelige!", "src": "2016s L1", "m": [16, 29]}, {"s": "Med andre ord: Du får en uddannelse, du bliver stolt af.", "src": "2013s L1", "m": [0, 13]}], "herunder": [{"s": "Nationalmuseet har i dag en lang række afdelinger rundt omkring i hele landet, herunder både museer og slotte, blandt andre: Frihedsmuseet, Frilandsmuseet, Musikmuseet, Kongernes Jelling og Frøslevlejrens Museum.", "src": "2020s L1", "m": [79, 87]}, {"s": "Herunder finder du svar på de spørgsmål, vi oftest får stillet om sæsonarbejde i Universe.", "src": "2018s L1", "m": [0, 8]}, {"s": "Hvis studievejlederen er i tvivl om dine faglige, herunder dansksproglige forudsætninger, får du et tilbud om en vejledende optagelsesprøve.", "src": "2016v L1", "m": [50, 58]}, {"s": "Studieaktivitet og mødepligt Der er krav om studieaktivitet herunder mødepligt.", "src": "2016v L1", "m": [60, 68]}, {"s": "om uddannelsen Uddannelsen giver dig et indgående varekendskab til fisk og skaldyr herunder fiskearter, fiskeri- og opdrætsmetoder samt køb og salg af fisk og skaldyr.", "src": "2015v L1", "m": [83, 91]}, {"s": "Se beskrivelser og optagelseskrav på de enkelte uddannelser herunder.", "src": "2015s L1", "m": [60, 68]}, {"s": "Om uddannelsen Uddannelsen består af elementer af undervisning, træning og praktiske aktiviteter, herunder bo-undervisning og praktik i virksomheder og institutioner.", "src": "2013s L1", "m": [98, 106]}, {"s": "I Vejlby gennemføres uddannelsen til landmand samt landbrugets lederuddan- nelse (produktionsleder, virksomhedsleder, agrarøkonom) og uddannelsen til jordbrugsteknolog i samarbejde med Erhvervsakademi Aarhus, herunder internationale uddannelser inden for landbrug og miljø.", "src": "2013s L1", "m": [209, 217]}], "heldigvis": [{"s": "Det er der heldigvis råd for!", "src": "2023s L1", "m": [11, 20]}, {"s": "Men heldigvis er der mange, der har fået et helt almindeligt arbejde og derfor ikke længere får støtte fra det offentlige.", "src": "2023s L2", "m": [4, 13]}, {"s": "Heldigvis hjalp Strynøs bosætningsgruppe os fra starten.", "src": "2022s L1", "m": [0, 9]}, {"s": "Heldigvis kan de fleste unge, både drenge og piger, lære at prioritere deres opgaver, give sig selv lov til at restituere og være åbne overfor, hvad fremtiden kan bringe.", "src": "2021v L2", "m": [0, 9]}, {"s": "Mit højskoleophold var helt afgørende for, at jeg efterfølgende valgte at læse teologi, som heldigvis bare er det perfekte studie for mig.", "src": "2018v L1", "m": [92, 101]}, {"s": "Da beslutningen om at flytte var taget, begyndte Lars at søge nyt job i Nordjylland, og han fik heldigvis hurtigt et job på Hjørring Gymnasium.", "src": "2018v L2", "m": [96, 105]}, {"s": "Så kan Peters mor heldigvis passe Sofie.", "src": "2018s L2", "m": [18, 27]}, {"s": "Det var ekstremt varmt, så han blev nødt til at drikke en masse for ikke at dehydrere, men det var han heldigvis forberedt på.", "src": "2015v L2", "m": [103, 112]}], "desværre": [{"s": "Rundvisningerne er desværre ikke egnede til gangbesværede.", "src": "2023s L1", "m": [19, 27]}, {"s": "Desværre er der ikke lige så mange, der ved, hvordan man bliver selvstændig og får sin egen forretning op at køre.", "src": "2022v L2", "m": [0, 8]}, {"s": "Men det er desværre ikke tilladt, sådan som lovgivningen ser ud i dag.", "src": "2022v L2", "m": [11, 19]}, {"s": "”Jeg skulle selv arrangere opholdet, for Københavns Professionshøjskole havde desværre ikke noget samarbejde med dem\", fortæller han videre, ”og det var et stort arbejde.", "src": "2020s L2", "m": [78, 86]}, {"s": "Det er desværre ikke nok blot at afmontere cyklen - også stativet skal af.", "src": "2017v L1", "m": [7, 15]}, {"s": "Kontakt os for at for at høre mere. • Vi kan desværre ikke rådgive omkring vaccinationer, da vi ikke er kvalificerede på dette område.", "src": "2016s L1", "m": [45, 53]}], "naturligvis": [{"s": "Den erfaring har de fleste nok gjort sig, og de fleste har naturligvis begået nogle begynderfejl undervejs.", "src": "2023v L2", "m": [59, 70]}, {"s": "Odense ZOO er naturligvis et oplagt valg, hvad enten I skal på familieudflugt, en kærestetur eller en hyggelig dag med vennerne, og havens muligheder er mange.", "src": "2021v L1", "m": [14, 25]}, {"s": "Man får naturligvis refunderet det beløb, man ikke har brugt på kortet, i samme bar.", "src": "2021v L1", "m": [8, 19]}, {"s": "Du kan naturligvis også sende et brev med beskrivelse og billeder med posten.", "src": "2017s L1", "m": [7, 18]}, {"s": "Vi tilrettelægger naturligvis arrangementerne efter jeres ønsker og behov.", "src": "2017s L1", "m": [18, 29]}, {"s": "Vores praktikophold kan være meritgivende på videregående uddannelser – du er selv ansvarlig for at søge merit på den pågældende uddannelsesinstitution, men vi er naturligvis behjælpelige så vidt muligt.", "src": "2016s L1", "m": [163, 174]}, {"s": "Uanset hvilken løsning du vælger, vil du naturligvis blive hentet i lufthavnen af vort lokale personale, og fulgt til dit projekt.", "src": "2016s L1", "m": [41, 52]}, {"s": "Størstedelen af vores projekter kræver ingen særlige sprogkundskaber, selvom det naturligvis altid er en fordel at lære sig nogle basale fraser inden afrejse.", "src": "2016s L1", "m": [81, 92]}], "faktisk": [{"s": "Sandet på Dueodde strand er indbydende og ultrafint – faktisk så fint, at det har været brugt til timeglas.", "src": "2023v L1", "m": [54, 61]}, {"s": "Men ofte viser det sig, at frygten er ubegrundet. ”Det voldte faktisk ikke de store problemer, da det kom til stykket.", "src": "2023v L2", "m": [62, 69]}, {"s": "For mange unge mennesker er en verden uden internet faktisk helt utænkelig.", "src": "2023v L2", "m": [52, 59]}, {"s": "Den forholdsvis lave søgning til de tekniske bacheloruddannelser er et problem, for der er faktisk mangel på unge med den type uddannelse.", "src": "2023v L2", "m": [91, 98]}, {"s": "Men det var faktisk ikke så svært for Peter at finde job og gøre karriere, for selvom der er færre stillinger, så er der også færre ansøgere.", "src": "2023s L1", "m": [12, 19]}, {"s": "klagesag faktisk ende med, at projekter ikke blot trækker ud, men helt må opgives.", "src": "2023s L2", "m": [9, 16]}, {"s": "Nogle gange kan en klagesag faktisk ende med, at projekter ikke blot trækker ud, men helt må opgives.", "src": "2023s L2", "m": [28, 35]}, {"s": "For nogle danskere er vikingekulturen faktisk også blevet en hobby.", "src": "2022v L1", "m": [38, 45]}], "overraskende_nok": [{"s": "Overraskende nok kunne 15 ud af 18 fortælle, at deres handicap enten har lille eller slet ingen betydning for deres arbejdsliv.", "src": "2023s L2", "m": [0, 16]}], "når": [{"s": "Den er desuden verdens største granitkirke, som man kan besøge, når der ikke er kirkelige handlinger.", "src": "2024s L1", "m": [64, 67]}, {"s": "Når man har tilmeldt sig som deltager til årets hærvejsmarch, modtager man en kvittering for sin betaling.", "src": "2024s L1", "m": [0, 3]}, {"s": "Man kan på forhånd bestille og købe morgen- og aftensmad til marchdagene, når man tilmelder sig online.", "src": "2024s L1", "m": [74, 77]}, {"s": "Når Viborg spiller på hjemmebane, så er jeg altid på stadion for at støtte dem.", "src": "2024s L1", "m": [0, 3]}, {"s": "Det er skønt, når man bor i lejlighed,
