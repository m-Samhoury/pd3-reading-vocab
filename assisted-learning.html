<style>
/* Design tokens and shared components follow pd3-reading-vocab's src/templates/common.css, so this page
   looks like the rest of that site (white sheets, soft grey page, one orange accent; light/dark by system). */
:root {
  --paper: #f7f7f9; --sheet: #ffffff; --ink: #15161b; --soft: #5d606b; --faint: #8b8e99;
  --rule: #ebebef; --rule-strong: #dcdce2; --hl: #ffd9c7; --hl-ink: #15161b;
  --accent: #ec6a3c; --accent-ink: #ffffff; --accent-soft: #fff1ea; --accent-text: #c4481c;
  --blue: #3b7bf6; --blue-soft: #eaf1ff; --blue-text: #2457c5;
  --violet: #7b5cf0; --violet-soft: #f0ecff; --violet-text: #5a3fc9;
  --link: #2457c5; --ok: #1f8a4c; --ok-bg: #e6f6ec; --bad: #c8412c; --bad-bg: #fdeceb;
  --warn: #9a6400; --warn-bg: #fff5dc; --focus: #ec6a3c;
  --shadow: 0 1px 2px rgba(20, 22, 30, .04), 0 6px 20px rgba(20, 22, 30, .05);
  --shadow-lg: 0 2px 4px rgba(20, 22, 30, .04), 0 18px 40px rgba(20, 22, 30, .08);
  --head: "Inter", "SF Pro Display", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", "SF Pro Text", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 16px; --gutter: 16px;
  /* learning states in the group map */
  --s-new: var(--rule-strong); --s-learn: var(--accent); --s-known: var(--blue); --s-master: var(--ok);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0f1014; --sheet: #17181e; --ink: #f1f1f4; --soft: #a9abb6; --faint: #7f828e;
    --rule: #26272f; --rule-strong: #34353f; --hl: #6a3420; --hl-ink: #fff3ec;
    --accent: #ff7b4d; --accent-ink: #1a0c05; --accent-soft: #2d1a12; --accent-text: #ff9b75;
    --blue: #5b93ff; --blue-soft: #16223a; --blue-text: #93b6ff;
    --violet: #9b83ff; --violet-soft: #221c3a; --violet-text: #b9a8ff;
    --link: #93b6ff; --ok: #6fd59a; --ok-bg: #14291d; --bad: #ff8b78; --bad-bg: #36191a;
    --warn: #f2c15a; --warn-bg: #33280f; --focus: #ff7b4d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 10px 30px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--head); line-height: 1.2; margin: 0; letter-spacing: -.02em; font-weight: 700; }
a { color: var(--link); text-underline-offset: 3px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 60%, transparent); outline-offset: 2px; border-radius: 10px; }
[hidden] { display: none !important; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter); }
.narrow { max-width: 780px; margin: 0 auto; }

/* top bar: logo · links · help · language (as on the other pages) */
.topbar { background: var(--sheet); border-bottom: 1px solid var(--rule); }
.topbar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 0 24px; min-height: 64px; }
.brand { order: 0; display: inline-flex; align-items: center; gap: 10px; min-height: 56px; text-decoration: none; color: var(--ink); font-weight: 700; letter-spacing: -.01em; }
.logo { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--accent-soft);
  color: var(--accent); font-weight: 800; font-size: .95rem; letter-spacing: -.04em; }
.nav { display: flex; align-items: center; gap: 2px 4px; flex: 1 1 auto; flex-wrap: wrap; order: 1; }
.nav a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none;
  color: var(--soft); font-weight: 500; font-size: .95rem; }
.nav a:hover { color: var(--ink); background: var(--paper); }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 600; background: var(--paper); }
.iconbtn { order: 2; margin-left: auto; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--soft); cursor: pointer; }
.iconbtn:hover { color: var(--ink); border-color: var(--ink); }
.langbtn { order: 2; margin-left: 8px; min-height: 38px; padding: 6px 16px; border-radius: 10px; border: 1px solid var(--rule-strong);
  background: var(--sheet); color: var(--ink); font-weight: 600; font-size: .9rem; cursor: pointer; }
.langbtn:hover { border-color: var(--ink); }
@media (max-width: 640px) {
  .topbar-in { padding-bottom: 8px; }
  .nav { order: 3; flex-basis: 100%; margin-left: -10px; }
  .nav a { padding: 0 10px; }
}
dialog.info { border: 0; border-radius: 18px; padding: 0; width: min(580px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  background: var(--sheet); color: var(--ink); box-shadow: var(--shadow-lg); overflow: auto; }
dialog.info::backdrop { background: rgba(15, 16, 20, .45); }
dialog.info .ib { padding: 14px 20px 22px; }
dialog.info .ih { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
dialog.info .ih h2 { font-size: 1.3rem; }
dialog.info h3 { font-size: 1rem; margin: 18px 0 6px; }
dialog.info p { margin: 6px 0; color: var(--soft); font-size: .93rem; }
dialog.explain { width: min(680px, calc(100vw - 32px)); }
dialog.explain .ih { position: sticky; top: 0; background: var(--sheet); padding: 14px 0 10px; margin-top: -14px; border-bottom: 1px solid var(--rule); z-index: 1; }
dialog.explain .ih .big { font-size: 1.8rem; }
dialog.explain h3 .soft { font-weight: 400; font-size: .85rem; }
dialog.explain .ex { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
dialog.explain .ex > span:not(.tag) { flex: 1 1 240px; min-width: 0; }
.trrow { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 8px; }
.trrow .tr { margin-left: 0; font-size: .85rem; }
.trrow .trl { flex-basis: 100%; font-size: .92rem; color: var(--soft); padding: 4px 0 2px 10px; border-left: 2px solid var(--blue); }
dialog.explain .tr { margin-left: auto; font-size: .8rem; white-space: nowrap; }
dialog.explain blockquote { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.trl { flex-basis: 100%; font-style: normal; font-size: .92rem; color: var(--soft); padding: 4px 0 2px 10px; border-left: 2px solid var(--blue); }
.trl.err a { color: var(--accent-text); }
.mates { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.mate { text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 11px; }
.mate:hover { border-color: var(--accent); }
.mate b { display: block; } .mate span { font-size: .85rem; color: var(--soft); }
.mate.same { border-color: var(--blue); }
button.word { cursor: pointer; font: inherit; font-size: .9rem; color: inherit; }
button.word:hover { border-color: var(--accent); }
.morebtn { margin-left: auto; }
dl.keylist { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: .9rem; color: var(--soft); }
dl.keylist dt { font-weight: 600; color: var(--ink); }
dl.keylist dd { margin: 0; }

/* page heading */
.top { padding-top: 44px; padding-bottom: 8px; }
.top h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); font-weight: 700; letter-spacing: -.03em; }
.top h1 .light { font-weight: 400; display: block; }
.top > p { margin: 10px 0 0; color: var(--soft); max-width: 62ch; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--sheet);
  border: 1px solid var(--rule); box-shadow: var(--shadow); font-size: .85rem; font-weight: 500; color: var(--ink); margin-bottom: 16px; }
.chip b { padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-weight: 600; font-size: .8rem; }
/* find bar: slides open under the top bar, over whichever screen is showing */
.findbar { display: grid; grid-template-rows: 0fr; background: var(--sheet); border-bottom: 1px solid transparent;
  transition: grid-template-rows .34s cubic-bezier(.2, .8, .2, 1), border-color .34s; }
.findbar.open { grid-template-rows: 1fr; border-bottom-color: var(--rule); box-shadow: var(--shadow); }
.findbar-in { min-height: 0; overflow: hidden; }
.findbar .wrap { padding-top: 14px; padding-bottom: 16px; opacity: 0; transform: translateY(-10px); transition: opacity .24s, transform .34s cubic-bezier(.2, .8, .2, 1); }
.findbar.open .wrap { opacity: 1; transform: none; transition-delay: .06s; }
.finder { position: relative; clip-path: inset(0 0 0 70% round 14px); transition: clip-path .42s cubic-bezier(.2, .8, .2, 1); }
.findbar.open .finder { clip-path: inset(-6px round 18px); }
.finder .ficon { position: absolute; left: 16px; top: 50%; translate: 0 -50%; color: var(--faint); pointer-events: none; }
.finder input { width: 100%; font: inherit; font-size: 1.2rem; padding: 13px 54px 13px 46px; border-radius: 14px; border: 1.5px solid var(--rule-strong); background: var(--sheet); color: var(--ink); }
.finder input::-webkit-search-cancel-button { display: none; }
.finder input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.fx { position: absolute; right: 8px; top: 50%; translate: 0 -50%; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
  border: 0; background: var(--paper); color: var(--soft); cursor: pointer; transform: rotate(-90deg) scale(.5); opacity: 0;
  transition: transform .34s cubic-bezier(.2, .8, .2, 1) .1s, opacity .2s .1s, background .15s, color .15s; }
.findbar.open .fx { transform: none; opacity: 1; }
.fx:hover { background: var(--accent-soft); color: var(--accent-text); }
.fsub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.fsub .letters { margin-top: 8px; }
.fsub #fmeta { margin: 8px 0 0; }
.findbar .hits { max-height: min(62vh, 600px); overflow-y: auto; overscroll-behavior: contain; margin-top: 14px; padding: 2px; }
.findbar .hits:empty { display: none; }
.findbar .hit { background: var(--paper); box-shadow: none; }
.nav a[aria-expanded="true"] { color: var(--accent-text); font-weight: 600; background: var(--accent-soft); }
.hits { display: grid; gap: 12px; margin-top: 18px; }
.hit { padding: 16px 18px; }
.hit .head .big { font-size: 1.6rem; }
.hit .via { font-size: .8rem; color: var(--faint); }
.hit .cats { display: grid; gap: 8px; margin-top: 12px; }
.hit .cat { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .92rem; }
.hit .cat .src { min-width: 120px; color: var(--soft); font-size: .82rem; }
.hit .cat .gname { font-weight: 700; font-size: 1.05rem; }
.hit .cat .gname small { font-weight: 400; color: var(--soft); font-size: .85rem; }
.hit .row { margin-top: 12px; }
.picker { margin-top: 22px; padding: 14px 16px 16px; }
.picker .ph { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; }
.picker .ph b { font-size: .95rem; }
.picker .tier { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
.picker .tier .badge { margin-right: 4px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rule-strong);
  background: var(--sheet); color: var(--ink); font: inherit; font-size: .88rem; cursor: pointer; transition: border-color .15s, background .15s; }
.pchip:hover { border-color: var(--accent); }
.pchip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.pchip[aria-pressed="true"]::before { content: "✓"; }
.pchip .n { font-size: .75rem; color: var(--faint); font-weight: 400; }
.pchip .d { min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: .7rem; font-weight: 700; text-align: center; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.section { margin-top: 40px; }
.section > h2 { font-size: 1.35rem; margin-bottom: 14px; }
.soft { color: var(--soft); }
.small { font-size: .88rem; }
.lbl { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
footer.foot { padding-top: 40px; padding-bottom: 48px; color: var(--faint); font-size: .85rem; }

/* controls */
.btn {
  min-height: 44px; padding: 9px 18px; border-radius: 10px; border: 1px solid var(--rule-strong);
  background: var(--sheet); color: var(--ink); cursor: pointer; font-weight: 600; font-size: .95rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.btn:hover { border-color: var(--ink); }
.btn.solid { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 28%, transparent); }
.btn.solid:hover { background: color-mix(in srgb, var(--accent) 88%, black); border-color: transparent; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--soft); }
.linkbtn { border: 0; background: none; padding: 0; font: inherit; color: var(--accent-text); text-decoration: underline; cursor: pointer; }
.btn.quiet:hover { color: var(--ink); background: var(--sheet); border-color: var(--rule); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.solid:disabled:hover { background: var(--accent); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.badge { display: inline-flex; align-items: center; min-height: 22px; padding: 1px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
.badge.t1 { background: var(--accent-soft); color: var(--accent-text); }
.badge.t2 { background: var(--blue-soft); color: var(--blue-text); }
.badge.t3 { background: var(--violet-soft); color: var(--violet-text); }
.tag { display: inline-flex; align-items: center; min-height: 22px; padding: 0 7px; border-radius: 6px; border: 1px solid var(--rule-strong);
  font-size: .72rem; font-weight: 600; color: var(--soft); letter-spacing: .02em; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); }
.bar { height: 8px; background: var(--rule); border-radius: 999px; overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; transition: width .25s; }
mark.hl { background: var(--hl); color: var(--hl-ink); padding: 0 3px; border-radius: 4px; font-style: normal; font-weight: 600; }
.err { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 14px 16px; }
code { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 1px 6px; font-size: .88em; }

/* progress band (as on the overview page) */
.band { background: var(--blue); color: #fff; border-radius: 20px; padding: 22px; box-shadow: 0 14px 30px color-mix(in srgb, var(--blue) 25%, transparent); }
@media (prefers-color-scheme: dark) { .band { background: #2a4fa8; } }
.prog { display: grid; gap: 18px 28px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.prog .m .lbl { font-size: .82rem; font-weight: 600; opacity: .85; color: inherit; letter-spacing: 0; text-transform: none; margin: 0; }
.prog .m b { display: block; font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.prog .m .s { font-size: .85rem; opacity: .85; }
.prog .bar { margin-top: 8px; background: rgba(255,255,255,.25); }
.prog .bar > span { background: #fff; }

/* group map */
.tierlabel { display: flex; align-items: center; gap: 8px; margin: 22px 0 10px; font-size: .9rem; font-weight: 600; color: var(--soft); }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: .85rem; color: var(--soft); }
.legend i, .word i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.group { text-align: left; padding: 14px 16px; cursor: pointer; color: inherit; transition: box-shadow .15s, transform .15s, border-color .15s; }
.group:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.group.open { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.group .gn { font-weight: 600; }
.group .ge { font-size: .85rem; color: var(--soft); }
.group .due { font-size: .75rem; font-weight: 600; color: var(--accent-text); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; }
.group .bar { margin-top: 10px; background: var(--s-new); }
.detail { grid-column: 1 / -1; padding: 16px; }
.words { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
.word { font-size: .9rem; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 3px 9px; }

/* session */
.counter { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 2px 12px; color: var(--soft); font-size: .9rem; margin: 22px 0 8px; }
.sessionbar { background: var(--rule); }
.sessionbar > span { background: var(--accent); border-radius: 999px; }
.q { padding: 22px 20px; margin-top: 14px; box-shadow: var(--shadow-lg); border-radius: 20px; }
.kind { font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.prompt { margin: 6px 0 14px; color: var(--soft); }
.big { font-family: var(--head); font-size: clamp(2rem, 7vw, 2.6rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.meaning { font-size: 1.2rem; font-weight: 600; margin-top: 6px; }
.sentence { font-size: 1.15rem; font-weight: 500; line-height: 1.55; }
.gap { display: inline-block; min-width: 4.5em; border-bottom: 2.5px solid var(--accent); margin: 0 2px; }
.opts { display: grid; gap: 8px; margin-top: 16px; }
.opt { justify-content: flex-start; text-align: left; min-height: 62px; font-size: 1.05rem; font-weight: 500; border-radius: 14px; padding: 12px 16px; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt .k { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--paper); color: var(--soft); font-weight: 700; font-size: .85rem; flex: 0 0 auto; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { background: var(--ok-bg); border-color: var(--ok); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt:disabled { cursor: default; opacity: 1; }
input.answer { width: 100%; min-height: 52px; font-size: 1.15rem; padding: 10px 14px; border: 1px solid var(--rule-strong); border-radius: 12px; background: var(--sheet); margin-top: 14px; }
input.answer:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.letters { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.letters button { min-width: 40px; min-height: 36px; border-radius: 9px; border: 1px solid var(--rule-strong); background: var(--sheet); cursor: pointer; font-size: 1rem; }
.letters button:hover { border-color: var(--ink); }
.tiles, .built { display: flex; flex-wrap: wrap; gap: 8px; }
.built { min-height: 58px; border: 1.5px dashed var(--rule-strong); border-radius: 14px; padding: 10px; margin: 14px 0 12px; align-content: flex-start; background: var(--paper); }
.tile { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 10px; padding: 7px 13px; font-size: 1.05rem; font-weight: 500; cursor: pointer; }
.tile:hover:not(:disabled) { border-color: var(--accent); }
.tile.fixed { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); cursor: default; font-weight: 600; }
.tile.used { visibility: hidden; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.feedback { margin-top: 14px; padding: 12px 14px; border-radius: 12px; }
.feedback.ok { background: var(--ok-bg); } .feedback.bad { background: var(--bad-bg); }
.feedback h3 { font-size: 1rem; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.feedback .why { margin-top: 4px; }
.sev { font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.sev.critical { background: var(--bad); color: var(--sheet); }
.sev.moderate { background: var(--warn-bg); color: var(--warn); }
.sev.minor { background: var(--sheet); color: var(--ok); }
.next { margin-top: 16px; }

/* teach card */
.head { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
.block { margin-top: 18px; }
.eg { padding: 12px 14px; border-radius: 12px; background: var(--paper); border-left: 3px solid var(--accent); }
.eg .sentence { font-style: italic; font-size: 1.05rem; }
.note { padding: 12px 14px; background: var(--blue-soft); border-radius: 12px; font-size: .94rem; display: grid; gap: 4px; margin-top: 8px; }
.note b.t { color: var(--blue-text); }
.note .demo { font-style: italic; }
.ex { margin: 8px 0; font-size: 1rem; }
.ex .tag { margin-right: 8px; }
.ddo { padding: 14px 16px; border: 1px solid var(--rule-strong); border-radius: 12px; }
.ddo blockquote { margin: 6px 0 0; padding-left: 10px; border-left: 2px solid var(--rule-strong); color: var(--soft); font-style: italic; font-size: .92rem; }
.ddo .cite { margin-top: 8px; font-size: .8rem; color: var(--faint); }
.en-def { font-size: .8rem; line-height: 1.4; color: var(--soft); margin: 1px 0 6px; }
.sense { margin-top: 14px; }
.sense:first-of-type { margin-top: 8px; }
.sense .sh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin-bottom: 6px; }
.sense .sh .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-weight: 700; font-size: .78rem; align-self: center; }
.sense .sh b { font-size: 1.02rem; }
.sense .eg { margin-bottom: 6px; }
.sense .none { font-size: .85rem; color: var(--faint); font-style: italic; }
.sensenote { margin-top: 12px; padding: 10px 14px; background: var(--blue-soft); border-radius: 12px; font-size: .9rem; }
.prepline { display: inline-block; margin: 6px 0 2px; padding: 3px 10px; border-radius: 8px; background: var(--blue-soft); color: var(--blue-text); font-size: .9rem; }
.prepline b { color: var(--ink); font-weight: 600; }
.feedback .prepline { margin-top: 8px; }
.whybox { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--sheet); border-left: 3px solid var(--accent); font-size: .94rem; }
.whybox > b:first-child { color: var(--accent-text); }
.whybox .test { margin-top: 6px; }
.tipbox { padding: 12px 14px; border-radius: 12px; background: var(--blue-soft); font-size: .94rem; }
.tipbox b { color: var(--blue-text); }
.tipbox ul { margin: 6px 0 0; padding-left: 18px; }
.tipbox li { margin: 4px 0; }
.tipbox .tl { font-weight: 600; }
.warnbox { padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: .94rem; }
.warnbox b { color: var(--accent-text); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.pair > div { background: var(--sheet); border-radius: 10px; padding: 10px 12px; }

/* flashcards: a card that flips in 3D; practice only */
.fctop { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 24px; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--paper); border: 1px solid var(--rule); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--soft); }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: var(--shadow); }
.fcprog { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.fcprog .bar { flex: 1; }
.fcard { display: block; width: 100%; margin-top: 14px; perspective: 1400px; cursor: pointer; border: 0; padding: 0; background: none; text-align: left; color: inherit;
  animation: fcIn .32s cubic-bezier(.2, .8, .2, 1); }
.fcard:focus-visible { outline: none; }
.fcard:focus-visible .face { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-lg); border-color: var(--accent); }
@keyframes fcIn { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.fcin { display: grid; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3, .9, .3, 1); }
.fcin.flipped { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; min-height: 340px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column;
  padding: 26px 24px 20px; border-radius: 22px; background: var(--sheet); border: 1px solid var(--rule); box-shadow: var(--shadow-lg); }
.face.back { transform: rotateY(180deg); }
.face.front { align-items: center; justify-content: center; text-align: center; }
.face.front .big { font-size: clamp(2.2rem, 9vw, 3.2rem); }
.face.front .fcq { font-size: clamp(1.5rem, 6vw, 2rem); font-weight: 700; font-family: var(--head); letter-spacing: -.02em; }
.face .fchint { margin-top: auto; padding-top: 22px; font-size: .82rem; color: var(--faint); }
.face.back .meaning { font-size: 1.45rem; margin-top: 4px; }
.face .prepline { align-self: flex-start; }
.face.front .prepline { align-self: center; }
.fcw { font-family: var(--head); font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; }
.face.back .block { margin-top: 14px; }
.face.back .en { color: var(--soft); font-size: .9rem; }
.fcbtns { margin-top: 16px; justify-content: center; }
.fcbtns .btn { min-width: 150px; }
.fcno { color: var(--bad); }
.fcno:hover { border-color: var(--bad); }
/* summary */
.score { font-family: var(--head); font-size: 3.4rem; font-weight: 700; letter-spacing: -.03em; line-height: 1; color: var(--accent); }
.list { margin: 0; padding: 0; list-style: none; }
.list li { padding: 10px 0; border-bottom: 1px solid var(--rule); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.list li:last-child { border-bottom: 0; }

@media (max-width: 600px) { .pair { grid-template-columns: 1fr; } .q { padding: 18px 16px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

irken en central kerne, der enten er rund eller ottekantet.", "src": "2023v L1", "m": [76, 81]}, {"s": "Men der er ikke tale om rejsebeskrivelse af hverken øen, himlen eller havet omkring Bornholm, men derimod om en fantasifuld fortælling fortalt af en til tider ret vidtløftig fortællerstemme.", "src": "2023v L1", "m": [64, 69]}, {"s": "Eller at man har en ubændig trang til at binde andre en røverhistorie på ærmet.", "src": "2023v L1", "m": [0, 5]}, {"s": "Det er karakteristisk for romanen, at dens mange fortællinger godt kunne være virkelige eller tage udgangspunkt i rigtige begivenheder.", "src": "2023v L1", "m": [88, 93]}, {"s": "Den stilistik, som romanen forsøger at efterligne, er nemlig den, der hersker i den mundtlige fortælling, i anekdoten eller skrønen.", "src": "2023v L1", "m": [118, 123]}], "ellers": [{"s": "Ellers risikerer man både, at projektet mislykkes, og at nogle bliver sure,” siger Marianne.", "src": "2021s L2", "m": [0, 6]}, {"s": "De frivillige, der passer biografen, ved nemlig rigtig meget om film, og det synes jeg ellers ikke, man oplever så tit hos personalet i de store biografer.", "src": "2019v L1", "m": [87, 93]}, {"s": "Men ellers er det mest i fritiden, Andrei kommunikerer på dansk.", "src": "2019v L2", "m": [4, 10]}, {"s": "Her tilbydes de studerende midlertidige boliger i skurvogne, som man ellers normalt finder ved byggepladser.", "src": "2018s L2", "m": [69, 75]}, {"s": "Men virksomhederne er nødt til at gøre det, ellers gør andre det.", "src": "2017v L2", "m": [44, 50]}, {"s": "Vi var der så også lige den dag, hvor det blæste allermest, men ellers var det super hyggeligt.", "src": "2017s L1", "m": [64, 70]}, {"s": "Uanset hvilket projekt du vælger, vil du opleve at blive en del af lokalsamfundet og på den måde få en enestående oplevelse, som man ellers ikke får på almindelige rejser.", "src": "2016s L1", "m": [133, 139]}, {"s": "De havde aldeles ikke lyst til det, men de lærte det, ellers fik de bank.", "src": "2016s L2", "m": [54, 60]}], "kunne": [{"s": "Det var en slags domstol, der traf afgørelser om krig og fred, og som kunne idømme folk straffe.", "src": "2024s L1", "m": [70, 75]}, {"s": "Det var helt specielt at kunne fejre så mange års sammenhold og fælles minder fra de mange hærvejsmarcher.", "src": "2024s L1", "m": [25, 30]}, {"s": "Min mand og jeg har vandret sammen i over 25 år med undtagelse af nogle år, hvor det ikke var muligt, fordi vores børn var for små til at kunne gå med.", "src": "2024s L1", "m": [138, 143]}, {"s": "Sven har kun misset et enkelt år, hvor han ikke kunne vandre.", "src": "2024s L1", "m": [48, 53]}, {"s": "Dels for lettere at kunne fastholde dem, der allerede er ansat, dels for lettere at kunne rekruttere nye, efterspurgte kræfter.", "src": "2024s L2", "m": [20, 25]}, {"s": "Det er karakteristisk for romanen, at dens mange fortællinger godt kunne være virkelige eller tage udgangspunkt i rigtige begivenheder.", "src": "2023v L1", "m": [67, 72]}, {"s": "Til gengæld savnede jeg nogle kolleger, jeg kunne sparre med om min nye rolle.", "src": "2023v L2", "m": [44, 49]}, {"s": "”Jeg måtte relativt hurtigt erkende, at jeg ikke kunne klare at arbejde så meget, og at jeg måtte blive bedre til nogle gange at slippe kontrollen.", "src": "2023v L2", "m": [49, 54]}], "skulle": [{"s": "Da Hærvejsmarchen så første gang blev holdt, var jeg ikke i tvivl om, at jeg skulle være med, og det har jeg så været lige siden.", "src": "2024s L1", "m": [77, 83]}, {"s": "Fra at have været mest optaget af deres egne opgaver, skulle de nu pludselig til at fokusere på deres kollegers faglighed og fastsætte rammerne for deres arbejde.", "src": "2023v L2", "m": [54, 60]}, {"s": "skulle have lov til at bestemme, om de ville høre til Danmark eller Tyskland.", "src": "2023s L1", "m": [0, 6]}, {"s": "grænse mellem Danmark og Tyskland skulle placeres.", "src": "2023s L1", "m": [34, 40]}, {"s": "kongehus-kritiske socialister på gaden med krav om, at kongen skulle afsættes.", "src": "2023s L1", "m": [62, 68]}, {"s": "Verdenskrig, og ved de efterfølgende fredsforhandlinger kom den danske regering med et krav om, at der skulle være folkeafstemninger i de nordligste områder af Tyskland om landsdelenes fremtidige tilhørsforhold.", "src": "2023s L1", "m": [103, 109]}, {"s": "Da deres første barn kom til verden, og Mette skulle i turnus som læge, gav det god mening at skifte bylivet på Nørrebro ud med mere plads og lavere huspriser i Sønderjylland.", "src": "2023s L1", "m": [46, 52]}, {"s": "Jeg tror ikke, jeg ville have energi til min familie, hvis jeg som mine kolleger skulle op kl. 5 hver morgen til hård fysisk træning,” siger Ditte Simonsen.", "src": "2023s L2", "m": [81, 87]}], "måtte": [{"s": "Varer måtte fragtes over land til Hjarbæk ved Limfjorden, der benyttedes som byens havn.", "src": "2024s L1", "m": [6, 11]}, {"s": "”Jeg måtte relativt hurtigt erkende, at jeg ikke kunne klare at arbejde så meget, og at jeg måtte blive bedre til nogle gange at slippe kontrollen.", "src": "2023v L2", "m": [5, 10]}, {"s": "Efter nederlaget måtte Danmark opgive hertugdømmerne, der indtil da på forskellig vis havde hørt under den danske konge.", "src": "2023s L1", "m": [17, 22]}, {"s": "Det var ikke med tyskernes gode vilje, at de måtte afstå den nordlige del af Slesvig.", "src": "2023s L1", "m": [45, 50]}, {"s": "Ø-lejren var åben for kvinder og børn, dog måtte drenge over 12 år ikke deltage.", "src": "2022s L1", "m": [43, 48]}, {"s": "Selvom hun måtte revidere sine forventninger undervejs, tænker hun ikke længere så meget på, at året med jobsøgning var frustrerende.", "src": "2022s L2", "m": [11, 16]}, {"s": "teringsproces måtte han også tage en personlighedstest.", "src": "2022s L2", "m": [14, 19]}, {"s": "Domkirken blev for eksempel brændt ned, og man måtte bygge en ny domkirke – det er den, vi har i dag.", "src": "2021v L1", "m": [47, 52]}], "ville": [{"s": "Pia Lehman er glad for, at hun tog springet ud i noget nyt, og at hun fandt frem til noget, hun hellere ville.", "src": "2024s L2", "m": [104, 109]}, {"s": "De forstod ikke altid, hvor jeg ville hen med mine ideer.", "src": "2023v L2", "m": [32, 37]}, {"s": "Flere, der egentlig ønskede at studere en humanistisk uddannelse, ville så være nødt til at vælge et andet studium.", "src": "2023v L2", "m": [66, 71]}, {"s": "På den måde ville der komme flere penge, flere studerende og et bedre studiemiljø på de uddannelsessteder, der er tilbage.", "src": "2023v L2", "m": [12, 17]}, {"s": "ville ende med at ’omvende’ dem til den tyske identitet.", "src": "2023s L1", "m": [0, 5]}, {"s": "skulle have lov til at bestemme, om de ville høre til Danmark eller Tyskland.", "src": "2023s L1", "m": [39, 44]}, {"s": "De frygtede, at de ikke ville have mulighed for at etablere en social omgangskreds, samt at der ville være et begrænset antal aktiviteter.", "src": "2023s L1", "m": [24, 29]}, {"s": "Jeg tror ikke, jeg ville have energi til min familie, hvis jeg som mine kolleger skulle op kl. 5 hver morgen til hård fysisk træning,” siger Ditte Simonsen.", "src": "2023s L2", "m": [19, 24]}], "at_betyde": [{"s": "Byen hed ikke oprindeligt Viborg men Vibjerg, der betyder ’det hellige sted på bakken’.", "src": "2024s L1", "m": [50, 57]}, {"s": "March betyder ifølge ordbogen ”en organiseret vandring”.", "src": "2024s L1", "m": [6, 13]}, {"s": "I nogle virksomheder betyder det, at man arbejder 37 timer på fire dage.", "src": "2024s L2", "m": [21, 28]}, {"s": "I andre betyder det, at man også arbejder færre timer om ugen.", "src": "2024s L2", "m": [8, 15]}, {"s": "Det synlige grundfjeld betyder blandt andet, at Bornholm som det eneste sted i landet har klippekyster.", "src": "2023v L1", "m": [23, 30]}, {"s": "Det betyder, at der er tid til at sove længe, gøre stop undervejs og nyde den bornholmske natur, og så er der ikke så mange stejle bakker.", "src": "2023v L1", "m": [4, 11]}, {"s": "Blandt andet kører man på mange dele af ruten på det nedlagte jernbanespor midt i landskabet, langt væk fra den øvrige trafik, hvilket betyder, at børneruten her er meget trafiksikker.", "src": "2023v L1", "m": [135, 142]}, {"s": "Uklarheden om ansvaret betyder imidlertid ikke, at udbyderne kan fralægge sig ethvert ansvar.", "src": "2023v L2", "m": [23, 30]}], "at_anbefale": [{"s": "Det anbefales, at man bruger en lommelygte, hvis man vil gå på opdagelse i de mørke minegange.", "src": "2024s L1", "m": [4, 13]}, {"s": "Året rundt er der kun otte grader i kalkgruberne, så det anbefales, at man har varmt tøj på.", "src": "2024s L1", "m": [57, 66]}, {"s": "Jeg har også gratis adgang til de fleste koncerter, så jeg kan kun anbefale at blive frivillig på Paletten.", "src": "2024s L1", "m": [67, 75]}, {"s": "Vi har samlet 8 anbefalede ture samt 1 for børn og 2 for mountainbikere.", "src": "2023v L1", "m": [16, 26]}, {"s": "De anbefalede tures numre er ikke skiltet i naturen, da de følger de nationale og regionale ruter.", "src": "2023v L1", "m": [3, 13]}, {"s": "Fx anbefaler de, at børn og unge undervises i iværksætteri i skolen.", "src": "2022v L2", "m": [3, 12]}, {"s": "Det kan anbefales at køre til Mandø med traktorbusserne.", "src": "2022s L1", "m": [8, 17]}, {"s": "Bosætningsgruppen på Strynø kunne nemlig anbefale et realkreditinstitut, som ville låne os penge, og så kunne vi købe det hus, vi ville.", "src": "2022s L1", "m": [41, 49]}], "at_fremhæve": [{"s": "Flere af oplysningsforbundene fremhæver fx den personlige udvikling som lige så vigtig som den faglige.", "src": "2020v L1", "m": [30, 39]}, {"s": "Det er dog især den gode work-life-balance, som mange herboende udlændinge fremhæver.", "src": "2019v L2", "m": [75, 84]}, {"s": "Thomas Graversen, der er chefkonsulent i Djøfs3 Karriere- & kompetencecenter, mener dog, at man skal være lidt forsigtig med at fremhæve ekstreme sportspræstationer som maraton og ironman i forbindelse med en ansøgning.", "src": "2015v L2", "m": [128, 136]}], "at_vare": [{"s": "Varer måtte fragtes over land til Hjarbæk ved Limfjorden, der benyttedes som byens havn.", "src": "2024s L1", "m": [0, 5]}, {"s": "Hvis de for eksempel ikke har mulighed for at have så mange varer på lager i butikken, kan de tilbyde at fremskaffe dem inden for 24 timer og levere dem til døren.", "src": "2024s L2", "m": [60, 65]}, {"s": "De er brugt i markedsføringen af så forskellige varer som pølser, ølflasker, sportshold, leverpostej, flyrejser og tændstikker.", "src": "2022v L1", "m": [48, 53]}, {"s": "Jeg rejser rundt til vikingemarkeder og vikingefestivaler, hvor jeg viser mine varer frem og fortæller om baggrunden for og produktionen af dem – og så sælger jeg dem selvfølgelig.", "src": "2022v L1", "m": [79, 84]}, {"s": "Lejren er siden blevet afholdt hvert år og varer 8 uger.", "src": "2022s L1", "m": [43, 48]}, {"s": "Man kan hoppe af og på undervejs, så turen kommer nemt til at vare en hel dag.", "src": "2021v L1", "m": [62, 66]}, {"s": "Det var ikke heldigt for byen, for næsten alle varer blev transporteret med skib dengang.", "src": "2021v L1", "m": [47, 52]}, {"s": "Rundvisningen starter ved teatrets hovedtrappe i Teatergaden og varer ca. 75 min.", "src": "2021s L1", "m": [64, 69]}], "at_ansøge_om": [{"s": "Det var en slags domstol, der traf afgørelser om krig og fred, og som kunne idømme folk straffe.", "src": "2024s L1", "m": [46, 48]}, {"s": "Her gemmer mange kilometer af minegange og underjordiske søer på historien om kalkindustrien, der har skabt fundamentet for Viborg, som byen ser ud i dag.", "src": "2024s L1", "m": [75, 77]}, {"s": "Her er der en verden af oplevelser, der fortæller om geologi, flagermus og imponerende arbejde udført med håndkraft.", "src": "2024s L1", "m": [50, 52]}, {"s": "Showet vises hver halve time og fortæller om kalkens og grubernes historie.", "src": "2024s L1", "m": [42, 44]}, {"s": "Her kan man lære om kalkgrubernes historie, om livet som kalkminearbejder, og man kan udforske flagermusenes liv.", "src": "2024s L1", "m": [17, 19]}, {"s": "Helt unikt for et historisk værksted findes de arkæologiske udgravninger side om side med den genskabte jernalderlandsby i bakkerne på Hvolris.", "src": "2024s L1", "m": [78, 80]}, {"s": "Da Hærvejsmarchen så første gang blev holdt, var jeg ikke i tvivl om, at jeg skulle være med, og det har jeg så været lige siden.", "src": "2024s L1", "m": [66, 68]}, {"s": "Sporten er virkelig noget, vi er sammen om her i Viborg.", "src": "2024s L1", "m": [40, 42]}], "at_bestille": [{"s": "Ved tilmelding har man mulighed for at bestille og købe en række tilvalg i forhold til indkvartering og forplejning.", "src": "2024s L1", "m": [39, 47]}, {"s": "Man kan på forhånd bestille og købe morgen- og aftensmad til marchdagene, når man tilmelder sig online.", "src": "2024s L1", "m": [19, 27]}, {"s": "Det var mere opgaverne, der var nogle andre, end han havde håbet. ”Efterhånden er der ikke særlig mange, der bestiller håndlavede møbler, så for det meste lavede vi almindeligt tømrerarbejde.", "src": "2022v L2", "m": [109, 118]}, {"s": "Man kan også bestille Ø-passet og få det tilsendt mod et gebyr via hjemmesiden oepas.dk.", "src": "2022s L1", "m": [13, 21]}, {"s": "Kørestolspladser: På Skuespilhusets Store Scene er der reserveret to faste kørestolspladser, som kan bestilles senest en uge før forestillingen gennem Det Kongelige Teaters Kundeservice på tlf. 33 69 69 69.", "src": "2021s L1", "m": [101, 110]}, {"s": "Kørestolspladser: På Operaens Store Scene er der reserveret fire faste kørestolspladser, som kan bestilles senest en uge før forestillingen gennem Det Kongelige Teaters Kundeservice på tlf. 33 69 69 69.", "src": "2021s L1", "m": [97, 106]}, {"s": "Der er reserveret to faste kørestolspladser, som kan bestilles senest en uge før forestillingen gennem Det Kongelige Teaters Kundeservice på tlf. 33 69 69 69.", "src": "2021s L1", "m": [53, 62]}, {"s": "Ønsker du at bestille en gratis ledsagerbillet i forbindelse med køb af kørestolsplads, skal du kontakte Det Kongelige Teaters Kundecenter på tlf. 33 69 69 69.", "src": "2021s L1", "m": [13, 21]}], "at_optage": [{"s": "Alle lovlige danske organisationer, foreninger, virksomheder m.fl. samt private, der lever op til Folkemødets principper for events, har mulighed for at blive optaget i Folkemødets program.", "src": "2023v L1", "m": [159, 166]}, {"s": "Fra at have været mest optaget af deres egne opgaver, skulle de nu pludselig til at fokusere på deres kollegers faglighed og fastsætte rammerne for deres arbejde.", "src": "2023v L2", "m": [23, 30]}, {"s": "Der er nemlig mange useriøse leverandører af antivirusprogrammer på markedet, som er mere optaget af profit end af datasikkerhed.", "src": "2023v L2", "m": [90, 97]}, {"s": "De svarede på vores spørgsmål, og det var også dem, der bakkede os op, da vi fik problemer med at optage boliglån.", "src": "2022s L1", "m": [98, 104]}, {"s": "Rønne Theater er et arbejdende teater, og lokalerne er derfor ofte optaget af forskellige aktiviteter.", "src": "2021s L1", "m": [67, 74]}, {"s": "Eleverne kommer gennem en klassisk produktionsproces, hvor de idéudvikler, optager og klipper med professionelt filmudstyr.", "src": "2019v L1", "m": [75, 82]}, {"s": "Unge, der opholder sig i Danmark på et Working Holiday-visum, kan optages på en højskole uden at søge yderligere opholdstilladelse.", "src": "2018v L1", "m": [66, 73]}, {"s": "For det første at man er optaget på en godkendt folkehøjskole og har betalt deltagergebyret.", "src": "2018v L1", "m": [25, 32]}], "at_udelukke": [{"s": "Hvis du ikke overholder reglerne om studieaktivitet, kan du miste retten til SU og i sidste ende blive udelukket fra undervisningen.", "src": "2016v L1", "m": [103, 112]}], "at_omfatte": [{"s": "En måned senere var der afstemning i den sydlige zone, der blandt andet omfattede Flensborg samt øerne Sylt og Föhr.", "src": "2023s L1", "m": [72, 81]}, {"s": "Nationalmuseets fotosalg omfatter både arkivfotos og nyoptagelser af museets genstande.", "src": "2020s L1", "m": [25, 33]}, {"s": "Samlingen omfatter musikinstrumenter fra Europa, Asien og Afrika fra bronzealderen og frem til vor tid.", "src": "2020s L1", "m": [10, 18]}, {"s": "Musikmuseets samling af tidsskrifter dækker hovedsageligt emner inden for musikinstrumenter og dansk/nordisk musikliv og -historie, men omfatter også titler af bredere musikalsk eller museumsfaglig karakter.", "src": "2020s L1", "m": [136, 144]}, {"s": "UNESCOmonumenterne omfatter de to runesten foran kirken, selve Jelling Kirke og de to store høje nord og syd herfor.", "src": "2020s L1", "m": [19, 27]}, {"s": "Højskolernes ugepris omfatter både undervisning, kost og logi.", "src": "2018v L1", "m": [21, 29]}, {"s": "Havens område omfatter blandt andet det areal, som Fyns Tivoli tidligere lå på.", "src": "2017v L1", "m": [14, 22]}, {"s": "Selskaber skal omfatte minimum 12 personer inden for museets åbningstid og minimum 20 personer uden for åbningstiden.", "src": "2017s L1", "m": [15, 22]}], "at_uddele": [{"s": "Den bliver uddelt hvert andet eller tredje år i forbindelse med Det danske Akademis årsfest.", "src": "2021s L1", "m": [11, 17]}, {"s": "Kjeld Abell-prisen bliver først og fremmest uddelt som belønning til en person, der har gjort en indsats inden for teater- og filmkunst.", "src": "2021s L1", "m": [44, 50]}, {"s": "Årets Reumert uddeles i 16 kategorier – blandt andre Årets hæderspris, Årets forestilling og Årets kvindelige og mandlige hovedrolle.", "src": "2021s L1", "m": [14, 21]}, {"s": "Mange musikfestivaler skaber alligevel et overskud, som de efterfølgende uddeler til forskellige former for velgørende formål.", "src": "2019s L1", "m": [73, 80]}, {"s": "På Skagen Festival uddeles Den Danske Folkemusikpris.", "src": "2019s L1", "m": [19, 26]}, {"s": "Der er udarbejdet fire lokale hæfter, der uddeles til alle elever i 9. og 10. klasse i regionen.", "src": "2015v L1", "m": [42, 49]}], "at_fordele": [{"s": "En fire-dages arbejdsuge kan altså være en fordel i konkurrencen om medarbejdere.", "src": "2024s L2", "m": [43, 49]}, {"s": "Der er både fordele for ambassadøren, der sælger billetter, og for dem, der køber en billet gennem en ambassadør.", "src": "2021v L1", "m": [12, 19]}, {"s": "På andet år er der ekstra mange skriftlige opgaver, som lærerne ikke altid får samarbejdet godt nok om at fordele jævnt over skoleåret.", "src": "2021v L2", "m": [106, 113]}, {"s": "Det er der både fordele og ulemper ved.", "src": "2020v L2", "m": [16, 23]}, {"s": "Fordele og ulemper ved en høj jobomsætning Inden for de fleste brancher er det en fordel for arbejdsgiverne, at man hurtigt kan tilpasse sig efterspørgslen og udskifte arbejdskraften efter behov.", "src": "2020v L2", "m": [0, 7]}, {"s": "Med en kort midlertidig ansættelse er man ikke sikret alle disse fordele.", "src": "2020v L2", "m": [65, 72]}, {"s": "Det er nok en god ide at vælge et par af udstillingerne ud og gå i dybden med disse og så se museet lidt efter lidt, fordelt på flere besøg.", "src": "2020s L1", "m": [117, 124]}, {"s": "Men der skal også være et klart fagligt udbytte, hvis et studieophold i udlandet skal være en fordel i forhold til fremtidig karriere.", "src": "2020s L2", "m": [94, 100]}], "at_give_udtryk_for": [{"s": "Det vil blandt andet sige, at man til møder skal være parat til at tage ordet og give udtryk for markante holdninger.", "src": "2018s L2", "m": [81, 96]}, {"s": "Eleverne og deres læring kom i centrum, og de skulle lære at give udtryk for deres meninger og holdninger.", "src": "2016s L2", "m": [61, 76]}], "at_afgøre": [{"s": "Det er nemlig kommunerne, der afgør, hvor møllerne skal sættes op.", "src": "2023s L2", "m": [30, 35]}, {"s": "Institutionens leder afgør ud fra en vurdering af dine kvalifikationer, om du kan optages.", "src": "2016v L1", "m": [21, 26]}, {"s": "Det er dig, der afgør, hvad vi skal tale om, og du vælger selv, om du vil være anonym.", "src": "2015s L1", "m": [16, 21]}, {"s": "Det er lederen af den skole, du har søgt optagelse på, der afgør, om du kan optages, eventuelt efter en optagelsesprøve.", "src": "2015s L1", "m": [59, 64]}, {"s": "Det er studenterkursets leder, der vurderer dine kvalifikationer og afgør, om du kan optages.", "src": "2015s L1", "m": [68, 73]}, {"s": "Skolens leder afgør efter en faglig samtale, hvem der kan optages.", "src": "2015s L1", "m": [14, 19]}, {"s": "Optagelse efter konkret vurdering Det er lederen af det gymnasium, du har søgt optagelse på, der afgør, om du har krav på optagelse.", "src": "2015s L1", "m": [97, 102]}, {"s": "UU indstiller til kommunen, at du optages på ungdomsuddannelsen, hvorefter kommunen afgør, om du skal tilbydes uddannelsen og på hvilke vilkår.", "src": "2013s L1", "m": [84, 89]}], "afgørende": [{"s": "Der kan være gode grunde til, at jobmuligheder og løn ikke er mere afgørende for danske unges valg af uddannelse.", "src": "2023v L2", "m": [67, 76]}, {"s": "Der er i de seneste år kommet hurtigt internet på de fleste øer, og netop dette har været afgørende for, at flere nu arbejder som selvstændige fra en lille ø.", "src": "2022s L1", "m": [90, 99]}, {"s": "I undersøgelsen pegede de unge på flere afgørende årsager til, at de ikke ønskede at rejse ud.", "src": "2020s L2", "m": [40, 49]}, {"s": "Det er et centralt princip for skolen, at det er den enkelte elevs egen motivation og begejstring, der skal være i fokus, da det er afgørende for et godt udbytte af undervisningen.", "src": "2018v L1", "m": [132, 141]}, {"s": "Mit højskoleophold var helt afgørende for, at jeg efterfølgende valgte at læse teologi, som heldigvis bare er det perfekte studie for mig.", "src": "2018v L1", "m": [28, 37]}, {"s": "Det er afgørende, at du har situationsfornemmelse, er rummelig og har god kulturforståelse.", "src": "2018s L1", "m": [7, 16]}, {"s": "Vurderingerne er afgørende for, om ansøgerne går videre i Universes ansættelsesforløb.", "src": "2018s L1", "m": [17, 26]}, {"s": "På U1 og U2 vil deltagerne ligeledes blive vurderet af nogle observatører, hvor præstation, mindset og engagement har en afgørende rolle for, om deltagerne går videre i ansættelsesforløbet.", "src": "2018s L1", "m": [121, 130]}], "en_årsag": [{"s": "De mange skriftlige opgaver i gymnasiet kan være en af årsagerne til, at mange unge ikke kan klare presset i skolen.", "src": "2021v L2", "m": [55, 64]}, {"s": "Han mener, at man bør se mere på de problemer, de unge har, i stedet for at skyde skylden på de sociale medier som årsag til problemerne.", "src": "2021v L2", "m": [115, 120]}, {"s": "Af den årsag forventede oplysningsforbundene et stort fald i antallet af kursusdeltagere på 30-40 %, men det viste sig ikke at blive helt så voldsomt.", "src": "2020v L1", "m": [7, 12]}, {"s": "Der er flere årsager til, at CSR har bredt sig i dansk erhvervsliv i de senere år.", "src": "2020v L2", "m": [13, 20]}, {"s": "I undersøgelsen pegede de unge på flere afgørende årsager til, at de ikke ønskede at rejse ud.", "src": "2020s L2", "m": [50, 57]}, {"s": "De mange master er imidlertid også årsag til bekymring.", "src": "2020s L2", "m": [35, 40]}, {"s": "De velgørende organisationers strategier og markedsføring samt et nyere skattefradrag er nogle af årsagerne.", "src": "2019s L2", "m": [98, 107]}, {"s": "Fradrag i skat for velgørenhed En anden væsentlig årsag til, at danskerne giver flere penge til velgørenhed kan være, at man kan få skattefradrag for bidragene.", "src": "2019s L2", "m": [50, 55]}], "et_vilkår": [{"s": "Nogle af mine gode venner har altid betalt til Børns Vilkår, som er en dansk organisation, der støtter udsatte børn og unge i Danmark, der har det hårdt økonomisk eller socialt.", "src": "2019s L2", "m": [53, 59]}, {"s": "Naturligvis bør man være sig bevidst, at der gælder andre vilkår og forhold i udviklingslande end herhjemme, og man skal derfor altid have sin sunde fornuft med sig.", "src": "2016s L1", "m": [58, 64]}, {"s": "Bagefter kan du altså læse videre og videreuddanne dig på samme vilkår som andre med gymnasial uddannelse.", "src": "2015v L1", "m": [64, 70]}, {"s": "Du skal tage del i de daglige opgaver og yde en arbejdsindsats på lige vilkår med de øvrige ans
