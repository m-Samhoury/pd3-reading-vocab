", "m": [56, 60]}, {"s": "Det samme gælder det mere end 1,4 milliard år gamle grundfjeld, der er synligt på store dele af øen samt på øgruppen Ertholmene nordøst for Bornholm.", "src": "2023v L1", "m": [100, 104]}, {"s": "Derudover er øen karakteriseret ved en stor mangfoldighed af flagermus samt et fravær af de fleste danske rovdyr.", "src": "2023v L1", "m": [71, 75]}, {"s": "Nedbøren påvirkes af havet samt det kuperede terræn, der bidrager til bygedannelsen.", "src": "2023v L1", "m": [27, 31]}, {"s": "Alle lovlige danske organisationer, foreninger, virksomheder m.fl. samt private, der lever op til Folkemødets principper for events, har mulighed for at blive optaget i Folkemødets program.", "src": "2023v L1", "m": [67, 71]}, {"s": "Vi har samlet 8 anbefalede ture samt 1 for børn og 2 for mountainbikere.", "src": "2023v L1", "m": [32, 36]}, {"s": "En måned senere var der afstemning i den sydlige zone, der blandt andet omfattede Flensborg samt øerne Sylt og Föhr.", "src": "2023s L1", "m": [92, 96]}], "ikke_kun_men_også": [{"s": "Men det er ikke kun i fodbold, Viborg klarer sig rigtigt godt som sportsby.", "src": "2024s L1", "m": [11, 19]}, {"s": "Jeg ser nogle gange deres kampe, dog kun på tv, så det er ikke kun fodbold, jeg følger.", "src": "2024s L1", "m": [58, 66]}, {"s": "Så det er ikke kun mig, der er vild med Borgvold, det er børnene også.", "src": "2024s L1", "m": [10, 18]}, {"s": "Men det er måske ikke kun virksomhedernes organisering af arbejdsugen, der kommer til at forandre sig.", "src": "2024s L2", "m": [17, 25]}, {"s": "Det er dog ikke kun politisk, der kan gøres en indsats.", "src": "2024s L2", "m": [11, 19]}, {"s": "Klassisk musik Koncerter bliver afholdt flere forskellige steder – i nogle af vore smukke kirker, men også på andre mere usædvanlige spillesteder.", "src": "2023v L1", "m": [98, 106]}, {"s": "Men også i dette kulturspor kan lokale kunstnere fint gøre sig gældende med koncerter rundt omkring på øen, hvor de viser kvaliteten af det bornholmske musikliv.", "src": "2023v L1", "m": [0, 8]}, {"s": "Ikke blot på grund af jobmulighederne, men også fordi nyuddannede med en teknisk uddannelse ofte får en højere løn end nyuddannede med en humanistisk uddannelse.", "src": "2023v L2", "m": [39, 47]}], "både_og": [{"s": "Kongehyldningsmonumentet af bronze og granit forestiller Dronning Margrethe I og Erik af Pommern.", "src": "2024s L1", "m": [35, 37]}, {"s": "Det var en slags domstol, der traf afgørelser om krig og fred, og som kunne idømme folk straffe.", "src": "2024s L1", "m": [54, 56]}, {"s": "En række statslige institutioner kom til byen, blandt andet en garnison og et sindssygehospital.", "src": "2024s L1", "m": [72, 74]}, {"s": "I dag er industriens største branche jern- og metalindustrien, men servicesektoren er blevet endnu vigtigere.", "src": "2024s L1", "m": [43, 45]}, {"s": "Viborg Domkirke står både stærkt i bybilledet og i Viborg bys lange historie.", "src": "2024s L1", "m": [21, 48]}, {"s": "I vådt puds tryllede de med deres kalkfarver, og freskerne taler et sprog, som alle kan forstå.", "src": "2024s L1", "m": [46, 48]}, {"s": "Her kan man tage tilbage i tiden og opleve kunsten samt spændende skiftende særudstillinger.", "src": "2024s L1", "m": [33, 35]}, {"s": "Kunstneren Joakim Skovgaard har udsmykket Viborg Domkirke, og museet er oprettet for at hædre ham og hans familie, hvoraf mange var kunstnere.", "src": "2024s L1", "m": [59, 61]}], "tilsvarende": [{"s": "Om foråret og i den tidlige sommer er Østersøen derimod kold og nedbørsmængderne tilsvarende små.", "src": "2023v L1", "m": [81, 92]}, {"s": "Indehavere af et officielt ledsagerkort, udstedt af Danske Handicaporganisationer, Dansk Blindesamfund eller tilsvarende organisation fra et EU land, tilbydes en gratis (+ serviceomkostninger) ledsagerbillet til Det Kongelige Teaters egne forestillinger.", "src": "2021s L1", "m": [109, 120]}, {"s": "Specialpædagogisk støtte (SPS) Har du en funktionsnedsættelse eller tilsvarende svære vanskeligheder (ordblind, blind, svagtsynet, døv, hørehæmmet, bevægelseshæmmet eller psykiske vanskeligheder), kan du få rådgivning, vejledning og hjælp via SPS.", "src": "2016v L1", "m": [68, 79]}, {"s": "Han mener, at det er vigtigt, at børn også i børnehaven arbejder med tablets og tilsvarende teknologi.", "src": "2016v L2", "m": [80, 91]}, {"s": "Ved enkeltfagsundervisningen gælder, at du tidligst kan blive optaget et år efter, at du har afsluttet folkeskolens 9. eller 10. klasse eller modtaget tilsvarende undervisning.", "src": "2015s L1", "m": [151, 162]}], "ligesom": [{"s": "Derfor arbejder Sammenslutningen af Danske Småøer for, at de små ø-skoler bevares, ligesom der arbejdes for at få etableret passende lægedækning, så utryghed ikke tvinger folk til at flytte fra øerne.", "src": "2022s L1", "m": [83, 90]}, {"s": "Traditionelle erhverv som landbrug, håndværk, handel og fiskeri spiller stadig en vis rolle på de små øer, ligesom der er jobs inden for turismeerhvervet.", "src": "2022s L1", "m": [107, 114]}, {"s": "Inden Kamilla fik jobbet, havde hun ligesom de fleste andre nyuddannede brugt meget tid på at lære at skrive ansøgninger og CV og syntes også selv, hendes ansøgninger var gode.", "src": "2022s L2", "m": [36, 43]}, {"s": "De følger derfor årstidernes gang ligesom landbruget.", "src": "2021v L1", "m": [34, 41]}, {"s": "Det er tydeligt, at skuespillerne ikke altid kan spille ligesom personerne fra filmen, men når det er en musical, så synes jeg, at det vigtigste er, hvordan skuespillerne synger.", "src": "2021s L1", "m": [56, 63]}, {"s": "Selvom flere unge ser korte midlertidige ansættelser som led i deres karriere, ønsker de fleste unge dog en længerevarende fastansættelse ligesom deres ældre kolleger.", "src": "2020v L2", "m": [138, 145]}, {"s": "Per, der læser til lærer på Københavns Professionshøjskole, valgte ligesom Eva at studere et halvt år i Cardiff, dog ikke på samme universitet.", "src": "2020s L2", "m": [67, 74]}, {"s": "På højskolen mødte jeg fagligt dygtige lærere og et dejligt inkluderende miljø, men det, jeg var mest glad for, var faktisk, at de andre højskoleelever elskede at diskutere ligesom jeg selv.", "src": "2018v L1", "m": [173, 180]}], "sammenlignet_med": [{"s": "Danmark er sammenlignet med mange andre lande et trygt og velfungerende velfærdssamfund.", "src": "2019v L2", "m": [11, 27]}], "heller_ikke": [{"s": "Butikkerne har nemlig især i de mindre byer, hvor der heller ikke er storcentre, en vigtig rolle for folks psykiske og fysiske velvære.", "src": "2024s L2", "m": [54, 65]}, {"s": "Men det er heller ikke meningen.", "src": "2023v L1", "m": [11, 22]}, {"s": "Heller ikke selvom de både har en god uddannelse og har lyst til at gå i gang med en karriere.", "src": "2023s L2", "m": [0, 11]}, {"s": "Odense Havn var heller ikke så vigtig mere.", "src": "2021v L1", "m": [16, 27]}, {"s": "Er der en løsning, der ikke involverer, at staten skal regulere, hvad vi spiser, og som heller ikke lægger hele ansvaret over på forbrugeren?", "src": "2021s L2", "m": [88, 99]}, {"s": "Selve undervisningen blev jeg bestemt heller ikke skuffet over, for underviseren er meget dygtig.", "src": "2020v L1", "m": [38, 49]}, {"s": "Det er heller ikke alle aftenskoler, der holder lærermøder – for det kan blandt andet være svært at finde et tidspunkt, hvor alle skolens undervisere kan mødes.", "src": "2020v L1", "m": [7, 18]}, {"s": "Man har måske heller ikke styr på den elektroniske udvikling og hvilke værktøjer, der måske kan gøre ens undervisning endnu bedre.", "src": "2020v L1", "m": [14, 25]}], "hverken_eller": [{"s": "Her findes også bænke og borde, hvor man kan nyde sin medbragte mad, mens man lytter til fuglene eller den brusende Gudenå.", "src": "2024s L1", "m": [97, 102]}, {"s": "Det er en kulisse for shoppingoplevelser, som hverken nettet eller et moderne shoppingcenter kan konkurrere med.", "src": "2024s L2", "m": [46, 66]}, {"s": "Øens lange kystlinje kan også opleves fra fx havkajak, og fra kysten eller fra båd kan man teste fiskelykken på Østersøens mange havørreder.", "src": "2023v L1", "m": [69, 74]}, {"s": "I stedet for et sideskib har rundkirken en central kerne, der enten er rund eller ottekantet.", "src": "2023v L1", "m": [76, 81]}, {"s": "Men der er ikke tale om rejsebeskrivelse af hverken øen, himlen eller havet omkring Bornholm, men derimod om en fantasifuld fortælling fortalt af en til tider ret vidtløftig fortællerstemme.", "src": "2023v L1", "m": [44, 69]}, {"s": "Eller at man har en ubændig trang til at binde andre en røverhistorie på ærmet.", "src": "2023v L1", "m": [0, 5]}, {"s": "Det er karakteristisk for romanen, at dens mange fortællinger godt kunne være virkelige eller tage udgangspunkt i rigtige begivenheder.", "src": "2023v L1", "m": [88, 93]}, {"s": "Den stilistik, som romanen forsøger at efterligne, er nemlig den, der hersker i den mundtlige fortælling, i anekdoten eller skrønen.", "src": "2023v L1", "m": [118, 123]}], "men": [{"s": "Byen hed ikke oprindeligt Viborg men Vibjerg, der betyder ’det hellige sted på bakken’.", "src": "2024s L1", "m": [33, 36]}, {"s": "Viborg blev i middelalderen domkirkeby, men var allerede tilbage i vikingetiden et religiøst mødested for hele Jylland.", "src": "2024s L1", "m": [40, 43]}, {"s": "Desuden havde byen god indtjening på studeeksport, men byens placering inde i landet var et permanent problem.", "src": "2024s L1", "m": [51, 54]}, {"s": "I dag er industriens største branche jern- og metalindustrien, men servicesektoren er blevet endnu vigtigere.", "src": "2024s L1", "m": [63, 66]}, {"s": "Men det er også den eneste gang, Sven ikke har været med, og vi regner med at være med i mange år endnu.", "src": "2024s L1", "m": [0, 3]}, {"s": "Men så blev jeg tømrer, og da jeg fik mit eget firma, stoppede jeg.", "src": "2024s L1", "m": [0, 3]}, {"s": "Nu er jeg pensionist og arbejder ikke længere, men interessen for fodbold har jeg stadig.", "src": "2024s L1", "m": [47, 50]}, {"s": "Men det er ikke kun i fodbold, Viborg klarer sig rigtigt godt som sportsby.", "src": "2024s L1", "m": [0, 3]}], "dog": [{"s": "Jeg ser nogle gange deres kampe, dog kun på tv, så det er ikke kun fodbold, jeg følger.", "src": "2024s L1", "m": [33, 36]}, {"s": "Det kan selvfølgelig virke lidt afskrækkende.” Der er dog oftest noget andet på spil, der vejer tungere.", "src": "2024s L2", "m": [54, 57]}, {"s": "Der er dog stadig en vis modstand blandt visse arbejdsgivere mod en fire-dages arbejdsuge.", "src": "2024s L2", "m": [7, 10]}, {"s": "Det er dog ikke kun politisk, der kan gøres en indsats.", "src": "2024s L2", "m": [7, 10]}, {"s": "En stor del af området er dog fredet og bør derfor ikke benyttes til klatring.", "src": "2023v L1", "m": [26, 29]}, {"s": "Det er dog lettere sagt end gjort.", "src": "2023v L2", "m": [7, 10]}, {"s": "Man kan dog tjekke kvaliteten hos uafhængige testvirksomheder, hvor man kan læse gratis analyser og anmeldelser af blandt andet de antivirusprogrammer, man kan finde på nettet.", "src": "2023v L2", "m": [8, 11]}, {"s": "Det var dog ikke det smarteste træk.", "src": "2023s L1", "m": [8, 11]}], "mens": [{"s": "Her findes også bænke og borde, hvor man kan nyde sin medbragte mad, mens man lytter til fuglene eller den brusende Gudenå.", "src": "2024s L1", "m": [69, 73]}, {"s": "De stejle klippevægge i nord byder på flere gode klatreruter, mens den sydlige del af øen rummer en række gode og populære badestrande.", "src": "2023v L1", "m": [62, 66]}, {"s": "Midt i det hele står den 25-årige Nancy, som arbejder på et bosted for udsatte, mens hun går på HF.", "src": "2023v L1", "m": [80, 84]}, {"s": "For ikke så mange årtier siden mente de fleste nok ikke, at det var relevant at læse kinesisk, mens de fleste er af den modsatte opfattelse i dag.", "src": "2023v L2", "m": [95, 99]}, {"s": "I zone 1 var der tydeligt dansk flertal, mens der i zone 2 var tysk flertal.", "src": "2023s L1", "m": [41, 45]}, {"s": "En tredjedel af dem mente, allerede mens de var studerende, at deres handicap ville få en betydning for, om de overhovedet kunne få et job.", "src": "2023s L2", "m": [36, 40]}, {"s": "Men det er selvfølgelig ærgerligt, at der er så mange studerende med et handicap, der tror noget andet, mens de læser.", "src": "2023s L2", "m": [104, 108]}, {"s": "Af disse er Aggersborg den største, mens Trelleborg er langt den bedst bevarede og i øvrigt den eneste med en befæstet forborg.", "src": "2022v L1", "m": [36, 40]}], "tværtimod": [{"s": "Han føler tværtimod, at han er skabt til noget stort.", "src": "2023v L1", "m": [10, 19]}, {"s": "Det betyder dog ikke, at hun har fortrudt et øjeblik – tværtimod: Det var det helt rigtige.", "src": "2020v L2", "m": [55, 64]}, {"s": "Formanden for Bibliotekarforbundet, Pernille Drost, peger tværtimod på, at der er tale om en afvikling.", "src": "2014s L2", "m": [58, 67]}], "i_modsætning_til": [{"s": "I modsætning til nettet og storcentrene rummer mange byer gamle, smukke huse og en historie, der går langt tilbage i tiden.", "src": "2024s L2", "m": [0, 16]}, {"s": "Derfor forekom sult og sygdom stort set ikke i Frøslevlejren – i modsætning til i andre tyske lejre.", "src": "2023s L1", "m": [63, 79]}, {"s": "Derfor valgte han til sidst at starte sit eget snedkerværksted. ”I modsætning til de fleste andre værksteder, satser jeg ikke på nye møbler.", "src": "2022v L2", "m": [65, 81]}, {"s": "Kurserne afsluttes i modsætning til i det formelle uddannelsessystem ikke med en eksamen efter endt kursus.", "src": "2020v L1", "m": [19, 35]}, {"s": "De kan blandt andet relativt nemt ansætte og fyre medarbejdere i modsætning til i mange andre lande, hvor der er strengere regler.", "src": "2020v L2", "m": [63, 79]}, {"s": "I modsætning til de kortere løb er mændene klart mere aktive end kvinderne i de længere løb og til ironman.", "src": "2015v L2", "m": [0, 16]}], "i_stedet_for": [{"s": "I stedet for et sideskib har rundkirken en central kerne, der enten er rund eller ottekantet.", "src": "2023v L1", "m": [0, 12]}, {"s": "Og afdelingen gik jo ikke i stå, fordi jeg trak mig lidt og i stedet bad medarbejderne klare flere opgaver selv.", "src": "2023v L2", "m": [60, 68]}, {"s": "Det var således ikke tilladt at nyde alkohol, fx den traditionelle kaffepunch, så danskerne begyndte i stedet at mødes til kaffe- og kagebord.", "src": "2023s L1", "m": [101, 109]}, {"s": "Da intet forsamlingshus havde kapacitet til at lave kager til så mange mennesker, medbragte deltagerne i stedet for selv kager til et fælles kaffebord.", "src": "2023s L1", "m": [103, 115]}, {"s": "Hun fik i stedet et job som SoMe-redaktør på et stort forlag i København.", "src": "2022s L2", "m": [8, 16]}, {"s": "Anne Lund medgiver, at selve ordet ’personlighedstest’ er uheldigt. ”Man burde kalde det en personlighedsprofil i stedet.", "src": "2022s L2", "m": [112, 120]}, {"s": "I stedet for at få karakterer har eleverne fået en feedback fra læreren med fokus på, hvor eleverne har udviklet sig i de forskellige fag.", "src": "2021v L2", "m": [0, 12]}, {"s": "Han mener, at man bør se mere på de problemer, de unge har, i stedet for at skyde skylden på de sociale medier som årsag til problemerne.", "src": "2021v L2", "m": [60, 72]}], "på_den_ene_side_på_den_anden_side": [{"s": "De daglige ture med Kvik i skoven på den anden side af vejen er næsten det hele værd,” siger Lars og fortsætter: ”Vi har også mødt mange nye mennesker.", "src": "2018v L2", "m": [34, 51]}, {"s": "På den anden side kan der også være en karrieremæssig fordel ved at flytte med.", "src": "2018v L2", "m": [0, 17]}, {"s": "Men på den anden side havde vi et godt fællesskab i min gamle klasse.", "src": "2016s L2", "m": [4, 21]}], "skønt": [{"s": "Det er skønt, når man bor i lejlighed, at der er større udearealer, hvor børnene kan brænde noget energi af.", "src": "2024s L1", "m": [7, 12]}, {"s": "Det var en super god oplevelse, for der er skønt og hyggeligt i bøgeskoven i Skanderborg.", "src": "2019s L1", "m": [43, 48]}], "ikke_desto_mindre": [{"s": "Ikke desto mindre er en offensiv markedsføring stadig en del af forbundenes virkelighed i dag, bl.a. på sociale medier.", "src": "2020v L1", "m": [0, 17]}], "ganske_vist": [{"s": "Ingen ved ganske vist, hvordan vikingernes mad smagte, da der ikke er bevaret opskrifter fra den tid.", "src": "2022v L1", "m": [10, 21]}], "trods_på_trods_af": [{"s": "På trods af et større budget og stjerneskuespillere fra Hollywood, så formåede filmen ikke at begejstre publikum og anmeldere på samme måde, som det danske forlæg havde gjort det.", "src": "2019v L1", "m": [0, 11]}, {"s": "Der er en lang række højskoler, som på trods af navnet ikke er folkehøjskoler.", "src": "2018v L1", "m": [36, 47]}, {"s": "Trods de mange nye tilbud falder udlånet på bibliotekerne overalt i Danmark – også i Århus.", "src": "2014s L2", "m": [0, 5]}], "hvis": [{"s": "Det anbefales, at man bruger en lommelygte, hvis man vil gå på opdagelse i de mørke minegange.", "src": "2024s L1", "m": [44, 48]}, {"s": "Der er konkurrence om de kvalificerede medarbejdere, og undersøgelser viser, at medarbejderne bliver mere loyale over for virksomheden, hvis de ikke skal arbejde så mange timer.", "src": "2024s L2", "m": [136, 140]}, {"s": "Hvis de for eksempel ikke har mulighed for at have så mange varer på lager i butikken, kan de tilbyde at fremskaffe dem inden for 24 timer og levere dem til døren.", "src": "2024s L2", "m": [0, 4]}, {"s": "De kan også tilbyde samme pris som en netbutik, hvis den fysiske butik ikke umiddelbart matcher den pris man kan få online.", "src": "2024s L2", "m": [48, 52]}, {"s": "Nancy er noget så eksotisk som en dansk roman om undergang, hvis handling udspiller sig på Bornholm og kombinerer mytologi og hverdagsrealisme: En mystisk tåge lægger sig pludselig om Bornholm.", "src": "2023v L1", "m": [60, 64]}, {"s": "Det er blevet sagt, at man som ny leder hurtigt må lære at svømme, hvis man ikke vil synke til bunds.", "src": "2023v L2", "m": [67, 71]}, {"s": "På nettet er der hackere fra hele verden, der er parate til at misbruge alle tænkelige slags oplysninger, hvis de kan: cpr-numre, MitID, oplysninger om konti og betalingskort, firmahemmeligheder m.m.", "src": "2023v L2", "m": [106, 110]}, {"s": "Det kan alt sammen være svært at overskue, hvis man ikke er særlig it-interesseret.", "src": "2023v L2", "m": [43, 47]}], "såfremt": [{"s": "Såfremt der er ledige pladser, optager vi også kursister i august inden studiestart.", "src": "2016v L1", "m": [0, 7]}, {"s": "Mentor Såfremt UU vurderer, at du har behov for støtte for at starte og gennemføre en ungdomsuddannelse eller 10. klasse,, kan du få hjælp af en mentor.", "src": "2015s L1", "m": [7, 14]}], "medmindre": [{"s": "Tagbokse af hård plast er som udgangspunkt velkomne, medmindre personalet på dagen vurderer det anderledes.", "src": "2017v L1", "m": [53, 62]}], "for_at": [{"s": "Kunstneren Joakim Skovgaard har udsmykket Viborg Domkirke, og museet er oprettet for at hædre ham og hans familie, hvoraf mange var kunstnere.", "src": "2024s L1", "m": [81, 87]}, {"s": "Man har også mulighed for at stille sulten og slukke tørsten i den hyggelige Café Kridthuset.", "src": "2024s L1", "m": [22, 28]}, {"s": "Her mødes tusinder af mennesker som i gamle dage, hvor man kom fra hele Jylland for at handle og feste og for måske at få afgjort nogle uenigheder på Tinge.", "src": "2024s L1", "m": [80, 86]}, {"s": "Ved tilmelding har man mulighed for at bestille og købe en række tilvalg i forhold til indkvartering og forplejning.", "src": "2024s L1", "m": [32, 38]}, {"s": "I det område, hvor alle ruter starter og slutter, er der derudover hele weekenden masser af muligheder for at købe mad og drikke for dem, der ikke har forudbestilt mad hjemmefra.", "src": "2024s L1", "m": [103, 109]}, {"s": "Når Viborg spiller på hjemmebane, så er jeg altid på stadion for at støtte dem.", "src": "2024s L1", "m": [61, 67]}, {"s": "Og de er næsten lige så glade for at lege på legepladsen og skøjte på skøjtebanen, som anlægges midt i parken om vinteren.", "src": "2024s L1", "m": [30, 36]}, {"s": "Bymidterne har historisk været et sted, hvor folk mødtes på torve og markeder for at handle og blive underholdt.", "src": "2024s L2", "m": [78, 84]}], "så_at": [{"s": "Kunstneren Joakim Skovgaard har udsmykket Viborg Domkirke, og museet er oprettet for at hædre ham og hans familie, hvoraf mange var kunstnere.", "src": "2024s L1", "m": [85, 87]}, {"s": "Det anbefales, at man bruger en lommelygte, hvis man vil gå på opdagelse i de mørke minegange.", "src": "2024s L1", "m": [15, 17]}, {"s": "Året rundt er der kun otte grader i kalkgruberne, så det anbefales, at man har varmt tøj på.", "src": "2024s L1", "m": [50, 52]}, {"s": "Man har også mulighed for at stille sulten og slukke tørsten i den hyggelige Café Kridthuset.", "src": "2024s L1", "m": [26, 28]}, {"s": "En mangeårig tradition er, at der i Viborg i hærvejsugen op til og under marchen arrangeres en stor byfest på pladser og torve i den gamle, historiske by.", "src": "2024s L1", "m": [27, 29]}, {"s": "Her mødes tusinder af mennesker som i gamle dage, hvor man kom fra hele Jylland for at handle og feste og for måske at få afgjort nogle uenigheder på Tinge.", "src": "2024s L1", "m": [84, 86]}, {"s": "Ved tilmelding har man mulighed for at bestille og købe en række tilvalg i forhold til indkvartering og forplejning.", "src": "2024s L1", "m": [36, 38]}, {"s": "I det område, hvor alle ruter starter og slutter, er der derudover hele weekenden masser af muligheder for at købe mad og drikke for dem, der ikke har forudbestilt mad hjemmefra.", "src": "2024s L1", "m": [107, 109]}], "med_henblik_på": [{"s": "Den Gamle By ansætter derfor typisk ekstra timelønnet assistance i publikumsafdelingerne og på restaurationsområdet i oktober med henblik på julen.", "src": "2017s L1", "m": [126, 140]}, {"s": "Hvis vi mod forventning ikke kan efterkomme dit ønske, kontakter vi dig med alternative forslag, eller med henblik på at refundere dit depositum.", "src": "2016s L1", "m": [103, 117]}, {"s": "Diagrammet nedenfor viser dine valg- muligheder med henblik på valg af ungdomsuddannelse.", "src": "2015v L1", "m": [48, 62]}, {"s": "Derudover er der fokus på udvalgte elementer fx vejledning og afklaring om uddannelsesvalg, ekstra træning eller højere niveauer i grundfag med henblik på mulighed for videreuddannelse.", "src": "2013s L1", "m": [140, 154]}], "undtagen": [{"s": "Butikken har åbent alle dage undtagen mandag: på hverdage 9:00-22:00, lørdag 10:45-22:00 og søndag 10:45-19:30.", "src": "2019v L1", "m": [29, 37]}, {"s": "Dyrene var en fantastisk oplevelse – undtagen isbjørnen, som gemte sig.", "src": "2017v L1", "m": [37, 45]}], "frem_for": [{"s": "Pia Lehman er glad for, at hun tog springet ud i noget nyt, og at hun fandt frem til noget, hun hellere ville.", "src": "2024s L2", "m": [76, 80]}, {"s": "Vikingeskibsmuseet vil holde åbent, helt frem til det nye museum står klar.", "src": "2022v L1", "m": [41, 45]}, {"s": "Jeg rejser rundt til vikingemarkeder og vikingefestivaler, hvor jeg viser mine varer frem og fortæller om baggrunden for og produktionen af dem – og så sælger jeg dem selvfølgelig.", "src": "2022v L1", "m": [85, 89]}, {"s": "Frem for at arbejde 37 timer om ugen for en arbejdsgiver et sted, hvor man måske ikke har særlig meget indflydelse eller selvbestemmelse, vil de gerne være iværksættere.", "src": "2022v L2", "m": [0, 8]}, {"s": "Og kom helt tæt på Odense og Fyn – lige fra Oldtiden og frem til i dag – i museets udstillinger og børnemuseet Histotoriet, hvor alt må røres og prøves.", "src": "2021v L1", "m": [56, 60]}, {"s": "Det betød, at skibstransport mistede betydning, og landtransport vandt frem.", "src": "2021v L1", "m": [71, 75]}, {"s": "Dresscode Du behøver ikke finde de lange silkehandsker og butterflyen frem for at komme ind på Store Scene.", "src": "2021s L1", "m": [70, 78]}, {"s": "Samlingen omfatter musikinstrumenter fra Europa, Asien og Afrika fra bronzealderen og frem til vor tid.", "src": "2020s L1", "m": [86, 90]}], "for_eksempel_fx": [{"s": "De ti udvalgte byer har for eksempel tænkt velfærdsfunktioner som biblioteker og borgerservice ind i deres planer for nyt liv i bymidterne.", "src": "2024s L2", "m": [24, 36]}, {"s": "Hvis de for eksempel ikke har mulighed for at have så mange varer på lager i butikken, kan de tilbyde at fremskaffe dem inden for 24 timer og levere dem til døren.", "src": "2024s L2", "m": [8, 20]}, {"s": "I dag er det meste af Højlyngen forsvundet, men i fx Rutsker Højlyng kan man stadig finde små rester af det gamle bornholmske hedelandskab.", "src": "2023v L1", "m": [50, 52]}, {"s": "Øens lange kystlinje kan også opleves fra fx havkajak, og fra kysten eller fra båd kan man teste fiskelykken på Østersøens mange havørreder.", "src": "2023v L1", "m": [42, 44]}, {"s": "Det skal fx også indeholde et spamfilter, der kan sortere uønskede mails fra.", "src": "2023v L2", "m": [9, 11]}, {"s": "For eksempel er uddannelse gratis, og studerende kan få SU, og efter endt uddannelse kan man som nyuddannet også modtage dagpenge.", "src": "2023v L2", "m": [0, 12]}, {"s": "En uddannelse som filosofi udbydes fx fem steder i landet, selvom der er høj ledighed blandt nyuddannede.", "src": "2023v L2", "m": [35, 37]}, {"s": "Det gælder fx David Budtz Pedersen, professor ved Institut for Kommunikation og Psykologi på Aalborg Universitet.", "src": "2023v L2", "m": [11, 13]}], "eksempelvis": [{"s": "Arbejdsdagen kan eksempelvis blive mere fokuseret og effektiv.", "src": "2022s L2", "m": [17, 28]}, {"s": "I kan også se flere forskellige udstilling er, eksempelvis Fyn – midt i verden, Byens liv og Børnenes baggård.", "src": "2021v L1", "m": [47, 58]}, {"s": "I løbet af året afholdes der forskellige arrangementer, eksempelvis Ulddag, Morgenvækning af dyrene og Håndværkerdag.", "src": "2021v L1", "m": [56, 67]}, {"s": "Eksempelvis præsenterer Biffen Nordkraft hvert år en eller to udvalgte film gratis for foreningen.", "src": "2019v L1", "m": [0, 11]}, {"s": "Gangstierne i de anlæg, som er beregnet for gående trafik, eksempelvis ved anlæg hos lemurer og kænguruer, er grusbelagte og kan benyttes af kørestolsbrugere.", "src": "2017v L1", "m": [59, 70]}, {"s": "Der er desuden rig mulighed for at kombinere arrangementet med eksempelvis en rundvisning, ølsmagning i det historiske bryggeri, musik under middagen, skattejagter og meget mere.", "src": "2017s L1", "m": [63, 74]}, {"s": "Eksempelvis er det en god idé på forhånd at aftale, hvilken mad der skal serveres, og hvor mange retter der skal på bordet.", "src": "2016v L2", "m": [0, 11]}, {"s": "Mulighederne er mange; du kan eksempelvis arbejde på et hospital i Mexico, på et abe-rehabiliteringscenter i Argentina, eller på et center for handicappede børn i Bolivia, og meget mere.", "src": "2016s L1", "m": [30, 41]}], "især": [{"s": "I landsbyen kan man følge jernalderfolkets daglige gøremål, hvor især madlavningen tager tid.", "src": "2024s L1", "m": [65, 69]}, {"s": "Det gør byen i høj grad også i håndbold, især kvinderne har succes.", "src": "2024s L1", "m": [41, 45]}, {"s": "Jeg er især vild med Borgvold.", "src": "2024s L1", "m": [7, 11]}, {"s": "Der kommer især kunstnere inden for rytmisk musik.", "src": "2024s L1", "m": [11, 15]}, {"s": "Selvom der især spilles rytmisk musik, har vi også en gang imellem klassiske koncerter.", "src": "2024s L1", "m": [11, 15]}, {"s": "Butikkerne har nemlig især i de mindre byer, hvor der heller ikke er storcentre, en vigtig rolle for folks psykiske og fysiske velvære.", "src": "2024s L2", "m": [22, 26]}, {"s": "Da Mimi fik job og flyttede til Tønder med sin mand, Jon, var udfordringen i begyndelsen, at de især var bekymrede for, om livskvaliteten i Sønderjylland kunne leve op til deres forventninger.", "src": "2023s L1", "m": [96, 100]}, {"s": "De har sammen ansvaret for en stor afdeling i virksomheden, men får også tid til at tale om ledelse generelt, og hvad de hver især gør for at blive bedre ledere.", "src": "2023s L2", "m": [126, 130]}], "det_vil_sige_dvs": [{"s": "Det tyske mindretal opfatter sig selv som tyske nordslesvigere, det vil sige som danske statsborgere med tysk identitet og stærk forankring i den sønderjyske region.", "src": "2023s L1", "m": [64, 76]}, {"s": "Det vil sige, at man byggede fabrikker, som kunne støbe jern, og fabrikker som brugte dampmaskiner som energi til for eksempel vævemaskiner.", "src": "2021v L1", "m": [0, 12]}, {"s": "Det vil sige, at vi fordyber os i kortere tid ad gangen, i skiftende aktiviteter og i midlertidige fællesskaber, der passer ind i vores liv nu og her.", "src": "2020v L1", "m": [0, 12]}, {"s": "Det vil sige, at man fx normalt er sikret overenskomstbestemte løn- og arbejdsvilkår, hvis man er ansat i en fast stilling.", "src": "2020v L2", "m": [0, 12]}, {"s": "Det vil sige, at de udenlandske studerende set i det lange perspektiv bidrager økonomisk til det danske samfund.", "src": "2020s L2", "m": [0, 12]}, {"s": "En ansøgning om opholdstilladelse indgives i ansøgerens hjemland, normalt ved en dansk repræsentation, dvs. en ambassade eller et generalkonsulat.", "src": "2018v L1", "m": [103, 107]}, {"s": "Kursusforløbet retter sig primært mod AMUmålgruppen – dvs. personer med en uddannelsesbaggrund til og med erhvervsuddannelsesniveauet og nogen erfaring med administrative opgaver.", "src": "2018s L1", "m": [54, 58]}, {"s": "Der er brug for mere klarhed omkring, hvad det vil sige at være en dygtig topleder, og hvordan arbejdslivet kan indrettes.", "src": "2018s L2", "m": [43, 55]}], "med_andre_ord": [{"s": "De ser med andre ord ingen problemer, de ikke kan løse i fællesskab, hverken på kort eller langt sigt.", "src": "2018s L2", "m": [7, 20]}, {"s": "Med andre ord kan du ”hoppe af og på” vores projekter når det bedst passer dig.", "src": "2016s L1", "m": [0, 13]}, {"s": "Med andre ord, du kan prøve din teori af i praksis samtidig med at du oplever forholdene i et udviklingsland.", "src": "2016s L1", "m": [0, 13]}, {"s": "Mulighederne er med andre ord uendelige!", "src": "2016s L1", "m": [16, 29]}, {"s": "Med andre ord: Du får en uddannelse, du bliver stolt af.", "src": "2013s L1", "m": [0, 13]}], "herunder": [{"s": "Nationalmuseet har i dag en lang række afdelinger rundt omkring i hele landet, herunder både museer og slotte, blandt andre: Frihedsmuseet, Frilandsmuseet, Musikmuseet, Kongernes Jelling og Frøslevlejrens Museum.", "src": "2020s L1", "m": [79, 87]}, {"s": "Herunder finder du svar på de spørgsmål, vi oftest får stillet om sæsonarbejde i Universe.", "src": "2018s L1", "m": [0, 8]}, {"s": "Hvis studievejlederen er i tvivl om dine faglige, herunder dansksproglige forudsætninger, får du et tilbud om en vejledende optagelsesprøve.", "src": "2016v L1", "m": [50, 58]}, {"s": "Studieaktivitet og mødepligt Der er krav om studieaktivitet herunder mødepligt.", "src": "2016v L1", "m": [60, 68]}, {"s": "om uddannelsen Uddannelsen giver dig et indgående varekendskab til fisk og skaldyr herunder fiskearter, fiskeri- og opdrætsmetoder samt køb og salg af fisk og skaldyr.", "src": "2015v L1", "m": [83, 91]}, {"s": "Se beskrivelser og optagelseskrav på de enkelte uddannelser herunder.", "src": "2015s L1", "m": [60, 68]}, {"s": "Om uddannelsen Uddannelsen består af elementer af undervisning, træning og praktiske aktiviteter, herunder bo-undervisning og praktik i virksomheder og institutioner.", "src": "2013s L1", "m": [98, 106]}, {"s": "I Vejlby gennemføres uddannelsen til landmand samt landbrugets lederuddan- nelse (produktionsleder, virksomhedsleder, agrarøkonom) og uddannelsen til jordbrugsteknolog i samarbejde med Erhvervsakademi Aarhus, herunder internationale uddannelser inden for landbrug og miljø.", "src": "2013s L1", "m": [209, 217]}], "heldigvis": [{"s": "Det er der heldigvis råd for!", "src": "2023s L1", "m": [11, 20]}, {"s": "Men heldigvis er der mange, der har fået et helt almindeligt arbejde og derfor ikke længere får støtte fra det offentlige.", "src": "2023s L2", "m": [4, 13]}, {"s": "Heldigvis hjalp Strynøs bosætningsgruppe os fra starten.", "src": "2022s L1", "m": [0, 9]}, {"s": "Heldigvis kan de fleste unge, både drenge og piger, lære at prioritere deres opgaver, give sig selv lov til at restituere og være åbne overfor, hvad fremtiden kan bringe.", "src": "2021v L2", "m": [0, 9]}, {"s": "Mit højskoleophold var helt afgørende for, at jeg efterfølgende valgte at læse teologi, som heldigvis bare er det perfekte studie for mig.", "src": "2018v L1", "m": [92, 101]}, {"s": "Da beslutningen om at flytte var taget, begyndte Lars at søge nyt job i Nordjylland, og han fik heldigvis hurtigt et job på Hjørring Gymnasium.", "src": "2018v L2", "m": [96, 105]}, {"s": "Så kan Peters mor heldigvis passe Sofie.", "src": "2018s L2", "m": [18, 27]}, {"s": "Det var ekstremt varmt, så han blev nødt til at drikke en masse for ikke at dehydrere, men det var han heldigvis forberedt på.", "src": "2015v L2", "m": [103, 112]}], "desværre": [{"s": "Rundvisningerne er desværre ikke egnede til gangbesværede.", "src": "2023s L1", "m": [19, 27]}, {"s": "Desværre er der ikke lige så mange, der ved, hvordan man bliver selvstændig og får sin egen forretning op at køre.", "src": "2022v L2", "m": [0, 8]}, {"s": "Men det er desværre ikke tilladt, sådan som lovgivningen ser ud i dag.", "src": "2022v L2", "m": [11, 19]}, {"s": "”Jeg skulle selv arrangere opholdet, for Københavns Professionshøjskole havde desværre ikke noget samarbejde med dem\", fortæller han videre, ”og det var et stort arbejde.", "src": "2020s L2", "m": [78, 86]}, {"s": "Det er desværre ikke nok blot at afmontere cyklen - også stativet skal af.", "src": "2017v L1", "m": [7, 15]}, {"s": "Kontakt os for at for at høre mere. • Vi kan desværre ikke rådgive omkring vaccinationer, da vi ikke er kvalificerede på dette område.", "src": "2016s L1", "m": [45, 53]}], "naturligvis": [{"s": "Den erfaring har de fleste nok gjort sig, og de fleste har naturligvis begået nogle begynderfejl undervejs.", "src": "2023v L2", "m": [59, 70]}, {"s": "Odense ZOO er naturligvis et oplagt valg, hvad enten I skal på familieudflugt, en kærestetur eller en hyggelig dag med vennerne, og havens muligheder er mange.", "src": "2021v L1", "m": [14, 25]}, {"s": "Man får naturligvis refunderet det beløb, man ikke har brugt på kortet, i samme bar.", "src": "2021v L1", "m": [8, 19]}, {"s": "Du kan naturligvis også sende et brev med beskrivelse og billeder med posten.", "src": "2017s L1", "m": [7, 18]}, {"s": "Vi tilrettelægger naturligvis arrangementerne efter jeres ønsker og behov.", "src": "2017s L1", "m": [18, 29]}, {"s": "Vores praktikophold kan være meritgivende på videregående uddannelser – du er selv ansvarlig for at søge merit på den pågældende uddannelsesinstitution, men vi er naturligvis behjælpelige så vidt muligt.", "src": "2016s L1", "m": [163, 174]}, {"s": "Uanset hvilken løsning du vælger, vil du naturligvis blive hentet i lufthavnen af vort lokale personale, og fulgt til dit projekt.", "src": "2016s L1", "m": [41, 52]}, {"s": "Størstedelen af vores projekter kræver ingen særlige sprogkundskaber, selvom det naturligvis altid er en fordel at lære sig nogle basale fraser inden afrejse.", "src": "2016s L1", "m": [81, 92]}], "faktisk": [{"s": "Sandet på Dueodde strand er indbydende og ultrafint – faktisk så fint, at det har været brugt til timeglas.", "src": "2023v L1", "m": [54, 61]}, {"s": "Men ofte viser det sig, at frygten er ubegrundet. ”Det voldte faktisk ikke de store problemer, da det kom til stykket.", "src": "2023v L2", "m": [62, 69]}, {"s": "For mange unge mennesker er en verden uden internet faktisk helt utænkelig.", "src": "2023v L2", "m": [52, 59]}, {"s": "Den forholdsvis lave søgning til de tekniske bacheloruddannelser er et problem, for der er faktisk mangel på unge med den type uddannelse.", "src": "2023v L2", "m": [91, 98]}, {"s": "Men det var faktisk ikke så svært for Peter at finde job og gøre karriere, for selvom der er færre stillinger, så er der også færre ansøgere.", "src": "2023s L1", "m": [12, 19]}, {"s": "klagesag faktisk ende med, at projekter ikke blot trækker ud, men helt må opgives.", "src": "2023s L2", "m": [9, 16]}, {"s": "Nogle gange kan en klagesag faktisk ende med, at projekter ikke blot trækker ud, men helt må opgives.", "src": "2023s L2", "m": [28, 35]}, {"s": "For nogle danskere er vikingekulturen faktisk også blevet en hobby.", "src": "2022v L1", "m": [38, 45]}], "overraskende_nok": [{"s": "Overraskende nok kunne 15 ud af 18 fortælle, at deres handicap enten har lille eller slet ingen betydning for deres arbejdsliv.", "src": "2023s L2", "m": [0, 16]}], "når": [{"s": "Den er desuden verdens største granitkirke, som man kan besøge, når der ikke er kirkelige handlinger.", "src": "2024s L1", "m": [64, 67]}, {"s": "Når man har tilmeldt sig som deltager til årets hærvejsmarch, modtager man en kvittering for sin betaling.", "src": "2024s L1", "m": [0, 3]}, {"s": "Man kan på forhånd bestille og købe morgen- og aftensmad til marchdagene, når man tilmelder sig online.", "src": "2024s L1", "m": [74, 77]}, {"s": "Når Viborg spiller på hjemmebane, så er jeg altid på stadion for at støtte dem.", "src": "2024s L1", "m": [0, 3]}, {"s": "Det er skønt, når man bor i lejlighed, at der er større udearealer, hvor børnene kan brænde noget energi af.", "src": "2024s L1", "m": [14, 17]}, {"s": "Når arbejdsugen og weekenden er næsten lige lange, kan man nå at komme ned i gear og få tankerne et helt andet sted hen, når man har fri.", "src": "2024s L2", "m": [0, 3]}, {"s": "Og man har også typisk mere overskud til at arbejde koncentreret, når man er på arbejde.", "src": "2024s L2", "m": [66, 69]}, {"s": "Når det kommer til forhistorien og arkæologien, er Bornholm også et kapitel for sig som det sted, hvor vi har de fleste og rigeste fund.", "src": "2023v L1", "m": [0, 3]}], "inden": [{"s": "Der kommer især kunstnere inden for rytmisk musik.", "src": "2024s L1", "m": [26, 31]}, {"s": "Det gælder ikke mindst inden for de områder, hvor der er mangel på arbejdskraft.", "src": "2024s L2", "m": [23, 28]}, {"s": "Hvis de for eksempel ikke har mulighed for at have så mange varer på lager i butikken, kan de tilbyde at fremskaffe dem inden for 24 timer og levere dem til døren.", "src": "2024s L2", "m": [120, 125]}, {"s": "Ud over de permanente udstillinger er der året igennem temaudstillinger inden for kunst, design og kunsthåndværk.", "src": "2023v L1", "m": [72, 77]}, {"s": "I dag symboliserer kilden oplevelser, rekreation og åndelig udvikling, og kilden løber nu gennem museumsbygningen, inden den ledes ud i Østersøen.", "src": "2023v L1", "m": [115, 120]}, {"s": "Her kan du møde spændende forfattere inden for mange genrer – de fleste er nogle, som festivalen har hentet uden for Bornholm, men selvfølgelig bliver der også præsenteret bornholmske forfattere.", "src": "2023v L1", "m": [37, 42]}, {"s": "Madkultur Du vil opdage, at det ikke er uden grund, at Bornholm har markeret sig så stærkt inden for gourmet gennem snart en længere årrække.", "src": "2023v L1", "m": [91, 96]}, {"s": "Jon er amerikaner og højtuddannet, men det tog lang tid, inden han kom i job.", "src": "2023s L1", "m": [57, 62]}], "efter_at": [{"s": "Er du nysgerrig efter at vide, hvilke attraktioner i Odense der uden tvivl er et besøg værd?", "src": "2021v L1", "m": [16, 24]}, {"s": "De fleste kender den friskhed, man føler efter at have brugt sin krop.", "src": "2018v L2", "m": [41, 49]}, {"s": "efter at have brugt sin krop.", "src": "2018v L2", "m": [0, 8]}, {"s": "Men efter at have researchet lidt på det fik også han øje på det potentiale, som Sørens idé gemte på.", "src": "2017v L2", "m": [4, 12]}, {"s": "“Helt fra starten har de lokale kolleger været meget ivrige efter at involvere os i arbejdet.", "src": "2016s L1", "m": [60, 68]}, {"s": "Ofte er tavle og kridt de eneste materialer i klasseværelset, men du vil blive varmt modtaget af eleverne, der er ivrige efter at suge ny viden til sig!", "src": "2016s L1", "m": [121, 129]}, {"s": "Efter at have trænet et stykke tid tilmeldte han sig sit livs første maratonløb1.", "src": "2015v L2", "m": [0, 8]}, {"s": "Næste dag skrev jeg til en lægebrevkasse og fik nogle dage efter at vide, at der ikke er nogen forskning, der viser, at det skulle være farligt med korte fasteperioder.", "src": "2014v L2", "m": [59, 67]}], "efterhånden_som": [{"s": "Trine Sundsvald tog blot sine projekter med sig, og efterhånden som de bliver løst, overtager hun nye.", "src": "2020v L2", "m": [52, 67]}], "siden": [{"s": "Ved siden af caféen ligger flagermuslegepladsen, hvor børnene kan klatre og lege på de fem flagermusarter, der overvintrer i kalkgruberne.", "src": "2024s L1", "m": [4, 9]}, {"s": "Da Hærvejsmarchen så første gang blev holdt, var jeg ikke i tvivl om, at jeg skulle være med, og det har jeg så været lige siden.", "src": "2024s L1", "m": [123, 128]}, {"s": "Vi havde så for nogle år siden en halvtredsårs jubilæumsfest, og det var en meget stor og helt særlig oplevelse for mig og mine venner.", "src": "2024s L1", "m": [25, 30]}, {"s": "Siden fagforeningernes opkomst i slutningen af det 19. århundrede har man diskuteret lønmodtagernes arbejdstid.", "src": "2024s L2", "m": [0, 5]}, {"s": "De enkelte Helligdomsklipper har siden fået tildelt romantiske navne som Lyseklippen, Mågetårnet, Måneskinsklipperne og Kærlighedsbænken.", "src": "2023v L1", "m": [33, 38]}, {"s": "Børneruten har de fleste steder plads til, at man kan køre ved siden af hinanden og også have cykelanhænger med.", "src": "2023v L1", "m": [63, 68]}, {"s": "For ikke så mange årtier siden mente de fleste nok ikke, at det var relevant at læse kinesisk, mens de fleste er af den modsatte opfattelse i dag.", "src": "2023v L2", "m": [25, 30]}, {"s": "Hærvejen er Danmarks ældste landevej, som siden oldtiden har fragtet soldater og folk fra Dannevirke i syd til Viborg i nord og den modsatte vej.", "src": "2023s L1", "m": [42, 47]}], "derefter": [{"s": "Så kl. 20 fik jeg fri, og derefter kunne jeg bare gå to etager ned i bygningen og lære at spille guitar.", "src": "2020v L1", "m": [26, 34]}, {"s": "Det er vigtigt, at du, allerede når du tilmelder dig eller hurtigst muligt derefter, gør opmærksom på, at du eventuelt vil få behov for SPS for at kunne gennemføre uddannelsen.", "src": "2016v L1", "m": [75, 83]}, {"s": "Eleverne kan for eksempel bruge en tablet til en skattejagt eller til at tage billeder af dyr og planter, som de ser i naturen, og derefter søge informationer om dem.", "src": "2016v L2", "m": [131, 139]}, {"s": "andre veje Langt de fleste vælger at starte på grundforløbet og derefter indgå en uddannelsesaftale.", "src": "2015v L1", "m": [64, 72]}, {"s": "Uddannelsen starter med et praktikophold (ca. 6 måneder) og derefter et skoleophold på 11 uger.", "src": "2015v L1", "m": [60, 68]}, {"s": "Tilmed begyndte han at få ondt i det ene knæ, da der manglede ca. 50 km, så da han derefter skulle gennemføre konkurrencens sidste del, maratonløbet, var der ikke mange kræfter tilbage.", "src": "2015v L2", "m": [83, 91]}, {"s": "Det er længe siden, at arbejdet som bibliotekar var et spørgsmål om at finde den rigtige bog til et menneske, der derefter kunne låne bogen med sig hjem.", "src": "2014s L2", "m": [114, 122]}, {"s": "en god start Du begynder med et introduktionsforløb, og derefter tilrettelægger du dit grundforløb sammen med din kontaktlærer.", "src": "2013s L1", "m": [56, 64]}], "herefter": [{"s": "Herefter blev der indført entré, det medførte et fald i antallet af publikummer.", "src": "2020s L1", "m": [0, 8]}, {"s": "Herefter følger en personlig samtale, hvor vi vil lære hinanden lidt bedre at kende, og hvor vi vil høre lidt mere om, hvorfor du gerne vil arbejde i Legoland.", "src": "2018s L1", "m": [0, 8]}, {"s": "Herefter flyttede jeg hjem og startede på VUF.", "src": "2016v L1", "m": [0, 8]}, {"s": "Hvis dine forældre ikke er enige i UU´s vurdering (ikke-uddannelsesparat), sendes din ansøgning til den uddannelsesinstitution, du har søgt, som herefter vurderer, om du er uddannelsesparat.", "src": "2015v L1", "m": [145, 153]}, {"s": "Herefter er det UU-centret eller din efterskole mv., som sender ansøgningen videre til uddannelsesstedet.", "src": "2015v L1", "m": [0, 8]}, {"s": "Herefter skal fangstredskaber og kutter rengøres, efterses og gøres klar til næste tur på havet.", "src": "2015v L1", "m": [0, 8]}, {"s": "Vurderes du herefter uddannelsesparat, rettes din uddannelsesplan, og den sendes til det ansøgte uddannelsessted.", "src": "2015s L1", "m": [12, 20]}, {"s": "To eksempler på eGU Herefter kan du se to konkrete eksempler på EGU.", "src": "2013s L1", "m": [20, 28]}], "til_sidst": [{"s": "Det hele har ikke meget med vikinger at gøre, men historien om familien, der til sidst igen finder sammen, er god familieunderholdning.", "src": "2022v L1", "m": [77, 86]}, {"s": "Derfor valgte han til sidst at starte sit eget snedkerværksted. ”I modsætning til de fleste andre værksteder, satser jeg ikke på nye møbler.", "src": "2022v L2", "m": [18, 27]}, {"s": "Jeg tog blandt andet kurser i at skrive ansøgninger – og jeg blev til sidst rigtig god til at beskrive alt det, jeg kan,” siger han med et smil.", "src": "2022s L2", "m": [66, 75]}], "endelig": [{"s": "Nylars Rundkirke er den bedst bevarede af de bornholmske rundkirker, og endelig kan man opleve Nyker Rundkirke, der er den mindste og sandsynligvis også den yngste af Bornholms rundkirker.", "src": "2023v L1", "m": [72, 79]}, {"s": "Endelig er det også vigtigt altid at holde sine enheder opdaterede, gerne automatisk.", "src": "2023v L2", "m": [0, 7]}, {"s": "Og halvdelen mente, at deres handicap ville få stor betydning for, hvordan de ville klare deres job, hvis de endelig fik et.", "src": "2023s L2", "m": [109, 116]}, {"s": "Endelig viste undersøgelsen også, at mange mennesker med et handicap ikke kender særlig meget til de mange forskellige støttemuligheder, der er på arbejdsmarkedet.", "src": "2023s L2", "m": [0, 7]}, {"s": "Endelig kan nyuddannede med et handicap også få løntilskud i deres første job.", "src": "2023s L2", "m": [0, 7]}, {"s": "Endelig får man mulighed for at beskæftige sig med lige præcis det, man har lyst til.", "src": "2022v L2", "m": [0, 7]}, {"s": "Hun er blot glad for, at det via aktivt brug af sit netværk på de sociale medier endelig lykkedes hende at få et job.", "src": "2022s L2", "m": [81, 88]}, {"s": "Endelig forventer mange unge meget af sig selv, og de sammenligner sig meget med hinanden, både på de sociale medier og i klassen.", "src": "2021v L2", "m": [0, 7]}], "alt_i_alt": [{"s": "Selvom det alt i alt har været meget dyrt for Eva og Per at tage på studieophold i Storbritannien, synes de, det har været det hele værd.", "src": "2020s L2", "m": [11, 20]}, {"s": "Alt i alt var mit ophold i Nepal berigende socialt, kulturelt og fagligt, og det var været en af de absolut bedste oplevelser i mit liv at rejse dertil som frivillig.", "src": "2016s L1", "m": [0, 9]}, {"s": "Uddannelsestiden varierer fra eux-forløb til eux-forløb, men alt i alt vil uddannelsestiden være længere end den “normale” længde for den pågældende erhvervsuddannelse.", "src": "2015v L1", "m": [61, 70]}, {"s": "Uddannelsestiden varierer fra eux-forløb til eux-forløb, men alt i alt vil uddannelsestiden være væsentlig længere end den \"normale\" længde for den pågældende erhvervsuddannelse.", "src": "2013s L1", "m": [61, 70]}], "samlet_set": [{"s": "Samlet set giver det en årsmiddeltemperatur, som ligger tæt på landsgennemsnittet.", "src": "2023v L1", "m": [0, 10]}, {"s": "Samlet set går mange tusind mennesker til undervisning på AOF’s aftenskoler hver uge, hvor de bliver klogere på alt fra madlavning, Mellemøsten og motion til sprog og syning.", "src": "2020v L1", "m": [0, 10]}, {"s": "Det betyder samlet set, at vi bliver udsat for mindre stråling, men meget oftere end før.", "src": "2020s L2", "m": [12, 22]}, {"s": "Samlet set var 98 % af drikkevarerne (inkl. øl og spiritus) økologiske.", "src": "2019s L1", "m": [0, 10]}, {"s": "Men samlet set er der flere kvinder, der donerer penge end mænd.", "src": "2019s L2", "m": [4, 14]}, {"s": "Behandling i hjemmet er altså samlet set både nemmere for borgerne og billigere for samfundet.", "src": "2016s L2", "m": [30, 40]}], "kort_sagt": [{"s": "Kort sagt er det altså intet problem at få en hel dag til at gå her.", "src": "2021v L1", "m": [0, 9]}, {"s": "Kort sagt, vil du aldrig være isoleret i dit destinationsland.", "src": "2016s L1", "m": [0, 9]}, {"s": "Vores kendetegn er et stærkt fagligt miljø, et godt kammeratskab og godt sammenhold - her er kort sagt rart at være.", "src": "2015v L1", "m": [93, 102]}, {"s": "Kort sagt, dit arbejde handler om at være med til at forbedre patientens tilværelse og velvære.", "src": "2013s L1", "m": [0, 9]}], "at_bekræfte": [{"s": "Det kan både Mette Dalgaard og Henriette Friis bekræfte.", "src": "2023v L2", "m": [47, 55]}], "at_fortryde": [{"s": "Grundforløbet og det første halve år af studieretningen på pre-IB skal være tilrettelagt, så du har mulighed for at skifte fra pre-IB klassen til en stx-studie retning, hvis du fortryder dit valg.", "src": "2015s L1", "m": [177, 186]}], "at_beklage": [{"s": "Vi beklager meget det besvær, det må give for vores gæster og kan oplyse, at museets ledelse løbende er i dialog med Aarhus Kommune om forbedring af forholdene.", "src": "2017s L1", "m": [3, 11]}], "at_opleve": [{"s": "Her kan man tage tilbage i tiden og opleve kunsten samt spændende skiftende særudstillinger.", "src": "2024s L1", "m": [36, 42]}, {"s": "I Mønsted Kalkgruber kan man opleve en labyrint af minegange, spændende historie og smuk natur.", "src": "2024s L1", "m": [29, 35]}, {"s": "På turen kan man opleve den særlige natur i området og se den flotte udsigt til søen i bunden af kalkbruddet.", "src": "2024s L1", "m": [17, 23]}, {"s": "Øens lange kystlinje kan også opleves fra fx havkajak, og fra kysten eller fra båd kan man teste fiskelykken på Østersøens mange havørreder.", "src": "2023v L1", "m": [30, 37]}, {"s": "Og det er ikke så underligt, for her kan man virkelig få gang i fantasien og opleve den bornholmske historie.", "src": "2023v L1", "m": [77, 83]}, {"s": "Det nye Hammershus Besøgscenter giver en helt ny måde at opleve Hammershus på.", "src": "2023v L1", "m": [57, 63]}, {"s": "Nylars Rundkirke er den bedst bevarede af de bornholmske rundkirker, og endelig kan man opleve Nyker Rundkirke, der er den mindste og sandsynligvis også den yngste af Bornholms rundkirker.", "src": "2023v L1", "m": [88, 94]}, {"s": "Bornholm er en attraktiv ø at opleve fra en cykel.", "src": "2023v L1", "m": [30, 36]}], "at_reducere": [{"s": "De ser på forskellige uddannelsesmuligheder i stedet for at fokusere på enkelte prestigeuddannelser, og det er med til at reducere presset.", "src": "2021v L2", "m": [122, 130]}, {"s": "I nogle storbyer i verden har man forsøgt at reducere trafikproblemerne ved at opkræve en afgift for at køre ind i byen.", "src": "2015s L2", "m": [45, 53]}, {"s": "Antallet af biblioteker er reduceret kraftigt.", "src": "2014s L2", "m": [27, 36]}], "at_muliggøre": [{"s": "Samtidig muliggør elevforeningens hjemmeside kontakten til ens gamle højskolevenner.", "src": "2018v L1", "m": [9, 17]}], "at_udvide": [{"s": "Gosch oprettede en afdeling med blyanter kaldet VIKING, en afdeling, som i dag er udvidet med oliekridt, farvekridt m.m.", "src": "2022v L1", "m": [82, 89]}, {"s": "Man byggede masser af boliger til arbejderne, og byen blev udvidet med for eksempel Kongensgade, Albani-kvarteret og Vesterbro-området.", "src": "2021v L1", "m": [59, 66]}, {"s": "FOF arbejder for at udvide den enkeltes indsigt.", "src": "2020v L1", "m": [20, 26]}, {"s": "FOF tilbyder undervisning og samvær, der tilstræber at udvide den enkeltes horisont både kulturelt, socialt og fagligt.", "src": "2020v L1", "m": [55, 61]}, {"s": "COWI satser på at udvide sine internationale aktiviteter i de kommende år.", "src": "2019v L2", "m": [18, 24]}, {"s": "Så tænkte jeg, at vi må kunne udvide de netværk og gøre betalingen automatisk,” siger Søren.", "src": "2017v L2", "m": [30, 36]}, {"s": "Vinterferien i Den Gamle By er i år udvidet med en uge, så vi både i uge 7 og 8 har masser af aktiviteter for hele familien.", "src": "2017s L1", "m": [36, 43]}, {"s": "På den måde kan man både få et godt måltid mad og udvide sin vennekreds, og det vil måske få endnu flere til at deltage i madklubber i fremtiden.", "src": "2016v L2", "m": [50, 56]}], "at_forlænge": [{"s": "Man kan imidlertid søge om at få tilladelsen forlænget, dog højst til 18 måneder.", "src": "2018v L1", "m": [45, 54]}, {"s": "Rekruttering og Integration inddrage eller nægte at forlænge ens opholdstilladelse.", "src": "2018v L1", "m": [52, 60]}], "at_investere_i": [{"s": "Det har øget interessen blandt private firmaer for at investere i store vindmølleprojekter.", "src": "2023s L2", "m": [54, 65]}, {"s": "Derfor bliver der investeret meget i vores medarbejdere, hvilket blandt andet gøres via uddannelse inden ansættelse i Universe.", "src": "2018s L1", "m": [18, 28]}, {"s": "Respekt for vores frivillige Vi anerkender, at vores frivillige investerer tid, energi og penge i at yde en indsats for lokalsamfund i udviklingslande.", "src": "2016s L1", "m": [64, 74]}], "en_mulighed": [{"s": "Man har også mulighed for at stille sulten og slukke tørsten i den hyggelige Café Kridthuset.", "src": "2024s L1", "m": [13, 21]}, {"s": "Ved tilmelding har man mulighed for at bestille og købe en række tilvalg i forhold til indkvartering og forplejning.", "src": "2024s L1", "m": [23, 31]}, {"s": "Der er mange muligheder for god forplejning under marchen.", "src": "2024s L1", "m": [13, 23]}, {"s": "I det område, hvor alle ruter starter og slutter, er der derudover hele weekenden masser af muligheder for at købe mad og drikke for dem, der ikke har forudbestilt mad hjemmefra.", "src": "2024s L1", "m": [92, 102]}, {"s": "Hvis de for eksempel ikke har mulighed for at have så mange varer på lager i butikken, kan de tilbyde at fremskaffe dem inden for 24 timer og levere dem til døren.", "src": "2024s L2", "m": [30, 38]}, {"s": "Den storslåede og varierende natur giver gode muligheder for friluftsliv.", "src": "2023v L1", "m": [46, 56]}, {"s": "Besøgscentret byder også på en fascinerende udstilling, hvor der er mulighed for at læse om borgruinens utrolige historie.", "src": "2023v L1", "m": [68, 76]}, {"s": "Og ved at give borgerne mulighed for at møde beslutningstagerne ansigt til ansigt.", "src": "2023v L1", "m": [24, 32]}], "en_udfordring": [{"s": "Da Mimi fik job og flyttede til Tønder med sin mand, Jon, var udfordringen i begyndelsen, at de især var bekymrede for, om livskvaliteten i Sønderjylland kunne leve op til deres forventninger.", "src": "2023s L1", "m": [62, 74]}, {"s": "Så det var disse udfordringer, man fra øernes side ville arbejde for at løse.", "src": "2022s L1", "m": [17, 29]}, {"s": "At lære det danske sprog Vores søn Michel havde udfordringer i børnehaven i Maribo, da han havde svært ved dansk, og han nærmede sig skolealderen.", "src": "2022s L1", "m": [48, 60]}, {"s": "Udfordringer ved flytningen Ikke alt var dog lige let ved at flytte.", "src": "2022s L1", "m": [0, 12]}, {"s": "Udfordringer for den etiske forbruger, side 84.", "src": "2021s L2", "m": [0, 12]}, {"s": "Udfordringer for den etiske forbruger, side 86.", "src": "2021s L2", "m": [0, 12]}, {"s": "Men sproget har ikke overraskende for ham vist sig at være en stor udfordring, som han må bruge meget tid på.", "src": "2019v L2", "m": [67, 77]}, {"s": "Udfordringer for arbejdspladserne Også for arbejdspladserne kan der være en række udfordringer forbundet med at flytte.", "src": "2018v L2", "m": [0, 12]}], "et_ansvar": [{"s": "jeg et job som konsulent med ansvar for udvikling af en helt ny hjemmeside i et ministerium, og det har jeg ikke fortrudt.", "src": "2024s L2", "m": [29, 35]}, {"s": "De trives begge med at have indflydelse og ansvar for medarbejdere – også selvom det ikke altid er lige let.", "src": "2023v L2", "m": [43, 49]}, {"s": "Men hvem har egentlig det primære ansvar for at opretholde en høj datasikkerhed?", "src": "2023v L2", "m": [34, 40]}, {"s": "Uklarheden om ansvaret betyder imidlertid ikke, at udbyderne kan fralægge sig ethvert ansvar.", "src": "2023v L2", "m": [14, 22]}, {"s": "De har sammen ansvaret for en stor afdeling i virksomheden, men får også tid til at tale om ledelse generelt, og hvad de hver især gør for at blive bedre ledere.", "src": "2023s L2", "m": [14, 22]}, {"s": "At spise østers indsamlet i Vadehavet foregår på eget ansvar, uanset om man er på tur med en naturvejleder eller er ude på egen hånd.", "src": "2022s L1", "m": [54, 60]}, {"s": "Det er det ikke alle, der har, selvom arbejdsgiverne har ansvar for at sikre et godt fysisk arbejdsmiljø derhjemme.", "src": "2022s L2", "m": [57, 63]}, {"s": "Delprøve 2A – Hvem har ansvaret for klimaet?", "src": "2021s L2", "m": [23, 31]}], "et_behov": [{"s": "Forskellige aktører på nettet har forskellige behov.", "src": "2023v L2", "m": [46, 51]}, {"s": "Store multinationale virksomheder har nogle helt andre behov for beskyttelse end den almindelige borger.", "src": "2023v L2", "m": [55, 60]}, {"s": "Det er ikke alle, der er enige i, at man skal prøve at tilpasse udvalget af uddannelser efter det behov, der er i øjeblikket.", "src": "2023v L2", "m": [98, 103]}, {"s": "Vi kan derfor ikke vurdere, hvilke behov der kommer til at opstå.", "src": "2023v L2", "m": [35, 40]}, {"s": "Den bliver klippet efter behov i sommerhalvåret, men nogle steder kan der i perioder forekomme høj bevoksning.", "src": "2023s L1", "m": [25, 30]}, {"s": "Projektet viste bl.a. et behov for flere lejeboliger, som kan være attraktive for potentielle tilflyttere, der ikke er parate til at købe en bolig.", "src": "2022s L1", "m": [25, 30]}, {"s": "Derfor kan de lettere balancere mellem kravene om præstation og behovet for hvile.", "src": "2021v L2", "m": [64, 71]}, {"s": "Særlige behov Nedenfor finder du information om adgangsforhold og handicapfaciliteter på Det Kongelige Teaters scener.", "src": "2021s L1", "m": [8, 13]}], "en_modstand": [{"s": "Der er dog stadig en vis modstand blandt visse arbejdsgivere mod en fire-dages arbejdsuge.", "src": "2024s L2", "m": [25, 33]}, {"s": "Men flere steder møder projekterne modstand fra lokale borgere.", "src": "2023s L2", "m": [35, 43]}, {"s": "Men planerne blev opgivet blandt andet på grund af folkelig modstand.", "src": "2015s L2", "m": [60, 68]}], "en_opbakning": [{"s": "Jeg er imponeret over den opbakning vores sportsfolk får.", "src": "2024s L1", "m": [26, 35]}, {"s": "Opsætningen af vindmøller har generelt både politisk og folkelig opbakning i Danmark.", "src": "2023s L2", "m": [65, 74]}, {"s": "OFF er en publikumsfest med massiv opbakning i lokalmiljøet.", "src": "2021v L1", "m": [35, 44]}, {"s": "Det er Torben enig i: ”Uden opbakning går det selvfølgelig ikke.", "src": "2021s L2", "m": [28, 37]}, {"s": "Fælles for alle tiltag er dog, at der skal være en politisk opbakning bag.", "src": "2019v L2", "m": [60, 69]}, {"s": "Hvis man derimod deles mere lige i familien, viser man, at der er opbakning hjemmefra, og det påvirker de positive forventninger til kvinden.", "src": "2018s L2", "m": [66, 75]}, {"s": "Politikerne vil også være helt sikre på, at der er folkelig opbakning, inden man eventuelt indfører roadpricing.", "src": "2015s L2", "m": [60, 69]}, {"s": "Politikerne vil også være helt sikre på, at der er folkelig opbakning, inden m~m eventuelt indfører roadpricing.", "src": "2015s L2", "m": [60, 69]}], "en_forudsætning": [{"s": "Folkeoplysning bliver i Danmark anset for at være en vigtig forudsætning for folkestyret.", "src": "2020v L1", "m": [60, 72]}, {"s": "Formidlingen adskiller sig ved, at indholdet ikke kræver, at modtagerne har særlige forudsætninger eller evner ud over det at være nysgerrige og interesserede mennesker.", "src": "2020v L1", "m": [84, 98]}, {"s": "Der kræves ingen forudsætninger for at deltage på kurset, men vi forventer, at du møder stabilt og er interesseret i og motiveret for at arbejde med skriftligt dansk og lave ansøgninger const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const norm = s => String(s).normalize("NFC").toLowerCase().replace(/[.,!?;:"«»()…]/g, " ").replace(/\s+/g, " ").trim();

function readProgress() {

function writeProgress(id) {

}

// SM-2, same maths as sm2() in pd3.py
function grade(id, q) {
  const c = DB.cards[id];
  c.introduced = c.introduced || DB.today;
  if (q >= 3) {
    c.interval = c.reps === 0 ? 1 : c.reps === 1 ? 6 : Math.round(c.interval * c.ef);
    c.reps += 1;
  } else {
    c.interval = 1; c.reps = 0; c.lapses += 1;
  }
  c.ef = Math.max(1.3, Math.round((c.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02))) * 100) / 100);
  const d = new Date(DB.today + "T12:00"); d.setDate(d.getDate() + c.interval);
  c.due = iso(d);
  c.history = [...c.history, [DB.today, q]].slice(-10);
  writeProgress(id);
  return c;
}

// ---------- card helpers ----------
function wtype(c) {
  const m = /^(SUB\/PRÆP|SUB\/ADV|SUB|ADV|KOO|PRÆP)\b/.exec(c.note || "");
  return m ? m[1] : null;
}
function stateOf(c) {
  if (!c.history || !c.history.length) return "new";
  return c.interval >= 21 ? "master" : c.interval >= 6 ? "known" : "learn";
}
function variants(word) {
  const base = norm(word.replace(/\(.*?\)/g, ""));
  const out = [norm(word), base, ...[...word.matchAll(/\((.*?)\)/g)].map(m => norm(m[1]))];
  base.split(/\s*\/\s*/).forEach(p => out.push(p.trim()));
  out.slice().forEach(v => { for (const a of ["at ", "en ", "et "]) if (v.startsWith(a)) out.push(v.slice(a.length)); });
  return [...new Set(out.filter(Boolean))];
}
function isAnswer(c, input) {
  const a = norm(input), set = variants(c.word);
  return set.includes(a) || set.includes(a.replace(/^(at|en|et) /, ""));
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function nearMiss(c, input) {
  const a = norm(input).replace(/^(at|en|et) /, "");
  return a.length > 2 && variants(c.word).some(v => lev(a, v) <= (v.length > 8 ? 2 : 1));
}
// Where the card word sits in a sentence (for highlighting and cloze gaps)
function findSpan(c, s) {
  const w = norm(c.word);
  const kind = w.startsWith("at ") ? "verb" : /^(en|et) /.test(w) ? "noun" : c.group === "adjektiv" ? "adj" : "fixed";
  const vs = variants(c.word).filter(v => !/^(at|en|et) /.test(v) && v.length > 1).sort((a, b) => b.length - a.length);
  for (const v of vs) {
    const toks = v.split(" ").map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    if (kind === "verb") toks[0] = toks[0].replace(/e$/, "") + "\\p{L}{0,4}";
    else if (kind !== "fixed") toks[0] += "\\p{L}{0,4}";
    const m = new RegExp("(?<![\\p{L}])" + toks.join("\\s+") + "(?![\\p{L}])", "iu").exec(s);
    if (m) return [m.index, m.index + m[0].length];
  }
  return null;
}
function hlSentence(c, s, span) {
  span = span || findSpan(c, s);
  if (!span) return esc(s);
  return esc(s.slice(0, span[0])) + `<mark class="hl">${esc(s.slice(span[0], span[1]))}</mark>` + esc(s.slice(span[1]));
}
function examSentences(c) { return DB.sentences[c.id] || []; }
function partnerPairs(id) { return CONFUSABLES.filter(p => (p[0] === id || p[1] === id) && DB.cards[p[0]] && DB.cards[p[1]]); }
function gname(g) { return GROUPS[g] ? GROUPS[g][LANG === "en" ? 0 : 1] : g; }
// both languages, the page language first (as the other pages name their groups)
function glabel(g) { return GROUPS[g] ? (LANG === "en" ? `${GROUPS[g][0]} · ${GROUPS[g][1]}` : `${GROUPS[g][1]} · ${GROUPS[g][0]}`) : g; }
const prio = g => (GROUPS[g] || [])[2] || 3;

function daysTo(d) { return d ? Math.round((new Date(d) - new Date(DB.today)) / 864e5) : null; }
function counts() {
  const all = cards();
  const introducedToday = all.filter(c => c.introduced === DB.today).length;
  return {
    due: all.filter(c => c.history && c.history.length && c.due <= DB.today).length,
    newLeft: Math.max(0, NEW_PER_DAY - introducedToday),
    fresh: all.filter(c => stateOf(c) === "new").length,
    learning: all.filter(c => ["learn", "known"].includes(stateOf(c))).length,
    mastered: all.filter(c => stateOf(c) === "master").length,
    total: all.length,
  };
}

function sessionBlurb(k, due, fresh) {
  const r = Math.min(due, REVIEW_LIMIT), n = Math.min(BATCH, fresh);
  if (!r && !n) return t("h.nothing");
  const parts = [r ? (r === 1 ? t("h.blurb.r1") : t("h.blurb.r", r)) : null, n ? t("h.blurb.n", n) : null].filter(Boolean);
  return t("h.blurb", parts.join(" + "));
}
function groupTile(g, cs) {
  const n = { new: 0, learn: 0, known: 0, master: 0 };
  cs.forEach(c => n[stateOf(c)]++);
  const due = cs.filter(c => c.history.length && c.due <= DB.today).length;
  const seg = s => n[s] ? `<span style="width:${100 * n[s] / cs.length}%;background:var(--s-${s})"></span>` : "";
  const other = GROUPS[g] ? GROUPS[g][LANG === "en" ? 1 : 0] : "";
  return `<button class="sheet group${openGroup === g ? " open" : ""}" data-g="${esc(g)}">
    <div class="row"><span class="gn">${esc(gname(g))}</span><span class="spacer"></span>${due ? `<span class="due">${t("g.due", due)}</span>` : ""}</div>
    <div class="ge">${esc(other)} · ${t("g.words", cs.length)}</div>
    <div class="bar">${seg("master")}${seg("known")}${seg("learn")}</div></button>`;
}
function showGroupDetail(g, cs) {
  const grid = $(`.groups[data-pr="${prio(g)}"]`);
  const tiles = [...grid.children], idx = tiles.findIndex(x => x.dataset.g === g);
  // place the panel after the last tile in the clicked tile's row
  const top = tiles[idx].offsetTop;
  let last = idx; while (tiles[last + 1] && tiles[last + 1].offsetTop === top) last++;
