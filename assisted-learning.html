// ---------- session building ----------
function startSession({ groups = null, reviews = REVIEW_LIMIT, fresh = BATCH }) {
  const k = counts();
  const inGroup = c => !groups || groups.includes(c.group);
  const rank = c => [c.priority || 3, -(c.lapses || 0), c.reps || 0];
  const cmp = (a, b) => { const x = rank(a), y = rank(b); return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]; };
  const due = cards().filter(c => inGroup(c) && c.history.length && c.due <= DB.today).sort(cmp).slice(0, reviews);
  const n = Math.min(fresh, k.newLeft);
  let batch = [];
  if (n > 0) {
    // taught group by group: fill the batch from the first (selected) group that still has new words, then the next
    for (const g of GROUP_ORDER.filter(g => !groups || groups.includes(g))) {
      if (batch.length >= n) break;
      batch.push(...cards().filter(c => c.group === g && stateOf(c) === "new").slice(0, n - batch.length));
    }
  }
  let practice = [];
  if (groups && !due.length && !batch.length) // nothing to grade: practise the groups' learnt words without touching the schedule
    practice = shuffle(cards().filter(c => inGroup(c) && c.history.length)).slice(0, 8);
  const q = [];
  due.forEach(c => q.push({ kind: "ex", id: c.id }));
  if (batch.length) {
    q.push({ kind: "intro", ids: batch.map(c => c.id) });
    batch.forEach(c => q.push({ kind: "teach", id: c.id }));
    shuffle(batch).forEach(c => q.push({ kind: "ex", id: c.id, first: true }));
  }
  practice.forEach(c => q.push({ kind: "ex", id: c.id, practice: true }));
  if (!q.length) { alert(groups ? t("g.empty") : t("h.empty")); return; }
  const title = !groups ? t("s.session") : groups.length === 1 ? glabel(groups[0]) : groups.length <= 3 ? groups.map(gname).join(" · ") : t("s.groups", groups.length);
  S = { queue: q, i: 0, results: [], lastType: null, graded: new Set(), title };
  step();
}
function startConfusables() {
  const pairs = shuffle(CONFUSABLES.filter(p => DB.cards[p[0]] && DB.cards[p[1]])).slice(0, 5);
  S = { queue: pairs.map(p => ({ kind: "pair", pair: p })), i: 0, results: [], lastType: null, graded: new Set(), title: t("s.conf") };
  step();
}

// ---------- step rendering ----------
function frame(kindLabel, inner) {
  const done = S.i, total = S.queue.length;
  $("#app").innerHTML = `<div class="narrow">
    <div class="counter"><span>${esc(S.title)} · ${t("s.count", done + 1, total)}</span><button class="btn quiet" id="quit">✕ ${t("s.end")}</button></div>
    <div class="bar sessionbar" aria-hidden="true"><span style="width:${100 * done / total}%"></span></div>
    <div class="sheet q"><div class="kind">${esc(kindLabel)}</div>${inner}</div></div>`;
  $("#quit").onclick = () => S.results.length ? summary() : home();
  window.scrollTo(0, 0);
}
function step() {
  if (S.i >= S.queue.length) return summary();
  const it = S.queue[S.i];
  if (it.kind === "intro") return renderIntro(it);
  if (it.kind === "teach") return renderTeach(DB.cards[it.id]);
  if (it.kind === "pair") return renderPair(it);
  return renderExercise(it);
}
function advance() { S.i++; step(); }

function renderIntro(it) {
  const cs = it.ids.map(id => DB.cards[id]);
  frame(t("k.new"), `
    <h2 style="font-size:1.6rem;margin-top:6px">${[...new Set(cs.map(c => c.group))].map(g => esc(glabel(g))).join("<br>")}</h2>
    <p class="prompt">${t("intro.p", cs.length)}</p>
    <div class="words" lang="da">${cs.map(c => `<span class="word">${esc(c.word)}</span>`).join("")}</div>
    <button class="btn solid next" id="nx">${t("b.start")}</button>`);
  bindNext(advance);
}

function ruleBlock(c) {
  const w = wtype(c);
  if (!w) return "";
  return w.split("/").map(k => RULES[k] ? `<div class="note"><b class="t">${RULES[k][0]}</b><div>${rule(k)}</div><div class="demo" lang="da">${RULES[k][3]}</div></div>` : "").join("");
}
// the word-type label is shown as a tag already
function noteText(c) { return (c.note || "").replace(/^(SUB\/PRÆP|SUB\/ADV|SUB|ADV|KOO|PRÆP)\s*(—\s*)?/, ""); }
function renderTeach(c) {
  const ex = examSentences(c).slice(0, 2);
  const d = c.dict;
  const pairs = partnerPairs(c.id);
  const extraNote = noteText(c);
  frame(t("k.learn"), `
    <div class="head" style="margin-top:6px"><span class="big" lang="da">${esc(c.word)}</span>${wtype(c) ? `<span class="tag">${esc(wtype(c))}</span>` : ""}<span class="badge t${prio(c.group)}">${esc(glabel(c.group))}</span></div>
    <div class="meaning">${esc(c.meaning)}</div>
    ${extraNote ? `<div class="soft" lang="da" style="margin-top:4px">${esc(extraNote)}</div>` : ""}
    ${wtype(c) ? `<div class="block"><span class="lbl">${t("t.order")}</span>${ruleBlock(c)}</div>` : ""}
    <div class="block"><div class="eg"><span class="lbl">${t("t.example")}</span><div class="sentence" lang="da">${hlSentence(c, c.example)}</div></div></div>
    ${ex.length ? `<div class="block"><span class="lbl">${t("t.exam")}</span>${ex.map(e => `<div class="ex" lang="da"><span class="tag">${esc(e.src)}</span>${hlSentence(c, e.s, e.m)}</div>`).join("")}</div>` : ""}
    ${d ? `<div class="block"><div class="ddo"><span class="lbl">${t("t.ddo")}</span><div class="soft small">${esc(d.pos)}</div>${d.senses.slice(0, 2).map((s, i) => `<div lang="da">${d.senses.length > 1 ? `<b>${i + 1}.</b> ` : ""}${esc(s)}</div>`).join("")}${d.cite.slice(0, 1).map(x => `<blockquote lang="da">${esc(x)}</blockquote>`).join("")}<div class="cite"><a href="${esc(d.url)}" target="_blank" rel="noopener">ordnet.dk ↗</a></div></div></div>` : ""}
    ${pairs.map(p => { const o = DB.cards[p[0] === c.id ? p[1] : p[0]]; return `<div class="block"><div class="warnbox"><b>${t("t.mix")}</b> <span lang="da">${esc(c.word)} / ${esc(o.word)}</span> — ${esc(tip(p))}</div></div>`; }).join("")}
    <div class="row next"><button class="btn solid" id="nx">${t("b.got")}</button><button class="btn quiet morebtn" id="more">${t("b.more")}</button></div>`);
  $("#more").onclick = () => explain(c);
  bindNext(advance);
}

// ---------- exercises ----------
function orderTokens(c) {
  const s = c.example || "";
  if (/[…:;()]|\.\s|\?\s/.test(s.slice(0, -1))) return null;
  const toks = s.replace(/[.!?]$/, "").split(/\s+/).map(x => x.replace(/,$/, "")).filter(Boolean);
  return toks.length >= 4 && toks.length <= 11 ? toks : null;
}
function clozeSource(c) {
  if (c.word.includes("…")) return null;
  const sp = c.example && findSpan(c, c.example);
  // a lone exam sentence lacks the context that decides between connectors (derfor vs ligeledes both fit
  // "… findes ___ også …"), so connectors use their example, written with that context; content words use the exam
  if (c.priority === 1 && sp) return { s: c.example, span: sp, src: "example" };
  const srcs = examSentences(c).map(e => ({ s: e.s, span: e.m, src: e.src }));
  if (sp) srcs.push({ s: c.example, span: sp, src: "example" });
  return srcs.length ? pick(srcs.slice(0, 3)) : null;
}
function eligibleTypes(c, first) {
  const ts = [["meaning", 1], ["produce", 2]];
  if (clozeSource(c)) ts.push(["cloze", 2]);
  if (c.priority === 1) {
    ts.push(["relation", 1]);
    if (cards().filter(x => x.group === c.group).length > 1) ts.push(["odd", 1]);
    if (wtype(c) && orderTokens(c)) ts.push(["order", 3]);
  }
  // a brand-new word is tested with recognition first
  return first ? ts.filter(([k]) => ["meaning", "cloze", "relation"].includes(k)) : ts;
}
function chooseType(c, first) {
  let ts = eligibleTypes(c, first).filter(([k]) => k !== S.lastType);
  if (!ts.length) ts = eligibleTypes(c, first);
  let r = Math.random() * ts.reduce((a, [, w]) => a + w, 0);
  for (const [k, w] of ts) if ((r -= w) < 0) return k;
  return ts[0][0];
}
function distractors(c, n, filter) {
  const pool = shuffle(cards().filter(x => x.id !== c.id && x.group !== c.group && filter(x)));
  const out = [], seen = new Set([norm(c.meaning), norm(c.word)]);
  for (const x of pool) {
    if (seen.has(norm(x.meaning)) || seen.has(norm(x.word))) continue;
    seen.add(norm(x.meaning)); seen.add(norm(x.word)); out.push(x);
    if (out.length === n) break;
  }
  return out;
}
const sameKind = c => { const w = norm(c.word); return w.startsWith("at ") ? x => norm(x.word).startsWith("at ") : /^(en|et) /.test(w) ? x => /^(en|et) /.test(norm(x.word)) : x => (x.priority || 3) === (c.priority || 3) && !/^(at|en|et) /.test(norm(x.word)); };

function renderExercise(it) {
  const c = DB.cards[it.id];
  const type = it.type || chooseType(c, it.first);
  it.type = type;
  S.lastType = type;
  S.t0 = performance.now();
  const label = t(it.practice ? "k.practice" : it.first ? "k.first" : "k.review") + " · " + t("x." + type);
  ({ meaning: exMeaning, produce: exProduce, cloze: exCloze, relation: exRelation, order: exOrder, odd: exOdd })[type](c, label, it);
}

function mc(label, head, options, correctIdx, onDone) {
  frame(label, `${head}<div class="opts">${options.map((o, i) => `<button class="btn opt" data-i="${i}"><span class="k">${i + 1}</span><span>${o}</span></button>`).join("")}</div><div id="fb"></div>`);
  const btns = [...document.querySelectorAll(".opt")];
  const choose = i => {
    if (btns[0].disabled) return;
    btns.forEach(b => b.disabled = true);
    btns[correctIdx].classList.add("right");
    if (i !== correctIdx) btns[i].classList.add("wrong");
    onDone(i === correctIdx);
  };
  btns.forEach(b => b.onclick = () => choose(+b.dataset.i));
  S.keys = e => { const n = +e.key; if (n >= 1 && n <= options.length) choose(n - 1); };
}
const quick = () => performance.now() - S.t0 < 6000;

function exMeaning(c, label, it) {
  const opts = shuffle([c, ...distractors(c, 3, x => (x.priority || 3) === (c.priority || 3))]);
  mc(label, `<p class="prompt">${t("q.meaning")}</p><div class="big" lang="da">${esc(c.word)}</div>`,
    opts.map(o => esc(o.meaning)), opts.indexOf(c),
    ok => feedback(c, it, ok ? (quick() ? 5 : 4) : 2, ok, ok ? "" : `<b lang="da">${esc(c.word)}</b> = ${esc(c.meaning)}`, ok ? null : "moderate"));
}

function exRelation(c, label, it) {
  const groups = shuffle([c.group, ...shuffle(GROUP_ORDER.filter(g => prio(g) === 1 && g !== c.group && !(ALSO[c.id] || []).includes(g))).slice(0, 3)]);
  mc(label, `<p class="prompt">${t("q.relation")}</p><div class="big" lang="da">${esc(c.word)}</div>`,
    groups.map(g => esc(glabel(g))), groups.indexOf(c.group),
    ok => feedback(c, it, ok ? 4 : 2, ok, `<b lang="da">${esc(c.word)}</b> (${esc(c.meaning)}) → ${esc(glabel(c.group))}`, ok ? null : "moderate"));
}

function exCloze(c, label, it) {
  const src = clozeSource(c);
  // same word class (and same word-order type for connectors), so the choice is about meaning, not grammar
  const opts = shuffle([c, ...distractors(c, 3, x => sameKind(c)(x) && !x.word.includes("…") && (!wtype(c) || wtype(x) === wtype(c)))]);
  if (opts.length < 3) { it.type = "meaning"; return exMeaning(c, label, it); }
  const [a, b] = src.span;
  const gapped = `${esc(src.s.slice(0, a))}<span class="gap">&nbsp;</span>${esc(src.s.slice(b))}`;
  const inflected = norm(src.s.slice(a, b)) !== norm(c.word.replace(/^(at|en|et) /, ""));
  mc(label, `<p class="prompt">${t("q.cloze")}${inflected ? t("q.base") : ""} ${src.src !== "example" ? `<span class="tag">${esc(src.src)}</span>` : ""}</p><div class="sentence" lang="da">${gapped}</div>`,
    opts.map(o => `<span lang="da">${esc(o.word)}</span>`), opts.indexOf(c),
    ok => feedback(c, it, ok ? (quick() ? 5 : 4) : 2, ok,
      `<div class="sentence" lang="da">${hlSentence(c, src.s, src.span)}</div><div class="small"><span lang="da">${esc(c.word)}</span> = ${esc(c.meaning)}</div>`, ok ? null : "moderate"));
}

function exOdd(c, label, it) {
  const mate = pick(cards().filter(x => x.group === c.group && x.id !== c.id));
  const others = [];
  shuffle(cards().filter(x => x.priority === 1 && x.group !== c.group)).forEach(x => { if (others.length < 2 && !others.some(o => o.group === x.group)) others.push(x); });
  const opts = shuffle([c, mate, ...others]);
  frame(label, `<p class="prompt">${t("q.odd")}</p>
    <div class="opts">${opts.map((o, i) => `<button class="btn opt" data-i="${i}"><span class="k">${i + 1}</span><span lang="da">${esc(o.word)}</span></button>`).join("")}</div><div id="fb"></div>`);
  const btns = [...document.querySelectorAll(".opt")], sel = new Set();
  const toggle = i => {
    if (btns[0].disabled) return;
    sel.has(i) ? sel.delete(i) : sel.add(i);
    btns[i].classList.toggle("sel");
    if (sel.size < 2) return;
    btns.forEach(b => b.disabled = true);
    const ok = [...sel].every(j => opts[j].group === c.group);
    opts.forEach((o, j) => { btns[j].classList.remove("sel"); if (o.group === c.group) btns[j].classList.add("right"); else if (sel.has(j)) btns[j].classList.add("wrong"); });
    feedback(c, it, ok ? 4 : 2, ok, t("f.both", `<b lang="da">${esc(c.word)}</b>`, `<b lang="da">${esc(mate.word)}</b>`, esc(glabel(c.group))) + " " +
      opts.filter(o => o.group !== c.group).map(o => `<span lang="da">${esc(o.word)}</span> = ${esc(gname(o.group))}`).join(" · "), ok ? null : "moderate");
  };
  btns.forEach(b => b.onclick = () => toggle(+b.dataset.i));
  S.keys = e => { const n = +e.key; if (n >= 1 && n <= 4) toggle(n - 1); };
}

function letters() { return `<div class="letters">${["æ", "ø", "å"].map(l => `<button type="button" data-l="${l}">${l}</button>`).join("")}</div>`; }
function bindLetters(input) {
  document.querySelectorAll("[data-l]").forEach(b => b.onclick = () => {
    const p = input.selectionStart ?? input.value.length;
    input.value = input.value.slice(0, p) + b.dataset.l + input.value.slice(input.selectionEnd ?? p);
    input.focus(); input.setSelectionRange(p + 1, p + 1);
    input.dispatchEvent(new Event("input"));
  });
}
function exProduce(c, label, it) {
  frame(label, `<p class="prompt">${t("q.produce")}</p>
    <div class="meaning" style="font-size:1.5rem">${esc(c.meaning)}</div>
    <div class="soft small">${esc(glabel(c.group))}${wtype(c) ? " · " + esc(wtype(c)) : ""}</div>
    <input class="answer" id="ans" lang="da" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${t("q.ph")}">${letters()}
    <div class="row next"><button class="btn solid" id="chk">${t("b.check")}</button><button class="btn quiet" id="idk">${t("b.idk")}</button></div><div id="fb"></div>`);
  const input = $("#ans");
  input.focus(); bindLetters(input);
  const check = give => {
    if (input.disabled) return;
    const v = input.value.trim();
    if (!v && !give) return;
    // another deck word with an overlapping meaning (however → dog / imidlertid): not wrong, ask for the other one
    const gloss = s => new Set(s.toLowerCase().split(/[,/;()]+/).map(x => x.trim()).filter(Boolean));
    const twin = !give && !isAnswer(c, v) && cards().find(x => x.id !== c.id && isAnswer(x, v) && [...gloss(x.meaning)].some(g => gloss(c.meaning).has(g)));
    if (twin) {
      $("#fb").innerHTML = `<div class="feedback ok"><h3>${t("f.twin", esc(twin.word))}</h3><div class="why">${t("f.twin.p")}</div></div>`;
      input.value = ""; input.focus();
      return;
    }
    input.disabled = true; $("#chk").remove(); $("#idk").remove();
    const answer = `<b lang="da">${esc(c.word)}</b><div class="small" lang="da">${hlSentence(c, c.example)}</div>`;
    if (!give && isAnswer(c, v)) return feedback(c, it, performance.now() - S.t0 < 9000 ? 5 : 4, true, answer);
    if (!give && nearMiss(c, v)) return feedback(c, it, 3, true, t("f.spelling", `<b lang="da">${esc(c.word)}</b>`, esc(v)), "minor", t("f.almost"));
    feedback(c, it, give ? 0 : 1, false, (v ? t("f.wrote", esc(v)) : "") + answer, give ? null : "moderate", null, !give);
  };
  $("#chk").onclick = () => check(false);
  $("#idk").onclick = () => check(true);
  S.keys = e => { if (e.key === "Enter" && document.activeElement === input) { e.preventDefault(); check(false); } };
}

function exOrder(c, label, it) {
  const toks = orderTokens(c);
  const rest = toks.slice(1);
  let tiles = shuffle(rest.map((x, i) => ({ t: x, i })));
  for (let n = 0; n < 5 && tiles.map(x => x.t).join(" ") === rest.join(" "); n++) tiles = shuffle(tiles);
  const placed = [];
  let tries = 0;
  frame(label, `<p class="prompt">${t("q.order", `<b lang="da">${esc(c.word)}</b> <span class="tag">${esc(wtype(c))}</span>`)}</p>
    <div class="built" id="built" lang="da"></div><div class="tiles" id="tiles" lang="da"></div>
    <div class="row next"><button class="btn solid" id="chk" disabled>${t("b.check")}</button><button class="btn quiet" id="clr">${t("b.clear")}</button><button class="btn quiet" id="idk">${t("b.show")}</button></div><div id="fb"></div>`);
  const draw = () => {
    $("#built").innerHTML = `<span class="tile fixed">${esc(toks[0])}</span>` + placed.map((x, k) => `<button class="tile" data-k="${k}">${esc(x.t)}</button>`).join("");
    $("#tiles").innerHTML = tiles.map((x, k) => `<button class="tile${placed.includes(x) ? " used" : ""}" data-t="${k}">${esc(x.t)}</button>`).join("");
    document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { if (!placed.includes(tiles[+b.dataset.t])) { placed.push(tiles[+b.dataset.t]); draw(); } });
    document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { placed.splice(+b.dataset.k, 1); draw(); });
    $("#chk").disabled = placed.length !== rest.length;
  };
  draw();
  const right = `<div class="sentence" lang="da">${hlSentence(c, c.example)}</div>`;
  const finish = (q, ok, sev) => {
    ["#chk", "#clr", "#idk"].forEach(s => $(s)?.remove());
    document.querySelectorAll(".tile").forEach(b => b.disabled = true);
    feedback(c, it, q, ok, right + `<div class="why">${rule(wtype(c).split("/")[0]) || ""}</div>`, sev, null, false, ok ? null : c.example);
  };
  $("#chk").onclick = () => {
    const ok = placed.map(x => x.t.toLowerCase()).join(" ") === rest.join(" ").toLowerCase();
    tries++;
    if (ok) return finish(tries === 1 ? 5 : 3, true);
    if (tries === 1) {
      $("#built").classList.remove("shake"); void $("#built").offsetWidth; $("#built").classList.add("shake");
      $("#fb").innerHTML = `<div class="feedback bad"><h3>${t("f.retry")}</h3><div class="why">${t("f.retry.p", `<b lang="da">${esc(c.word)}</b>`)}</div></div>`;
      return;
    }
    finish(1, false, "critical");
  };
  $("#clr").onclick = () => { placed.length = 0; draw(); };
  $("#idk").onclick = () => finish(1, false, "critical");
  S.keys = e => { if (e.key === "Enter" && !$("#chk")?.disabled) $("#chk")?.click(); };
}

// ---------- feedback + grading ----------
// q follows vocab.md: 5 instant · 4 after hesitation · 3 small slip · 2 recognised when shown · 1 vaguely · 0 blank
function feedback(c, it, q, ok, body, severity, headText, canOverride, retype) {
  S.pending = { id: c.id, q, ok, practice: it.practice || S.graded.has(c.id) };
  const why = c.note ? `<div class="why soft small" lang="da">${esc(c.note)}</div>` : "";
  const sevTag = severity ? `<span class="sev ${severity}">${t("sev." + severity)}</span>` : "";
  $("#fb").innerHTML = `<div class="feedback ${ok ? "ok" : "bad"}">
      <h3>${sevTag}${headText || (ok ? t("f.right") : t("f.wrong"))}</h3>
      <div class="why">${body}</div>${why}
      ${retype ? `<div style="margin-top:12px"><div class="small"><b>${t("f.retype")}</b> ${t("f.retype.s")}</div><input class="answer" id="rt" lang="da" autocomplete="off" spellcheck="false" style="margin-top:6px">${letters()}</div>` : ""}
    </div>
    <div class="row next"><button class="btn solid" id="nx" ${retype ? "disabled" : ""}>${t("b.next")}</button>
      ${canOverride ? `<button class="btn quiet" id="ov">${t("b.override")}</button>` : ""}
      ${retype ? `<button class="btn quiet" id="skip">${t("b.skip")}</button>` : ""}
      <button class="btn quiet" id="more">${t("b.more")}</button>
      <span class="spacer"></span><span class="soft small">${S.pending.practice ? t("f.practice") : t("f.grade", q)}</span></div>`;
  $("#more").onclick = () => explain(c);
  if (retype) {
    const r = $("#rt"); r.focus(); bindLetters(r);
    r.oninput = () => { $("#nx").disabled = norm(r.value) !== norm(retype); if (!$("#nx").disabled) $("#nx").focus(); };
    $("#skip").onclick = () => { $("#nx").disabled = false; $("#nx").focus(); };
  }
  if (canOverride) $("#ov").onclick = () => { S.pending.q = 4; S.pending.ok = true; $(".feedback").className = "feedback ok"; $(".feedback h3").textContent = t("f.counted"); $("#ov").remove(); };
  bindNext(commit);
}
function commit() {
  const p = S.pending;
  if (!p) return advance();
  S.pending = null;
  $("#nx") && ($("#nx").disabled = true);
  if (!p.practice) {
    grade(p.id, p.q);
    S.graded.add(p.id);
    S.results.push({ id: p.id, q: p.q });
    if (p.q < 3) {
      // relearn later in this session with another exercise type, and drill its confusable partner
      S.queue.splice(Math.min(S.i + 4, S.queue.length), 0, { kind: "ex", id: p.id, practice: true });
      const pr = partnerPairs(p.id)[0];
      if (pr && !S.queue.some(x => x.kind === "pair" && x.pair === pr)) S.queue.splice(Math.min(S.i + 2, S.queue.length), 0, { kind: "pair", pair: pr });
    }
  }
  advance();
}

function renderPair(it) {
  const [a, b] = it.pair;
  const A = DB.cards[a], B = DB.cards[b];
  const items = shuffle([A, B]).map(c => {
    const s = (c.example && findSpan(c, c.example)) ? { s: c.example, span: findSpan(c, c.example) } :
      examSentences(c)[0] ? { s: examSentences(c)[0].s, span: examSentences(c)[0].m } : null;
    return s && { c, ...s };
  }).filter(Boolean);
  let k = 0;
  const one = () => {
    if (k >= items.length) return;
    const x = items[k], opts = [A, B];
    const gapped = `${esc(x.s.slice(0, x.span[0]))}<span class="gap">&nbsp;</span>${esc(x.s.slice(x.span[1]))}`;
    mc(`${t("s.conf")} · ${A.word} / ${B.word}`, `<p class="prompt">${t("q.pair", k + 1, items.length)}</p><div class="sentence" lang="da">${gapped}</div>`,
      opts.map(o => `<b lang="da">${esc(o.word)}</b> <span class="soft">· ${esc(o.meaning)}</span>`), opts.indexOf(x.c), ok => {
        $("#fb").innerHTML = `<div class="feedback ${ok ? "ok" : "bad"}"><h3>${ok ? t("f.right") : t("f.its", esc(x.c.word))}</h3>
          <div class="why sentence" lang="da">${hlSentence(x.c, x.s, x.span)}</div>
          ${k === items.length - 1 ? `<div class="pair"><div><b lang="da">${esc(A.word)}</b><br>${esc(A.meaning)}<div class="small soft" lang="da">${esc(A.note || "")}</div></div><div><b lang="da">${esc(B.word)}</b><br>${esc(B.meaning)}<div class="small soft" lang="da">${esc(B.note || "")}</div></div></div><div class="why"><b>${t("f.rule")}</b> ${esc(tip(it.pair))}</div>` : ""}
          </div><div class="row next"><button class="btn solid" id="nx">${t("b.next")}</button><button class="btn quiet" id="more">${t("b.more")}: <span lang="da">${esc(x.c.word)}</span></button><span class="spacer"></span><span class="soft small">${t("f.practice")}</span></div>`;
        $("#more").onclick = () => explain(x.c);
        bindNext(() => { k++; if (k < items.length) one(); else advance(); });
      });
  };
  if (!items.length) return advance();
  one();
}

// ---------- explain more ----------
// translation into English, shown under the sentence; cached per browser so each sentence is fetched once
const TR_KEY = "pd3-assisted-learning:tr:v1";
let TR = {};
try { TR = JSON.parse(localStorage.getItem(TR_KEY) || "{}"); } catch (e) { TR = {}; }
async function translate(s) {
  if (TR[s]) return TR[s];
  const q = encodeURIComponent(s);
  const tries = [
    async () => (await (await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=da&tl=en&dt=t&q=${q}`)).json())[0].map(x => x[0]).join(""),
    async () => { const r = await (await fetch(`https://api.mymemory.translated.net/get?q=${q}&langpair=da|en`)).json(); if (r.responseStatus !== 200) throw 0; return r.responseData.translatedText; },
  ];
  for (const f of tries) {
    try {
      const out = (await f() || "").trim();
      if (out) { TR[s] = out; try { localStorage.setItem(TR_KEY, JSON.stringify(TR)); } catch (e) { /* ignore */ } return out; }
    } catch (e) { /* try the next one */ }
  }
  throw new Error("no translation");
}
function trLink(s) { return `<button type="button" class="linkbtn tr" data-s="${esc(s)}">${t("m.tr")}</button>`; }
function bindTr(root) {
  root.querySelectorAll("button.tr").forEach(b => b.onclick = async () => {
    const box = b.parentElement, open = box.querySelector(":scope > .trl");
    if (open) { open.remove(); b.textContent = t("m.tr"); return; }
    const s = b.dataset.s, line = document.createElement("div");
    line.className = "trl"; line.lang = "en"; line.setAttribute("aria-live", "polite");
    line.textContent = t("m.tr.wait"); box.append(line); b.textContent = t("m.tr.hide");
    try { line.textContent = await translate(s); }
    catch (e) {
      line.classList.add("err");
      line.innerHTML = `${t("m.tr.err")} <a href="https://translate.google.com/?sl=da&tl=en&op=translate&text=${encodeURIComponent(s)}" target="_blank" rel="noopener">${t("m.tr.open")}</a>`;
    }
  });
}
function explain(c) {
  let dlg = $("#explain");
  if (!dlg) {
    dlg = document.createElement("dialog");
    dlg.className = "info explain"; dlg.id = "explain"; dlg.setAttribute("aria-labelledby", "exTitle");
    dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
    document.body.append(dlg);
  }
  const d = c.dict, ex = examSentences(c), pairs = partnerPairs(c.id);
  const same = x => norm(x.meaning) === norm(c.meaning);
  const mates = Object.values(DB.cards).filter(x => x.group === c.group && x.id !== c.id)
    .sort((a, b) => same(b) - same(a) || a.word.localeCompare(b.word, "da"));
  const lookup = d ? d.url : `https://ordnet.dk/ddo/ordbog?query=${encodeURIComponent(variants(c.word).filter(v => !/^(at|en|et) /.test(v)).pop() || c.word)}`;
  dlg.innerHTML = `<div class="ib">
    <div class="ih"><div><span class="lbl" id="exTitle">${t("m.title")}</span><div class="head"><span class="big" lang="da">${esc(c.word)}</span>${wtype(c) ? `<span class="tag">${esc(wtype(c))}</span>` : ""}</div></div>
      <button type="button" class="btn quiet" id="exClose">${t("info.close")}</button></div>
    <div class="meaning" style="margin-top:12px">${esc(c.meaning)}</div>
    ${noteText(c) ? `<div class="soft" lang="da" style="margin-top:4px">${esc(noteText(c))}</div>` : ""}
    <div class="block"><div class="eg"><span class="lbl">${t("t.example")}</span><div class="ex" lang="da"><span class="sentence">${hlSentence(c, c.example)}</span>${trLink(c.example)}</div></div></div>
    ${wtype(c) ? `<h3>${t("t.order")}</h3>${ruleBlock(c)}` : ""}
    <h3>${t("m.senses")} <span class="soft">· ${t("t.ddo")}</span></h3>
    ${d ? `<div class="ddo"><div class="soft small">${esc(d.pos)}</div>${d.senses.map((s, i) => `<div lang="da" style="margin-top:4px">${d.senses.length > 1 ? `<b>${i + 1}.</b> ` : ""}${esc(s)}</div>`).join("")}
      ${d.cite.length ? `<span class="lbl" style="margin-top:12px">${t("m.cites")}</span>${d.cite.map(x => `<blockquote lang="da"><span>${esc(x)}</span>${trLink(x)}</blockquote>`).join("")}` : ""}
      <div class="cite"><a href="${esc(d.url)}" target="_blank" rel="noopener">ordnet.dk ↗</a></div></div>`
      : `<p>${t("m.nodict")} <a href="${esc(lookup)}" target="_blank" rel="noopener">${t("m.lookup")}</a></p>`}
    ${ex.length ? `<h3>${t("m.exam")} <span class="soft">· ${ex.length}</span></h3>${ex.map(e => `<div class="ex" lang="da"><span class="tag">${esc(e.src)}</span><span>${hlSentence(c, e.s, e.m)}</span>${trLink(e.s)}</div>`).join("")}` : ""}
    ${pairs.map(p => { const o = DB.cards[p[0] === c.id ? p[1] : p[0]]; return `<div class="block"><div class="warnbox"><b>${t("t.mix")}</b> <span lang="da">${esc(c.word)} / ${esc(o.word)}</span> (${esc(o.meaning)}) — ${esc(tip(p))}</div></div>`; }).join("")}
    ${mates.length ? `<h3>${t("m.mates")} <span class="soft">· ${esc(gname(c.group))} ${t("m.mates.s")}</span></h3>
      <div class="mates">${mates.map(x => `<button type="button" class="mate${same(x) ? " same" : ""}" data-id="${esc(x.id)}"><b lang="da">${esc(x.word)}</b><span>${esc(x.meaning)}${same(x) ? ` · ${t("m.same")}` : ""}</span></button>`).join("")}</div>` : ""}
    <p class="small" style="margin-top:18px">${t("m.coach", esc(c.word))}</p></div>`;
  $("#exClose").onclick = () => dlg.close();
  bindTr(dlg);
  dlg.querySelectorAll(".mate").forEach(b => { b.onclick = () => explain(DB.cards[b.dataset.id]); });
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
}

// ---------- keyboard ----------
function bindNext(fn) {
  S.keys = null;
  const b = $("#nx");
  if (b) { b.onclick = fn; setTimeout(() => { if (!document.activeElement || document.activeElement === document.body) b.focus(); }, 0); }
  S.next = fn;
}
document.addEventListener("keydown", e => {
  if (!S || document.querySelector("dialog[open]")) return;
  const nx = $("#nx");
  if (e.key === "Enter" && nx && !nx.disabled && (document.activeElement?.tagName !== "INPUT" || document.activeElement.id === "rt")) { e.preventDefault(); nx.click(); return; }
  if (S.keys && document.activeElement?.tagName !== "INPUT") S.keys(e);
  else if (S.keys && e.key === "Enter") S.keys(e);
});

// ---------- summary ----------
function summary() {
  const r = S.results, n = r.length;
  const right = r.filter(x => x.q >= 3).length;
  const shaky = r.filter(x => x.q <= 2).map(x => DB.cards[x.id]);
  const next = {};
  r.forEach(x => { const d = DB.cards[x.id].due; next[d] = (next[d] || 0) + 1; });
  const fmt = d => new Date(d + "T12:00").toLocaleDateString(LANG === "en" ? "en-GB" : "da-DK", { weekday: "short", day: "numeric", month: "short" });
  const title = S.title;
  S = null;
  $("#app").innerHTML = `<div class="narrow"><div class="sheet q" style="margin-top:28px">
    <div class="kind">${t("r.done", esc(title))}</div>
    ${n ? `<div class="row" style="align-items:baseline;margin-top:10px"><span class="score">${Math.round(100 * right / n)}%</span><span class="soft">${t("r.score", right, n)}</span></div>` : `<p>${t("r.practice")}</p>`}
    ${shaky.length ? `<div class="block"><span class="lbl">${t("r.shaky")}</span><ul class="list">${shaky.map(c => `<li><b lang="da">${esc(c.word)}</b><span class="soft">${esc(c.meaning)}</span><span class="spacer"></span><span class="small soft">${t("r.tomorrow")}</span></li>`).join("")}</ul></div>` : n ? `<div class="block">${t("r.none")}</div>` : ""}
    ${n ? `<div class="block"><span class="lbl">${t("r.next")}</span><ul class="list">${Object.keys(next).sort().map(d => `<li>${fmt(d)}<span class="spacer"></span><span class="soft">${t("r.cards", next[d])}</span></li>`).join("")}</ul></div>` : ""}
    ${n ? `<p class="small soft block">${esc(t("r.coach"))}</p>` : ""}
    <div class="row next"><button class="btn solid" id="home">${t("r.home")}</button></div></div></div>`;
  $("#home").onclick = home;
}

load();
</script>
