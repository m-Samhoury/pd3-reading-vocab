// ---------- find a word ----------
// the study sheet's own list (data/words.json on the site) has its own groups; it's fetched once when the finder opens
let SITE_WORDS = null;   // null = not loaded, false = failed, else {words, groups}
async function loadSiteWords() {
  if (SITE_WORDS !== null) return SITE_WORDS;
  const base = location.protocol === "file:" ? SITE : "";
  try {
    const [w, g] = await Promise.all(["data/words.json", "data/groups.json"].map(async u => { const r = await fetch(base + u); if (!r.ok) throw 0; return r.json(); }));
    SITE_WORDS = { words: w, groups: Object.fromEntries(g.map(x => [x.id, x])) };
  } catch (e) { SITE_WORDS = false; }
  return SITE_WORDS;
}
const fold = s => norm(s).replace(/æ/g, "ae").replace(/ø/g, "oe").replace(/å/g, "aa").replace(/aa/g, "a");
// one entry per Danish word, merging the coach deck and the study sheet
let WI = null, WI_SITE;
function wordIndex() {
  if (WI && WI_SITE === SITE_WORDS) return WI;
  const idx = new Map();
  const get = key => { if (!idx.has(key)) idx.set(key, { key, word: null, meaning: "", card: null, site: null, forms: new Set(), en: "" }); return idx.get(key); };
  for (const c of cards()) {
    const e = get(fold(c.word)); e.word = c.word; e.card = c; e.meaning = c.meaning; e.en += " " + c.meaning;
    variants(c.word).forEach(v => e.forms.add(v));
  }
  for (const w of SITE_WORDS ? SITE_WORDS.words : []) {
    const k = fold(w.display);
    // join to a coach card when one of its look-up forms is this word
    const hit = [...idx.values()].find(e => e.card && [...e.forms].some(f => fold(f) === k));
    const e = hit || get(k);
    e.site = w; e.word = e.word || w.display;
    const en = (w.senses || []).map(s => s.en_definition || "").join(" ");
    e.en += " " + en;
    if (!e.meaning) e.meaning = ((w.senses || [])[0]?.en_definition || "").replace(/\s+[–-]\s+.*$/, "");
    [w.display, w.lemma, ...(w.forms || [])].filter(Boolean).forEach(v => e.forms.add(norm(v)));
  }
  WI_SITE = SITE_WORDS;
  return (WI = [...idx.values()]);
}
const ABBR = { "bl a": "blandt andet", "fx": "for eksempel", "f eks": "for eksempel", "dvs": "det vil sige", "mht": "med hensyn til",
  "pga": "på grund af", "ift": "i forhold til", "osv": "og så videre", "evt": "eventuelt", "ca": "cirka", "iflg": "ifølge", "vha": "ved hjælp af" };
// bare stems of a typed word, so "medfører", "medførte", "konsekvenser" find "at medføre", "konsekvens"
function stems(f) {
  const out = new Set([f]);
  for (const end of ["ede", "ende", "erne", "ene", "er", "en", "et", "ne", "de", "te", "r", "e", "s"])
    if (f.endsWith(end) && f.length - end.length >= 3) { const b = f.slice(0, -end.length); out.add(b); out.add(b + "e"); }
  return out;
}
function searchWords(q) {
  q = ABBR[norm(q).replace(/\.$/, "")] || q;
  const f = fold(q);
  if (!f) return [];
  const fs = stems(f);
  const out = [];
  for (const e of wordIndex()) {
    let best = null;
    for (const v of e.forms) {
      const fv = fold(v);
      const sc = fv === f ? 0 : fv.startsWith(f) ? 1 : fs.has(fv) ? 1.5 : (f.length >= 3 && fv.includes(f)) ? 2 : null;
      if (sc !== null && (!best || sc < best.sc)) best = { sc, form: v };
    }
    if (!best && f.length >= 3 && new RegExp(`\\b${f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}`).test(fold(e.en))) best = { sc: 3, en: true };
    if (best) out.push({ e, ...best });
  }
  return out.sort((a, b) => a.sc - b.sc || a.e.word.length - b.e.word.length).slice(0, 12);
}
function nearWords(q) {
  const f = fold(q);
  return wordIndex().map(e => ({ e, d: Math.min(...[...e.forms].map(v => lev(fold(v), f))) }))
    .filter(x => x.d <= Math.max(2, Math.floor(f.length / 3))).sort((a, b) => a.d - b.d).slice(0, 6).map(x => x.e);
}
function hitCard(x) {
  const e = x.e, c = e.card, w = e.site;
  const sg = w ? (w.groups || [w.primary_group]).map(id => SITE_WORDS.groups[id]).filter(Boolean) : [];
  const via = x.en ? t("f.viaen") : (x.form && fold(x.form) !== fold(e.word) && x.sc === 0) ? t("f.viaform", x.form) : "";
  return `<div class="sheet hit">
    <div class="head"><span class="big" lang="da">${esc(e.word)}</span>${c && wtype(c) ? `<span class="tag">${esc(wtype(c))}</span>` : w ? `<span class="tag">${esc(w.word_class || "")}</span>` : ""}</div>
    ${e.meaning ? `<div class="meaning">${esc(e.meaning)}</div>` : ""}${c ? prepLine(c) : ""}${via ? `<div class="via">${esc(via)}</div>` : ""}
    <div class="cats">
      <div class="cat"><span class="src">${t("f.al")}</span>${c ? `<span class="badge t${prio(c.group)}">${esc(t("p." + prio(c.group)))}</span><span class="gname">${esc(gname(c.group))} <small>· ${esc(GROUPS[c.group] ? GROUPS[c.group][LANG === "en" ? 1 : 0] : "")}</small></span>` : `<span class="soft">${t("f.notal")}</span>`}</div>
      ${SITE_WORDS ? `<div class="cat"><span class="src">${t("f.site")}</span>${sg.length ? sg.map((g, i) => `<span class="gname">${esc(LANG === "en" ? g.name_en : g.name_da)} <small>· ${esc(LANG === "en" ? g.name_da : g.name_en)}</small></span>`).join(`<span class="soft">+</span>`) : `<span class="soft">${t("f.notsite")}</span>`}</div>` : ""}
    </div>
    ${c ? `<div class="row"><button class="btn" data-explain="${esc(c.id)}">${t("b.more")}</button><button class="btn quiet" data-practise="${esc(c.group)}">${t("f.pract")} →</button></div>` : ""}
  </div>`;
}
// the find bar lives under the top bar and opens over whatever screen is showing (home, a session, the summary)
let findTimer;
function finder() {
  const bar = $("#findbar"), nav = $("#navFind"), input = $("#fq"), x = $("#fqClose");
  input.placeholder = t("f.ph"); input.setAttribute("aria-label", t("nav.find"));
  x.title = t("f.close"); x.setAttribute("aria-label", t("f.close"));
  bindLetters(input, bar);
  nav.onclick = e => { e.preventDefault(); bar.classList.contains("open") ? findClose() : findOpen(); };
  x.onclick = findClose;
  input.onkeydown = e => { if (e.key === "Escape") { e.preventDefault(); findClose(); } };
}
function findOpen(q0) {
  const bar = $("#findbar"), input = $("#fq");
  clearTimeout(findTimer);
  bar.inert = false; bar.classList.add("open");
  $("#navFind").setAttribute("aria-expanded", "true");
  if (q0 !== undefined) input.value = q0;
  input.focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: "smooth" });
  findDraw();
}
function findClose() {
  const bar = $("#findbar");
  if (!bar.classList.contains("open")) return;
  bar.classList.remove("open");
  $("#navFind").setAttribute("aria-expanded", "false");
  $("#navFind").focus({ preventScroll: true });
  // empty it once the closing animation has run
  findTimer = setTimeout(() => { bar.inert = true; $("#fq").value = ""; $("#hits").innerHTML = ""; }, 420);
}
async function findDraw() {
  const input = $("#fq"), k = counts();
  const meta = () => { $("#fmeta").textContent = SITE_WORDS === null ? t("f.loading") : SITE_WORDS === false ? t("f.offline") : t("f.count", k.total, SITE_WORDS.words.length); };
  const draw = () => {
    const q = input.value.trim();
    if (!q) { $("#hits").innerHTML = ""; return; }
    const hits = searchWords(q);
    if (hits.length) $("#hits").innerHTML = hits.map(hitCard).join("");
    else {
      const near = nearWords(q);
      // a close spelling is most likely what was meant: show it in full, the rest as chips
      $("#hits").innerHTML = `<div class="sheet hit"><b>${esc(t("f.none", q))}</b>
        ${near.length > 1 ? `<div class="row"><span class="soft">${t("f.near")}</span>${near.map(e => `<button type="button" class="pchip" data-q="${esc(e.word)}" lang="da">${esc(e.word)}</button>`).join("")}</div>` : ""}
        <p class="small" style="margin-top:12px"><a href="https://ordnet.dk/ddo/ordbog?query=${encodeURIComponent(q)}" target="_blank" rel="noopener">${esc(t("f.ddo", q))}</a></p></div>
        ${near.length ? `<span class="lbl" style="margin:6px 0 -4px">${t("f.near")}</span>${hitCard({ e: near[0] })}` : ""}`;
    }
    $("#hits").querySelectorAll("[data-explain]").forEach(b => b.onclick = () => explain(DB.cards[b.dataset.explain]));
    $("#hits").querySelectorAll("[data-practise]").forEach(b => b.onclick = () => { setPicked([b.dataset.practise]); findClose(); home(); });
    $("#hits").querySelectorAll("[data-q]").forEach(b => b.onclick = () => { input.value = b.dataset.q; draw(); input.focus(); });
  };
  input.oninput = draw;
  meta(); draw();
  await loadSiteWords();
  if ($("#findbar").classList.contains("open")) { meta(); draw(); }
}

// ---------- explain more ----------
// translation into English, shown under the sentence; cached per browser so each sentence is fetched once
const TR_KEY = "pd3-assisted-learning:tr:v1";
let TR = {};
try { TR = JSON.parse(localStorage.getItem(TR_KEY) || "{}"); } catch (e) { TR = {}; }
async function translate(s) {
  if (TR[s]) return TR[s];
  const q = encodeURIComponent(s);
  const tries = [
    async () => (await (await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=da&tl=en&dt=t&q=${q}`)).json())[0].map(x => x[0]).join(""),
    async () => { const r = await (await fetch(`https://api.mymemory.translated.net/get?q=${q}&langpair=da|en`)).json(); if (r.responseStatus !== 200) throw 0; return r.responseData.translatedText; },
  ];
  for (const f of tries) {
    try {
      const out = (await f() || "").trim();
      if (out) { TR[s] = out; try { localStorage.setItem(TR_KEY, JSON.stringify(TR)); } catch (e) { /* ignore */ } return out; }
    } catch (e) { /* try the next one */ }
  }
  throw new Error("no translation");
}
function trLink(s) { return `<button type="button" class="linkbtn tr" data-s="${esc(s)}">${t("m.tr")}</button>`; }
function bindTr(root) {
  root.querySelectorAll("button.tr").forEach(b => b.onclick = async () => {
    const box = b.parentElement, open = box.querySelector(":scope > .trl");
    if (open) { open.remove(); b.textContent = t("m.tr"); return; }
    const s = b.dataset.s, line = document.createElement("div");
    line.className = "trl"; line.lang = "en"; line.setAttribute("aria-live", "polite");
    line.textContent = t("m.tr.wait"); box.append(line); b.textContent = t("m.tr.hide");
    try { line.textContent = await translate(s); }
    catch (e) {
      line.classList.add("err");
      line.innerHTML = `${t("m.tr.err")} <a href="https://translate.google.com/?sl=da&tl=en&op=translate&text=${encodeURIComponent(s)}" target="_blank" rel="noopener">${t("m.tr.open")}</a>`;
    }
  });
}
function explain(c) {
  let dlg = $("#explain");
  if (!dlg) {
    dlg = document.createElement("dialog");
    dlg.className = "info explain"; dlg.id = "explain"; dlg.setAttribute("aria-labelledby", "exTitle");
    dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
    document.body.append(dlg);
  }
  const d = c.dict, ex = examSentences(c), pairs = partnerPairs(c.id);
  const same = x => norm(x.meaning) === norm(c.meaning);
  const mates = Object.values(DB.cards).filter(x => x.group === c.group && x.id !== c.id)
    .sort((a, b) => same(b) - same(a) || a.word.localeCompare(b.word, "da"));
  const lookup = d ? d.url : `https://ordnet.dk/ddo/ordbog?query=${encodeURIComponent(variants(c.word).filter(v => !/^(at|en|et) /.test(v)).pop() || c.word)}`;
  dlg.innerHTML = `<div class="ib">
    <div class="ih"><div><span class="lbl" id="exTitle">${t("m.title")}</span><div class="head"><span class="big" lang="da">${esc(c.word)}</span>${wtype(c) ? `<span class="tag">${esc(wtype(c))}</span>` : ""}</div></div>
      <button type="button" class="btn quiet" id="exClose">${t("info.close")}</button></div>
    ${prepLine(c)}
    <div class="meaning" style="margin-top:12px">${esc(c.meaning)}</div>
    ${noteText(c) ? `<div class="soft" lang="da" style="margin-top:4px">${esc(noteText(c))}</div>` : ""}
    ${DB.senses[c.id] ? "" : `<div class="block"><div class="eg"><span class="lbl">${t("t.example")}</span><div class="ex" lang="da"><span class="sentence">${hlSentence(c, c.example)}</span>${trLink(c.example)}</div></div></div>`}
    ${wtype(c) ? `<h3>${t("t.order")}</h3>${ruleBlock(c)}` : ""}
    <h3>${t("m.senses")} <span class="soft">· ${t("t.ddo")}</span></h3>
    ${d ? `<div class="ddo"><div class="soft small">${ddoHead(c, d)}</div>${ddoSenses(d, 99)}
      ${d.cite.length ? `<span class="lbl" style="margin-top:12px">${t("m.cites")}</span>${d.cite.map(x => `<blockquote lang="da"><span>${esc(x)}</span>${trLink(x)}</blockquote>`).join("")}` : ""}
      <div class="cite"><a href="${esc(d.url)}" target="_blank" rel="noopener">ordnet.dk ↗</a></div></div>`
      : `<p>${t("m.nodict")} <a href="${esc(lookup)}" target="_blank" rel="noopener">${t("m.lookup")}</a></p>`}
    ${DB.senses[c.id] ? `<h3>${t("t.senses")} <span class="soft">· ${t("m.exam")}</span></h3>${senseBlocks(c, 99, true)}` :
      ex.length ? `<h3>${t("m.exam")} <span class="soft">· ${ex.length}</span></h3>${ex.map(e => `<div class="ex" lang="da"><span class="tag">${esc(e.src)}</span><span>${hlSentence(c, e.s, e.m)}</span>${trLink(e.s)}</div>`).join("")}` : ""}
    ${pairs.map(p => { const o = DB.cards[p[0] === c.id ? p[1] : p[0]]; return `<div class="block"><div class="warnbox"><b>${t("t.mix")}</b> <span lang="da">${esc(c.word)} / ${esc(o.word)}</span> (${esc(o.meaning)}) — ${esc(tip(p))}</div></div>`; }).join("")}
    ${tipBlock(c)}
    ${mates.length ? `<h3>${t("m.mates")} <span class="soft">· ${esc(gname(c.group))} ${t("m.mates.s")}</span></h3>
      <div class="mates">${mates.map(x => `<button type="button" class="mate${same(x) ? " same" : ""}" data-id="${esc(x.id)}"><b lang="da">${esc(x.word)}</b><span>${esc(x.meaning)}${same(x) ? ` · ${t("m.same")}` : ""}</span></button>`).join("")}</div>` : ""}
    <p class="small" style="margin-top:18px">${t("m.coach", esc(c.word))}</p></div>`;
  $("#exClose").onclick = () => dlg.close();
  bindTr(dlg);
  dlg.querySelectorAll(".mate").forEach(b => { b.onclick = () => explain(DB.cards[b.dataset.id]); });
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
}

// ---------- keyboard ----------
function bindNext(fn) {
  S.keys = null;
  const b = $("#nx");
  if (b) { b.onclick = fn; setTimeout(() => { if (!document.activeElement || document.activeElement === document.body) b.focus(); }, 0); }
  S.next = fn;
}
document.addEventListener("keydown", e => {
  if (!S || document.querySelector("dialog[open]") || e.target.closest?.("#findbar")) return;
  const nx = $("#nx");
  if (e.key === "Enter" && nx && !nx.disabled && (document.activeElement?.tagName !== "INPUT" || document.activeElement.id === "rt")) { e.preventDefault(); nx.click(); return; }
  if (e.key === "ArrowLeft" && $("#prev") && document.activeElement?.tagName !== "INPUT") { e.preventDefault(); goBack(); return; }
  if (S.keys && document.activeElement?.tagName !== "INPUT") S.keys(e);
  else if (S.keys && e.key === "Enter") S.keys(e);
});

// ---------- summary ----------
function summary() {
  const ex = S.exercise;
  const r = ex ? S.practiceResults : S.results, n = r.length;
  const right = r.filter(x => x.q >= 3).length;
  const shaky = r.filter(x => x.q <= 2).map(x => DB.cards[x.id]);
  const next = {};
  if (!ex) r.forEach(x => { const d = DB.cards[x.id].due; next[d] = (next[d] || 0) + 1; });
  const fmt = d => new Date(d + "T12:00").toLocaleDateString(LANG === "en" ? "en-GB" : "da-DK", { weekday: "short", day: "numeric", month: "short" });
  const title = S.title;
  S = null;
  $("#app").innerHTML = `<div class="narrow"><div class="sheet q" style="margin-top:28px">
    <div class="kind">${t("r.done", esc(title))}</div>
    ${n ? `<div class="row" style="align-items:baseline;margin-top:10px"><span class="score">${Math.round(100 * right / n)}%</span><span class="soft">${t("r.score", right, n)}</span></div>` : `<p>${t("r.practice")}</p>`}
    ${shaky.length ? `<div class="block"><span class="lbl">${t("r.shaky")}</span><ul class="list">${shaky.map(c => `<li><b lang="da">${esc(c.word)}</b><span class="soft">${esc(c.meaning)}</span><span class="spacer"></span><span class="small soft">${ex ? "" : t("r.tomorrow")}</span></li>`).join("")}</ul></div>` : n ? `<div class="block">${t("r.none")}</div>` : ""}
    ${ex ? `<p class="small soft block">${t("r.ex")}</p>` : ""}
    ${n && !ex ? `<div class="block"><span class="lbl">${t("r.next")}</span><ul class="list">${Object.keys(next).sort().map(d => `<li>${fmt(d)}<span class="spacer"></span><span class="soft">${t("r.cards", next[d])}</span></li>`).join("")}</ul></div>` : ""}
    ${n ? `<p class="small soft block">${esc(t("r.coach"))}</p>` : ""}
    <div class="row next"><button class="btn solid" id="home">${t("r.home")}</button></div></div></div>`;
  $("#home").onclick = home;
}
