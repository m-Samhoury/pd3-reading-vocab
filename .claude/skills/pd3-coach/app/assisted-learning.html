* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--body); -webkit-font-smoothing: antialiased;
  caret-color: var(--accent); accent-color: var(--accent); scrollbar-color: var(--faint) var(--paper); }
::selection { background: var(--accent-soft); color: var(--accent-text); }
h1, h2, h3 { font-family: var(--head); line-height: 1.2; margin: 0; letter-spacing: -.01em; font-weight: 800; text-wrap: balance; }
a { color: var(--link); text-underline-offset: 3px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--focus) 60%, transparent); outline-offset: 2px; border-radius: 10px; }
[hidden] { display: none !important; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter); }
.narrow { max-width: 780px; margin: 0 auto; }

/* top bar: logo · links · help · language (as on the other pages) */
.topbar { background: var(--sheet); border-bottom: 1px solid var(--rule); }
.topbar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 0 24px; min-height: 64px; }
.brand { order: 0; display: inline-flex; align-items: center; gap: 10px; min-height: 56px; text-decoration: none; color: var(--ink); font-weight: 700; letter-spacing: -.01em; }
.logo { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--accent-soft);
  color: var(--accent); font-weight: 800; font-size: .95rem; letter-spacing: -.04em; }
.nav { display: flex; align-items: center; gap: 2px 4px; flex: 1 1 auto; flex-wrap: wrap; order: 1; }
.nav a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 10px; text-decoration: none;
  color: var(--soft); font-weight: 500; font-size: .95rem; }
.nav a:hover { color: var(--ink); background: var(--paper); }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 600; background: var(--paper); }
.iconbtn { order: 2; margin-left: auto; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--rule-strong); background: var(--sheet); color: var(--soft); cursor: pointer; }
.iconbtn:hover { color: var(--ink); border-color: var(--ink); }
.themebtn { margin-left: 8px; }
.themebtn svg { display: block; }
.langbtn { order: 2; margin-left: 8px; min-height: 38px; padding: 6px 16px; border-radius: 10px; border: 1px solid var(--rule-strong);
  background: var(--sheet); color: var(--ink); font-weight: 600; font-size: .9rem; cursor: pointer; }
.langbtn:hover { border-color: var(--ink); }
@media (max-width: 640px) {
  .topbar-in { padding-bottom: 8px; column-gap: 8px; }
  .brand { margin-right: auto; }
  .iconbtn { margin-left: 0; }
  .langbtn { padding: 6px 12px; }
  .nav { order: 3; flex-basis: 100%; margin-left: -10px; }
  .nav a { padding: 0 10px; }
}
dialog.info { border: 0; border-radius: 18px; padding: 0; width: min(580px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  background: var(--sheet); color: var(--ink); box-shadow: var(--shadow-lg); overflow: auto; }
dialog.info::backdrop { background: rgba(15, 16, 20, .45); }
dialog.info .ib { padding: 14px 20px 22px; }
dialog.info .ih { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
dialog.info .ih h2 { font-size: 1.3rem; }
dialog.info h3 { font-size: 1rem; margin: 18px 0 6px; }
dialog.info p { margin: 6px 0; color: var(--soft); font-size: .93rem; }
dialog.explain { width: min(680px, calc(100vw - 32px)); }
dialog.explain .ih { position: sticky; top: 0; background: var(--sheet); padding: 14px 0 10px; margin-top: -14px; border-bottom: 1px solid var(--rule); z-index: 1; }
dialog.explain .ih .big { font-size: 1.8rem; }
dialog.explain h3 .soft { font-weight: 400; font-size: .85rem; }
dialog.explain .ex { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
dialog.explain .ex > span:not(.tag) { flex: 1 1 240px; min-width: 0; }
.trrow { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 8px; }
.trrow .tr { margin-left: 0; font-size: .85rem; }
.trrow .trl { flex-basis: 100%; font-size: .92rem; color: var(--soft); padding: 4px 0 2px 10px; border-left: 2px solid var(--blue); }
dialog.explain .tr { margin-left: auto; font-size: .8rem; white-space: nowrap; }
dialog.explain blockquote { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.trl { flex-basis: 100%; font-style: normal; font-size: .92rem; color: var(--soft); padding: 4px 0 2px 10px; border-left: 2px solid var(--blue); }
.trl.err a { color: var(--accent-text); }
.mates { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.mate { text-align: left; font: inherit; color: inherit; cursor: pointer; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 11px; }
.mate:hover { border-color: var(--accent); }
.mate b { display: block; } .mate span { font-size: .85rem; color: var(--soft); }
.mate.same { border-color: var(--blue); }
button.word { cursor: pointer; font: inherit; font-size: .9rem; color: inherit; }
button.word:hover { border-color: var(--accent); }
.morebtn { margin-left: auto; }
dl.keylist { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: .9rem; color: var(--soft); }
dl.keylist dt { font-weight: 600; color: var(--ink); }
dl.keylist dd { margin: 0; }

/* page heading */
.top { padding-top: 44px; padding-bottom: 8px; }
.top h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); font-weight: 700; letter-spacing: -.03em; }
.top h1 .light { font-weight: 400; display: block; }
.top > p { margin: 10px 0 0; color: var(--soft); max-width: 62ch; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--sheet);
  border: 1px solid var(--rule); box-shadow: var(--shadow); font-size: .85rem; font-weight: 500; color: var(--ink); margin-bottom: 16px; }
.chip b { padding: 2px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-weight: 600; font-size: .8rem; }
/* find bar: slides open under the top bar, over whichever screen is showing */
.findbar { display: grid; grid-template-rows: 0fr; background: var(--sheet); border-bottom: 1px solid transparent;
  transition: grid-template-rows .34s cubic-bezier(.2, .8, .2, 1), border-color .34s; }
.findbar.open { grid-template-rows: 1fr; border-bottom-color: var(--rule); box-shadow: var(--shadow); }
.findbar-in { min-height: 0; overflow: hidden; }
.findbar .wrap { padding-top: 14px; padding-bottom: 16px; opacity: 0; transform: translateY(-10px); transition: opacity .24s, transform .34s cubic-bezier(.2, .8, .2, 1); }
.findbar.open .wrap { opacity: 1; transform: none; transition-delay: .06s; }
.finder { position: relative; clip-path: inset(0 0 0 70% round 14px); transition: clip-path .42s cubic-bezier(.2, .8, .2, 1); }
.findbar.open .finder { clip-path: inset(-6px round 18px); }
.finder .ficon { position: absolute; left: 16px; top: 50%; translate: 0 -50%; color: var(--faint); pointer-events: none; }
.finder input { width: 100%; font: inherit; font-size: 1.2rem; padding: 13px 54px 13px 46px; border-radius: 14px; border: 1.5px solid var(--rule-strong); background: var(--sheet); color: var(--ink); }
.finder input::-webkit-search-cancel-button { display: none; }
.finder input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.fx { position: absolute; right: 8px; top: 50%; translate: 0 -50%; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%;
  border: 0; background: var(--paper); color: var(--soft); cursor: pointer; transform: rotate(-90deg) scale(.5); opacity: 0;
  transition: transform .34s cubic-bezier(.2, .8, .2, 1) .1s, opacity .2s .1s, background .15s, color .15s; }
.findbar.open .fx { transform: none; opacity: 1; }
.fx:hover { background: var(--accent-soft); color: var(--accent-text); }
.fsub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
.fsub .letters { margin-top: 8px; }
.fsub #fmeta { margin: 8px 0 0; }
.findbar .hits { max-height: min(62vh, 600px); overflow-y: auto; overscroll-behavior: contain; margin-top: 14px; padding: 2px; }
.findbar .hits:empty { display: none; }
.findbar .hit { background: var(--paper); box-shadow: none; }
.nav a[aria-expanded="true"] { color: var(--accent-text); font-weight: 600; background: var(--accent-soft); }
.hits { display: grid; gap: 12px; margin-top: 18px; }
.hit { padding: 16px 18px; }
.hit .head .big { font-size: 1.6rem; }
.hit .via { font-size: .8rem; color: var(--faint); }
.hit .cats { display: grid; gap: 8px; margin-top: 12px; }
.hit .cat { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .92rem; }
.hit .cat .src { min-width: 120px; color: var(--soft); font-size: .82rem; }
.hit .cat .gname { font-weight: 700; font-size: 1.05rem; }
.hit .cat .gname small { font-weight: 400; color: var(--soft); font-size: .85rem; }
.hit .row { margin-top: 12px; }
/* home: exercise tiles (bento) first, then the topic picker with one tab per tier */
.hometop { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 24px; }
.hometop h1 { font-size: clamp(1.75rem, 5vw, 2.25rem); line-height: 1.15; }
.dayspill { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px 0 12px; border-radius: 999px;
  background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); font-weight: 600; font-size: .9rem; }
.dayspill svg { width: 20px; height: 20px; }
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(140px, auto); gap: 12px; }
.mtile { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 16px; padding: 20px;
  border: 0; border-radius: 32px; cursor: pointer; text-align: left; font: inherit; transition: border-radius .4s var(--spring); }
.mtile::before { content: ""; position: absolute; inset: 0; z-index: -1; background: currentColor; opacity: 0; transition: opacity .2s; }
.mtile:hover:not(:disabled)::before { opacity: .08; }
.mtile:active:not(:disabled)::before { opacity: .1; }
.mtile:active:not(:disabled) { border-radius: 48px; }
.mtile .tt { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.mtile .ti svg { width: 32px; height: 32px; display: block; }
.mtile b { display: block; font-family: var(--head); font-size: 1.375rem; line-height: 1.25; font-weight: 700; }
.mtile .td { display: block; font-size: .875rem; line-height: 1.4; margin-top: 2px; }
.mtile .tn { padding: 3px 12px; border-radius: 999px; background: var(--md-sys-color-surface-container-lowest); color: var(--md-sys-color-on-surface);
  font-size: .75rem; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mtile.k-go { grid-column: span 2; grid-row: span 2; padding: 28px; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); }
.mtile.k-go b { font-size: 2.25rem; line-height: 1.15; }
.mtile.k-go .td { font-size: 1rem; }
.mtile.k-go .ti { display: grid; place-items: center; width: 88px; height: 88px; border-radius: 48px; background: var(--md-sys-color-on-primary); color: var(--md-sys-color-primary);
  transition: border-radius .4s var(--spring); }
.mtile.k-go:hover .ti { border-radius: 28px; }
.mtile.k-go .ti svg { width: 44px; height: 44px; }
.mtile.k-learn, .mtile.k-review { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
.mtile.k-conf, .mtile.k-exer { background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); }
.mtile.k-flash, .mtile.k-gram { background: var(--md-sys-color-tertiary-container); color: var(--md-sys-color-on-tertiary-container); grid-column: span 2; }
.bento.nogram .mtile.k-flash { grid-column: span 4; }
.mtile:disabled { cursor: default; background: transparent; color: var(--md-sys-color-on-surface-variant); box-shadow: inset 0 0 0 2px var(--md-sys-color-outline-variant); }
.mtile:disabled .tn { background: var(--md-sys-color-surface-container); color: var(--md-sys-color-on-surface-variant); }
.picker { margin-top: 32px; padding: 24px; border-radius: 32px; background: var(--md-sys-color-surface-container); }
.picker .ph { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; }
.picker .ph h2 { flex: 1; font-size: 1.5rem; }
.picker .ph .soft { font-size: .9rem; }
.txtbtn { min-height: 40px; padding: 0 12px; border: 0; border-radius: 999px; background: none; color: var(--md-sys-color-primary); font-weight: 600; font-size: .9rem; cursor: pointer; }
.txtbtn:hover { background: color-mix(in srgb, var(--md-sys-color-primary) 8%, transparent); }
.ptabs { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 16px 0; }
.ptabs .txtbtn { margin-left: auto; }
.ptab { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; cursor: pointer; white-space: nowrap;
  background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface-variant); font-weight: 600; font-size: .9rem; }
.ptab:hover { color: var(--md-sys-color-on-surface); }
.ptab[aria-selected="true"] { background: var(--md-sys-color-inverse-surface); color: var(--md-sys-color-inverse-on-surface); }
.ptab .c { min-width: 22px; padding: 0 6px; border-radius: 999px; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); font-size: .75rem; text-align: center; }
.pchips { display: flex; flex-wrap: wrap; gap: 8px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rule-strong);
  background: var(--sheet); color: var(--ink); font: inherit; font-size: .88rem; cursor: pointer; transition: border-color .15s, background .15s; }
.pchip:hover { border-color: var(--accent); }
.pchip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.pchip .n { font-size: .75rem; color: var(--faint); font-weight: 400; }
.pchip .d { min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: .7rem; font-weight: 700; text-align: center; }
.picker .pchip { min-height: 48px; padding: 0 12px 0 18px; gap: 8px; border: 0; border-radius: 16px; background: var(--md-sys-color-surface-container-lowest);
  color: var(--md-sys-color-on-surface); font-size: .95rem; font-weight: 500; transition: border-radius .4s var(--spring), background .2s, color .2s; }
.picker .pchip:hover { background: color-mix(in srgb, var(--md-sys-color-on-surface) 8%, var(--md-sys-color-surface-container-lowest)); }
.picker .pchip .ck { display: none; width: 18px; height: 18px; margin-left: -6px; }
.picker .pchip .n { padding: 1px 8px; border-radius: 999px; background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface-variant); font-size: .75rem; font-weight: 600; }
.picker .pchip .d { background: var(--md-sys-color-secondary); color: var(--md-sys-color-on-secondary); font-size: .75rem; padding: 1px 6px; }
.picker .pchip[aria-pressed="true"] { border-radius: 999px; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); font-weight: 600; }
.picker .pchip[aria-pressed="true"] .ck { display: block; }
.picker .pchip[aria-pressed="true"] .n { background: var(--md-sys-color-on-primary); color: var(--md-sys-color-primary); }
@media (max-width: 839px) { .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); } .mtile.k-flash, .mtile.k-gram { grid-column: span 1; } .bento.nogram .mtile.k-flash { grid-column: span 2; } }
@media (max-width: 599px) {
  .bento { grid-auto-rows: minmax(120px, auto); gap: 10px; }
  .mtile { padding: 16px; border-radius: 28px; }
  .mtile b { font-size: 1.05rem; hyphens: auto; overflow-wrap: anywhere; }
  .mtile .td { font-size: .8rem; }
  .mtile.k-go { grid-row: span 1; padding: 20px; }
  .mtile.k-go b { font-size: 1.75rem; }
  .mtile.k-go .ti { width: 64px; height: 64px; border-radius: 32px; } .mtile.k-go .ti svg { width: 34px; height: 34px; }
  .picker { padding: 18px 14px; border-radius: 28px; }
  .picker .pchip { min-height: 44px; padding: 0 10px 0 14px; font-size: .9rem; }
}
@media (prefers-reduced-motion: reduce) { .mtile, .mtile .ti, .picker .pchip { transition: none; } }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.section { margin-top: 40px; }
.section > h2 { font-size: 1.35rem; margin-bottom: 14px; }
.soft { color: var(--soft); }
.small { font-size: .88rem; }
.lbl { display: block; font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); margin-bottom: 6px; }
footer.foot { padding-top: 40px; padding-bottom: 48px; color: var(--faint); font-size: .85rem; }

/* controls */
.btn {
  min-height: 44px; padding: 9px 18px; border-radius: 10px; border: 1px solid var(--rule-strong);
  background: var(--sheet); color: var(--ink); cursor: pointer; font-weight: 600; font-size: .95rem;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
.btn:hover { border-color: var(--ink); }
.btn.solid { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); border-radius: 999px; }
.btn.solid:hover { background: color-mix(in srgb, var(--accent) 88%, black); border-color: transparent; }
.btn.quiet { border-color: transparent; background: transparent; color: var(--soft); }
.linkbtn { border: 0; background: none; padding: 0; font: inherit; color: var(--accent-text); text-decoration: underline; cursor: pointer; }
.btn.quiet:hover { color: var(--ink); background: var(--sheet); border-color: var(--rule); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.solid:disabled:hover { background: var(--accent); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.badge { display: inline-flex; align-items: center; min-height: 22px; padding: 1px 9px; border-radius: 999px; font-size: .75rem; font-weight: 600; white-space: nowrap; }
.badge.t1 { background: var(--accent-soft); color: var(--accent-text); }
.badge.t2 { background: var(--blue-soft); color: var(--blue-text); }
.badge.t3 { background: var(--violet-soft); color: var(--violet-text); }
.tag { display: inline-flex; align-items: center; min-height: 22px; padding: 0 7px; border-radius: 6px; border: 1px solid var(--rule-strong);
  font-size: .72rem; font-weight: 600; color: var(--soft); letter-spacing: .02em; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); }
.bar { height: 8px; background: var(--rule); border-radius: 999px; overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; transition: width .25s; }
mark.hl { background: var(--hl); color: var(--hl-ink); padding: 0 3px; border-radius: 4px; font-style: normal; font-weight: 600; }
.err { background: var(--bad-bg); color: var(--bad); border-radius: 12px; padding: 14px 16px; }
code { background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 1px 6px; font-size: .88em; }

/* progress band (as on the overview page) */
.band { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border-radius: 32px; padding: 24px; }
.prog { display: grid; gap: 18px 28px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.prog .m .lbl { font-size: .82rem; font-weight: 600; opacity: .85; color: inherit; letter-spacing: 0; text-transform: none; margin: 0; }
.prog .m b { display: block; font-size: 1.9rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.prog .m .s { font-size: .85rem; opacity: .85; }
.prog .bar { margin-top: 8px; background: color-mix(in srgb, currentColor 25%, transparent); }
.prog .bar > span { background: currentColor; }

/* group map */
.tierlabel { display: flex; align-items: center; gap: 8px; margin: 22px 0 10px; font-size: .9rem; font-weight: 600; color: var(--soft); }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: .85rem; color: var(--soft); }
.legend i, .word i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.group { text-align: left; padding: 14px 16px; cursor: pointer; color: inherit; transition: box-shadow .15s, transform .15s, border-color .15s; }
.group:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.group.open { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }
.group .gn { font-weight: 600; }
.group .ge { font-size: .85rem; color: var(--soft); }
.group .due { font-size: .75rem; font-weight: 600; color: var(--accent-text); background: var(--accent-soft); border-radius: 999px; padding: 1px 8px; }
.group .bar { margin-top: 10px; background: var(--s-new); }
.detail { grid-column: 1 / -1; padding: 16px; }
.words { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px; }
.word { font-size: .9rem; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 3px 9px; }

/* session */
.counter { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 2px 12px; color: var(--soft); font-size: .9rem; margin: 22px 0 8px; }
.sessionbar { background: var(--rule); }
.sessionbar > span { background: var(--accent); border-radius: 999px; }
.q { padding: 22px 20px; margin-top: 14px; box-shadow: var(--shadow-lg); border-radius: 20px; }
.kind { font-size: .72rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); }
.prompt { margin: 6px 0 14px; color: var(--soft); }
.big { font-family: var(--head); font-size: clamp(2rem, 7vw, 2.6rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.meaning { font-size: 1.2rem; font-weight: 600; margin-top: 6px; }
.sentence { font-size: 1.15rem; font-weight: 500; line-height: 1.55; }
.gap { display: inline-block; min-width: 4.5em; border-bottom: 2.5px solid var(--accent); margin: 0 2px; }
.opts { display: grid; gap: 8px; margin-top: 16px; }
.opt { justify-content: flex-start; text-align: left; min-height: 62px; font-size: 1.05rem; font-weight: 500; border-radius: 14px; padding: 12px 16px; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt .k { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--paper); color: var(--soft); font-weight: 700; font-size: .85rem; flex: 0 0 auto; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { background: var(--ok-bg); border-color: var(--ok); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt:disabled { cursor: default; opacity: 1; }
input.answer { width: 100%; min-height: 52px; font-size: 1.15rem; padding: 10px 14px; border: 1px solid var(--rule-strong); border-radius: 12px; background: var(--sheet); margin-top: 14px; }
input.answer:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none; }
.letters { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.letters button { min-width: 40px; min-height: 36px; border-radius: 9px; border: 1px solid var(--rule-strong); background: var(--sheet); cursor: pointer; font-size: 1rem; }
.letters button:hover { border-color: var(--ink); }
.tiles, .built { display: flex; flex-wrap: wrap; gap: 8px; }
.built { min-height: 58px; border: 1.5px dashed var(--rule-strong); border-radius: 14px; padding: 10px; margin: 14px 0 12px; align-content: flex-start; background: var(--paper); }
.tile { border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 10px; padding: 7px 13px; font-size: 1.05rem; font-weight: 500; cursor: pointer; }
.tile:hover:not(:disabled) { border-color: var(--accent); }
.tile.fixed { background: var(--accent-soft); border-color: transparent; color: var(--accent-text); cursor: default; font-weight: 600; }
.tile.used { visibility: hidden; }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.feedback { margin-top: 14px; padding: 12px 14px; border-radius: 12px; }
.feedback.ok { background: var(--ok-bg); } .feedback.bad { background: var(--bad-bg); }
.feedback h3 { font-size: 1rem; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.feedback .why { margin-top: 4px; }
.sev { font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.sev.critical { background: var(--bad); color: var(--sheet); }
.sev.moderate { background: var(--warn-bg); color: var(--warn); }
.sev.minor { background: var(--sheet); color: var(--ok); }
.next { margin-top: 16px; }

/* teach card */
.head { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; }
.block { margin-top: 18px; }
.eg { padding: 12px 14px; border-radius: 12px; background: var(--paper); border-left: 3px solid var(--accent); }
.eg .sentence { font-style: italic; font-size: 1.05rem; }
.note { padding: 12px 14px; background: var(--blue-soft); border-radius: 12px; font-size: .94rem; display: grid; gap: 4px; margin-top: 8px; }
.note b.t { color: var(--blue-text); }
.note .demo { font-style: italic; }
.ex { margin: 8px 0; font-size: 1rem; }
.ex .tag { margin-right: 8px; }
.ddo { padding: 14px 16px; border: 1px solid var(--rule-strong); border-radius: 12px; }
.ddo blockquote { margin: 6px 0 0; padding-left: 10px; border-left: 2px solid var(--rule-strong); color: var(--soft); font-style: italic; font-size: .92rem; }
.ddo .cite { margin-top: 8px; font-size: .8rem; color: var(--faint); }
.en-def { font-size: .8rem; line-height: 1.4; color: var(--soft); margin: 1px 0 6px; }
.sense { margin-top: 14px; }
.sense:first-of-type { margin-top: 8px; }
.sense .sh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin-bottom: 6px; }
.sense .sh .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-weight: 700; font-size: .78rem; align-self: center; }
.sense .sh b { font-size: 1.02rem; }
.sense .eg { margin-bottom: 6px; }
.sense .none { font-size: .85rem; color: var(--faint); font-style: italic; }
.sensenote { margin-top: 12px; padding: 10px 14px; background: var(--blue-soft); border-radius: 12px; font-size: .9rem; }
.prepline { display: inline-block; margin: 6px 0 2px; padding: 3px 10px; border-radius: 8px; background: var(--blue-soft); color: var(--blue-text); font-size: .9rem; }
.prepline b { color: var(--ink); font-weight: 600; }
/* Grammatik */
.gsec { margin-top: 26px; }
.opts.short { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.gsec > h2 { font-size: 1.05rem; margin-bottom: 2px; }
.ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 10px; }
.gtile { padding: 16px 18px; display: grid; gap: 6px; align-content: start; text-align: left; cursor: pointer; border: 1px solid var(--rule); }
.gtile:hover { border-color: var(--accent); }
.gtile h3 { font-size: 1.05rem; }
.gtile .rule { font-size: .92rem; color: var(--soft); }
.gtile .demo { font-size: .92rem; font-style: italic; }
.gtile .meta { display: flex; gap: 8px; align-items: center; font-size: .8rem; color: var(--faint); }
.gtile .bar { height: 5px; flex: 1; }
.gsent { font-size: 1.15rem; font-weight: 500; line-height: 1.9; }
.gsent .gap { min-width: 3.5em; }
.gsent mark.hl { font-weight: 700; }
input.vgap { width: 5.6em; font: inherit; font-size: 1.05rem; padding: 2px 8px; margin: 0 2px; border: 0; border-bottom: 2.5px solid var(--accent); border-radius: 6px 6px 0 0; background: var(--accent-soft); color: var(--ink); }
input.vgap:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
input.vgap.right { border-color: var(--ok); background: var(--ok-bg); } input.vgap.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); text-decoration: line-through; }
.vinf { color: var(--soft); font-size: .9rem; font-weight: 400; }
.vfix { color: var(--ok); font-weight: 700; margin-left: 4px; }
.built { display: inline-flex; flex-wrap: wrap; gap: 6px; vertical-align: middle; min-height: 40px; min-width: 6em; padding: 3px 6px; border-bottom: 2.5px solid var(--accent); border-radius: 8px 8px 0 0; background: var(--accent-soft); }
.built .tile { padding: 4px 11px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; min-height: 44px; }
.built.right { background: var(--ok-bg); border-color: var(--ok); } .built.wrong { background: var(--bad-bg); border-color: var(--bad); }
.ewords { font-size: 1.15rem; line-height: 2; }
.ew { font: inherit; background: none; border: 0; border-bottom: 1px dashed var(--rule-strong); padding: 0 1px; margin: 0; color: var(--ink); cursor: pointer; }
.ew:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-text); }
.ew:disabled { cursor: default; border-color: transparent; }
.ew.bad { background: var(--bad-bg); color: var(--bad); border-radius: 4px; text-decoration: line-through; }
.ew.miss { background: var(--accent-soft); border-radius: 4px; }
.gdiff { margin-top: 6px; line-height: 1.6; }
.gdiff del { background: var(--bad-bg); color: var(--bad); text-decoration: line-through; padding: 0 2px; border-radius: 4px; }
.gwhy { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rule); }
.gwhy ul { margin: 6px 0 0; padding-left: 18px; }
.gwhy li { margin: 3px 0; }
.scheme { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.scheme span { display: inline-flex; flex-direction: column; align-items: center; padding: 3px 9px 4px; border-radius: 8px; background: var(--sheet); border: 1px solid var(--rule); }
.scheme b { font-weight: 600; }
.scheme i { font-style: normal; font-size: .62rem; font-weight: 700; letter-spacing: .06em; color: var(--faint); text-transform: uppercase; }
.scheme .v { border-color: var(--accent); } .scheme .a { border-color: var(--blue); }
/* tag on text written by AI for this tool (not from DDO or the exams) */
.ai { display: inline-block; margin-left: 6px; padding: 0 5px; border: 1px dashed var(--faint); border-radius: 5px; vertical-align: .12em;

.lbl .src { text-transform: none; letter-spacing: 0; font-weight: 600; }
.feedback .prepline { margin-top: 8px; }

.whybox > b:first-child { color: var(--accent-text); }
.whybox .test { margin-top: 6px; }
.facts { padding: 12px 14px; border-radius: 12px; background: var(--paper); display: grid; gap: 8px; }
.facts .lbl { margin-bottom: 0; }
.frow { display: grid; grid-template-columns: 7.5em 1fr; gap: 2px 10px; align-items: baseline; font-size: .95rem; }
.frow .fl { color: var(--soft); font-size: .85rem; font-weight: 600; }
@media (max-width: 480px) { .frow { grid-template-columns: 1fr; } }
.facts .forms { display: inline-flex; flex-wrap: wrap; gap: 5px; }
.facts .form { padding: 1px 8px; border-radius: 7px; background: var(--sheet); border: 1px solid var(--rule); font-weight: 600; font-size: .9rem; }
.facts .fsep { color: var(--faint); }
.facts ul.cons { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.facts ul.cons li { padding-left: 13px; position: relative; }
.facts ul.cons li::before { content: "›"; position: absolute; left: 1px; color: var(--accent); font-weight: 700; }
.facts .cap { font-variant: small-caps; font-weight: 700; letter-spacing: .03em; color: var(--soft); }
.tipbox { padding: 12px 14px; border-radius: 12px; background: var(--blue-soft); font-size: .94rem; }
.tipbox b { color: var(--blue-text); }
.tipbox ul { margin: 6px 0 0; padding-left: 18px; }
.tipbox li { margin: 4px 0; }
.tipbox .tl { font-weight: 600; }
.warnbox { padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); font-size: .94rem; }
.warnbox b { color: var(--accent-text); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.pair > div { background: var(--sheet); border-radius: 10px; padding: 10px 12px; }

/* flashcards: a card that flips in 3D; practice only */
.fctop { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 24px; }
.seg { display: inline-flex; padding: 3px; border-radius: 11px; background: var(--paper); border: 1px solid var(--rule); }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: .85rem; font-weight: 600; color: var(--soft); }
.seg button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: var(--shadow); }
.fcprog { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
.fcprog .bar { flex: 1; }
.fcard { display: block; width: 100%; margin-top: 14px; perspective: 1400px; cursor: pointer; border: 0; padding: 0; background: none; text-align: left; color: inherit;
  animation: fcIn .32s cubic-bezier(.2, .8, .2, 1); }
.fcard:focus-visible { outline: none; }
.fcard:focus-visible .face { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-lg); border-color: var(--accent); }
@keyframes fcIn { from { opacity: 0; transform: translateY(14px) scale(.98); } }
.fcin { display: grid; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3, .9, .3, 1); }
.fcin.flipped { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; min-height: 340px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column;
  padding: 26px 24px 20px; border-radius: 22px; background: var(--sheet); border: 1px solid var(--rule); box-shadow: var(--shadow-lg); }
.face.back { transform: rotateY(180deg); }
.face.front { align-items: center; justify-content: center; text-align: center; }
.face.front .big { font-size: clamp(2.2rem, 9vw, 3.2rem); }
.face.front .fcq { font-size: clamp(1.5rem, 6vw, 2rem); font-weight: 700; font-family: var(--head); letter-spacing: -.02em; }
.face .fchint { margin-top: auto; padding-top: 22px; font-size: .82rem; color: var(--faint); }
.face.back .meaning { font-size: 1.45rem; margin-top: 4px; }
.face .prepline { align-self: flex-start; }
.face.front .prepline { align-self: center; }
.fcw { font-family: var(--head); font-size: 1.6rem; font-weight: 700; letter-spacing: -.02em; }
.face.back .block { margin-top: 14px; }
.face.back .en { color: var(--soft); font-size: .9rem; }
.fcbtns { margin-top: 16px; justify-content: center; }
.fcbtns .btn { min-width: 150px; }
.fcno { color: var(--bad); }
.fcno:hover { border-color: var(--bad); }
/* summary */
.score { font-family: var(--head); font-size: 3.4rem; font-weight: 700; letter-spacing: -.03em; line-height: 1; color: var(--accent); }
.list { margin: 0; padding: 0; list-style: none; }
.list li { padding: 10px 0; border-bottom: 1px solid var(--rule); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.list li:last-child { border-bottom: 0; }

@media (max-width: 600px) { .pair { grid-template-columns: 1fr; } .q { padding: 18px 16px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

function setPicked(gs) { picked = GROUP_ORDER.filter(g => gs.includes(g)); try { localStorage.setItem(PICK_KEY, JSON.stringify(picked)); } catch (e) { /* ignore */ } }

const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const norm = s => String(s).normalize("NFC").toLowerCase().replace(/[.,!?;:"«»()…]/g, " ").replace(/\s+/g, " ").trim();
const cards = () => Object.values(DB.cards);

// The deck is embedded in the built page (no server needed); review progress lives in this
// browser's localStorage, so it survives closing the page. Cards never reviewed here keep the deck's own schedule.
const STORE = "pd3-assisted-learning:progress:v1";
const SRS_FIELDS = ["ef", "interval", "reps", "due", "lapses", "history", "introduced"];
let storageOK = true;

function readProgress() {
  try { return JSON.parse(localStorage.getItem(STORE) || "{}").cards || {}; }
  catch (e) { storageOK = false; return {}; }
}
function writeProgress(id) {
  try {
    const all = readProgress();
    all[id] = Object.fromEntries(SRS_FIELDS.filter(f => DB.cards[id][f] !== undefined).map(f => [f, DB.cards[id][f]]));
    localStorage.setItem(STORE, JSON.stringify({ cards: all, saved: new Date().toISOString() }));
    storageOK = true;
  } catch (e) { storageOK = false; }
}
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

// ---------- switching language in place ----------
// The language button swaps every interface text on screen instead of reloading, so a session, a flashcard,
// a search or an open dialog stays exactly where it is. Texts are found by their wording in the other language;
// Danish or English content (lang="da" / lang="en", the words and sentences) is left alone.
function langPairs() {
  const pairs = Object.values(I18N).map(v => [v[0], v[1]]);           // [da, en]
  for (const [en, da] of Object.values(GROUPS)) pairs.push([da, en], [`${da} · ${en}`, `${en} · ${da}`]);
  for (const r of Object.values(RULES)) pairs.push([r[2], r[1]]);
  for (const p of CONFUSABLES) pairs.push([p[3], p[2]]);
  return pairs;
}
function flipLang() {
  const to = LANG === "en" ? "da" : "en", [fi, ti] = to === "en" ? [0, 1] : [1, 0];
  const exact = new Map(), pats = [];
  for (const p of langPairs()) {
    const a = p[fi], b = p[ti];
    if (!a || !b || a === b || /<[a-z]/i.test(a)) continue;
    if (/\{\d\}/.test(a)) {
      const idx = [], re = a.replace(/[.*+?^$()|[\]\\]/g, "\\$&").replace(/\{(\d)\}/g, (_, i) => { idx.push(i); return "(.+?)"; });
      pats.push([new RegExp("^" + re + "$"), b, idx]);
    } else {
      exact.set(a.trim(), b.trim());
      exact.set(a.trim().replace(/:$/, ""), b.trim().replace(/:$/, ""));   // labels used without their colon
    }
  }
  const one = k => {
    if (exact.has(k)) return exact.get(k);
    for (const [re, b, idx] of pats) {
      const m = re.exec(k), v = {};
      if (m) { idx.forEach((i, j) => { v[i] = m[j + 1]; }); return b.replace(/\{(\d)\}/g, (_, i) => v[i] ?? ""); }
    }
    return null;
  };
  // whole text first; then without a leading symbol or trailing arrow/colon ("✕ Afslut", "Ordstilling:");
  // then compounds part by part ("Start session · Årsag", "Forveksl ikke: a / b — begge = …")
  const bare = k => {
    const r = one(k);
    if (r != null) return r;
    const m = /^([^\p{L}\p{N}“"(]*)(.*?)([\s:→←›…]*)$/u.exec(k);
    if (m && (m[1] || m[3]) && m[2]) { const x = one(m[2]); if (x != null) return m[1] + x + m[3]; }
    return null;
  };
  const tr = s => {
    const k = s.trim();
    if (!k) return null;
    let out = bare(k);
    for (const sep of [" · ", " — "]) {
      if (out != null || !k.includes(sep)) continue;
      const parts = k.split(sep), got = parts.map(x => bare(x.trim()) ?? x);
      if (got.some((x, i) => x !== parts[i])) out = got.join(sep);
    }
    return out == null ? null : s.replace(k, out);
  };
  const content = n => { const l = n.closest && n.closest("[lang]"); return l && l !== document.documentElement; };
  const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for (let n; (n = walk.nextNode());) {
    const el = n.parentElement;
    if (!el || el.closest("script, style") || content(el)) continue;
    const r = tr(n.nodeValue); if (r != null) n.nodeValue = r;
  }
  document.body.querySelectorAll("[title], [aria-label], [placeholder]").forEach(el => {
    if (content(el)) return;
    for (const a of ["title", "aria-label", "placeholder"]) { const v = el.getAttribute(a); const r = v && tr(v); if (r != null) el.setAttribute(a, r); }
  });
  LANG = to;
  try { localStorage.setItem("pd3.lang", to); } catch (e) { /* ignore */ }
  document.documentElement.lang = to;
  document.title = `${t("nav.assisted")} · ${t("brand")}`;
  const lb = $(".langbtn"); lb.lang = to === "en" ? "da" : "en"; lb.textContent = t("lang.button"); lb.title = t("lang.title"); themeButton();
  // screens that redraw without losing anything are drawn again, so nothing is left in the old language
  if ($("#go")) { const y = window.scrollY; home(); window.scrollTo(0, y); }
  else if (FC && $("#fcard")) flashCard();
  if ($("#findbar").classList.contains("open")) findDraw();
}

function grade(id, q) {
  const c = DB.cards[id];
  c.introduced = c.introduced || DB.today;
  if (q >= 3) {
    c.interval = c.reps === 0 ? 1 : c.reps === 1 ? 6 : Math.round(c.interval * c.ef);
    c.reps += 1;
  } else {
    c.interval = 1; c.reps = 0; c.lapses += 1;
  }
  c.ef = Math.max(1.3, Math.round((c.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02))) * 100) / 100);
  const d = new Date(DB.today + "T12:00"); d.setDate(d.getDate() + c.interval);
  c.due = iso(d);
  c.history = [...c.history, [DB.today, q]].slice(-10);
  writeProgress(id);
  return c;
}

// ---------- card helpers ----------
function wtype(c) {
  const m = /^(SUB\/PRÆP|SUB\/ADV|SUB|ADV|KOO|PRÆP)\b/.exec(c.note || "");
  return m ? m[1] : null;
}
function stateOf(c) {
  if (!c.history || !c.history.length) return "new";
  return c.interval >= 21 ? "master" : c.interval >= 6 ? "known" : "learn";
}
function variants(word) {
  const base = norm(word.replace(/\(.*?\)/g, ""));
  const out = [norm(word), base, ...[...word.matchAll(/\((.*?)\)/g)].map(m => norm(m[1]))];
  base.split(/\s*\/\s*/).forEach(p => out.push(p.trim()));
  out.slice().forEach(v => { for (const a of ["at ", "en ", "et "]) if (v.startsWith(a)) out.push(v.slice(a.length)); });
  return [...new Set(out.filter(Boolean))];
}
function isAnswer(c, input) {
  const a = norm(input), set = variants(c.word);
  return set.includes(a) || set.includes(a.replace(/^(at|en|et) /, ""));
}
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function nearMiss(c, input) {
  const a = norm(input).replace(/^(at|en|et) /, "");
  return a.length > 2 && variants(c.word).some(v => lev(a, v) <= (v.length > 8 ? 2 : 1));
}
// Where the card word sits in a sentence (for highlighting and cloze gaps)
function findSpan(c, s) {
  const w = norm(c.word);
  const kind = w.startsWith("at ") ? "verb" : /^(en|et) /.test(w) ? "noun" : c.group === "adjektiv" ? "adj" : "fixed";
  const vs = variants(c.word).filter(v => !/^(at|en|et) /.test(v) && v.length > 1).sort((a, b) => b.length - a.length);
  for (const v of vs) {
    const toks = v.split(" ").map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    if (kind === "verb") toks[0] = toks[0].replace(/e$/, "") + "\\p{L}{0,4}";
    else if (kind !== "fixed") toks[0] += "\\p{L}{0,4}";
    const m = new RegExp("(?<![\\p{L}])" + toks.join("\\s+") + "(?![\\p{L}])", "iu").exec(s);
    if (m) return [m.index, m.index + m[0].length];
  }
  return null;
}
function hlSentence(c, s, span) {

// ---------- session building ----------
function startSession({ groups = null, reviews = REVIEW_LIMIT, fresh = BATCH }) {
  const k = counts();
  const inGroup = c => !groups || groups.includes(c.group);
  const rank = c => [c.priority || 3, -(c.lapses || 0), c.reps || 0];
  const cmp = (a, b) => { const x = rank(a), y = rank(b); return x[0] - y[0] || x[1] - y[1] || x[2] - y[2]; };
  const due = cards().filter(c => inGroup(c) && c.history.length && c.due <= DB.today).sort(cmp).slice(0, reviews);
  const n = Math.min(fresh, k.newLeft);
  let batch = [];
  if (n > 0) {
    // taught group by group: fill the batch from the first (selected) group that still has new words, then the next
    for (const g of GROUP_ORDER.filter(g => !groups || groups.includes(g))) {
      if (batch.length >= n) break;
      batch.push(...cards().filter(c => c.group === g && stateOf(c) === "new").slice(0, n - batch.length));
    }
  }
  let practice = [];
  if (groups && !due.length && !batch.length) // nothing to grade: practise the groups' learnt words without touching the schedule
    practice = shuffle(cards().filter(c => inGroup(c) && c.history.length)).slice(0, 8);
  const q = [];
  due.forEach(c => q.push({ kind: "ex", id: c.id }));
  if (batch.length) {
    q.push({ kind: "intro", ids: batch.map(c => c.id) });
    batch.forEach(c => q.push({ kind: "teach", id: c.id }));
    shuffle(batch).forEach(c => q.push({ kind: "ex", id: c.id, first: true }));
  }
  practice.forEach(c => q.push({ kind: "ex", id: c.id, practice: true }));
  if (!q.length) { alert(groups ? t("g.empty") : t("h.empty")); return; }
  const title = !groups ? t("s.session") : groups.length === 1 ? glabel(groups[0]) : groups.length <= 3 ? groups.map(gname).join(" · ") : t("s.groups", groups.length);
  S = { queue: q, i: 0, results: [], lastType: null, graded: new Set(), title };
  step();
}

// Earlier steps are shown again as their word's lesson card (read-only): answers already given keep their grade.
// S.back counts how many steps behind the current one (S.i) the screen is.

  if (S.pending && !S.back) { flushPending(); S.i++; }  // an answer on screen counts before leaving it
  const j = prevIndex();

  }
  if (S.i >= S.queue.length) return summary();
  const it = S.queue[S.i];
  if (it.kind === "intro") return renderIntro(it);
  if (it.kind === "teach") return renderTeach(DB.cards[it.id]);
  if (it.kind === "pair") { S.queue.splice(S.i, 1, ...pairItems(it.pair, 1)); return step(); }

// ---------- exercises ----------
// word-order tiles: the connector's clause from a real exam sentence (PD3 length), else the card's example
function clauseTokens(s) {
  if (/[…:;()”"–]|\.\s|\?\s/.test(s.slice(0, -1))) return null;
  const toks = s.replace(/[.!?]$/, "").split(/\s+/).map(x => x.replace(/,$/, "")).filter(Boolean);
  return toks.length >= 4 && toks.length <= 14 ? toks : null;
}
function orderSource(c) {
  if (!wtype(c)) return null;
  const cands = [];
  for (const e of examSentences(c)) {
    const [a] = e.m;
    let part = null;
    if (a === 0) part = e.s;                                   // "Derfor er det …" / "Da jeg var barn, …"
    else if (/,\s$/.test(e.s.slice(0, a))) part = e.s.slice(a).split(/,\s/)[0];   // "…, da de følger de … ruter"
    const toks = part && clauseTokens(part);
    if (toks && toks.length >= 6) cands.push({ toks, s: part.replace(/[,.]$/, "") + (/[.!?]$/.test(part) ? "" : "."), src: e.src });
  }
  if (cands.length) return pickEasy(cands);
  const toks = c.example && clauseTokens(c.example);
  return toks ? { toks, s: c.example, src: null } : null;
}
function orderTokens(c) { return orderSource(c)?.toks || null; }
const defOf = x => x.dict && x.dict.senses && x.dict.senses[0];
// writing clue: the first two DDO meanings, since an exam sentence may use the second one (begrænset af = bounded by)
const defClue = c => { const ss = c.dict.senses.slice(0, 2); return ss.length > 1 ? ss.map((d, i) => `<div><b>${i + 1}.</b> ${esc(d)}</div>`).join("") : esc(ss[0]); };
const posKey = x => ((x.dict && x.dict.pos) || "").split(/[ ,]/)[0];
// PD3 level with readable context: prefer a word's shortest exam sentences (≤ 110 characters when there is one)
function pickEasy(list) {
  if (!list.length) return null;
  const byLen = list.slice().sort((a, b) => a.s.length - b.s.length);
  const short = byLen.filter(x => x.s.length <= 110);
  return pick((short.length ? short : byLen).slice(0, 3));
}
const ctxSentence = c => pickEasy(examSentences(c).filter(e => !e.sense || !DB.senses[c.id]));
function clozeSource(c) {
  if (c.word.includes("…")) return null;
  const sp = c.example && findSpan(c, c.example);
  // a lone exam sentence lacks the context that decides between connectors (derfor vs ligeledes both fit
  // "… findes ___ også …"), so connectors use their example, written with that context; content words use the exam
  if (c.priority === 1 && sp) return { s: c.example, span: sp, src: "example" };
  const srcs = examSentences(c).map(e => ({ s: e.s, span: e.m, src: e.src }));
  if (sp) srcs.push({ s: c.example, span: sp, src: "example" });
  return pickEasy(srcs);
}
function eligibleTypes(c, first) {
  // B2: once a word has been met, production (writing, word order, meaning in context) dominates
  const ts = [["meaning", 2], ["produce", 2]];
  if (clozeSource(c)) ts.push(["cloze", 2]);
  // multi-meaning words (da, mens, så, siden): read the meaning off a real exam sentence
  if (DB.senses[c.id] && DB.senses[c.id].senses.length > 1 && examSentences(c).some(e => e.sense)) ts.push(["sense", 3]);
  if (c.priority === 1) {
    ts.push(["relation", 1]);
    if (cards().filter(x => x.group === c.group).length > 1) ts.push(["odd", 1]);
    if (wtype(c) && orderTokens(c)) ts.push(["order", 3]);
  }
  // a brand-new word is tested with recognition first
  return first ? ts.filter(([k]) => ["meaning", "cloze", "relation", "sense"].includes(k)) : ts;
}
function chooseType(c, first) {
  let ts = eligibleTypes(c, first).filter(([k]) => k !== S.lastType);
  if (!ts.length) ts = eligibleTypes(c, first);
  let r = Math.random() * ts.reduce((a, [, w]) => a + w, 0);
  for (const [k, w] of ts) if ((r -= w) < 0) return k;

function distractors(c, n, filter) {
  const pool = shuffle(cards().filter(x => x.id !== c.id && x.group !== c.group && filter(x)));
  const out = [], seen = new Set([norm(c.meaning), norm(c.word)]);
  for (const x of pool) {
    if (seen.has(norm(x.meaning)) || seen.has(norm(x.word))) continue;
    seen.add(norm(x.meaning)); seen.add(norm(x.word)); out.push(x);

function renderExercise(it) {

function mc(label, head, options, correctIdx, onDone) {
  frame(label, `${head}<div class="opts">${options.map((o, i) => `<button class="btn opt" data-i="${i}"><span class="k">${i + 1}</span><span>${o}</span></button>`).join("")}</div><div id="fb"></div>`);
  const btns = [...document.querySelectorAll(".opt")];
  const choose = i => {
    if (btns[0].disabled) return;
    btns.forEach(b => b.disabled = true);
    btns[correctIdx].classList.add("right");
    if (i !== correctIdx) btns[i].classList.add("wrong");
    onDone(i === correctIdx, i);
  };
  btns.forEach(b => b.onclick = () => choose(+b.dataset.i));
  S.keys = e => { const n = +e.key; if (n >= 1 && n <= options.length) choose(n - 1); };
}
// real exam sentences take longer to read than a single word
const quick = (ms = 6000) => performance.now() - S.t0 < ms;

function exMeaning(c, label, it) {

  if (defOf(c)) {
    const fits = x => defOf(x) && norm(defOf(x)) !== norm(defOf(c)) && (posKey(c) ? posKey(x) === posKey(c) : sameKind(c)(x));

    const overlap = x => { const a = words(c), b = words(x); return [...b].filter(w => a.has(w)).length / Math.max(1, Math.min(a.size, b.size)); };
    const glossSet = x => new Set(x.meaning.toLowerCase().split(/[,/;()]+/).map(g => g.trim()).filter(Boolean));
    const near = shuffle(cards().filter(x => x.id !== c.id && x.group === c.group && fits(x) && overlap(x) < 0.5 && ![...glossSet(x)].some(g => glossSet(c).has(g))))[0];
    const others = distractors(c, 3, fits);

      const opts = shuffle([c, ...others]), ctx = ctxSentence(c);
      S.sent = ctx && ctx.s;
      const clip = x => { const d = defOf(x); return d.length > 150 ? d.slice(0, 147) + "…" : d; };
      return mc(label.replace(t("x.meaning"), t("x.def")), `<p class="prompt">${t("q.def")}</p><div class="big" lang="da">${esc(c.word)}</div>
        ${ctx ? `<div class="ex" lang="da" style="margin-top:8px"><span class="tag">${esc(ctx.src)}</span>${hlSentence(c, ctx.s, ctx.m)}</div>` : ""}`,
        opts.map(o => `<span lang="da">${esc(clip(o))}</span>`), opts.indexOf(c),
        (ok, i) => feedback(c, it, ok ? (quick(12000) ? 5 : 4) : 2, ok,
          `<b lang="da">${esc(c.word)}</b> = ${esc(c.meaning)}<div class="small" lang="da">${esc(defOf(c))}</div>${c.dict.senses_en?.[0] ? `<div class="en-def">${esc(c.dict.senses_en[0])}</div>` : ""}` +
          (ok ? "" : whyBox(`${t("why.def", wordLine(opts[i]))}${opts[i].dict.senses_en?.[0] ? `<div class="en-def">${esc(opts[i].dict.senses_en[0])}</div>` : ""}`)), ok ? null : "moderate"));

function exRelation(c, label, it) {

function exCloze(c, label, it) {

  S.sent = src && src.s;
  // same word class (and same word-order type for connectors), so the choice is about meaning, not grammar
  // a confusable partner (da/når, for/fordi) is the hardest distractor, so it goes in first when it fits the gap
  const partner = partnerPairs(c.id).map(p => DB.cards[p[0] === c.id ? p[1] : p[0]]).find(x => sameKind(c)(x) && (!wtype(c) || wtype(x) === wtype(c)));

  const inflected = norm(src.s.slice(a, b)) !== norm(c.word.replace(/^(at|en|et) /, ""));
  mc(label, `<p class="prompt">${t("q.cloze")}${inflected ? t("q.base") : ""} ${src.src !== "example" ? `<span class="tag">${esc(src.src)}</span>` : ""}</p><div class="sentence" lang="da">${gapped}</div>`,
    opts.map(o => `<span lang="da">${esc(o.word)}</span>`), opts.indexOf(c),
    (ok, i) => {

        `<div>${t("why.chose", wordLine(x))}</div>` +
        (pr ? `<div class="test"><b>${t("f.rule")}</b> <span lang="da">${esc(tip(pr))}</span></div>` :
          wtype(c) && x.group !== c.group ? `<div class="test">${t("why.needs2")} ${relWhy(c.group)}</div><div class="test">${esc(x.word)}: ${relWhy(x.group)}</div>` :
          defOf(c) ? `<div class="test">${t("why.clue", `<b lang="da">${esc(c.word)}</b>`)} <span lang="da">${esc(defOf(c))}</span></div>` : "") +
        (inflected || /^(at|en|et) /.test(c.word) ? "" : `<div class="test sentence small" lang="da">${swapIn(src.s, src.span, x.word.replace(/^(at|en|et) /, ""))} ❌</div>`));

function exOdd(c, label, it) {
  const mate = pick(cards().filter(x => x.group === c.group && x.id !== c.id));
  const others = [];
  shuffle(cards().filter(x => x.priority === 1 && x.group !== c.group)).forEach(x => { if (others.length < 2 && !others.some(o => o.group === x.group)) others.push(x); });
  const opts = shuffle([c, mate, ...others]);
  frame(label, `<p class="prompt">${t("q.odd")}</p>
    <div class="opts">${opts.map((o, i) => `<button class="btn opt" data-i="${i}"><span class="k">${i + 1}</span><span lang="da">${esc(o.word)}</span></button>`).join("")}</div><div id="fb"></div>`);
  const btns = [...document.querySelectorAll(".opt")], sel = new Set();
  const toggle = i => {
    if (btns[0].disabled) return;

    btns[i].classList.toggle("sel");
    if (sel.size < 2) return;
    btns.forEach(b => b.disabled = true);
    const ok = [...sel].every(j => opts[j].group === c.group);
    opts.forEach((o, j) => { btns[j].classList.remove("sel"); if (o.group === c.group) btns[j].classList.add("right"); else if (sel.has(j)) btns[j].classList.add("wrong"); });

      opts.filter(o => o.group !== c.group).map(o => `<span lang="da">${esc(o.word)}</span> = ${esc(gname(o.group))}`).join(" · ") +
      (ok ? "" : whyBox(opts.map(o => `<div class="test"><span lang="da">${esc(o.word)}</span>: ${relWhy(o.group)}</div>`).join(""))), ok ? null : "moderate");
  };
  btns.forEach(b => b.onclick = () => toggle(+b.dataset.i));

    const answer = `<b lang="da">${esc(c.word)}</b>${gapForm && norm(gapForm) !== norm(c.word.replace(/^(at|en|et) /, "")) ? ` (<span lang="da">${esc(gapForm)}</span>)` : ""} = ${esc(c.meaning)}<div class="small" lang="da">${ctx ? hlSentence(c, ctx.s, ctx.m) : hlSentence(c, c.example)}</div>`;
    // B2: the gap needs the form the sentence asks for (skyldtes, not skyldes); the base form is the right word, wrong form
    const exact = !gapForm || norm(v) === norm(gapForm) || norm(gapForm) === norm(c.word.replace(/^(at|en|et) /, ""));
    if (!give && isRight(v) && !exact) return feedback(c, it, hinted ? 3 : 4, true, t("f.formok", `<b lang="da">${esc(gapForm)}</b>`) + `<div style="margin-top:6px">${answer}</div>`);
    if (!give && isRight(v)) return feedback(c, it, hinted ? 3 : quick(ctx ? 15000 : 9000) ? 5 : 4, true, answer + (hinted ? `<div class="soft small">${t("f.hinted")}</div>` : ""));
    if (!give && nearMiss(c, v)) return feedback(c, it, 3, true, t("f.spelling", `<b lang="da">${esc(c.word)}</b>`, esc(v)), "minor", t("f.almost"));
    const other = v && cards().find(x => x.id !== c.id && isAnswer(x, v));
    const why = give ? "" : whyBox((other ? `<div>${t("why.typed", `<b lang="da">${esc(v)}</b>`, esc(other.meaning))}</div>` : "") +
      (defOf(c) ? `<div class="test">${t("why.clue", `<b lang="da">${esc(c.word)}</b>`)} <span lang="da">${esc(defOf(c))}</span></div>` : `<div class="test">${wordLine(c)}</div>`) +
      (other && wtype(other) && wtype(c) && other.group !== c.group ? `<div class="test">${relWhy(c.group)}</div>` : ""));
    feedback(c, it, give ? 0 : 1, false, (v ? t("f.wrote", esc(v)) : "") + answer + why, give ? null : "moderate", null, !give);
  };
  $("#chk").onclick = () => check(false);
  $("#idk").onclick = () => check(true);
  S.keys = e => { if (e.key === "Enter" && document.activeElement === input) { e.preventDefault(); check(false); } };
}

function exOrder(c, label, it) {
  const os = it.os || (it.os = orderSource(c));
  if (!os) { it.type = "cloze"; return clozeSource(c) ? exCloze(c, label, it) : exMeaning(c, label, it); }
  const toks = os.toks;
  S.sent = os.s;
  const rest = toks.slice(1);
  let tiles = shuffle(rest.map((x, i) => ({ t: x, i })));
  for (let n = 0; n < 5 && tiles.map(x => x.t).join(" ") === rest.join(" "); n++) tiles = shuffle(tiles);
  const placed = [];
  let tries = 0;
  frame(label, `<p class="prompt">${t("q.order", `<b lang="da">${esc(c.word)}</b> <span class="tag">${esc(wtype(c))}</span>`)}</p>
    <div class="built" id="built" lang="da"></div><div class="tiles" id="tiles" lang="da"></div>
    <div class="row next"><button class="btn solid" id="chk" disabled>${t("b.check")}</button><button class="btn quiet" id="clr">${t("b.clear")}</button><button class="btn quiet" id="idk">${t("b.show")}</button></div><div id="fb"></div>`);
  const draw = () => {
    $("#built").innerHTML = `<span class="tile fixed">${esc(toks[0])}</span>` + placed.map((x, k) => `<button class="tile" data-k="${k}">${esc(x.t)}</button>`).join("");
    $("#tiles").innerHTML = tiles.map((x, k) => `<button class="tile${placed.includes(x) ? " used" : ""}" data-t="${k}">${esc(x.t)}</button>`).join("");
    document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { if (!placed.includes(tiles[+b.dataset.t])) { placed.push(tiles[+b.dataset.t]); draw(); } });
    document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { placed.splice(+b.dataset.k, 1); draw(); });
    $("#chk").disabled = placed.length !== rest.length;
  };
  draw();
  const right = `<div class="sentence" lang="da">${hlSentence(c, os.s)}</div>${os.src ? `<span class="tag">${esc(os.src)}</span>` : ""}`;
  const finish = (q, ok, sev) => {
    ["#chk", "#clr", "#idk"].forEach(s => $(s)?.remove());
    document.querySelectorAll(".tile").forEach(b => b.disabled = true);
    const built = [toks[0], ...placed.map(x => x.t)].join(" ");
    feedback(c, it, q, ok, right + (ok ? `<div class="why">${rule(wtype(c).split("/")[0]) || ""}</div>` :
      whyBox(`${placed.length ? `<div>${t("why.built")} <span lang="da" style="text-decoration:line-through">${esc(built)}</span></div>` : ""}<div class="test">${rule(wtype(c).split("/")[0]) || ""}</div>`)), sev, null, false, ok ? null : os.s);
  };
  $("#chk").onclick = () => {
    const ok = placed.map(x => x.t.toLowerCase()).join(" ") === rest.join(" ").toLowerCase();
    tries++;
    if (ok) return finish(tries === 1 ? 5 : 3, true);
    if (tries === 1) {
      $("#built").classList.remove("shake"); void $("#built").offsetWidth; $("#built").classList.add("shake");
      $("#fb").innerHTML = `<div class="feedback bad"><h3>${t("f.retry")}</h3><div class="why">${t("f.retry.p", `<b lang="da">${esc(c.word)}</b>`)}</div></div>`;
      return;
    }
    finish(1, false, "critical");
  };
  $("#clr").onclick = () => { placed.length = 0; draw(); };
  $("#idk").onclick = () => finish(1, false, "critical");
  S.keys = e => { if (e.key === "Enter" && !$("#chk")?.disabled) $("#chk")?.click(); };
}

// ---------- feedback + grading ----------
// q follows vocab.md: 5 instant · 4 after hesitation · 3 small slip · 2 recognised when shown · 1 vaguely · 0 blank
function feedback(c, it, q, ok, body, severity, headText, canOverride, retype) {

  if (S.sent) body += `<div class="trrow">${trLink(S.sent).replace(t("m.tr"), t("tr.sent"))}</div>`;
  S.pending = { id: c.id, q, ok, practice: it.practice || S.graded.has(c.id) };

      <div class="why">${body}</div>${why}${prepLine(c)}
      ${retype ? `<div style="margin-top:12px"><div class="small"><b>${t("f.retype")}</b> ${t("f.retype.s")}</div><input class="answer" id="rt" lang="da" autocomplete="off" spellcheck="false" style="margin-top:6px">${letters()}</div>` : ""}
    </div>

      ${retype ? `<button class="btn quiet" id="skip">${t("b.skip")}</button>` : ""}
      <button class="btn quiet" id="more">${t("b.more")}</button>
      <span class="spacer"></span><span class="soft small">${S.pending.practice ? t("f.practice") : t("f.grade", q)}</span></div>`;
  $("#more").onclick = () => explain(c);

    const r = $("#rt"); r.focus(); bindLetters(r);
    r.oninput = () => { $("#nx").disabled = norm(r.value) !== norm(retype); if (!$("#nx").disabled) $("#nx").focus(); };
    $("#skip").onclick = () => { $("#nx").disabled = false; $("#nx").focus(); };
  }
  if (canOverride) $("#ov").onclick = () => { S.pending.q = 4; S.pending.ok = true; $(".feedback").className = "feedback ok"; $(".feedback h3").textContent = t("f.counted"); $("#ov").remove(); };
  bindTr($("#fb"));
  bindNext(commit);
}
function commit() {
  $("#nx") && ($("#nx").disabled = true);

}
function flushPending() {
  const p = S.pending;
  if (!p) return;
  S.pending = null;
  if (p.practice && S.exercise) S.practiceResults.push({ id: p.id, q: p.q });
  if (!p.practice) {
    grade(p.id, p.q);
    S.graded.add(p.id);
    S.results.push({ id: p.id, q: p.q });
    if (p.q < 3 && !S.drill) {
      // relearn later in this session with another exercise type, and drill its confusable partner
      S.queue.splice(Math.min(S.i + 4, S.queue.length), 0, { kind: "ex", id: p.id, practice: true });
      const pr = partnerPairs(p.id)[0];
      if (pr && !S.queue.some(x => x.kind === "pair" && x.pair === pr)) S.queue.splice(Math.min(S.i + 2, S.queue.length), 0, { kind: "pair", pair: pr });
    }
  }
}

// ---------- confusables drill ----------
// pairs that mean the same thing can't be tested with a gap (either word fits): they get an L3-style check instead
const SAME_MEANING = new Set(["derfor|således", "næppe|næsten_ikke", "imidlertid|dog", "at_medføre|at_forårsage", "at_forhindre|at_forebygge", "at_begrænse|at_reducere", "undtagen|bortset_fra", "hvis|såfremt", "skønt|selvom", "ikke_desto_mindre|alligevel", "desuden|derudover", "endvidere|ydermere", "især|navnlig", "for_eksempel_fx|eksempelvis", "i_stedet_for|frem_for", "derefter|herefter", "alt_i_alt|samlet_set", "dermed|derved", "følgelig|derfor", "at_sikre|at_garantere"]);
// per pair: which of a word's labelled senses to use, and senses where the partner also fits (counted right, with a note)
const PAIR_SENSES = { "mens|hvorimod": { mens: { both: ["contrast"] }, hvorimod: { skip: true } } };
const RELATED = { "konsekvens": ["årsag", "formål", "konklusion"], "årsag": ["konsekvens", "formål"], "kontrast": ["indrømmelse"], "indrømmelse": ["kontrast"] };
const pairKey = p => `${p[0]}|${p[1]}`;
function pairItems(pair, perWord) {
  if (SAME_MEANING.has(pairKey(pair))) return [{ kind: "pairsame", pair }];
  const rule = PAIR_SENSES[pairKey(pair)] || {};
  const sides = [];
  for (const id of [pair[0], pair[1]]) {
    const c = DB.cards[id], r = rule[id] || {}, other = id === pair[0] ? pair[1] : pair[0];
    if (r.skip) continue;
    let srcs = examSentences(c).filter(e => e.s.length < 230).map(e => ({ s: e.s, span: e.m, src: e.src, sense: e.sense }));
    if (!srcs.length && c.example && findSpan(c, c.example)) srcs = [{ s: c.example, span: findSpan(c, c.example), src: null }];
    if (srcs.length) sides.push({ id, other, r, srcs: srcs.sort((a, b) => a.s.length - b.s.length) });
  }
  // each word is the answer equally often (a word with one sentence used to leave its partner the answer 3 times in 4),
  // and the two words are listed in random order, so the answer can't be guessed from its place in "Skriv A eller B"
  const n = Math.min(perWord, ...sides.map(x => x.srcs.length));
  const out = sides.flatMap(({ id, other, r, srcs }) => shuffle(srcs.slice(0, Math.max(n, 4))).slice(0, n)
    .map(x => ({ kind: "pairq", pair, id, other, ...x, both: (r.both || []).includes(x.sense), flip: Math.random() < .5 })));
  return shuffle(out);
}
function renderPairQ(it) {
  const c = DB.cards[it.id], o = DB.cards[it.other], [A, B] = (it.flip ? [it.pair[1], it.pair[0]] : it.pair).map(id => DB.cards[id]);
  const gapForm = it.s.slice(it.span[0], it.span[1]);
  S.sent = it.s;
  frame(`${t("s.conf")} · ${A.word} / ${B.word}`, `<p class="prompt">${t("q.pair2", `<b lang="da">${esc(A.word)}</b>`, `<b lang="da">${esc(B.word)}</b>`)}</p>
    <div class="sentence" lang="da">${esc(it.s.slice(0, it.span[0]))}<span class="gap">&nbsp;</span>${esc(it.s.slice(it.span[1]))}</div>
    ${it.src ? `<div style="margin-top:6px"><span class="tag">${esc(it.src)}</span></div>` : ""}
    <input class="answer" id="ans" lang="da" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${t("q.ph")}">${letters()}
    <div class="row next"><button class="btn solid" id="chk">${t("b.check")}</button><button class="btn quiet" id="idk">${t("b.idk")}</button></div><div id="fb"></div>`);
  const input = $("#ans");
  input.focus(); bindLetters(input);
  const check = give => {
    if (input.disabled) return;
    const v = input.value.trim();
    if (!v && !give) return;
    input.disabled = true; $("#chk").remove(); $("#idk").remove();
    const body = `<div class="sentence" lang="da">${hlSentence(c, it.s, it.span)}</div>
      <div class="why"><b>${t("f.rule")}</b> ${esc(tip(it.pair))}</div>
      <div class="pair"><div><b lang="da">${esc(A.word)}</b><br>${esc(A.meaning)}</div><div><b lang="da">${esc(B.word)}</b><br>${esc(B.meaning)}</div></div>`;
    const exact = norm(v) === norm(gapForm);
    if (!give && exact) return feedback(c, it, quick(10000) ? 5 : 4, true, body);
    if (!give && it.both && isAnswer(o, v)) return feedback(c, it, 4, true, `<div class="why">${t("f.bothfit", `<b lang="da">${esc(o.word)}</b>`)}</div>` + body);
    if (!give && isAnswer(c, v)) return feedback(c, it, 4, true, t("f.formok", `<b lang="da">${esc(gapForm)}</b>`) + body);
    if (!give && isAnswer(o, v)) return feedback(c, it, 1, false, whyBox(`${t("why.chose", wordLine(o))}<div class="test sentence small" lang="da">${swapIn(it.s, it.span, v)} ❌</div><div class="test"><b>${t("f.rule")}</b> <span lang="da">${esc(tip(it.pair))}</span></div>`) + body, "critical", t("f.its", esc(gapForm)));
    if (!give && nearMiss(c, v)) return feedback(c, it, 3, true, t("f.spelling", `<b lang="da">${esc(gapForm)}</b>`, esc(v)) + body, "minor", t("f.almost"));
    feedback(c, it, give ? 0 : 1, false, (v ? t("f.wrote", esc(v)) : "") + body, give ? null : "moderate", t("f.its", esc(gapForm)));
  };
  $("#chk").onclick = () => check(false);
  $("#idk").onclick = () => check(true);
  S.keys = e => { if (e.key === "Enter" && document.activeElement === input) { e.preventDefault(); check(false); } };
}
// same-meaning pair: pick the two words that say the same thing (they cancel each other out in an L3 grid)
function renderPairSame(it) {
  S.sent = null;
  const [A, B] = [DB.cards[it.pair[0]], DB.cards[it.pair[1]]];
  const others = [];
  // wrong options come from clearly different relations (not cause/result/purpose next to derfor)
  const near = new Set([A.group, B.group, ...(ALSO[A.id] || []), ...(ALSO[B.id] || []), ...(RELATED[A.group] || [])]);
  shuffle(cards().filter(x => !near.has(x.group) && (x.priority || 3) === (A.priority || 3) && !x.word.includes("…") && norm(x.meaning) !== norm(A.meaning)))
    .forEach(x => { if (others.length < 2 && !others.some(y => y.group === x.group)) others.push(x); });
  const opts = shuffle([A, B, ...others]);
  frame(`${t("s.conf")} · ${t("x.same")}`, `<p class="prompt">${t("q.same")}</p>
    <div class="opts">${opts.map((x, i) => `<button class="btn opt" data-i="${i}"><span class="k">${i + 1}</span><span lang="da">${esc(x.word)}</span></button>`).join("")}</div><div id="fb"></div>`);
  const btns = [...document.querySelectorAll(".opt")], sel = new Set();
  const toggle = i => {
    if (btns[0].disabled) return;
    sel.has(i) ? sel.delete(i) : sel.add(i);
    btns[i].classList.toggle("sel");
    if (sel.size < 2) return;
    btns.forEach(b => b.disabled = true);
    const ok = [...sel].every(j => opts[j] === A || opts[j] === B);
    opts.forEach((x, j) => { btns[j].classList.remove("sel"); if (x === A || x === B) btns[j].classList.add("right"); else if (sel.has(j)) btns[j].classList.add("wrong"); });
    feedback(A, it, ok ? 4 : 2, ok, `<div class="why"><b>${t("f.rule")}</b> ${esc(tip(it.pair))}</div>
      <div class="small">${opts.map(x => `<span lang="da">${esc(x.word)}</span> = ${esc(x.meaning)}`).join(" · ")}</div>`, ok ? null : "moderate");
  };
  btns.forEach(b => b.onclick = () => toggle(+b.dataset.i));
  S.keys = e => { const n = +e.key; if (n >= 1 && n <= 4) toggle(n - 1); };
}

// ---------- flashcards ----------
