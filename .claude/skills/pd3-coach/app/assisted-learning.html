  }
  $("#app").innerHTML = `<div class="narrow lbset3">
    <div class="counter"><span><span class="mkpill">${t("lb.pill")}</span> ${esc(s.title)} <span class="tag">${esc(s.src.replace(" · ", " · "))}</span>${s.ai ? AI() : ""}</span>
      <span class="row">${clock}${LB.done ? "" : `<button class="btn quiet" id="lbtimer" aria-pressed="${LB.timed}">${t("lb.timer")}</button>`}<button class="btn quiet" id="lbquit">✕ ${t("s.end")}</button></span></div>
    ${body}</div>`;
  document.querySelectorAll(".lbcell:not([disabled])").forEach(b => b.onclick = () => {
    const i = +b.dataset.g - 1, L = b.dataset.l, y = window.scrollY;
    if (LB.ans[i] === L) LB.ans[i] = null;                                   // the same letter again: clear the row
    else { LB.ans = LB.ans.map((x, k) => x === L && k !== i ? null : x); LB.ans[i] = L; }   // a letter moves to the new row
    lbSetRender(); window.scrollTo(0, y);
  });
  if ($("#lbhand")) $("#lbhand").onclick = lbHand;
  if ($("#lbtimer")) $("#lbtimer").onclick = () => {
    LB.timed = !LB.timed;
    lbStop();
    if (LB.timed) { LB.left = LB.left || (full ? 15 : 6) * 60; LBT = setInterval(lbTick, 1000); }
    lbSetRender();
  };
  if ($("#lbretry")) $("#lbretry").onclick = () => lbSetStart(s.id, LB.held);
  if ($("#lbsets")) $("#lbsets").onclick = () => { LB = null; l2bHome(); window.scrollTo(0, 0); };
  document.querySelectorAll("[data-x]").forEach(b => b.onclick = () => { const bd = $("#lbx-" + b.dataset.x), open = bd.hasAttribute("hidden"); bd.toggleAttribute("hidden", !open); b.setAttribute("aria-expanded", open); });
  $("#lbquit").onclick = () => { lbStop(); LB = null; l2bHome(); window.scrollTo(0, 0); };
  bindTr($("#app"));
}
const lbMmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function lbTick() {
  if (!LB || LB.lvl !== 3 || !LB.timed || LB.done) return lbStop();
  LB.left--;
  if (LB.left <= 0) { LB.left = 0; return lbHand(); }
  const el = $("#lbclock"); if (el) el.textContent = t("lb.timer.left", lbMmss(LB.left));
}
function lbHand() {
  lbStop();
  const s = LB.set, n = LB.n, right = LB.ans.filter((x, i) => x === s.key[i + 1]).length;
  LB.done = true;
  lbRecord(st => {
    st.sets = st.sets || {}; st.sets[s.id] = [right, n, iso(new Date())];
    st.last = [iso(new Date()), s.title, `${2 * right}/${2 * n}`];
  });
  lbSetRender();
  $(".lbresult")?.scrollIntoView({ block: "start" });
}
function lbSets() {
  LBV = { view: "sets" }; LB = null; lbStop();
  const st = l2Store().sets || {};
  const list = l2Sets().filter(s => !s.hold).sort((a, b) => (a.kind === "mini" ? 0 : 1) - (b.kind === "mini" ? 0 : 1));
  $("#app").innerHTML = `<div class="narrow lbwrap">
    <div class="top"><a href="#" class="tvback" id="lbback">${t("lb.back")}</a></div>
    <h1>${t("lb.sets")}</h1><p class="soft">${t("lb.sets.s")}</p>
    <ul class="lbsets">${list.map(s => { const r = st[s.id]; return `<li class="sheet q lbset"><div><b lang="da">${esc(s.title)}</b> <span class="tag">${esc(s.src)}</span>${s.ai ? AI() : ""}<p class="small soft">${t(s.kind === "mini" ? "lb.sets.mini" : "lb.sets.full")}</p></div><span class="small soft">${r ? t("lb.sets.done", 2 * r[0], 2 * r[1]) : t("lb.sets.none")}</span><button class="btn solid" data-set="${esc(s.id)}">${ICONS.play}${t("lb.start")}</button></li>`; }).join("")}</ul></div>`;
  document.querySelectorAll("[data-set]").forEach(b => b.onclick = () => lbSetStart(b.dataset.set, false));
  $("#lbback").onclick = e => { e.preventDefault(); l2bHome(); };
}
// the 2B home: the method (Danish, English small), three levels, the trap counts, the held final test
const LB_METHOD = [
  ["Læs sætningen før og sætningen efter hullet.", "Read the sentence before and the sentence after the gap."],
  ["Læs stykkets første ord. Et bindeord («derfor», «men», «til gengæld») skal passe til sammenhængen.", "Read the piece's first words. A linking word («derfor», «men», «til gengæld») must match the relation."],
  ["Pege-ord («den», «det», «de», «dem», «sådan») skal pege tilbage på noget lige før hullet.", "Pointing words («den», «det», «de», «dem», «sådan») must point back to something just before the gap."],
  ["Den næste sætning forklarer, fortsætter eller modsiger ofte stykket.", "The next sentence often explains, continues or contrasts the piece."],
];
function l2bHome() {
  LBV = { view: "home" }; LB = null; lbStop();
  const st = l2Store(), traps = st.traps || {}, held = l2Sets().find(s => s.hold);
  const lv = lvl => { const s = ((st.scores || {})[lvl] || []).slice(-1)[0]; return s ? t("lb.lastn", s[1], s[2]) : t("lb.none"); };
  const card = (lvl, title, desc, fn, last) => `<article class="lbcard"><h3>${t(title)}</h3><p class="soft small">${t(desc)}</p><span class="small soft">${last}</span><button type="button" class="btn solid" data-lv="${lvl}">${ICONS.play}${t("lb.start")}</button></article>`;
  $("#app").innerHTML = `<div class="narrow lbwrap">
    <div class="top"><a href="#" class="tvback" id="lbhome">${t("gm.back")}</a></div>
    <div class="hometop"><h1>${t("lb.title")}</h1></div>
    <p class="soft">${t("lb.intro")}</p>
    <section class="sheet q lbmetod"><h2>${t("lb.method")}</h2><ol class="lbsteps">${LB_METHOD.map(([da, en]) => `<li><span lang="da">${esc(da)}</span><small class="soft" lang="en">${esc(en)}</small></li>`).join("")}</ol></section>
    <div class="lbgrid">
      ${card(1, "lb.lv1", "lb.lv1.d", null, lv(1))}
      ${card(2, "lb.lv2", "lb.lv2.d", null, lv(2))}
      ${card(3, "lb.lv3", "lb.lv3.d", null, t("lb.sets.n", l2Sets().filter(s => !s.hold).length))}
    </div>
    <section class="sheet q lbtraps-box"><h2>${t("lb.traps")}</h2><p class="small soft">${t("lb.traps.s")}</p>
      <div class="lbtraps">${["samme", "nabo", "logik", "peger"].map(k => `<div class="lbtrow">${lbPill(k)}<span class="small">${t("lb.trap.n", traps[k] || 0)}</span></div>`).join("")}</div>
    </section>
    ${held ? `<section class="sheet q lbheldbox"><div><b>${t("lb.held", esc(held.title))}</b><p class="small soft">${t("lb.held.s")} · ${st.sets && st.sets[held.id] ? t("lb.sets.done", 2 * st.sets[held.id][0], 2 * st.sets[held.id][1]) : t("lb.sets.none")}</p></div><button type="button" class="btn quiet" id="lbheld">${ICONS.check}${t("lb.held.go")}</button></section>` : ""}
    <p class="small soft lbmiss">${t("lb.missed", (st.miss || []).length)}</p>
  </div>`;
  document.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { const lvl = +b.dataset.lv; if (lvl === 3) lbSets(); else lbStart(lvl); });
  $("#lbhome").onclick = e => { e.preventDefault(); home(); window.scrollTo(0, 0); };
  if ($("#lbheld")) $("#lbheld").onclick = () => lbSetStart(held.id, true);
  bindTr($("#app"));
}
// the banner on the home screen, as the mock banner
function l2bBanner() {
  const st = l2Store(), last = st.last ? ` · ${t("lb.last", st.last[2])}` : "";
  return `<section class="l2bbanner"><span class="mkpill">${t("lb.pill")}</span><div><b>${t("lb.title")}</b><p>${t("lb.s")}${last}</p></div><button type="button" class="btn solid" id="l2bGo">${ICONS.pencil}${t("lb.go")}</button></section>`;
}
function lbRedraw() {
  if (!LBV) return;
  if (LBV.view === "home") l2bHome();
  else if (LBV.view === "sets") lbSets();
  else if (LB && LB.lvl === 3) lbSetRender();
  else if (LB) lbRender();
}
// ---------- summary ----------
function summary() {
  const ex = S.exercise;
  const r = ex ? S.practiceResults : S.results, n = r.length;
  const right = r.filter(x => x.q >= 3).length;
  const shaky = r.filter(x => x.q <= 2).map(x => DB.cards[x.id]);
  const next = {};
  if (!ex) r.forEach(x => { const d = DB.cards[x.id].due; next[d] = (next[d] || 0) + 1; });
  const fmt = d => new Date(d + "T12:00").toLocaleDateString(LANG === "en" ? "en-GB" : "da-DK", { weekday: "short", day: "numeric", month: "short" });
  const title = S.title;
  S = null;
  $("#app").innerHTML = `<div class="narrow"><div class="sheet q" style="margin-top:28px">
    <div class="kind">${t("r.done", esc(title))}</div>
    ${n ? `<div class="row" style="align-items:baseline;margin-top:10px"><span class="score">${Math.round(100 * right / n)}%</span><span class="soft">${t("r.score", right, n)}</span></div>` : `<p>${t("r.practice")}</p>`}
    ${shaky.length ? `<div class="block"><span class="lbl">${t("r.shaky")}</span><ul class="list">${shaky.map(c => `<li><b lang="da">${esc(c.word)}</b><span class="soft">${esc(c.meaning)}</span><span class="spacer"></span><span class="small soft">${ex ? "" : t("r.tomorrow")}</span></li>`).join("")}</ul></div>` : n ? `<div class="block">${t("r.none")}</div>` : ""}
    ${ex ? `<p class="small soft block">${t("r.ex")}</p>` : ""}
    ${n && !ex ? `<div class="block"><span class="lbl">${t("r.next")}</span><ul class="list">${Object.keys(next).sort().map(d => `<li>${fmt(d)}<span class="spacer"></span><span class="soft">${t("r.cards", next[d])}</span></li>`).join("")}</ul></div>` : ""}
    ${n ? `<p class="small soft block">${esc(t("r.coach"))}</p>` : ""}
    <div class="row next"><button class="btn solid" id="home">${t("r.home")}</button></div></div></div>`;
  $("#home").onclick = home;
}

load();
</script>
